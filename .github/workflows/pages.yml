name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p _site
          tar xJf site.txz.b64 -C _site
          cat parts/linea.p0 parts/linea.p1 parts/linea.p2 parts/linea.p3 parts/linea.p4 parts/linea.p5 parts/linea.p6 > linea.txz
          python3 -c "d=bytearray(open('linea.txz','rb').read());exec('for o,v in [(70470,243),(114450,231),(125398,121),(125399,226)]: d[o]=v');open('linea.txz','wb').write(d)"
          sha256sum linea.txz
          rm -rf _site/linea-impianti
          tar xJf linea.txz -C _site
          touch _site/.nojekyll
          if [ -d ncc ]; then cp -R ncc _site/ncc; fi
          if [ -d h ]; then cp -R h _site/h; fi
          if [ -d nozze ]; then cp -R nozze _site/nozze; fi
          if [ -d outbound ]; then cp -R outbound _site/outbound; fi
          if [ -d fvg ]; then cp -R fvg _site/fvg; fi
          if [ -d taa ]; then cp -R taa _site/taa; fi
          if [ -d veneto ]; then cp -R veneto _site/veneto; fi
          if [ -d studio ]; then cp -R studio _site/studio; fi
          if [ -d lavoro ]; then cp -R lavoro _site/lavoro; rm -rf _site/lavoro/_strumenti; fi
          if [ -d lead ]; then cp -R lead _site/lead; fi
          if [ -d richiamo ]; then cp -R richiamo _site/richiamo; rm -rf _site/richiamo/_strumenti; fi
          if [ -d cantine ]; then cp -R cantine _site/cantine; fi
          if [ -d ambiente ]; then cp -R ambiente _site/ambiente; rm -rf _site/ambiente/_tools _site/ambiente/_media.tsv; fi
          if [ -d fr ]; then cp -R fr _site/fr; fi
          if [ -d us ]; then cp -R us _site/us; fi
          if [ -d nozze ]; then for d in nozze/*/; do n=$(basename "$d"); [ -e "_site/$n" ] || cp -R "$d" "_site/$n"; done; fi
          ls -R _site/linea-impianti
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Attesa artifact
        run: sleep 25
      - id: dep
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
