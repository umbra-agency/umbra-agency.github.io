<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0e">
<title>Ecoasis · Livret d&#x27;accueil</title>
<meta property="og:title" content="Ecoasis · votre livret d&#x27;accueil est prêt">
<meta property="og:description" content="Livret d'accueil en 4 langues, préparé par Umbra.">
<meta property="og:image" content="https://wsrv.nl/?url=https%3A%2F%2Fecoasis.fr%2Fwp-content%2Fuploads%2F2024%2F01%2Fboutonjeunez-beige-2.png.webp&amp;w=1600&amp;output=webp&amp;q=80">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gloock:wght@400&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{--bg:#f4efe7;--ink:#261f1a;--ink2:#4a3f37;--acc:#a0522d;--soft:#f0e0d2;--card:#fffdfa;--line:rgba(0,0,0,.09);--mut:#7d7a72;--r:16px;--fh:'Gloock';--fb:'Work Sans';--emst:normal;--ease:cubic-bezier(.2,.7,.1,1);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb),system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,.ser{font-family:var(--fh),Georgia,serif;font-weight:400;letter-spacing:-.005em}
em{font-style:var(--emst,italic)}
.ico{display:inline-flex;width:22px;height:22px;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translate3d(0,34px,0);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.vis{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
.pr{overflow:hidden;clip-path:inset(10% 6% 10% 6% round 22px);transition:clip-path 1.3s var(--ease)}
.pr img{transform:scale(1.12);transition:transform 1.6s var(--ease)}
.pr.vis{clip-path:inset(0 0 0 0 round var(--pr-r,0px))}
.pr.vis img{transform:scale(1)}
.ex{display:inline-block;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);border:1px solid currentColor;padding:4px 6px 3px;border-radius:99px;vertical-align:middle;margin-left:8px;opacity:.85;white-space:nowrap}
/* barre haute */
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:70}
.demo{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:45;font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.16em;text-transform:uppercase;background:rgba(11,11,14,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#ececf1;padding:10px 12px;border-radius:99px;display:flex;gap:7px;align-items:center}
.demo i{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:45;display:flex;gap:2px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.lang button{border:0;background:transparent;font:700 11.5px/1 var(--fb),sans-serif;letter-spacing:.06em;padding:8px 9px;border-radius:99px;color:#2a2a2e;cursor:pointer;transition:background .3s,color .3s}
.lang button.on{background:#111114;color:#fff}
.tip{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 46px);right:14px;z-index:45;background:#111114;color:#f1f1f4;font:600 12px/1.3 var(--fb),sans-serif;padding:9px 12px;border-radius:12px;max-width:210px;opacity:0;transform:translateY(-6px);transition:all .5s var(--ease);pointer-events:none}
.tip:before{content:"";position:absolute;top:-5px;right:22px;width:10px;height:10px;background:#111114;transform:rotate(45deg)}
.tip.on{opacity:1;transform:none}
/* intro Umbra */
#intro{position:fixed;inset:0;z-index:100;background:#060608;color:#e9e9ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .8s ease,visibility .8s}
#intro.off{opacity:0;visibility:hidden}
.ecl{width:78px;height:78px;border-radius:50%;position:relative;background:#d9dbe4;box-shadow:0 0 50px 8px rgba(205,210,230,.22);animation:eg 2.2s var(--ease) both}
.ecl:after{content:"";position:absolute;inset:0;border-radius:50%;background:#060608;transform:translate(14px,-8px);animation:em 2.2s var(--ease) both}
@keyframes eg{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes em{from{transform:translate(70px,-30px)}to{transform:translate(14px,-8px)}}
#intro small{letter-spacing:.38em;text-transform:uppercase;font-size:10.5px;color:#8e90a0}
#intro b{font-family:var(--fh),serif;font-weight:400;font-size:25px;line-height:1.25;text-align:center;padding:0 30px;max-width:520px;opacity:0;animation:fi 1s .5s var(--ease) forwards}
@keyframes fi{to{opacity:1}}
/* blocs de contenu (communs) */
.blk{padding:26px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bh .ico{width:40px;height:40px;padding:9px;border-radius:50%;background:var(--soft);color:var(--acc)}
.bh h3{font-size:23px;line-height:1.2}
.blk p{color:var(--ink2)}
.blk.al{background:var(--soft);border:0;border-radius:20px;padding:22px 20px;margin:10px 0}
.blk.al .bh .ico{background:var(--card)}
.ul{list-style:none}
.ul li{position:relative;padding:9px 0 9px 22px;color:var(--ink2);border-bottom:1px dashed var(--line)}
.ul li:last-child{border-bottom:0}
.ul li:before{content:"";position:absolute;left:2px;top:19px;width:9px;height:1.5px;background:var(--acc)}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r b{font-weight:600}
.rows .r span{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.pois{display:grid;gap:2px}
.poi{display:grid;grid-template-columns:74px 1fr 26px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.poi:last-child{border-bottom:0}
.poi .km{font-family:var(--fh),serif;font-size:38px;line-height:.9;color:var(--acc);text-align:right;font-variant-numeric:lining-nums}
.poi .km small{display:block;font:600 10px/1.6 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.poi b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.2}
.poi small.d{display:block;font-size:14px;color:var(--ink2);line-height:1.45;margin-top:4px}
.poi .go{width:26px;height:26px;color:var(--acc);transition:transform .3s}
.poi:active .go{transform:translateX(4px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.3}
.chip b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:18px}
.chip span{color:var(--mut)}
.sos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sos a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;transition:transform .2s}
.sos a:active{transform:scale(.97)}
.sos b{font-family:var(--fh),serif;font-size:28px;font-weight:400;color:var(--acc);line-height:1.1}
.sos small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35}
.chk label{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk label:last-of-type{border-bottom:0}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .bx{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--acc);flex:none;display:flex;align-items:center;justify-content:center;transition:background .3s}
.chk .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none;opacity:0;transform:scale(.5);transition:all .3s var(--ease)}
.chk input:checked+.bx{background:var(--acc)}
.chk input:checked+.bx svg{opacity:1;transform:none}
.chk input:checked~span{color:var(--mut);text-decoration:line-through}
.prog{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:4px 0 6px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.prog i:after{content:"";position:absolute;inset:0;background:var(--acc);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .5s var(--ease)}
.kick{font:600 11px/1.2 var(--fb),sans-serif;letter-spacing:.3em;text-transform:uppercase}
.z{cursor:zoom-in}
/* ess (essentiels) commun */
.ess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.es{border-radius:20px;padding:16px;position:relative;overflow:hidden}
.es .ico{width:24px;height:24px;margin-bottom:18px}
.es .l{font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.es .v{font-family:var(--fh),serif;font-size:22px;line-height:1.2;margin-top:7px;word-break:break-word}
.es .s{font-size:12.5px;opacity:.7;margin-top:3px}
.es .ex{margin:8px 0 0}
.ess .es:nth-child(3),.ess .es:nth-child(4){grid-column:1/-1}
.ess .es:nth-child(3) .v,.ess .es:nth-child(4) .v{font-size:24px}
/* footer */
footer{background:#0b0b0e;color:#cfd0d8;text-align:center;padding:80px 26px calc(150px + var(--sb))}
footer .ecl{width:44px;height:44px;margin:0 auto 26px;animation:none;box-shadow:0 0 30px 4px rgba(205,210,230,.18)}
footer .ecl:after{background:#0b0b0e;animation:none;transform:translate(8px,-5px)}
footer .thx{font-family:var(--fh),serif;font-size:27px;line-height:1.3;color:#fff;max-width:520px;margin:0 auto 16px}
footer small{font-size:12.5px;letter-spacing:.06em;color:#8d8f9e}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,6,8,.96);display:none;touch-action:pan-y}
#lb.on{display:block}
#lb .tr{display:flex;height:100%;transition:transform .45s var(--ease)}
#lb figure{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:60px 10px}
#lb figure img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
#lb .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;cursor:pointer;z-index:2}
#lb .n{position:absolute;bottom:calc(22px + var(--sb));left:0;right:0;text-align:center;color:#aaa;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em}

/* =========================== MAS : immersif =========================== */
.L-mas .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#1a1a1a}
.L-mas .hero .bg{position:absolute;inset:-6% 0 0 0;will-change:transform}
.L-mas .hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}@keyframes kb2{from{transform:scale(1.04)}to{transform:scale(1)}}.L-mas .hero .bg img.lo{animation-name:kb2}
.L-mas .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.72) 100%)}
.L-mas .hero .tx{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 24px calc(92px + var(--sb));max-width:820px;margin:0 auto}
.L-mas .hero .kick{display:flex;align-items:center;gap:12px;opacity:0;animation:fi 1s 2.6s forwards}
.L-mas .hero .kick:before{content:"";width:28px;height:1px;background:#fff}
.L-mas .hero h1{font-size:clamp(50px,14vw,104px);line-height:.95;margin:16px 0 18px}
.sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.sp>span{display:inline-block;transform:translateY(105%);animation:up 1.2s var(--ease) forwards}
@keyframes up{to{transform:none}}
.L-mas .hero .meta{font-size:15px;letter-spacing:.04em;opacity:0;animation:fi 1s 3.1s forwards}
.cue{position:absolute;left:50%;bottom:calc(22px + var(--sb));z-index:2;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cue i{width:1px;height:40px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.cue i:after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{to{top:100%}}
.L-mas .wel{padding:96px 26px 70px;max-width:760px;margin:0 auto}
.L-mas .wel .kick{color:var(--acc);margin-bottom:26px;display:flex;gap:12px;align-items:center}
.L-mas .wel .kick:before{content:"";width:28px;height:1px;background:var(--acc)}
.L-mas .big{font-family:var(--fh),serif;font-size:clamp(28px,7.4vw,44px);line-height:1.22;letter-spacing:-.01em}
.L-mas .big .w{opacity:.14;transition:opacity .4s}
.L-mas .big .w.on{opacity:1}
.L-mas .essw{background:var(--ink);color:var(--bg);padding:56px 18px 60px}
.L-mas .essw .in{max-width:760px;margin:0 auto}
.L-mas .essw .kick{opacity:.6;margin:0 6px 20px}
.L-mas .es{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.L-mas .es .ex{color:var(--bg)}
.L-mas .chap{position:relative}
.L-mas .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:#222;z-index:0}
.L-mas .pin img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;will-change:transform}.L-mas .pin img.lo{inset:-3% 0;height:106%}
.L-mas .pin:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35) 100%)}
.L-mas .plab{position:absolute;left:24px;right:24px;top:calc(84px + env(safe-area-inset-top));z-index:2;color:#fff}
.L-mas .plab .no{font-family:var(--fh),serif;font-size:92px;line-height:.8;display:block;opacity:.95;-webkit-text-stroke:1px rgba(255,255,255,.9);color:transparent}
.L-mas .plab h2{font-size:clamp(40px,11vw,74px);line-height:1;margin-top:6px}
.L-mas .body{position:relative;z-index:2;margin-top:-30svh;background:var(--bg);border-radius:30px 30px 0 0;padding:34px 24px 54px;box-shadow:0 -24px 60px rgba(0,0,0,.22)}
.L-mas .body .in{max-width:720px;margin:0 auto}
.L-mas .body:before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-16px auto 18px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -24px 6px;padding:0 24px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 76%;height:min(62vw,420px);object-fit:cover;border-radius:18px;scroll-snap-align:center}
.L-mas .galw{padding:80px 12px 40px;max-width:980px;margin:0 auto}
.L-mas .galw h2{font-size:clamp(40px,11vw,70px);line-height:1;margin:0 12px 30px}
.L-mas .galw h2 em{color:var(--acc)}
.mz{columns:2;column-gap:10px}
.mz .pr{break-inside:avoid;margin-bottom:10px;--pr-r:14px}
.mz img{width:100%;border-radius:14px}

/* =========================== CARNET : app =========================== */
.L-carnet{background:var(--bg)}
.L-carnet .top{padding:calc(76px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(180deg,var(--soft) 0%,var(--soft) 62%,var(--bg) 100%);overflow:hidden}
.stack{position:relative;height:min(118vw,560px);max-width:520px;margin:0 auto}
.stack .c{position:absolute;left:50%;top:6%;width:66%;aspect-ratio:3/4;margin-left:-33%;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px rgba(30,20,40,.28);transition:transform 1.4s var(--ease);background:#ccc}
.stack .c img{width:100%;height:100%;object-fit:cover}
.stack .c1{transform:rotate(0) translate(0,30px) scale(.9);z-index:1}
.stack .c2{transform:rotate(0) translate(0,30px) scale(.9);z-index:2}
.stack .c3{transform:rotate(0) translate(0,20px);z-index:3}
.stack.vis .c1{transform:rotate(-9deg) translate(-27%,6%) scale(.86)}
.stack.vis .c2{transform:rotate(8deg) translate(27%,8%) scale(.86)}
.stack.vis .c3{transform:rotate(-1.5deg) translate(0,0)}
.L-carnet .ttl{padding:6px 24px 0;max-width:640px;margin:0 auto;text-align:center}
.L-carnet .ttl .kick{color:var(--acc)}
.L-carnet .ttl h1{font-size:clamp(46px,13vw,84px);line-height:.98;margin:14px 0 10px}
.L-carnet .ttl .meta{color:var(--mut);font-size:15px}
.L-carnet .lead{font-size:18.5px;line-height:1.6;color:var(--ink2);padding:26px 24px 8px;max-width:640px;margin:0 auto}
.pass{margin:22px 18px 0;max-width:600px;background:var(--card);border-radius:24px;box-shadow:0 20px 50px rgba(30,20,40,.12);position:relative}
@media(min-width:640px){.pass{margin:22px auto 0}}
.pass .tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 20px 18px}
.pass .tp div:last-child{text-align:right}
.pass .tp .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .tp .v{font-family:var(--fh),serif;font-size:28px;line-height:1.1;margin-top:6px}
.pass .tp .mid{color:var(--acc);width:54px;height:24px}
.pass .tp .mid svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4}
.pass .perf{height:0;border-top:2px dashed var(--line);margin:0 18px;position:relative}
.pass .perf:before,.pass .perf:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.pass .perf:before{left:-30px}.pass .perf:after{right:-30px}
.pass .bt{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pass .bt>div{padding:16px 20px 20px;display:flex;gap:12px;align-items:center}
.pass .bt>div+div{border-left:1px solid var(--line)}
.pass .bt .ico{color:var(--acc)}
.pass .bt .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .bt .v{font-weight:600;font-size:14.5px;margin-top:5px;word-break:break-word;line-height:1.3}
.pass .ex{margin:6px 0 0}
.L-carnet .open{display:flex;margin:28px auto 6px;align-items:center;gap:10px;border:0;background:var(--ink);color:var(--bg);padding:16px 24px;border-radius:99px;font:700 14px/1 var(--fb),sans-serif;letter-spacing:.04em;cursor:pointer}
.L-carnet .open .ico{width:18px;height:18px}
.panes{padding:10px 0 0;min-height:100svh}
.pane{display:none;padding:0 16px 40px;max-width:720px;margin:0 auto}
.pane.on{display:block;animation:pin .55s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pane.on.back{animation-name:pinb}
@keyframes pinb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.pban{position:relative;border-radius:26px;overflow:hidden;height:min(108vw,460px);margin:6px 0 18px;color:#fff;--pr-r:26px}
.pban img{width:100%;height:100%;object-fit:cover}
.pban:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)}
.pban .t{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}
.pban .t span{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.85}
.pban .t h2{font-size:clamp(36px,10vw,56px);line-height:1;margin-top:8px}

.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:50;background:rgba(18,16,22,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:flex;padding:7px;gap:2px;max-width:560px;margin:0 auto;transform:translateY(140%);transition:transform .6s var(--ease);box-shadow:0 18px 40px rgba(0,0,0,.3)}

.L-riviera .rwel{max-width:720px;margin:0 auto;padding:80px 24px 30px}
.L-riviera .rwel .kick{color:var(--acc);margin-bottom:22px}
.L-riviera .drop{font-size:19px;line-height:1.7;color:var(--ink2)}
.L-riviera .drop:first-letter{font-family:var(--fh),serif;float:left;font-size:86px;line-height:.82;margin:6px 12px 0 0;color:var(--acc)}
.etab{margin-top:40px;border-top:1px solid var(--ink)}
.etab .r{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.etab .r .l{font:600 10.5px/1.4 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.etab .r .v{font-family:var(--fh),serif;font-size:24px;line-height:1.2;word-break:break-word}
.etab .r .v small{display:block;font-family:var(--fb),sans-serif;font-size:13px;color:var(--mut);margin-top:3px}
.hs{position:relative;background:var(--bg)}
.hsin{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hsh{display:flex;justify-content:space-between;align-items:baseline;padding:0 24px 22px;max-width:1100px;width:100%;margin:0 auto}
.hsh h2{font-size:clamp(34px,9vw,60px);line-height:1}
.hsh h2 em{color:var(--acc)}
.hsh .cnt{font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em;color:var(--mut);font-variant-numeric:tabular-nums}
.track{display:flex;gap:14px;padding:0 24px;will-change:transform}
.track figure{flex:0 0 78vw;max-width:560px}
.track figure div{height:min(64svh,520px);border-radius:20px;overflow:hidden}
.track img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.track figcaption{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.22em;color:var(--mut);margin-top:12px}
.toc{max-width:760px;margin:0 auto;padding:40px 20px 70px}
.toc>.kick{color:var(--acc);padding:0 4px 18px}
.row{border-top:1px solid var(--ink)}
.row:last-child{border-bottom:1px solid var(--ink)}
.row>button{width:100%;display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;padding:24px 4px;background:transparent;border:0;text-align:left;cursor:pointer}

.row .pl{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .5s var(--ease),background .3s}

.row.on .pl{transform:rotate(45deg);background:var(--ink);color:var(--bg)}

.row .rci>.wrap{padding:0 0 26px}
.row .rimg{height:min(60vw,360px);border-radius:18px;overflow:hidden;margin:0 0 8px}
.row .rimg img{width:100%;height:100%;object-fit:cover}
.night{background:var(--ink);color:var(--bg);padding:84px 22px 80px;position:relative;overflow:hidden}
.night .in{max-width:720px;margin:0 auto;position:relative}

.rgal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:60px 12px 40px;max-width:1100px;margin:0 auto}

.rgal .pr:nth-child(5n+4),.rgal .pr:nth-child(5n+5){grid-column:span 3;aspect-ratio:1}

/* =========================== couche Umbra : offre =========================== */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(130%);transition:transform .6s var(--ease);padding:0 10px calc(10px + var(--sb))}

#sheet .in{max-width:560px;margin:0 auto;background:#0b0b0e;color:#ececf1;border-radius:22px;padding:20px 20px 16px;box-shadow:0 -10px 50px rgba(0,0,0,.35)}

#sheet p{font-size:14.5px;color:#b9bac6;margin:8px 0 14px}
.btns{display:flex;gap:8px}
.b1{flex:1;border:0;background:#ececf1;color:#0b0b0e;font:700 14px/1 var(--fb),sans-serif;padding:15px;border-radius:13px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.b2{border:1px solid #3a3a44;background:transparent;color:#ececf1;font:600 14px/1 var(--fb),sans-serif;padding:15px 16px;border-radius:13px;cursor:pointer}
#pill{position:fixed;right:14px;bottom:calc(14px + var(--sb));z-index:55;border:0;background:#0b0b0e;color:#fff;font:700 13.5px/1 var(--fb),sans-serif;padding:15px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;display:flex;gap:9px;align-items:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:all .5s var(--ease)}
#pill i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
#pill.on{opacity:1;transform:none;pointer-events:auto}
#offer{position:fixed;inset:0;z-index:80;background:rgba(5,5,8,.55);display:none}

#offer .pn{position:absolute;left:0;right:0;bottom:0;top:7svh;background:#0b0b0e;color:#ececf1;border-radius:24px 24px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 20px 40px;animation:sup .55s var(--ease)}
@keyframes sup{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#offer .x{position:sticky;top:0;float:right;background:#1c1c22;color:#fff;border:0;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
#offer .pn>div{max-width:620px;margin:0 auto}
#offer small.k{letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#8d8f9e}

.val{margin:22px 0 6px}
.val div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #22222a;font-size:15px;color:#d6d7de}
.val div b{color:#fff}
.val span{flex:none;width:26px;height:26px;border-radius:50%;background:#1c1c22;display:flex;align-items:center;justify-content:center;font-size:13px}
.plans{display:grid;gap:12px;margin:22px 0}
.plan{border:1px solid #2a2a33;border-radius:18px;padding:18px;position:relative;background:#111116}
.plan.best{border-color:#d9dbe4;background:#15151b}
.plan .tag{position:absolute;top:-10px;left:16px;background:#ececf1;color:#0b0b0e;font:700 10.5px/1 var(--fb),sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:6px}
.plan h4{font-family:var(--fh),serif;font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan h4 b{font-family:var(--fb),sans-serif;font-size:26px;font-weight:700;color:#fff}
.plan ul{list-style:none;margin:10px 0 14px}
.plan li{font-size:14px;color:#c9cad3;padding:5px 0 5px 22px;position:relative}
.plan li:before{content:"✓";position:absolute;left:0;color:#d9dbe4}
.steps{counter-reset:s;margin:10px 0 18px}
.steps div{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:15px;color:#d6d7de}
.steps div:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #3a3a44;display:flex;align-items:center;justify-content:center;font-size:13px}
.guar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 22px}
.guar div{background:#15151b;border-radius:12px;padding:12px;font-size:12.5px;color:#c9cad3;text-align:center;line-height:1.35}
.guar b{display:block;color:#fff;font-size:14px;margin-bottom:4px}
details{border-bottom:1px solid #22222a;padding:14px 0}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}

details p{color:#b9bac6;font-size:14.5px;margin-top:8px}
.legal{font-size:12px;color:#7c7e8c;margin-top:26px;text-align:center}
.legal a{color:#a9abb8;text-decoration:underline}
h3.pt{font-family:var(--fh),serif;font-weight:400;font-size:22px;margin:26px 0 6px}

/* =========================== blocs v3 : services, taxe, terroir, agenda =========================== */
sup{font-size:.62em;line-height:0;vertical-align:.45em}
.svc{display:grid}
.sv{display:grid;grid-template-columns:40px 1fr auto 20px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.txu{font-size:15px;color:var(--ink2);line-height:1.35;max-width:13em;padding-bottom:4px}
.txt .r b{font-weight:500;color:var(--ink2)}

.txm{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 2px;border-top:1px solid var(--line)}

.txm dt{font-size:11.5px;color:var(--mut);line-height:1.3}
.txm dd{font-size:14.5px;font-weight:600;line-height:1.35;margin-top:3px}
.tax .txx,.tax .txw{font-size:14px;margin-top:12px;line-height:1.55}
.tax .txx b{color:var(--ink);font-weight:600}
.txof{font-size:13.5px;color:var(--mut);margin-top:12px;font-variant-numeric:tabular-nums}
.txof span{font-weight:600;color:var(--ink2);margin-right:8px}
.ter .tr{padding:15px 0;border-bottom:1px solid var(--line)}

.ter .th{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.ter .th b{font-family:var(--fh),serif;font-weight:400;font-size:22px;line-height:1.2}
.ter .th span{font-size:13px;color:var(--acc);font-style:italic;text-align:right;flex:none;max-width:45%}
.ter .tr p{font-size:15px;margin-top:4px;line-height:1.5}
.ag{list-style:none;position:relative;margin-top:10px;padding-left:24px}

.ag .w{display:block;font-size:13px;font-weight:600;color:var(--acc)}
.ag b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.25;margin-top:2px}
.ag p{font-size:15px;margin-top:3px;color:var(--ink2);line-height:1.5}
.night .ter .tr{border-color:rgba(255,255,255,.12)}

.sos b{white-space:nowrap}.sos b.lg{font-size:20px;line-height:1.5}
@media(min-width:760px){.txm{grid-template-columns:1.3fr 1fr 1fr}.txm div:first-child{grid-column:auto}.txm div+div{padding-left:14px;border-left:1px solid var(--line)}}

dinner)", "table": "On request, the day before.", "spa_t": "Spa", "spa": "On request, ask us for a time slot.", "trash_t": "Recycling", "trash": "Packaging and paper in the yellow bin, glass at the village bottle bank, everything else in household waste.", "c3": "Around {c}", "near_t": "Worth seeing nearby", "market_t": "Markets", "market_n": "Market days are indicative, please check locally.", "maps": "Directions", "c4": "Provence tips", "heat_t": "Heat and sun", "heat": "In summer, drink plenty of water, avoid effort between 1 and 5 pm, wear a hat and sunscreen.", "fire_t": "Hills and wildfire risk", "fire": "From June to September, access to the forested hills may be restricted or closed depending on the daily risk. Check the prefecture's map before a hike.", "mistral_t": "The mistral", "mistral": "This north wind can blow hard for several days: refreshing, but watch out for parasols and boat trips.", "mosq_t": "Mosquitoes", "mosq": "In the Camargue, bring repellent, especially in the evening.", "sea_t": "The sea", "sea": "Follow the beach flags. Sea rescue: 196.", "sos_t": "Emergencies", "sos": [["112", "Emergency (all of Europe)"], ["15", "Medical emergency (SAMU)"], ["18", "Fire brigade"], ["17", "Police"], ["114", "Emergency by text"], ["3237", "Pharmacy on duty"]], "tax_t": "Tourist tax", "tax": "Set by the town, it is added to the nightly rate (per adult, per night) and we pay it to the town.", "c5": "Check-out", "out_t": "Before you leave", "out": ["Keys left in the agreed place", "Windows and shutters closed", "Air conditioning and lights off", "Dishes washed or in the dishwasher", "Rubbish taken out", "Nothing forgotten: chargers, swimsuits, the fridge"], "thanks": "Thank you for staying with us! An online review helps us enormously.", "gallery": "In pictures", "ex": "to fill in", "made": "Guide prepared by Umbra for {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen in {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Hinweise. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 16 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Provence-Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Anfahrt senden wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi manchmal: Folgen Sie auf den letzten Kilometern unserer Beschreibung.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser privater Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, wir organisieren das (Schlüsselbox oder Empfang).", "police_t": "Ausländische Gäste: Meldeschein", "police": "Das französische Gesetz verlangt, dass jeder Gast ohne französische Staatsangehörigkeit bei der Ankunft einen kurzen Meldeschein ausfüllt (Name, Geburtsdatum und -ort, Staatsangehörigkeit, Adresse). Das dauert eine Minute, danke!", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht.", "Ab 22 Uhr Ruhe, damit sich alle erholen.", "Wasser ist in der Provence kostbar: Bitte sparsam damit umgehen, vor allem im Sommer.", "In den heißen Stunden die Fensterläden schließen: So bleibt das Haus kühl."], "pets": "Haustiere: auf Anfrage.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 9 bis 20 Uhr.", "Der Pool ist nicht beaufsichtigt: Kinder nur unter Aufsicht eines Erwachsenen.", "Vor dem Baden duschen, kein Glas am Becken."], "bf_t": "Frühstück", "bf": "Von 8:30 bis 10 Uhr, mit Produkten aus der Region.", "table_t": "Table d'hôtes (Abendessen)", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Auf Anfrage, fragen Sie uns nach einem Termin.", "trash_t": "Mülltrennung", "trash": "Verpackungen und Papier in die gelbe Tonne, Glas zum Container im Dorf, der Rest in den Hausmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Märkte", "market_n": "Markttage ohne Gewähr, bitte vor Ort prüfen.", "maps": "Route", "c4": "Provence-Tipps", "heat_t": "Hitze und Sonne", "heat": "Im Sommer viel trinken, zwischen 13 und 17 Uhr Anstrengung meiden, Hut und Sonnencreme.", "fire_t": "Wälder und Waldbrandgefahr", "fire": "Von Juni bis September kann der Zugang zu den Waldgebieten je nach Tagesrisiko eingeschränkt oder gesperrt sein. Vor einer Wanderung die Karte der Präfektur prüfen.", "mistral_t": "Der Mistral", "mistral": "Dieser Nordwind kann mehrere Tage kräftig wehen: erfrischend, aber Vorsicht mit Sonnenschirmen und Bootsausflügen.", "mosq_t": "Mücken", "mosq": "In der Camargue Mückenschutz mitnehmen, vor allem abends.", "sea_t": "Das Meer", "sea": "Beachten Sie die Badeflaggen. Seenotrettung: 196.", "sos_t": "Notfälle", "sos": [["112", "Notruf (ganz Europa)"], ["15", "Medizinischer Notfall (SAMU)"], ["18", "Feuerwehr"], ["17", "Polizei"], ["114", "Notruf per SMS"], ["3237", "Notdienst-Apotheke"]], "tax_t": "Kurtaxe", "tax": "Sie wird von der Gemeinde festgelegt, kommt zum Übernachtungspreis hinzu (pro Erwachsenem und Nacht) und wir führen sie an die Gemeinde ab.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel am vereinbarten Ort", "Fenster und Läden geschlossen", "Klimaanlage und Licht aus", "Geschirr gespült oder in der Spülmaschine", "Müll hinausgebracht", "Nichts vergessen: Ladegeräte, Badesachen, Kühlschrank"], "thanks": "Danke für Ihren Aufenthalt! Eine Online-Bewertung hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Gästemappe von Umbra für {n}"}, "nl": {"kicker": "Welkomstgids", "welcome_t": "Welkom", "welcome": "Welkom in {n}! Je bent {z}. In deze gids vind je alles voor je verblijf: de aankomst, het huis, onze favoriete adressen rond {c} en praktische tips. Bewaar hem op je telefoon.", "checkin": "Aankomst", "checkout": "Vertrek", "wifi": "Wifi", "host": "Je gastheer", "from": "vanaf 16.00 uur", "before": "vóór 11.00 uur", "net": "Netwerk", "pwd": "Wachtwoord", "call": "Bellen", "msg": "Bericht", "nav": ["Aankomst", "Het huis", "Omgeving", "Provence-tips", "Vertrek"], "c1": "Aankomst", "car": "Met de auto", "car_t": "We sturen je het exacte adres en de routebeschrijving vóór je aankomst. Op het platteland kan de navigatie zich vergissen: volg voor de laatste kilometers onze aanwijzingen.", "train": "Met de trein", "plane": "Met het vliegtuig", "approx": "geschatte afstanden over de weg", "parking": "Parkeren", "park_yes": "Gratis privéparkeerplaats ter plaatse.", "park_no": "Waar je kunt parkeren, laten we je vóór aankomst weten.", "late": "Kom je laat aan? Laat het ons weten, dan regelen we het (sleutelkastje of ontvangst).", "police_t": "Buitenlandse gasten: politieformulier", "police": "De Franse wet verplicht elke gast zonder Franse nationaliteit om bij aankomst een kort formulier in te vullen (naam, geboortedatum en -plaats, nationaliteit, adres). Het duurt een minuutje, dank je!", "c2": "Het huis", "rules_t": "Huisregels", "rules": ["Binnen wordt niet gerookt.", "Rust na 22.00 uur, zodat iedereen kan uitrusten.", "Water is kostbaar in de Provence: ga er zuinig mee om, zeker in de zomer.", "Houd de luiken dicht tijdens de warmste uren: zo blijft het huis koel."], "pets": "Huisdieren: op aanvraag.", "clim": "Airco: houd de ramen dicht als hij aanstaat en zet hem uit als je weggaat.", "pool_t": "Het zwembad", "pool": ["Open van 9.00 tot 20.00 uur.", "Het zwembad is onbewaakt: kinderen alleen onder toezicht van een volwassene.", "Douche vóór het zwemmen, geen glas rond het bad."], "bf_t": "Ontbijt", "bf": "Geserveerd van 8.30 tot 10.00 uur, met streekproducten.", "table_t": "Table d'hôtes (diner)", "table": "Op aanvraag, de dag van tevoren.", "spa_t": "Spa", "spa": "Op aanvraag, vraag ons naar een tijdstip.", "trash_t": "Afval scheiden", "trash": "Verpakkingen en papier in de gele bak, glas naar de glasbak in het dorp, de rest bij het restafval.", "c3": "Rond {c}", "near_t": "De moeite waard in de buurt", "market_t": "Markten", "market_n": "Marktdagen zijn indicatief, check ze ter plaatse.", "maps": "Route", "c4": "Provence-tips", "heat_t": "Hitte en zon", "heat": "Drink in de zomer veel water, vermijd inspanning tussen 13.00 en 17.00 uur, draag een hoed en zonnebrand.", "fire_t": "Bossen en brandgevaar", "fire": "Van juni tot september kan de toegang tot de beboste heuvels beperkt of verboden zijn, afhankelijk van het risico van de dag. Bekijk vóór een wandeling de kaart van de prefectuur.", "mistral_t": "De mistral", "mistral": "Deze noordenwind kan dagenlang hard waaien: verfrissend, maar let op parasols en boottochtjes.", "mosq_t": "Muggen", "mosq": "Neem in de Camargue muggenspray mee, vooral 's avonds.", "sea_t": "De zee", "sea": "Respecteer de vlaggen op het strand. Redding op zee: 196.", "sos_t": "Noodgevallen", "sos": [["112", "Noodnummer (heel Europa)"], ["15", "Medische nood (SAMU)"], ["18", "Brandweer"], ["17", "Politie"], ["114", "Noodnummer via sms"], ["3237", "Apotheek van dienst"]], "tax_t": "Toeristenbelasting", "tax": "Vastgesteld door de gemeente, komt bij de prijs per nacht (per volwassene, per nacht) en wij dragen hem af aan de gemeente.", "c5": "Vertrek", "out_t": "Voor je vertrekt", "out": ["Sleutels op de afgesproken plek", "Ramen en luiken dicht", "Airco en lichten uit", "Afwas gedaan of in de vaatwasser", "Afval buiten gezet", "Niets vergeten: opladers, zwemkleding, de koelkast"], "thanks": "Bedankt voor je verblijf! Een online review helpt ons enorm.", "gallery": "In beeld", "ex": "in te vullen", "made": "Gids gemaakt door Umbra voor {n}"}};
var R={"NAV4": {"fr": "Lot pratique", "en": "Lot tips", "de": "Lot-Tipps", "nl": "Lot-tips"}, "RULES": {"fr": ["Fosse septique : uniquement du papier toilette dans les WC, ni lingettes ni protections.", "L’été, l’eau est précieuse : douches courtes, et pas d’arrosage en cas d’arrêté sécheresse.", "Pas de feu ni de barbecue hors de l’emplacement prévu : par temps sec, les bois s’embrasent vite.", "Calme après 22 h : à la campagne, le son porte loin et les voisins se lèvent tôt."], "en": ["Septic tank: only toilet paper down the loo – no wipes or sanitary products.", "Water is precious in summer: keep showers short, and no watering when drought restrictions apply.", "No fires or barbecues except where provided: woodland catches fire very quickly in dry weather.", "Quiet after 10 pm: sound carries a long way in the countryside, and neighbours rise early."], "de": ["Klärgrube: nur Toilettenpapier in die Toilette – keine Feuchttücher, keine Hygieneartikel.", "Im Sommer ist Wasser kostbar: kurz duschen und bei Trockenheitserlass nicht gießen.", "Feuer und Grillen nur am vorgesehenen Platz: Bei Trockenheit fängt der Wald schnell Feuer.", "Ruhe ab 22 Uhr: Auf dem Land trägt der Schall weit, und die Nachbarn stehen früh auf."], "nl": ["Septische put: alleen wc-papier in het toilet – geen vochtige doekjes of maandverband.", "Water is ’s zomers kostbaar: kort douchen en niet sproeien als er een droogtebesluit geldt.", "Geen vuur of barbecue buiten de vaste plek: bij droogte vat het bos razendsnel vlam.", "Rust na 22.00 uur: op het platteland draagt geluid ver en de buren staan vroeg op."]}, "HOUSE": {"fr": [{"ic": "fire", "h": "Poêle & chauffage", "p": "Le poêle à bois : on vous montre son fonctionnement à l’arrivée. Brûlez uniquement le bois sec fourni et gardez la porte fermée hors rechargement. Les cendres restent chaudes plusieurs jours : videz-les dans le seau métallique, dehors, loin de tout ce qui brûle."}, {"ic": "sun", "h": "Garder la fraîcheur", "p": "Les murs de pierre gardent la fraîcheur si on les aide : en journée, fermez volets et fenêtres côté soleil, puis ouvrez grand le soir et la nuit. En cas de canicule, buvez souvent et évitez l’effort entre 12 h et 17 h."}, {"ic": "leaf", "h": "Eau & fosse septique", "p": "Comme beaucoup de maisons de campagne, la nôtre peut fonctionner avec une <b>fosse septique<\/b> : dans les WC, uniquement du papier toilette. Ni lingettes, ni cotons, ni protections, ni huile de friture, et l’eau de Javel avec modération. L’eau du robinet est potable."}, {"ic": "home", "h": "Électricité", "p": "Le tableau électrique : on vous indique son emplacement à l’arrivée. Si tout se coupe, débranchez le dernier appareil allumé puis relevez le disjoncteur. Les orages d’été provoquent parfois de courtes coupures : débranchez la box et les appareils sensibles quand le tonnerre approche."}, {"ic": "bin", "h": "Tri des déchets", "ul": ["Jaune : tous les emballages (plastique, métal, carton) et les papiers, bien vidés, sans les emboîter.", "Verre : dans les colonnes à verre du village, de préférence en journée.", "Ordures ménagères : en sacs fermés, dans le bac ou le conteneur gris.", "Épluchures et restes : au composteur s’il y en a un, sinon selon les consignes de la commune.", "Dans de nombreuses communes, les conteneurs s’ouvrent avec un badge : s’il en faut un, nous vous le laissons."]}, {"ic": "sos", "h": "Sécurité & voisinage", "p": "La maison est équipée de détecteurs de fumée ; l’extincteur et la trousse de secours : on vous les montre à l’arrivée. S’il y a une piscine, ne laissez jamais un enfant seul à proximité. Et le soir, musique douce : à la campagne, tout s’entend."}], "en": [{"ic": "fire", "h": "Wood stove & heating", "p": "The wood-burning stove: we’ll show you how it works when you arrive. Burn only the dry logs provided and keep the door shut except when refuelling. Ashes stay hot for days: empty them into the metal bucket, outside and well away from anything that could catch fire."}, {"ic": "sun", "h": "Keeping cool", "p": "Thick stone walls stay cool if you help them: during the day, close shutters and windows on the sunny side, then open everything wide in the evening and overnight. In a heatwave, drink often and avoid exertion between noon and 5 pm."}, {"ic": "leaf", "h": "Water & septic tank", "p": "Like many country houses, ours may run on a <b>septic tank<\/b> (fosse septique): only toilet paper down the loo. No wipes, cotton buds, sanitary products or cooking oil, and go easy on the bleach. Tap water is safe to drink."}, {"ic": "home", "h": "Electricity", "p": "The fuse box: we’ll show you where it is when you arrive. If everything trips, unplug the last appliance you switched on, then flip the main switch back up. Summer storms sometimes cause short power cuts: unplug the router and sensitive devices when thunder is close."}, {"ic": "bin", "h": "Recycling & rubbish", "ul": ["Yellow: all packaging (plastic, metal, cardboard) and paper, emptied and not stacked inside each other.", "Glass: in the village bottle banks, ideally during the day.", "General waste: in tied bags, in the grey bin or container.", "Peelings and food scraps: in the compost bin if there is one, otherwise as the commune advises.", "In many communes the bins open with a badge: if one is needed, we’ll leave it for you."]}, {"ic": "sos", "h": "Safety & neighbours", "p": "The house has smoke alarms; we’ll show you the fire extinguisher and first-aid kit when you arrive. If there is a pool, never leave a child near it unsupervised. And keep music low in the evening: sound carries in the countryside."}], "de": [{"ic": "fire", "h": "Holzofen & Heizung", "p": "Den Holzofen zeigen wir Ihnen bei der Ankunft. Verbrennen Sie nur das bereitgestellte trockene Holz und halten Sie die Tür außer beim Nachlegen geschlossen. Asche bleibt tagelang heiß: bitte in den Metalleimer geben, draußen und fern von allem Brennbaren."}, {"ic": "sun", "h": "Kühle bewahren", "p": "Dicke Steinmauern halten die Kühle, wenn man ihnen hilft: tagsüber Fensterläden und Fenster auf der Sonnenseite schließen, abends und nachts weit öffnen. Bei Hitzewellen viel trinken und Anstrengung zwischen 12 und 17 Uhr meiden."}, {"ic": "leaf", "h": "Wasser & Klärgrube", "p": "Wie viele Landhäuser kann auch unseres an eine <b>Klärgrube<\/b> angeschlossen sein: nur Toilettenpapier in die Toilette. Keine Feuchttücher, Wattestäbchen, Hygieneartikel oder Frittierfett, Bleichmittel nur sparsam. Das Leitungswasser ist trinkbar."}, {"ic": "home", "h": "Strom", "p": "Den Sicherungskasten zeigen wir Ihnen bei der Ankunft. Fällt alles aus, ziehen Sie das zuletzt eingeschaltete Gerät aus und legen den Hauptschalter wieder um. Sommergewitter verursachen manchmal kurze Stromausfälle: Router und empfindliche Geräte bei nahendem Donner ausstecken."}, {"ic": "bin", "h": "Mülltrennung", "ul": ["Gelb: alle Verpackungen (Plastik, Metall, Karton) und Papier, gut geleert und nicht ineinandergesteckt.", "Glas: in die Glascontainer im Dorf, am besten tagsüber.", "Restmüll: in geschlossenen Beuteln in die graue Tonne oder den grauen Container.", "Schalen und Essensreste: auf den Kompost, falls vorhanden, sonst nach den Regeln der Gemeinde.", "In vielen Gemeinden öffnen sich die Container nur mit einem Chip: Falls nötig, lassen wir Ihnen einen da."]}, {"ic": "sos", "h": "Sicherheit & Nachbarn", "p": "Das Haus ist mit Rauchmeldern ausgestattet; Feuerlöscher und Erste-Hilfe-Set zeigen wir Ihnen bei der Ankunft. Gibt es einen Pool, lassen Sie Kinder dort nie unbeaufsichtigt. Abends bitte leise Musik: Auf dem Land hört man alles."}], "nl": [{"ic": "fire", "h": "Houtkachel & verwarming", "p": "Hoe de houtkachel werkt, laten we u bij aankomst zien. Stook alleen het droge hout dat klaarligt en houd het deurtje dicht, behalve bij het bijvullen. As blijft dagenlang heet: leeg die in de metalen emmer, buiten en ver van alles wat kan branden."}, {"ic": "sun", "h": "Koel houden", "p": "Dikke stenen muren blijven koel als u ze een handje helpt: overdag luiken en ramen aan de zonkant dicht, ’s avonds en ’s nachts alles wijd open. Bij een hittegolf: drink veel en vermijd inspanning tussen 12 en 17 uur."}, {"ic": "leaf", "h": "Water & septische put", "p": "Zoals veel landhuizen kan ook het onze op een <b>septische put<\/b> zijn aangesloten: alleen wc-papier in het toilet. Geen doekjes, wattenstaafjes, maandverband of frituurvet, en wees zuinig met bleek. Het kraanwater is drinkbaar."}, {"ic": "home", "h": "Elektriciteit", "p": "Waar de stoppenkast zit, laten we u bij aankomst zien. Valt alles uit, haal dan het laatst aangezette apparaat uit het stopcontact en zet de hoofdschakelaar terug. Zomeronweer zorgt soms voor korte stroomstoringen: trek de stekker van modem en gevoelige apparaten eruit als het onweer nadert."}, {"ic": "bin", "h": "Afval scheiden", "ul": ["Geel: alle verpakkingen (plastic, metaal, karton) en papier, goed leeg en niet in elkaar geschoven.", "Glas: in de glasbakken in het dorp, liefst overdag.", "Restafval: in dichtgeknoopte zakken in de grijze bak of container.", "Schillen en etensresten: op de composthoop als die er is, anders volgens de regels van de gemeente.", "In veel gemeenten gaan de containers open met een pasje: als dat nodig is, laten we het voor u klaar."]}, {"ic": "sos", "h": "Veiligheid & buren", "p": "Het huis heeft rookmelders; de brandblusser en de verbanddoos laten we u bij aankomst zien. Is er een zwembad, laat kinderen er dan nooit zonder toezicht. En ’s avonds zachte muziek: op het platteland hoor je alles."}]}, "PRAT": {"fr": [{"ic": "sun", "h": "Au fil des saisons", "p": "Printemps doux et fleuri, été chaud et sec (souvent plus de 30 °C en juillet–août), automne lumineux, idéal pour les marchés et les cèpes. L’hiver est frais et humide, avec des brumes matinales dans les vallées."}, {"ic": "list", "h": "Grottes : réservez", "al": 1, "p": "Les grottes ornées ont des jauges strictes. <b>Lascaux IV<\/b> : réservez en ligne, surtout l’été. <b>Font-de-Gaume<\/b> : très peu de places par jour, réservez longtemps à l’avance. <b>Padirac<\/b> et <b>Pech Merle<\/b> : visites sur créneaux en saison. Sous terre, il fait environ 13 °C : prévoyez une petite laine."}, {"ic": "sea", "h": "Canoë sur la rivière", "p": "Sur la Dordogne et la Vézère, le loueur vous dépose en amont et vous redescendez à votre rythme. En juillet–août, réservez la veille et partez tôt. Après de fortes pluies ou des lâchers de barrage, le niveau monte vite : suivez l’avis du loueur, gilet toujours attaché."}, {"ic": "leaf", "h": "Chasse & cueillette", "al": 1, "p": "La chasse est ouverte en gros de septembre à fin février, surtout le week-end. Aux panneaux « Chasse en cours », restez sur les chemins et portez une couleur vive. Champignons : faites contrôler votre cueillette en pharmacie, et respectez les bois privés."}, {"ic": "bug", "h": "Tiques & santé", "p": "Après une balade dans l’herbe haute ou en sous-bois, inspectez-vous : les tiques sont fréquentes d’avril à octobre. Retirez-les avec un tire-tique. Pharmacie de garde : <b>3237<\/b>. Les visiteurs britanniques peuvent utiliser leur carte GHIC."}, {"ic": "wind", "h": "Orages & canicule", "al": 1, "p": "Les orages d’été peuvent être violents, avec grêle et rafales : rentrez coussins et linge, évitez rivière et arbres isolés. Suivez la vigilance Météo-France. Par forte chaleur, visitez tôt le matin et gardez les volets clos."}, {"ic": "car", "h": "Sur la route", "p": "Routes étroites, tracteurs, chevreuils au crépuscule : roulez en douceur, et attention à la priorité à droite dans les villages. Alcool : 0,5 g/l, plus strict qu’en Angleterre ; en dégustation, désignez un conducteur. À Sarlat, Rocamadour ou Saint-Cirq, utilisez les parkings d’entrée."}, {"ic": "coins", "h": "Marchés & horaires", "p": "Gardez de la monnaie pour les marchés. Beaucoup de commerces ferment de 12 h à 14 h, le dimanche après-midi et le lundi ; hors saison, nombre de restaurants ferment lundi et mardi. L’été, les <b>marchés nocturnes<\/b> réunissent producteurs et grandes tablées : selon le village, apportez vos couverts."}], "en": [{"ic": "sun", "h": "Through the seasons", "p": "Mild, flowery springs; hot, dry summers (often above 30 °C in July and August); bright autumns, perfect for markets and wild mushrooms. Winters are cool and damp, with morning mist in the valleys."}, {"ic": "list", "h": "Caves: book ahead", "al": 1, "p": "The painted caves have strict visitor limits. <b>Lascaux IV<\/b>: book online, especially in summer. <b>Font-de-Gaume<\/b>: very few places a day, so book well in advance. <b>Padirac<\/b> and <b>Pech Merle<\/b>: timed slots in season. It’s around 13 °C underground, so bring a jumper."}, {"ic": "sea", "h": "Canoeing the rivers", "p": "On the Dordogne and the Vézère, the hire company drops you upstream and you paddle back at your own pace. In July and August, book the day before and set off early. After heavy rain or dam releases the water rises fast: follow the hirer’s advice and keep your buoyancy aid fastened."}, {"ic": "leaf", "h": "Hunting & foraging", "al": 1, "p": "Hunting season runs roughly from September to the end of February, mostly at weekends. Where you see ‘Chasse en cours’ signs, stay on the paths and wear something bright. Mushrooms: have your finds checked at a pharmacy, and respect private woodland."}, {"ic": "bug", "h": "Ticks & health", "p": "After walking through long grass or woodland, check yourself for ticks – common from April to October – and remove them with a tick tool. Duty pharmacy: <b>3237<\/b>. UK visitors can use their GHIC card for state healthcare."}, {"ic": "wind", "h": "Storms & heatwaves", "al": 1, "p": "Summer storms can be fierce, with hail and strong gusts: bring in cushions and washing, and keep away from the river and lone trees. Check Météo-France warnings. In a heatwave, sightsee early and keep the shutters closed."}, {"ic": "car", "h": "On the road", "p": "Narrow lanes, tractors and deer at dusk: drive gently, and watch for ‘priority to the right’ in villages. The drink-drive limit is 0.5 g/l, stricter than in England, so pick a driver for wine tastings. In Sarlat, Rocamadour or Saint-Cirq, use the car parks on the edge of town."}, {"ic": "coins", "h": "Markets & opening hours", "p": "Carry some cash for markets. Many shops close from noon to 2 pm, on Sunday afternoons and on Mondays; out of season, many restaurants close on Mondays and Tuesdays. In summer, don’t miss the <b>night markets<\/b>: local producers and long shared tables – in some villages you bring your own cutlery."}], "de": [{"ic": "sun", "h": "Im Lauf der Jahreszeiten", "p": "Milder, blühender Frühling, heißer und trockener Sommer (im Juli und August oft über 30 °C), ein leuchtender Herbst, ideal für Märkte und Steinpilze. Der Winter ist kühl und feucht, mit Morgennebel in den Tälern."}, {"ic": "list", "h": "Höhlen: reservieren", "al": 1, "p": "Die Bilderhöhlen haben strenge Besucherkontingente. <b>Lascaux IV<\/b>: online buchen, vor allem im Sommer. <b>Font-de-Gaume<\/b>: sehr wenige Plätze pro Tag, lange im Voraus reservieren. <b>Padirac<\/b> und <b>Pech Merle<\/b>: in der Saison feste Zeitfenster. Unter Tage sind es etwa 13 °C – nehmen Sie eine Jacke mit."}, {"ic": "sea", "h": "Kanu auf dem Fluss", "p": "Auf Dordogne und Vézère bringt Sie der Verleih flussaufwärts, zurück paddeln Sie in Ihrem Tempo. Im Juli und August am Vortag reservieren und früh starten. Nach starkem Regen oder Stauseeablässen steigt das Wasser schnell: Folgen Sie dem Rat des Verleihs, Schwimmweste immer geschlossen."}, {"ic": "leaf", "h": "Jagd & Pilze", "al": 1, "p": "Jagdsaison ist ungefähr von September bis Ende Februar, vor allem am Wochenende. Bei Schildern „Chasse en cours“ auf den Wegen bleiben und etwas Leuchtendes tragen. Pilze: Lassen Sie Ihren Fund in der Apotheke prüfen, und respektieren Sie Privatwald."}, {"ic": "bug", "h": "Zecken & Gesundheit", "p": "Nach Spaziergängen durch hohes Gras oder Wald absuchen: Zecken sind von April bis Oktober häufig. Mit einer Zeckenzange entfernen. Apothekennotdienst: <b>3237<\/b>. Mit der Europäischen Krankenversicherungskarte werden Sie in Frankreich behandelt."}, {"ic": "wind", "h": "Gewitter & Hitze", "al": 1, "p": "Sommergewitter können heftig sein, mit Hagel und Sturmböen: Kissen und Wäsche hereinholen, Fluss und einzelne Bäume meiden. Unwetterwarnungen von Météo-France beachten. Bei großer Hitze früh am Morgen besichtigen und die Fensterläden geschlossen halten."}, {"ic": "car", "h": "Unterwegs", "p": "Schmale Straßen, Traktoren, Rehe in der Dämmerung: Fahren Sie gelassen, und in Dörfern gilt oft rechts vor links. Promillegrenze 0,5 ‰: Bestimmen Sie bei Weinproben einen Fahrer. In Sarlat, Rocamadour oder Saint-Cirq die Parkplätze am Ortsrand nutzen."}, {"ic": "coins", "h": "Märkte & Öffnungszeiten", "p": "Halten Sie für die Märkte etwas Bargeld bereit. Viele Geschäfte schließen von 12 bis 14 Uhr, sonntagnachmittags und montags; außerhalb der Saison haben viele Restaurants Mo. und Di. Ruhetag. Im Sommer locken die <b>Nachtmärkte<\/b> mit Erzeugern und langen Tafeln – je nach Dorf das eigene Besteck mitbringen."}], "nl": [{"ic": "sun", "h": "Door de seizoenen", "p": "Een zacht, bloeiend voorjaar, een hete en droge zomer (in juli en augustus vaak boven 30 °C) en een stralende herfst, ideaal voor markten en paddenstoelen. De winter is fris en vochtig, met ochtendnevel in de dalen."}, {"ic": "list", "h": "Grotten: reserveer", "al": 1, "p": "De beschilderde grotten werken met strikte quota. <b>Lascaux IV<\/b>: online reserveren, zeker in de zomer. <b>Font-de-Gaume<\/b>: heel weinig plaatsen per dag, reserveer ruim vooraf. <b>Padirac<\/b> en <b>Pech Merle<\/b>: in het seizoen met tijdslots. Onder de grond is het zo’n 13 °C: neem een trui mee."}, {"ic": "sea", "h": "Kanoën op de rivier", "p": "Op de Dordogne en de Vézère zet de verhuurder u stroomopwaarts af en peddelt u in uw eigen tempo terug. Reserveer in juli en augustus de dag ervoor en vertrek vroeg. Na hevige regen of het openzetten van stuwdammen stijgt het water snel: volg het advies van de verhuurder, zwemvest altijd vast."}, {"ic": "leaf", "h": "Jacht & paddenstoelen", "al": 1, "p": "Het jachtseizoen loopt ongeveer van september tot eind februari, vooral in het weekend. Bij bordjes ‘Chasse en cours’ blijft u op de paden en draagt u felle kleuren. Paddenstoelen: laat uw vondst controleren bij de apotheek, en respecteer privébossen."}, {"ic": "bug", "h": "Teken & gezondheid", "p": "Controleer uzelf na een wandeling door hoog gras of bos: teken komen veel voor van april tot oktober. Verwijder ze met een tekentang. Dienstdoende apotheek: <b>3237<\/b>. Neem uw Europese zorgpas (EHIC) mee."}, {"ic": "wind", "h": "Onweer & hitte", "al": 1, "p": "Zomeronweer kan hevig zijn, met hagel en windstoten: haal kussens en was binnen, en blijf weg van de rivier en losse bomen. Volg de waarschuwingen van Météo-France. Bij grote hitte: ga vroeg op pad en houd de luiken dicht."}, {"ic": "car", "h": "Onderweg", "p": "Smalle wegen, tractoren en reeën in de schemering: rijd rustig, en in dorpen geldt vaak voorrang van rechts. Alcohollimiet 0,5 promille: wijs bij wijnproeverijen een Bob aan. In Sarlat, Rocamadour of Saint-Cirq parkeert u het best aan de rand van het dorp."}, {"ic": "coins", "h": "Markten & openingstijden", "p": "Neem wat contant geld mee naar de markt. Veel winkels sluiten van 12 tot 14 uur, op zondagmiddag en op maandag; buiten het seizoen zijn veel restaurants ma. en di. dicht. In de zomer zijn er <b>avondmarkten<\/b> met producenten en lange tafels – in sommige dorpen neemt u uw eigen bestek mee."}]}, "TERROIR": {"fr": [["Noix du Périgord", "AOP ; à croquer fraîches, en huile, en gâteau ou en vin de noix", "oct. – déc."], ["Truffe noire du Périgord", "Le « diamant noir », vendue sur les marchés aux truffes de Sarlat, Sainte-Alvère, Lalbenque", "déc. – fév."], ["Foie gras & confits", "IGP Canard à foie gras du Sud-Ouest ; marchés au gras en hiver", "toute l’année, nov. – mars"], ["Fraise du Périgord", "IGP ; Gariguette au printemps, Mara des bois jusqu’à l’automne", "avr. – oct."], ["Rocamadour", "AOP ; petit fromage de chèvre fondant, frais ou affiné", "printemps – automne"], ["Agneau du Quercy", "IGP et Label Rouge, élevé sur les causses", "toute l’année"], ["Vins de Cahors", "AOC ; rouges profonds à base de malbec, le « vin noir »", "toute l’année"], ["Bergerac & Monbazillac", "AOC ; rouges, blancs secs et le liquoreux de Monbazillac, parfait avec le foie gras", "toute l’année"], ["Melon du Quercy", "IGP ; sucré et parfumé, cultivé sur les coteaux du Quercy", "juil. – sept."], ["Cèpes", "Le champignon roi des sous-bois après les pluies d’automne", "sept. – nov."], ["Châtaignes", "Grillées, en soupe ou en farine ; reines des marchés d’automne", "oct. – nov."]], "en": [["Périgord walnuts", "PDO; eaten fresh, as walnut oil, in cakes or as walnut wine", "Oct – Dec"], ["Périgord black truffle", "The ‘black diamond’, sold at truffle markets in Sarlat, Sainte-Alvère and Lalbenque", "Dec – Feb"], ["Foie gras & confit", "PGI South-West duck foie gras; ‘marchés au gras’ in winter", "all year, Nov – Mar"], ["Périgord strawberries", "PGI; Gariguette in spring, Mara des bois into autumn", "Apr – Oct"], ["Rocamadour cheese", "PDO; a small, creamy goat’s cheese, fresh or matured", "spring – autumn"], ["Quercy lamb", "PGI and Label Rouge, raised on the limestone plateaux", "all year"], ["Cahors wines", "AOC; deep reds based on Malbec, the famous ‘black wine’", "all year"], ["Bergerac & Monbazillac", "AOC; reds, dry whites and sweet Monbazillac, perfect with foie gras", "all year"], ["Quercy melon", "PGI; sweet and fragrant, grown on the Quercy hillsides", "Jul – Sep"], ["Ceps (porcini)", "The king of woodland mushrooms, after the autumn rains", "Sep – Nov"], ["Chestnuts", "Roasted, in soups or as flour; stars of the autumn markets", "Oct – Nov"]], "de": [["Walnüsse aus dem Périgord", "AOP; frisch, als Nussöl, im Kuchen oder al
