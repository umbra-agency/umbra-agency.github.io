<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0e">
<title>Lo Rey du Lac · Livret d&#x27;accueil</title>
<meta property="og:title" content="Lo Rey du Lac · votre livret d&#x27;accueil est prêt">
<meta property="og:description" content="Livret d'accueil en 4 langues, préparé par Umbra.">
<meta property="og:image" content="https://wsrv.nl/?url=https%3A%2F%2Floreydulac.com%2Fwp-content%2Fuploads%2F2024%2F02%2FGrand-Lodge-vue-de-face.webp&amp;w=1600&amp;output=webp&amp;q=80">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{--bg:#f5f3ee;--ink:#1a2529;--ink2:#38474d;--acc:#2c7a8c;--soft:#d8ebef;--card:#fffdfa;--line:rgba(0,0,0,.09);--mut:#7d7a72;--r:16px;--fh:'Bodoni Moda';--fb:'Inter';--emst:italic;--ease:cubic-bezier(.2,.7,.1,1);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb),system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,.ser{font-family:var(--fh),Georgia,serif;font-weight:400;letter-spacing:-.005em}
em{font-style:var(--emst,italic)}
.ico{display:inline-flex;width:22px;height:22px;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translate3d(0,34px,0);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.vis{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
.pr{overflow:hidden;clip-path:inset(10% 6% 10% 6% round 22px);transition:clip-path 1.3s var(--ease)}
.pr img{transform:scale(1.12);transition:transform 1.6s var(--ease)}
.pr.vis{clip-path:inset(0 0 0 0 round var(--pr-r,0px))}
.pr.vis img{transform:scale(1)}
.ex{display:inline-block;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);border:1px solid currentColor;padding:4px 6px 3px;border-radius:99px;vertical-align:middle;margin-left:8px;opacity:.85;white-space:nowrap}
/* barre haute */
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:70}
.demo{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:45;font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.16em;text-transform:uppercase;background:rgba(11,11,14,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#ececf1;padding:10px 12px;border-radius:99px;display:flex;gap:7px;align-items:center}
.demo i{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:45;display:flex;gap:2px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.lang button{border:0;background:transparent;font:700 11.5px/1 var(--fb),sans-serif;letter-spacing:.06em;padding:8px 9px;border-radius:99px;color:#2a2a2e;cursor:pointer;transition:background .3s,color .3s}
.lang button.on{background:#111114;color:#fff}
.tip{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 46px);right:14px;z-index:45;background:#111114;color:#f1f1f4;font:600 12px/1.3 var(--fb),sans-serif;padding:9px 12px;border-radius:12px;max-width:210px;opacity:0;transform:translateY(-6px);transition:all .5s var(--ease);pointer-events:none}
.tip:before{content:"";position:absolute;top:-5px;right:22px;width:10px;height:10px;background:#111114;transform:rotate(45deg)}
.tip.on{opacity:1;transform:none}
/* intro Umbra */
#intro{position:fixed;inset:0;z-index:100;background:#060608;color:#e9e9ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .8s ease,visibility .8s}
#intro.off{opacity:0;visibility:hidden}
.ecl{width:78px;height:78px;border-radius:50%;position:relative;background:#d9dbe4;box-shadow:0 0 50px 8px rgba(205,210,230,.22);animation:eg 2.2s var(--ease) both}
.ecl:after{content:"";position:absolute;inset:0;border-radius:50%;background:#060608;transform:translate(14px,-8px);animation:em 2.2s var(--ease) both}
@keyframes eg{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes em{from{transform:translate(70px,-30px)}to{transform:translate(14px,-8px)}}
#intro small{letter-spacing:.38em;text-transform:uppercase;font-size:10.5px;color:#8e90a0}
#intro b{font-family:var(--fh),serif;font-weight:400;font-size:25px;line-height:1.25;text-align:center;padding:0 30px;max-width:520px;opacity:0;animation:fi 1s .5s var(--ease) forwards}
@keyframes fi{to{opacity:1}}
/* blocs de contenu (communs) */
.blk{padding:26px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bh .ico{width:40px;height:40px;padding:9px;border-radius:50%;background:var(--soft);color:var(--acc)}
.bh h3{font-size:23px;line-height:1.2}
.blk p{color:var(--ink2)}
.blk.al{background:var(--soft);border:0;border-radius:20px;padding:22px 20px;margin:10px 0}
.blk.al .bh .ico{background:var(--card)}
.ul{list-style:none}
.ul li{position:relative;padding:9px 0 9px 22px;color:var(--ink2);border-bottom:1px dashed var(--line)}
.ul li:last-child{border-bottom:0}
.ul li:before{content:"";position:absolute;left:2px;top:19px;width:9px;height:1.5px;background:var(--acc)}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r b{font-weight:600}
.rows .r span{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.pois{display:grid;gap:2px}
.poi{display:grid;grid-template-columns:74px 1fr 26px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.poi:last-child{border-bottom:0}
.poi .km{font-family:var(--fh),serif;font-size:38px;line-height:.9;color:var(--acc);text-align:right;font-variant-numeric:lining-nums}
.poi .km small{display:block;font:600 10px/1.6 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.poi b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.2}
.poi small.d{display:block;font-size:14px;color:var(--ink2);line-height:1.45;margin-top:4px}
.poi .go{width:26px;height:26px;color:var(--acc);transition:transform .3s}
.poi:active .go{transform:translateX(4px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.3}
.chip b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:18px}
.chip span{color:var(--mut)}
.sos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sos a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;transition:transform .2s}
.sos a:active{transform:scale(.97)}
.sos b{font-family:var(--fh),serif;font-size:28px;font-weight:400;color:var(--acc);line-height:1.1}
.sos small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35}
.chk label{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk label:last-of-type{border-bottom:0}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .bx{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--acc);flex:none;display:flex;align-items:center;justify-content:center;transition:background .3s}
.chk .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none;opacity:0;transform:scale(.5);transition:all .3s var(--ease)}
.chk input:checked+.bx{background:var(--acc)}
.chk input:checked+.bx svg{opacity:1;transform:none}
.chk input:checked~span{color:var(--mut);text-decoration:line-through}
.prog{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:4px 0 6px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.prog i:after{content:"";position:absolute;inset:0;background:var(--acc);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .5s var(--ease)}
.kick{font:600 11px/1.2 var(--fb),sans-serif;letter-spacing:.3em;text-transform:uppercase}
.z{cursor:zoom-in}
/* ess (essentiels) commun */
.ess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.es{border-radius:20px;padding:16px;position:relative;overflow:hidden}
.es .ico{width:24px;height:24px;margin-bottom:18px}
.es .l{font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.es .v{font-family:var(--fh),serif;font-size:22px;line-height:1.2;margin-top:7px;word-break:break-word}
.es .s{font-size:12.5px;opacity:.7;margin-top:3px}
.es .ex{margin:8px 0 0}
.ess .es:nth-child(3),.ess .es:nth-child(4){grid-column:1/-1}
.ess .es:nth-child(3) .v,.ess .es:nth-child(4) .v{font-size:24px}
/* footer */
footer{background:#0b0b0e;color:#cfd0d8;text-align:center;padding:80px 26px calc(150px + var(--sb))}
footer .ecl{width:44px;height:44px;margin:0 auto 26px;animation:none;box-shadow:0 0 30px 4px rgba(205,210,230,.18)}
footer .ecl:after{background:#0b0b0e;animation:none;transform:translate(8px,-5px)}
footer .thx{font-family:var(--fh),serif;font-size:27px;line-height:1.3;color:#fff;max-width:520px;margin:0 auto 16px}
footer small{font-size:12.5px;letter-spacing:.06em;color:#8d8f9e}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,6,8,.96);display:none;touch-action:pan-y}
#lb.on{display:block}
#lb .tr{display:flex;height:100%;transition:transform .45s var(--ease)}
#lb figure{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:60px 10px}
#lb figure img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
#lb .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;cursor:pointer;z-index:2}
#lb .n{position:absolute;bottom:calc(22px + var(--sb));left:0;right:0;text-align:center;color:#aaa;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em}

/* =========================== MAS : immersif =========================== */
.L-mas .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#1a1a1a}
.L-mas .hero .bg{position:absolute;inset:-6% 0 0 0;will-change:transform}
.L-mas .hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}@keyframes kb2{from{transform:scale(1.04)}to{transform:scale(1)}}.L-mas .hero .bg img.lo{animation-name:kb2}
.L-mas .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.72) 100%)}
.L-mas .hero .tx{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 24px calc(92px + var(--sb));max-width:820px;margin:0 auto}
.L-mas .hero .kick{display:flex;align-items:center;gap:12px;opacity:0;animation:fi 1s 2.6s forwards}
.L-mas .hero .kick:before{content:"";width:28px;height:1px;background:#fff}
.L-mas .hero h1{font-size:clamp(50px,14vw,104px);line-height:.95;margin:16px 0 18px}
.sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.sp>span{display:inline-block;transform:translateY(105%);animation:up 1.2s var(--ease) forwards}
@keyframes up{to{transform:none}}
.L-mas .hero .meta{font-size:15px;letter-spacing:.04em;opacity:0;animation:fi 1s 3.1s forwards}
.cue{position:absolute;left:50%;bottom:calc(22px + var(--sb));z-index:2;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cue i{width:1px;height:40px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.cue i:after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{to{top:100%}}
.L-mas .wel{padding:96px 26px 70px;max-width:760px;margin:0 auto}
.L-mas .wel .kick{color:var(--acc);margin-bottom:26px;display:flex;gap:12px;align-items:center}
.L-mas .wel .kick:before{content:"";width:28px;height:1px;background:var(--acc)}
.L-mas .big{font-family:var(--fh),serif;font-size:clamp(28px,7.4vw,44px);line-height:1.22;letter-spacing:-.01em}
.L-mas .big .w{opacity:.14;transition:opacity .4s}
.L-mas .big .w.on{opacity:1}
.L-mas .essw{background:var(--ink);color:var(--bg);padding:56px 18px 60px}
.L-mas .essw .in{max-width:760px;margin:0 auto}
.L-mas .essw .kick{opacity:.6;margin:0 6px 20px}
.L-mas .es{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.L-mas .es .ex{color:var(--bg)}
.L-mas .chap{position:relative}
.L-mas .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:#222;z-index:0}
.L-mas .pin img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;will-change:transform}.L-mas .pin img.lo{inset:-3% 0;height:106%}
.L-mas .pin:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35) 100%)}
.L-mas .plab{position:absolute;left:24px;right:24px;top:calc(84px + env(safe-area-inset-top));z-index:2;color:#fff}
.L-mas .plab .no{font-family:var(--fh),serif;font-size:92px;line-height:.8;display:block;opacity:.95;-webkit-text-stroke:1px rgba(255,255,255,.9);color:transparent}
.L-mas .plab h2{font-size:clamp(40px,11vw,74px);line-height:1;margin-top:6px}
.L-mas .body{position:relative;z-index:2;margin-top:-30svh;background:var(--bg);border-radius:30px 30px 0 0;padding:34px 24px 54px;box-shadow:0 -24px 60px rgba(0,0,0,.22)}
.L-mas .body .in{max-width:720px;margin:0 auto}
.L-mas .body:before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-16px auto 18px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -24px 6px;padding:0 24px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 76%;height:min(62vw,420px);object-fit:cover;border-radius:18px;scroll-snap-align:center}
.L-mas .galw{padding:80px 12px 40px;max-width:980px;margin:0 auto}
.L-mas .galw h2{font-size:clamp(40px,11vw,70px);line-height:1;margin:0 12px 30px}
.L-mas .galw h2 em{color:var(--acc)}
.mz{columns:2;column-gap:10px}
.mz .pr{break-inside:avoid;margin-bottom:10px;--pr-r:14px}
.mz img{width:100%;border-radius:14px}

/* =========================== CARNET : app =========================== */
.L-carnet{background:var(--bg)}
.L-carnet .top{padding:calc(76px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(180deg,var(--soft) 0%,var(--soft) 62%,var(--bg) 100%);overflow:hidden}
.stack{position:relative;height:min(118vw,560px);max-width:520px;margin:0 auto}
.stack .c{position:absolute;left:50%;top:6%;width:66%;aspect-ratio:3/4;margin-left:-33%;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px rgba(30,20,40,.28);transition:transform 1.4s var(--ease);background:#ccc}
.stack .c img{width:100%;height:100%;object-fit:cover}
.stack .c1{transform:rotate(0) translate(0,30px) scale(.9);z-index:1}
.stack .c2{transform:rotate(0) translate(0,30px) scale(.9);z-index:2}
.stack .c3{transform:rotate(0) translate(0,20px);z-index:3}
.stack.vis .c1{transform:rotate(-9deg) translate(-27%,6%) scale(.86)}
.stack.vis .c2{transform:rotate(8deg) translate(27%,8%) scale(.86)}
.stack.vis .c3{transform:rotate(-1.5deg) translate(0,0)}
.L-carnet .ttl{padding:6px 24px 0;max-width:640px;margin:0 auto;text-align:center}
.L-carnet .ttl .kick{color:var(--acc)}
.L-carnet .ttl h1{font-size:clamp(46px,13vw,84px);line-height:.98;margin:14px 0 10px}
.L-carnet .ttl .meta{color:var(--mut);font-size:15px}
.L-carnet .lead{font-size:18.5px;line-height:1.6;color:var(--ink2);padding:26px 24px 8px;max-width:640px;margin:0 auto}
.pass{margin:22px 18px 0;max-width:600px;background:var(--card);border-radius:24px;box-shadow:0 20px 50px rgba(30,20,40,.12);position:relative}
@media(min-width:640px){.pass{margin:22px auto 0}}
.pass .tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 20px 18px}
.pass .tp div:last-child{text-align:right}
.pass .tp .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .tp .v{font-family:var(--fh),serif;font-size:28px;line-height:1.1;margin-top:6px}
.pass .tp .mid{color:var(--acc);width:54px;height:24px}
.pass .tp .mid svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4}
.pass .perf{height:0;border-top:2px dashed var(--line);margin:0 18px;position:relative}
.pass .perf:before,.pass .perf:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.pass .perf:before{left:-30px}.pass .perf:after{right:-30px}
.pass .bt{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pass .bt>div{padding:16px 20px 20px;display:flex;gap:12px;align-items:center}
.pass .bt>div+div{border-left:1px solid var(--line)}
.pass .bt .ico{color:var(--acc)}
.pass .bt .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .bt .v{font-weight:600;font-size:14.5px;margin-top:5px;word-break:break-word;line-height:1.3}
.pass .ex{margin:6px 0 0}
.L-carnet .open{display:flex;margin:28px auto 6px;align-items:center;gap:10px;border:0;background:var(--ink);color:var(--bg);padding:16px 24px;border-radius:99px;font:700 14px/1 var(--fb),sans-serif;letter-spacing:.04em;cursor:pointer}
.L-carnet .open .ico{width:18px;height:18px}
.panes{padding:10px 0 0;min-height:100svh}
.pane{display:none;padding:0 16px 40px;max-width:720px;margin:0 auto}
.pane.on{display:block;animation:pin .55s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pane.on.back{animation-name:pinb}
@keyframes pinb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.pban{position:relative;border-radius:26px;overflow:hidden;height:min(108vw,460px);margin:6px 0 18px;color:#fff;--pr-r:26px}
.pban img{width:100%;height:100%;object-fit:cover}
.pban:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)}
.pban .t{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}
.pban .t span{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.85}
.pban .t h2{font-size:clamp(36px,10vw,56px);line-height:1;margin-top:8px}

.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:50;background:rgba(18,16,22,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:flex;padding:7px;gap:2px;max-width:560px;margin:0 auto;transform:translateY(140%);transition:transform .6s var(--ease);box-shadow:0 18px 40px rgba(0,0,0,.3)}

.L-riviera .rwel{max-width:720px;margin:0 auto;padding:80px 24px 30px}
.L-riviera .rwel .kick{color:var(--acc);margin-bottom:22px}
.L-riviera .drop{font-size:19px;line-height:1.7;color:var(--ink2)}
.L-riviera .drop:first-letter{font-family:var(--fh),serif;float:left;font-size:86px;line-height:.82;margin:6px 12px 0 0;color:var(--acc)}
.etab{margin-top:40px;border-top:1px solid var(--ink)}
.etab .r{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.etab .r .l{font:600 10.5px/1.4 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.etab .r .v{font-family:var(--fh),serif;font-size:24px;line-height:1.2;word-break:break-word}
.etab .r .v small{display:block;font-family:var(--fb),sans-serif;font-size:13px;color:var(--mut);margin-top:3px}
.hs{position:relative;background:var(--bg)}
.hsin{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hsh{display:flex;justify-content:space-between;align-items:baseline;padding:0 24px 22px;max-width:1100px;width:100%;margin:0 auto}
.hsh h2{font-size:clamp(34px,9vw,60px);line-height:1}
.hsh h2 em{color:var(--acc)}
.hsh .cnt{font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em;color:var(--mut);font-variant-numeric:tabular-nums}
.track{display:flex;gap:14px;padding:0 24px;will-change:transform}
.track figure{flex:0 0 78vw;max-width:560px}
.track figure div{height:min(64svh,520px);border-radius:20px;overflow:hidden}
.track img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.track figcaption{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.22em;color:var(--mut);margin-top:12px}
.toc{max-width:760px;margin:0 auto;padding:40px 20px 70px}
.toc>.kick{color:var(--acc);padding:0 4px 18px}
.row{border-top:1px solid var(--ink)}
.row:last-child{border-bottom:1px solid var(--ink)}
.row>button{width:100%;display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;padding:24px 4px;background:transparent;border:0;text-align:left;cursor:pointer}

.row .pl{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .5s var(--ease),background .3s}

.row.on .pl{transform:rotate(45deg);background:var(--ink);color:var(--bg)}

.row .rci>.wrap{padding:0 0 26px}
.row .rimg{height:min(60vw,360px);border-radius:18px;overflow:hidden;margin:0 0 8px}
.row .rimg img{width:100%;height:100%;object-fit:cover}
.night{background:var(--ink);color:var(--bg);padding:84px 22px 80px;position:relative;overflow:hidden}
.night .in{max-width:720px;margin:0 auto;position:relative}

.rgal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:60px 12px 40px;max-width:1100px;margin:0 auto}

.rgal .pr:nth-child(5n+4),.rgal .pr:nth-child(5n+5){grid-column:span 3;aspect-ratio:1}

/* =========================== couche Umbra : offre =========================== */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(130%);transition:transform .6s var(--ease);padding:0 10px calc(10px + var(--sb))}

#sheet .in{max-width:560px;margin:0 auto;background:#0b0b0e;color:#ececf1;border-radius:22px;padding:20px 20px 16px;box-shadow:0 -10px 50px rgba(0,0,0,.35)}

#sheet p{font-size:14.5px;color:#b9bac6;margin:8px 0 14px}
.btns{display:flex;gap:8px}
.b1{flex:1;border:0;background:#ececf1;color:#0b0b0e;font:700 14px/1 var(--fb),sans-serif;padding:15px;border-radius:13px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.b2{border:1px solid #3a3a44;background:transparent;color:#ececf1;font:600 14px/1 var(--fb),sans-serif;padding:15px 16px;border-radius:13px;cursor:pointer}
#pill{position:fixed;right:14px;bottom:calc(14px + var(--sb));z-index:55;border:0;background:#0b0b0e;color:#fff;font:700 13.5px/1 var(--fb),sans-serif;padding:15px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;display:flex;gap:9px;align-items:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:all .5s var(--ease)}
#pill i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
#pill.on{opacity:1;transform:none;pointer-events:auto}
#offer{position:fixed;inset:0;z-index:80;background:rgba(5,5,8,.55);display:none}

#offer .pn{position:absolute;left:0;right:0;bottom:0;top:7svh;background:#0b0b0e;color:#ececf1;border-radius:24px 24px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 20px 40px;animation:sup .55s var(--ease)}
@keyframes sup{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#offer .x{position:sticky;top:0;float:right;background:#1c1c22;color:#fff;border:0;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
#offer .pn>div{max-width:620px;margin:0 auto}
#offer small.k{letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#8d8f9e}

.val{margin:22px 0 6px}
.val div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #22222a;font-size:15px;color:#d6d7de}
.val div b{color:#fff}
.val span{flex:none;width:26px;height:26px;border-radius:50%;background:#1c1c22;display:flex;align-items:center;justify-content:center;font-size:13px}
.plans{display:grid;gap:12px;margin:22px 0}
.plan{border:1px solid #2a2a33;border-radius:18px;padding:18px;position:relative;background:#111116}
.plan.best{border-color:#d9dbe4;background:#15151b}
.plan .tag{position:absolute;top:-10px;left:16px;background:#ececf1;color:#0b0b0e;font:700 10.5px/1 var(--fb),sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:6px}
.plan h4{font-family:var(--fh),serif;font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan h4 b{font-family:var(--fb),sans-serif;font-size:26px;font-weight:700;color:#fff}
.plan ul{list-style:none;margin:10px 0 14px}
.plan li{font-size:14px;color:#c9cad3;padding:5px 0 5px 22px;position:relative}
.plan li:before{content:"✓";position:absolute;left:0;color:#d9dbe4}
.steps{counter-reset:s;margin:10px 0 18px}
.steps div{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:15px;color:#d6d7de}
.steps div:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #3a3a44;display:flex;align-items:center;justify-content:center;font-size:13px}
.guar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 22px}
.guar div{background:#15151b;border-radius:12px;padding:12px;font-size:12.5px;color:#c9cad3;text-align:center;line-height:1.35}
.guar b{display:block;color:#fff;font-size:14px;margin-bottom:4px}
details{border-bottom:1px solid #22222a;padding:14px 0}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}

details p{color:#b9bac6;font-size:14.5px;margin-top:8px}
.legal{font-size:12px;color:#7c7e8c;margin-top:26px;text-align:center}
.legal a{color:#a9abb8;text-decoration:underline}
h3.pt{font-family:var(--fh),serif;font-weight:400;font-size:22px;margin:26px 0 6px}

/* =========================== blocs v3 : services, taxe, terroir, agenda =========================== */
sup{font-size:.62em;line-height:0;vertical-align:.45em}
.svc{display:grid}
.sv{display:grid;grid-template-columns:40px 1fr auto 20px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.txu{font-size:15px;color:var(--ink2);line-height:1.35;max-width:13em;padding-bottom:4px}
.txt .r b{font-weight:500;color:var(--ink2)}

.txm{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 2px;border-top:1px solid var(--line)}

.txm dt{font-size:11.5px;color:var(--mut);line-height:1.3}
.txm dd{font-size:14.5px;font-weight:600;line-height:1.35;margin-top:3px}
.tax .txx,.tax .txw{font-size:14px;margin-top:12px;line-height:1.55}
.tax .txx b{color:var(--ink);font-weight:600}
.txof{font-size:13.5px;color:var(--mut);margin-top:12px;font-variant-numeric:tabular-nums}
.txof span{font-weight:600;color:var(--ink2);margin-right:8px}
.ter .tr{padding:15px 0;border-bottom:1px solid var(--line)}

.ter .th{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.ter .th b{font-family:var(--fh),serif;font-weight:400;font-size:22px;line-height:1.2}
.ter .th span{font-size:13px;color:var(--acc);font-style:italic;text-align:right;flex:none;max-width:45%}
.ter .tr p{font-size:15px;margin-top:4px;line-height:1.5}
.ag{list-style:none;position:relative;margin-top:10px;padding-left:24px}

.ag .w{display:block;font-size:13px;font-weight:600;color:var(--acc)}
.ag b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.25;margin-top:2px}
.ag p{font-size:15px;margin-top:3px;color:var(--ink2);line-height:1.5}
.night .ter .tr{border-color:rgba(255,255,255,.12)}

.sos b{white-space:nowrap}.sos b.lg{font-size:20px;line-height:1.5}
@media(min-width:760px){.txm{grid-template-columns:1.3fr 1fr 1fr}.txm div:first-child{grid-column:auto}.txm div+div{padding-left:14px;border-left:1px solid var(--line)}}

: "Livret préparé par Umbra pour {n}"}, "en": {"kicker": "Welcome guide", "welcome_t": "Welcome", "welcome": "Welcome to {n}! You are {z}. This guide has everything you need for your stay: getting here, the house, our favourite places around {c} and practical tips. Keep it on your phone.", "checkin": "Check-in", "checkout": "Check-out", "wifi": "Wi-Fi", "host": "Your host", "from": "from 4 pm", "before": "before 11 am", "net": "Network", "pwd": "Password", "call": "Call", "msg": "Message", "nav": ["Getting here", "The house", "Around", "Provence tips", "Check-out"], "c1": "Getting here", "car": "By car", "car_t": "We send you the exact address and directions before you arrive. In the countryside GPS can go wrong: follow our directions for the last few kilometres.", "train": "By train", "plane": "By plane", "approx": "approximate road distances", "parking": "Parking", "park_yes": "Free private parking on site.", "park_no": "Where to park: we'll tell you before you arrive.", "late": "Arriving late? Let us know and we'll arrange it (key box or welcome).", "police_t": "Foreign guests: police form", "police": "French law requires every guest who is not a French national to fill in a short form on arrival (name, date and place of birth, nationality, address). It takes one minute, thank you!", "c2": "The house", "rules_t": "House rules", "rules": ["No smoking inside the house.", "Quiet after 10 pm, so everyone can rest.", "Water is precious in Provence: please use it with care, especially in summer.", "Keep the shutters closed in the hot hours: the house stays cool."], "pets": "Pets: on request.", "clim": "Air conditioning: keep windows closed while it runs, and switch it off when you go out.", "pool_t": "The pool", "pool": ["Open from 9 am to 8 pm.", "The pool is unsupervised: children must be watched by an adult.", "Shower before swimming, no glass around the pool."], "bf_t": "Breakfast", "bf": "Served from 8:30 to 10 am, with local produce.", "table_t": "Table d'hôtes (dinner)", "table": "On request, the day before.", "spa_t": "Spa", "spa": "On request, ask us for a time slot.", "trash_t": "Recycling", "trash": "Packaging and paper in the yellow bin, glass at the village bottle bank, everything else in household waste.", "c3": "Around {c}", "near_t": "Worth seeing nearby", "market_t": "Markets", "market_n": "Market days are indicative, please check locally.", "maps": "Directions", "c4": "Provence tips", "heat_t": "Heat and sun", "heat": "In summer, drink plenty of water, avoid effort between 1 and 5 pm, wear a hat and sunscreen.", "fire_t": "Hills and wildfire risk", "fire": "From June to September, access to the forested hills may be restricted or closed depending on the daily risk. Check the prefecture's map before a hike.", "mistral_t": "The mistral", "mistral": "This north wind can blow hard for several days: refreshing, but watch out for parasols and boat trips.", "mosq_t": "Mosquitoes", "mosq": "In the Camargue, bring repellent, especially in the evening.", "sea_t": "The sea", "sea": "Follow the beach flags. Sea rescue: 196.", "sos_t": "Emergencies", "sos": [["112", "Emergency (all of Europe)"], ["15", "Medical emergency (SAMU)"], ["18", "Fire brigade"], ["17", "Police"], ["114", "Emergency by text"], ["3237", "Pharmacy on duty"]], "tax_t": "Tourist tax", "tax": "Set by the town, it is added to the nightly rate (per adult, per night) and we pay it to the town.", "c5": "Check-out", "out_t": "Before you leave", "out": ["Keys left in the agreed place", "Windows and shutters closed", "Air conditioning and lights off", "Dishes washed or in the dishwasher", "Rubbish taken out", "Nothing forgotten: chargers, swimsuits, the fridge"], "thanks": "Thank you for staying with us! An online review helps us enormously.", "gallery": "In pictures", "ex": "to fill in", "made": "Guide prepared by Umbra for {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen in {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Hinweise. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 16 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Provence-Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Anfahrt senden wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi manchmal: Folgen Sie auf den letzten Kilometern unserer Beschreibung.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser privater Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, wir organisieren das (Schlüsselbox oder Empfang).", "police_t": "Ausländische Gäste: Meldeschein", "police": "Das französische Gesetz verlangt, dass jeder Gast ohne französische Staatsangehörigkeit bei der Ankunft einen kurzen Meldeschein ausfüllt (Name, Geburtsdatum und -ort, Staatsangehörigkeit, Adresse). Das dauert eine Minute, danke!", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht.", "Ab 22 Uhr Ruhe, damit sich alle erholen.", "Wasser ist in der Provence kostbar: Bitte sparsam damit umgehen, vor allem im Sommer.", "In den heißen Stunden die Fensterläden schließen: So bleibt das Haus kühl."], "pets": "Haustiere: auf Anfrage.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 9 bis 20 Uhr.", "Der Pool ist nicht beaufsichtigt: Kinder nur unter Aufsicht eines Erwachsenen.", "Vor dem Baden duschen, kein Glas am Becken."], "bf_t": "Frühstück", "bf": "Von 8:30 bis 10 Uhr, mit Produkten aus der Region.", "table_t": "Table d'hôtes (Abendessen)", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Auf Anfrage, fragen Sie uns nach einem Termin.", "trash_t": "Mülltrennung", "trash": "Verpackungen und Papier in die gelbe Tonne, Glas zum Container im Dorf, der Rest in den Hausmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Märkte", "market_n": "Markttage ohne Gewähr, bitte vor Ort prüfen.", "maps": "Route", "c4": "Provence-Tipps", "heat_t": "Hitze und Sonne", "heat": "Im Sommer viel trinken, zwischen 13 und 17 Uhr Anstrengung meiden, Hut und Sonnencreme.", "fire_t": "Wälder und Waldbrandgefahr", "fire": "Von Juni bis September kann der Zugang zu den Waldgebieten je nach Tagesrisiko eingeschränkt oder gesperrt sein. Vor einer Wanderung die Karte der Präfektur prüfen.", "mistral_t": "Der Mistral", "mistral": "Dieser Nordwind kann mehrere Tage kräftig wehen: erfrischend, aber Vorsicht mit Sonnenschirmen und Bootsausflügen.", "mosq_t": "Mücken", "mosq": "In der Camargue Mückenschutz mitnehmen, vor allem abends.", "sea_t": "Das Meer", "sea": "Beachten Sie die Badeflaggen. Seenotrettung: 196.", "sos_t": "Notfälle", "sos": [["112", "Notruf (ganz Europa)"], ["15", "Medizinischer Notfall (SAMU)"], ["18", "Feuerwehr"], ["17", "Polizei"], ["114", "Notruf per SMS"], ["3237", "Notdienst-Apotheke"]], "tax_t": "Kurtaxe", "tax": "Sie wird von der Gemeinde festgelegt, kommt zum Übernachtungspreis hinzu (pro Erwachsenem und Nacht) und wir führen sie an die Gemeinde ab.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel am vereinbarten Ort", "Fenster und Läden geschlossen", "Klimaanlage und Licht aus", "Geschirr gespült oder in der Spülmaschine", "Müll hinausgebracht", "Nichts vergessen: Ladegeräte, Badesachen, Kühlschrank"], "thanks": "Danke für Ihren Aufenthalt! Eine Online-Bewertung hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Gästemappe von Umbra für {n}"}, "nl": {"kicker": "Welkomstgids", "welcome_t": "Welkom", "welcome": "Welkom in {n}! Je bent {z}. In deze gids vind je alles voor je verblijf: de aankomst, het huis, onze favoriete adressen rond {c} en praktische tips. Bewaar hem op je telefoon.", "checkin": "Aankomst", "checkout": "Vertrek", "wifi": "Wifi", "host": "Je gastheer", "from": "vanaf 16.00 uur", "before": "vóór 11.00 uur", "net": "Netwerk", "pwd": "Wachtwoord", "call": "Bellen", "msg": "Bericht", "nav": ["Aankomst", "Het huis", "Omgeving", "Provence-tips", "Vertrek"], "c1": "Aankomst", "car": "Met de auto", "car_t": "We sturen je het exacte adres en de routebeschrijving vóór je aankomst. Op het platteland kan de navigatie zich vergissen: volg voor de laatste kilometers onze aanwijzingen.", "train": "Met de trein", "plane": "Met het vliegtuig", "approx": "geschatte afstanden over de weg", "parking": "Parkeren", "park_yes": "Gratis privéparkeerplaats ter plaatse.", "park_no": "Waar je kunt parkeren, laten we je vóór aankomst weten.", "late": "Kom je laat aan? Laat het ons weten, dan regelen we het (sleutelkastje of ontvangst).", "police_t": "Buitenlandse gasten: politieformulier", "police": "De Franse wet verplicht elke gast zonder Franse nationaliteit om bij aankomst een kort formulier in te vullen (naam, geboortedatum en -plaats, nationaliteit, adres). Het duurt een minuutje, dank je!", "c2": "Het huis", "rules_t": "Huisregels", "rules": ["Binnen wordt niet gerookt.", "Rust na 22.00 uur, zodat iedereen kan uitrusten.", "Water is kostbaar in de Provence: ga er zuinig mee om, zeker in de zomer.", "Houd de luiken dicht tijdens de warmste uren: zo blijft het huis koel."], "pets": "Huisdieren: op aanvraag.", "clim": "Airco: houd de ramen dicht als hij aanstaat en zet hem uit als je weggaat.", "pool_t": "Het zwembad", "pool": ["Open van 9.00 tot 20.00 uur.", "Het zwembad is onbewaakt: kinderen alleen onder toezicht van een volwassene.", "Douche vóór het zwemmen, geen glas rond het bad."], "bf_t": "Ontbijt", "bf": "Geserveerd van 8.30 tot 10.00 uur, met streekproducten.", "table_t": "Table d'hôtes (diner)", "table": "Op aanvraag, de dag van tevoren.", "spa_t": "Spa", "spa": "Op aanvraag, vraag ons naar een tijdstip.", "trash_t": "Afval scheiden", "trash": "Verpakkingen en papier in de gele bak, glas naar de glasbak in het dorp, de rest bij het restafval.", "c3": "Rond {c}", "near_t": "De moeite waard in de buurt", "market_t": "Markten", "market_n": "Marktdagen zijn indicatief, check ze ter plaatse.", "maps": "Route", "c4": "Provence-tips", "heat_t": "Hitte en zon", "heat": "Drink in de zomer veel water, vermijd inspanning tussen 13.00 en 17.00 uur, draag een hoed en zonnebrand.", "fire_t": "Bossen en brandgevaar", "fire": "Van juni tot september kan de toegang tot de beboste heuvels beperkt of verboden zijn, afhankelijk van het risico van de dag. Bekijk vóór een wandeling de kaart van de prefectuur.", "mistral_t": "De mistral", "mistral": "Deze noordenwind kan dagenlang hard waaien: verfrissend, maar let op parasols en boottochtjes.", "mosq_t": "Muggen", "mosq": "Neem in de Camargue muggenspray mee, vooral 's avonds.", "sea_t": "De zee", "sea": "Respecteer de vlaggen op het strand. Redding op zee: 196.", "sos_t": "Noodgevallen", "sos": [["112", "Noodnummer (heel Europa)"], ["15", "Medische nood (SAMU)"], ["18", "Brandweer"], ["17", "Politie"], ["114", "Noodnummer via sms"], ["3237", "Apotheek van dienst"]], "tax_t": "Toeristenbelasting", "tax": "Vastgesteld door de gemeente, komt bij de prijs per nacht (per volwassene, per nacht) en wij dragen hem af aan de gemeente.", "c5": "Vertrek", "out_t": "Voor je vertrekt", "out": ["Sleutels op de afgesproken plek", "Ramen en luiken dicht", "Airco en lichten uit", "Afwas gedaan of in de vaatwasser", "Afval buiten gezet", "Niets vergeten: opladers, zwemkleding, de koelkast"], "thanks": "Bedankt voor je verblijf! Een online review helpt ons enorm.", "gallery": "In beeld", "ex": "in te vullen", "made": "Gids gemaakt door Umbra voor {n}"}};
var R={"NAV4": {"fr": "Sud-Ouest pratique", "en": "South-West tips", "de": "Südwest praktisch", "nl": "Zuidwest praktisch"}, "RULES": {"fr": ["Sable : merci de rincer pieds, planches et combinaisons dehors avant d’entrer, et d’utiliser vos serviettes de plage.", "Aucun feu ni barbecue hors de l’emplacement prévu : en été, la forêt de pins s’embrase en quelques minutes.", "WC : uniquement du papier toilette, ni lingettes ni protections (fosse septique dans bien des maisons).", "Calme après 22 h : même au retour des fêtes, pensez aux voisins qui dorment."], "en": ["Sand: please rinse feet, boards and wetsuits outside before coming in, and use your own beach towels.", "No fires or barbecues except where provided: in summer the pine forest can go up in minutes.", "Toilet: only toilet paper, no wipes or sanitary products (many houses here run on a septic tank).", "Quiet after 10 pm: even after a night at the fêtes, spare a thought for sleeping neighbours."], "de": ["Sand: Bitte Füße, Bretter und Neoprenanzüge draußen abspülen und eigene Strandtücher benutzen.", "Feuer und Grillen nur am vorgesehenen Platz: Im Sommer brennt der Kiefernwald in wenigen Minuten.", "WC: nur Toilettenpapier, keine Feuchttücher oder Hygieneartikel (viele Häuser haben eine Klärgrube).", "Ruhe ab 22 Uhr: Auch nach einem Festabend schlafen die Nachbarn bereits."], "nl": ["Zand: spoel voeten, surfplanken en wetsuits buiten af voordat u binnenkomt, en gebruik uw eigen strandlakens.", "Geen vuur of barbecue buiten de vaste plek: ’s zomers staat het dennenbos binnen enkele minuten in brand.", "Toilet: alleen wc-papier, geen doekjes of maandverband (veel huizen hebben hier een septische put).", "Rust na 22.00 uur: ook na een avond feesten slapen de buren al."]}, "HOUSE": {"fr": [{"ic": "fire", "h": "Chauffage & aération", "p": "L’air océanique est humide : aérez dix minutes chaque matin et ne bouchez jamais les grilles de ventilation. Le chauffage : on vous montre son fonctionnement à l’arrivée. L’été, fermez les volets côté soleil en journée et ouvrez grand le soir."}, {"ic": "sea", "h": "Sable, surf & linge", "p": "Rincez sable et sel à la douche extérieure s’il y en a une, ou au robinet du jardin. Faites sécher combinaisons et planches dehors, à l’ombre, jamais sur un radiateur. Pour la plage, prenez vos serviettes : le linge de la maison reste à la maison."}, {"ic": "leaf", "h": "Eau & fosse septique", "p": "Dans l’arrière-pays, beaucoup de maisons fonctionnent avec une <b>fosse septique<\/b> : dans les WC, uniquement du papier toilette. Ni lingettes, ni cotons, ni protections, ni huile de friture. L’eau du robinet est potable."}, {"ic": "home", "h": "Électricité", "p": "Le tableau électrique : on vous indique son emplacement à l’arrivée. Si tout se coupe, débranchez le dernier appareil allumé puis relevez le disjoncteur. Les orages et coups de vent peuvent couper le courant : débranchez la box et les appareils sensibles quand l’orage approche."}, {"ic": "bin", "h": "Tri des déchets", "ul": ["Jaune : tous les emballages (plastique, métal, carton) et les papiers, bien vidés, sans les emboîter.", "Verre : dans les colonnes à verre du quartier, de préférence en journée.", "Ordures ménagères : en sacs fermés, dans le bac gris.", "Épluchures et restes : au composteur s’il y en a un, sinon selon les consignes de la commune.", "Certaines communes utilisent des conteneurs à badge : s’il en faut un, nous vous le laissons."]}, {"ic": "sos", "h": "Sécurité & voisinage", "p": "La maison est équipée de détecteurs de fumée ; l’extincteur et la trousse de secours : on vous les montre à l’arrivée. S’il y a une piscine, ne laissez jamais un enfant seul à proximité. Le soir, musique douce et voix basses en terrasse."}], "en": [{"ic": "fire", "h": "Heating & airing", "p": "Ocean air is damp: air the house for ten minutes every morning and never block the ventilation grilles. The heating: we’ll show you how it works when you arrive. In summer, close the shutters on the sunny side by day and open everything wide in the evening."}, {"ic": "sea", "h": "Sand, surf & linen", "p": "Rinse off sand and salt at the outdoor shower if there is one, or at the garden tap. Dry wetsuits and boards outside in the shade, never on a radiator. Please bring your own beach towels: the house linen stays in the house."}, {"ic": "leaf", "h": "Water & septic tank", "p": "Inland, many houses run on a <b>septic tank<\/b> (fosse septique): only toilet paper down the loo. No wipes, cotton buds, sanitary products or cooking oil. Tap water is safe to drink."}, {"ic": "home", "h": "Electricity", "p": "The fuse box: we’ll show you where it is when you arrive. If everything trips, unplug the last appliance you switched on, then flip the main switch back up. Storms and strong winds can cut the power: unplug the router and sensitive devices when a storm is close."}, {"ic": "bin", "h": "Recycling & rubbish", "ul": ["Yellow: all packaging (plastic, metal, cardboard) and paper, emptied and not stacked inside each other.", "Glass: in the neighbourhood bottle banks, ideally during the day.", "General waste: in tied bags, in the grey bin.", "Peelings and food scraps: in the compost bin if there is one, otherwise as the commune advises.", "Some communes use badge-operated containers: if one is needed, we’ll leave it for you."]}, {"ic": "sos", "h": "Safety & neighbours", "p": "The house has smoke alarms; we’ll show you the fire extinguisher and first-aid kit when you arrive. If there is a pool, never leave a child near it unsupervised. In the evening, keep music and voices low on the terrace."}], "de": [{"ic": "fire", "h": "Heizung & Lüften", "p": "Die Meeresluft ist feucht: Lüften Sie jeden Morgen zehn Minuten und decken Sie die Lüftungsgitter nie ab. Die Heizung erklären wir Ihnen bei der Ankunft. Im Sommer tagsüber die Fensterläden auf der Sonnenseite schließen, abends weit öffnen."}, {"ic": "sea", "h": "Sand, Surfen & Wäsche", "p": "Sand und Salz an der Außendusche abspülen, falls vorhanden, sonst am Gartenhahn. Neoprenanzüge und Bretter draußen im Schatten trocknen, nie auf der Heizung. Bitte eigene Strandtücher mitnehmen: Die Hauswäsche bleibt im Haus."}, {"ic": "leaf", "h": "Wasser & Klärgrube", "p": "Im Hinterland sind viele Häuser an eine <b>Klärgrube<\/b> angeschlossen: nur Toilettenpapier in die Toilette. Keine Feuchttücher, Wattestäbchen, Hygieneartikel oder Frittierfett. Das Leitungswasser ist trinkbar."}, {"ic": "home", "h": "Strom", "p": "Den Sicherungskasten zeigen wir Ihnen bei der Ankunft. Fällt alles aus, ziehen Sie das zuletzt eingeschaltete Gerät aus und legen den Hauptschalter wieder um. Gewitter und Sturm können den Strom unterbrechen: Router und empfindliche Geräte bei nahendem Gewitter ausstecken."}, {"ic": "bin", "h": "Mülltrennung", "ul": ["Gelb: alle Verpackungen (Plastik, Metall, Karton) und Papier, gut geleert und nicht ineinandergesteckt.", "Glas: in die Glascontainer im Viertel, am besten tagsüber.", "Restmüll: in geschlossenen Beuteln in die graue Tonne.", "Schalen und Essensreste: auf den Kompost, falls vorhanden, sonst nach den Regeln der Gemeinde.", "Manche Gemeinden haben Container mit Chip: Falls nötig, lassen wir Ihnen einen da."]}, {"ic": "sos", "h": "Sicherheit & Nachbarn", "p": "Das Haus ist mit Rauchmeldern ausgestattet; Feuerlöscher und Erste-Hilfe-Set zeigen wir Ihnen bei der Ankunft. Gibt es einen Pool, lassen Sie Kinder dort nie unbeaufsichtigt. Abends auf der Terrasse bitte leise Musik und gedämpfte Stimmen."}], "nl": [{"ic": "fire", "h": "Verwarming & luchten", "p": "De zeelucht is vochtig: lucht elke ochtend tien minuten en dek de ventilatieroosters nooit af. Hoe de verwarming werkt, laten we u bij aankomst zien. Houd ’s zomers overdag de luiken aan de zonkant dicht en zet ’s avonds alles wijd open."}, {"ic": "sea", "h": "Zand, surfen & linnengoed", "p": "Spoel zand en zout af onder de buitendouche als die er is, of bij de tuinkraan. Laat wetsuits en planken buiten in de schaduw drogen, nooit op de verwarming. Neem uw eigen strandlakens mee: het linnengoed van het huis blijft binnen."}, {"ic": "leaf", "h": "Water & septische put", "p": "In het binnenland zijn veel huizen op een <b>septische put<\/b> aangesloten: alleen wc-papier in het toilet. Geen doekjes, wattenstaafjes, maandverband of frituurvet. Het kraanwater is drinkbaar."}, {"ic": "home", "h": "Elektriciteit", "p": "Waar de stoppenkast zit, laten we u bij aankomst zien. Valt alles uit, haal dan het laatst aangezette apparaat uit het stopcontact en zet de hoofdschakelaar terug. Onweer en storm kunnen de stroom doen uitvallen: trek de stekker van modem en gevoelige apparaten eruit als het onweer nadert."}, {"ic": "bin", "h": "Afval scheiden", "ul": ["Geel: alle verpakkingen (plastic, metaal, karton) en papier, goed leeg en niet in elkaar geschoven.", "Glas: in de glasbakken in de buurt, liefst overdag.", "Restafval: in dichtgeknoopte zakken in de grijze bak.", "Schillen en etensresten: op de composthoop als die er is, anders volgens de regels van de gemeente.", "Sommige gemeenten werken met containers op pasje: als dat nodig is, laten we het voor u klaar."]}, {"ic": "sos", "h": "Veiligheid & buren", "p": "Het huis heeft rookmelders; de brandblusser en de verbanddoos laten we u bij aankomst zien. Is er een zwembad, laat kinderen er dan nooit zonder toezicht. ’s Avonds op het terras graag zachte muziek en gedempte stemmen."}]}, "PRAT": {"fr": [{"ic": "sea", "h": "Baïnes & baignade", "al": 1, "p": "Baignez-vous uniquement sur les plages surveillées, entre les drapeaux de la zone de bain ; les postes de secours ouvrent en gros de juin à septembre. Les <b>baïnes<\/b> créent de forts courants vers le large : si l’un vous emporte, ne luttez pas, faites la planche, levez le bras et regagnez le bord en biais."}, {"ic": "sun", "h": "Marées, soleil & surf", "p": "Consultez l’horaire des marées : la mer monte vite, surtout sur le Bassin et au pied des falaises. Le vent rafraîchit mais le soleil brûle : crème et chapeau, même sous les nuages. Au surf, prenez un cours en école, ne prenez pas la vague de celui qui est déjà dessus et gardez votre planche en main."}, {"ic": "fire", "h": "Forêt & risque d’incendie", "al": 1, "p": "La forêt landaise et girondine est très inflammable : ni barbecue, ni feu, ni cigarette en forêt. L’été, l’accès aux massifs peut être restreint selon le risque du jour. Ne vous garez jamais devant une piste forestière : c’est le passage des pompiers."}, {"ic": "bug", "h": "Moustiques & chenilles", "p": "Le moustique tigre pique de mai à novembre : videz soucoupes et seaux, utilisez un répulsif le soir. De janvier à avril, gare aux <b>chenilles processionnaires<\/b> sous les pins. Ne les touchez pas et tenez les chiens en laisse : leurs poils sont très urticants. Pharmacie de garde : <b>3237<\/b>."}, {"ic": "wind", "h": "Météo océane & montagne", "al": 1, "p": "Le temps change vite : averses océanes, tempêtes en automne et en hiver, vigilance vagues-submersion sur la côte. Suivez la vigilance Météo-France. En montagne, partez tôt, emportez de l’eau et une veste : orages l’après-midi et brouillard soudain sont fréquents l’été."}, {"ic": "car", "h": "Route & Vélodyssée", "p": "L’été, l’A63 sature autour de Bayonne et à la frontière, et les parkings de Biarritz, Saint-Jean-de-Luz ou de la dune du Pilat se remplissent tôt. Alcool : 0,5 g/l. La <b>Vélodyssée<\/b> longe la côte sur des pistes cyclables à travers les pins : idéale pour rejoindre plages et villages."}, {"ic": "cup", "h": "Pays basque & Espagne", "p": "Quelques mots d’euskara font toujours plaisir : <b>Ongi etorri<\/b> (bienvenue), <b>Milesker<\/b> (merci), <b>Agur<\/b> (au revoir). Ne manquez pas une partie de pelote au fronton du village. Saint-Sébastien est à 30 min de la frontière : en Espagne, les commerces ouvrent souvent le dimanche et l’on dîne tard, de pintxos en pintxos."}, {"ic": "coins", "h": "Fêtes, marchés & horaires", "p": "Fin juillet, les <b>Fêtes de Bayonne<\/b> réunissent des foules immenses, tout de blanc et de rouge vêtues : venez en train ou en navette. Gardez de la monnaie pour les marchés. Hors saison, beaucoup de restaurants ferment le lundi ou le mardi, et nombre de commerces de 12 h à 14 h."}], "en": [{"ic": "sea", "h": "Rip currents & swimming", "al": 1, "p": "Only swim at lifeguarded beaches, between the flags marking the bathing area; lifeguard posts are open roughly from June to September. The <b>baïnes<\/b> (tidal pools) create strong rip currents: if one pulls you out, don’t fight it, float, raise an arm and swim back at an angle."}, {"ic": "sun", "h": "Tides, sun & surf", "p": "Check the tide tables: the sea comes in fast, especially in Arcachon Bay and below the cliffs. The breeze feels cool but the sun burns: sunscreen and a hat, even when cloudy. For surfing, take a lesson at a surf school, never drop in on someone already riding a wave, and keep hold of your board."}, {"ic": "fire", "h": "Forest & fire risk", "al": 1, "p": "The Landes and Gironde pine forest is highly flammable: no barbecues, fires or cigarettes in the woods. In summer, access to forest areas may be restricted depending on the daily risk. Never park in front of a forest track: it’s the fire brigade’s access route."}, {"ic": "bug", "h": "Mosquitoes & caterpillars", "p": "Tiger mosquitoes bite from May to November: empty saucers and buckets, and use repellent in the evening. From January to April, watch out for <b>processionary caterpillars<\/b> under the pines. Don’t touch them and keep dogs on a lead: their hairs are highly irritant. Duty pharmacy: <b>3237<\/b>."}, {"ic": "wind", "h": "Ocean & mountain weather", "al": 1, "p": "The weather changes fast: Atlantic showers, storms in autumn and winter, and coastal flood or high-wave warnings. Follow the Météo-France alerts. In the mountains, set off early with water and a jacket: afternoon thunderstorms and sudden fog are common in summer."}, {"ic": "car", "h": "Roads & the Vélodyssée", "p": "In summer the A63 jams around Bayonne and at the border, and car parks in Biarritz, Saint-Jean-de-Luz or at the Dune du Pilat fill up early. Drink-drive limit: 0.5 g/l. The <b>Vélodyssée<\/b> cycle route follows the coast on traffic-free paths through the pines – perfect for reaching beaches and villages."}, {"ic": "cup", "h": "Basque Country & Spain", "p": "A few words of Euskara always go down well: <b>Ongi etorri<\/b> (welcome), <b>Milesker<\/b> (thank you), <b>Agur<\/b> (goodbye). Do catch a pelota match at the village fronton. San Sebastián is 30 minutes past the border: in Spain many shops open on Sundays and dinner is late, hopping from one pintxos bar to the next."}, {"ic": "coins", "h": "Fêtes, markets & hours", "p": "In late July the <b>Fêtes de Bayonne<\/b> draw huge crowds, all dressed in white and red: come by train or shuttle bus. Carry some cash for markets. Out of season, many restaurants close on Mondays or Tuesdays, and many shops close from noon to 2 pm."}], "de": [{"ic": "sea", "h": "Baïnes & Baden", "al": 1, "p": "Baden Sie nur an bewachten Stränden, zwischen den Flaggen der Badezone; die Rettungsposten sind etwa von Juni bis September besetzt. Die <b>Baïnes<\/b> (Priele) erzeugen starke Strömungen seewärts: Erfasst Sie eine, nicht ankämpfen, treiben lassen, Arm heben und schräg zum Ufer schwimmen."}, {"ic": "sun", "h": "Gezeiten, Sonne & Surfen", "p": "Beachten Sie die Gezeitentabelle: Die Flut kommt schnell, besonders im Bassin und unter den Klippen. Der Wind kühlt, doch die Sonne brennt: Sonnencreme und Hut, auch bei Wolken. Zum Surfen eine Stunde bei einer Surfschule nehmen, niemandem die Welle wegnehmen und das Brett immer festhalten."}, {"ic": "fire", "h": "Wald & Brandgefahr", "al": 1, "p": "Der Kiefernwald der Landes und der Gironde ist leicht entflammbar: kein Grill, kein Feuer, keine Zigarette im Wald. Im Sommer kann der Zugang je nach Brandgefahr eingeschränkt sein. Parken Sie nie vor einem Waldweg: Das ist die Zufahrt der Feuerwehr."}, {"ic": "bug", "h": "Mücken & Raupen", "p": "Die Tigermücke sticht von Mai bis November: Untersetzer und Eimer leeren, abends Mückenschutz auftragen. Von Januar bis April Vorsicht vor <b>Prozessionsraupen<\/b> unter den Kiefern. Nicht berühren und Hunde an der Leine führen: Ihre Haare sind stark nesselnd. Apothekennotdienst: <b>3237<\/b>."}, {"ic": "wind", "h": "Meeres- & Bergwetter", "al": 1, "p": "Das Wetter wechselt schnell: Atlantikschauer, Stürme im Herbst und Winter, an der Küste Warnungen vor hohen Wellen. Beachten Sie die Warnstufen von Météo-France. In den Bergen früh aufbrechen, Wasser und Jacke mitnehmen: Nachmittagsgewitter und plötzlicher Nebel sind im Sommer häufig."}, {"ic": "car", "h": "Straße & Vélodyssée", "p": "Im Sommer staut sich die A63 um Bayonne und an der Grenze, und die Parkplätze in Biarritz, Saint-Jean-de-Luz und an der Dune du Pilat sind früh voll. Promillegrenze: 0,5 ‰. Die <b>Vélodyssée<\/b> folgt der Küste auf Radwegen durch die Kiefern – ideal für Strände und Dörfer."}, {"ic": "cup", "h": "Baskenland & Spanien", "p": "Ein paar Worte Baskisch kommen immer gut an: <b>Ongi etorri<\/b> (willkommen), <b>Milesker<\/b> (danke), <b>Agur<\/b> (auf Wiedersehen). Schauen Sie sich ein Pelota-Spiel am Dorf-Fronton an. San Sebastián liegt 30 Minuten hinter der Grenze: In Spanien haben viele Geschäfte sonntags offen, und man isst spät, von Pintxos-Bar zu Pintxos-Bar."}, {"ic": "coins", "h": "Feste, Märkte & Zeiten", "p": "Ende Juli ziehen die <b>Fêtes de Bayonne<\/b> riesige Menschenmengen an, alle in Weiß und Rot: Reisen Sie mit Zug oder Shuttlebus an. Für die Märkte etwas Bargeld bereithalten. Außerhalb der Saison haben viele Restaurants montags oder dienstags Ruhetag, viele Geschäfte schließen von 12 bis 14 Uhr."}], "nl": [{"ic": "sea", "h": "Baïnes & zwemmen", "al": 1, "p": "Zwem alleen op bewaakte stranden, tussen de vlaggen die de zwemzone afbakenen; de reddingsposten zijn ruwweg van juni tot september bemand. De <b>baïnes<\/b> (zwinnen) veroorzaken sterke muistromen: word u meegesleurd, vecht er dan niet tegen, blijf drijven, steek een arm op en zwem schuin terug."}, {"ic": "sun", "h": "Getijden, zon & surfen", "p": "Kijk naar de getijdentabel: het water komt snel op, vooral in het Bassin en onder de kliffen. De wind voelt fris, maar de zon brandt: smeer in en draag een hoed, ook bij bewolking. Neem voor het surfen les bij een surfschool, pik nooit de golf van iemand die er al op staat en houd uw plank altijd vast."}, {"ic": "fire", "h": "Bos & brandgevaar", "al": 1, "p": "Het dennenbos van de Landes en de Gironde is zeer brandbaar: geen barbecue, vuur of sigaret in het bos. ’s Zomers kan de toegang tot de bossen beperkt zijn, afhankelijk van het risico. Parkeer nooit voor een bospad: dat is de doorgang voor de brandweer."}, {"ic": "bug", "h": "Muggen & rupsen", "p": "De tijgermug steekt van mei tot november: leeg schoteltjes en emmers en gebruik ’s avonds een muggenmiddel. Pas van januari tot april op voor <b>processierupsen<\/b> onder de dennen. Raak ze niet aan en houd honden aan de lijn: hun haren zijn zeer irriterend. Dienstdoende apotheek: <b>3237<\/b>."}, {"ic": "wind", "h": "Oceaan- & bergweer", "al": 1, "p": "Het weer slaat snel om: buien van de oceaan, stormen in herfst en winter, aan de kust waarschuwingen voor hoge golven. Volg de waarschuwingen van Météo-France. Vertrek in de bergen vroeg, met water en een jas: onweer in de middag en plotselinge mist komen ’s zomers vaak voor."}, {"ic": "car", "h": "Wegen & Vélodyssée", "p": "’s Zomers slibt de A63 dicht rond Bayonne en bij de grens, en de parkings van Biarritz, Saint-Jean-de-Luz en de Dune du Pilat raken vroeg vol. Alcohollimiet: 0,5 promille. De <b>Vélodyssée<\/b> volgt de kust over fietspaden door de dennen – ideaal om stranden en dorpen te bereiken."}, {"ic": "cup", "h": "Baskenland & Spanje", "p": "Een paar woorden Baskisch doen het altijd goed: <b>Ongi etorri<\/b> (welkom), <b>Milesker<\/b> (dank u), <b>Agur<\/b> (tot ziens). Bekijk zeker een partijtje pelota bij de fronton van het dorp. San Sebastián ligt een halfuur over de grens: in Spanje zijn veel winkels op zondag open en eet men laat, van pintxosbar naar pintxosbar."}, {"ic": "coins", "h": "Feesten, markten & tijden", "p": "Eind juli trekken de <b>Fêtes de Bayonne<\/b> enorme menigten, iedereen in het wit en rood: kom met de trein of de pendelbus. Neem wat contant geld mee naar de markt. Buiten het seizoen zijn veel restaurants op maandag of dinsdag dicht, en veel winkels sluiten van 12 tot 14 uur."}]}, "TERROIR": {"fr": [["Piment d’Espelette", "AOP ; doux et parfumé, séché en guirlandes sur les façades, en poudre toute l’année", "récolte août – nov."], ["Jambon de Bayonne", "IGP ; séché lentement au sel de l’Adour, à déguster en fines tranches", "toute l’année"], ["Ossau-Iraty", "AOP ; fromage de brebis des Pyrénées, avec une confiture de cerises noires", "toute l’année"], ["Gâteau basque", "Pâte sablée fourrée de crème pâtissière ou de cerises noires", "toute l’année"], ["Chocolat de Bayonne", "Une tradition depuis le XVIIe siècle ; chocolatiers de la rue du Port-Neuf", "toute l’année"], ["Irouléguy & Jurançon", "AOC ; rouges de montagne basques et blancs béarnais, secs ou moelleux", "toute l’année"], ["Huîtres du Bassin d’Arcachon", "Élevées dans les parcs du Bassin ; dégustées dans les cabanes, avec un verre de blanc", "sept. – avr."], ["Foie gras & canard des Landes", "IGP Canard à foie gras du Sud-Ouest ; magret, confit, et marchés au gras l’hiver", "toute l’année"], ["Asperges des Landes", "IGP ; blanches et tendres, cultivées dans le sable", "mars – mai"], ["Bœuf de Chalosse", "Label Rouge et IGP ; viande persillée des fermes de la Chalosse", "toute l’année"], ["Vins de Bordeaux", "AOC Saint-Émilion, Médoc, Pessac-Léognan, Sauternes… les plus célèbres vignobles du monde", "toute l’année"], ["Cannelés", "Petits gâteaux bordelais au rhum et à la vanille, croustillants dehors, moelleux dedans", "toute l’année"]], "en": [["Espelette pepper",
