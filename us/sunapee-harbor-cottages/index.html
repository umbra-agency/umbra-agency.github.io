<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0e">
<title>Sunapee Harbor Cottages · Welcome Book</title>
<meta property="og:title" content="Sunapee Harbor Cottages · your guest welcome book is ready">
<meta property="og:description" content="Welcome book in 4 languages, prepared by Umbra Agency.">
<meta property="og:image" content="https://wsrv.nl/?url=https%3A%2F%2Fsunapeeharborcottages.com%2Fwp-content%2Fuploads%2F2021%2F05%2F6.webp&amp;w=1600&amp;output=webp&amp;q=80">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{--bg:#f5f2ec;--ink:#1e2228;--ink2:#3f444c;--acc:#c0583c;--soft:#f3ddd3;--card:#fffdfa;--line:rgba(0,0,0,.09);--mut:#7d7a72;--r:16px;--fh:'Newsreader';--fb:'Inter Tight';--emst:italic;--ease:cubic-bezier(.2,.7,.1,1);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb),system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,.ser{font-family:var(--fh),Georgia,serif;font-weight:400;letter-spacing:-.005em}
em{font-style:var(--emst,italic)}
.ico{display:inline-flex;width:22px;height:22px;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translate3d(0,34px,0);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.vis{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
.pr{overflow:hidden;clip-path:inset(10% 6% 10% 6% round 22px);transition:clip-path 1.3s var(--ease)}
.pr img{transform:scale(1.12);transition:transform 1.6s var(--ease)}
.pr.vis{clip-path:inset(0 0 0 0 round var(--pr-r,0px))}
.pr.vis img{transform:scale(1)}
.ex{display:inline-block;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);border:1px solid currentColor;padding:4px 6px 3px;border-radius:99px;vertical-align:middle;margin-left:8px;opacity:.85;white-space:nowrap}
/* barre haute */
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:70}
.demo{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:45;font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.16em;text-transform:uppercase;background:rgba(11,11,14,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#ececf1;padding:10px 12px;border-radius:99px;display:flex;gap:7px;align-items:center}
.demo i{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:45;display:flex;gap:2px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.lang button{border:0;background:transparent;font:700 11.5px/1 var(--fb),sans-serif;letter-spacing:.06em;padding:8px 9px;border-radius:99px;color:#2a2a2e;cursor:pointer;transition:background .3s,color .3s}
.lang button.on{background:#111114;color:#fff}
.tip{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 46px);right:14px;z-index:45;background:#111114;color:#f1f1f4;font:600 12px/1.3 var(--fb),sans-serif;padding:9px 12px;border-radius:12px;max-width:210px;opacity:0;transform:translateY(-6px);transition:all .5s var(--ease);pointer-events:none}
.tip:before{content:"";position:absolute;top:-5px;right:22px;width:10px;height:10px;background:#111114;transform:rotate(45deg)}
.tip.on{opacity:1;transform:none}
/* intro Umbra */
#intro{position:fixed;inset:0;z-index:100;background:#060608;color:#e9e9ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .8s ease,visibility .8s}
#intro.off{opacity:0;visibility:hidden}
.ecl{width:78px;height:78px;border-radius:50%;position:relative;background:#d9dbe4;box-shadow:0 0 50px 8px rgba(205,210,230,.22);animation:eg 2.2s var(--ease) both}
.ecl:after{content:"";position:absolute;inset:0;border-radius:50%;background:#060608;transform:translate(14px,-8px);animation:em 2.2s var(--ease) both}
@keyframes eg{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes em{from{transform:translate(70px,-30px)}to{transform:translate(14px,-8px)}}
#intro small{letter-spacing:.38em;text-transform:uppercase;font-size:10.5px;color:#8e90a0}
#intro b{font-family:var(--fh),serif;font-weight:400;font-size:25px;line-height:1.25;text-align:center;padding:0 30px;max-width:520px;opacity:0;animation:fi 1s .5s var(--ease) forwards}
@keyframes fi{to{opacity:1}}
/* blocs de contenu (communs) */
.blk{padding:26px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bh .ico{width:40px;height:40px;padding:9px;border-radius:50%;background:var(--soft);color:var(--acc)}
.bh h3{font-size:23px;line-height:1.2}
.blk p{color:var(--ink2)}
.blk.al{background:var(--soft);border:0;border-radius:20px;padding:22px 20px;margin:10px 0}
.blk.al .bh .ico{background:var(--card)}
.ul{list-style:none}
.ul li{position:relative;padding:9px 0 9px 22px;color:var(--ink2);border-bottom:1px dashed var(--line)}
.ul li:last-child{border-bottom:0}
.ul li:before{content:"";position:absolute;left:2px;top:19px;width:9px;height:1.5px;background:var(--acc)}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r b{font-weight:600}
.rows .r span{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.pois{display:grid;gap:2px}
.poi{display:grid;grid-template-columns:74px 1fr 26px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.poi:last-child{border-bottom:0}
.poi .km{font-family:var(--fh),serif;font-size:38px;line-height:.9;color:var(--acc);text-align:right;font-variant-numeric:lining-nums}
.poi .km small{display:block;font:600 10px/1.6 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.poi b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.2}
.poi small.d{display:block;font-size:14px;color:var(--ink2);line-height:1.45;margin-top:4px}
.poi .go{width:26px;height:26px;color:var(--acc);transition:transform .3s}
.poi:active .go{transform:translateX(4px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.3}
.chip b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:18px}
.chip span{color:var(--mut)}
.sos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sos a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;transition:transform .2s}
.sos a:active{transform:scale(.97)}
.sos b{font-family:var(--fh),serif;font-size:28px;font-weight:400;color:var(--acc);line-height:1.1}
.sos small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35}
.chk label{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk label:last-of-type{border-bottom:0}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .bx{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--acc);flex:none;display:flex;align-items:center;justify-content:center;transition:background .3s}
.chk .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none;opacity:0;transform:scale(.5);transition:all .3s var(--ease)}
.chk input:checked+.bx{background:var(--acc)}
.chk input:checked+.bx svg{opacity:1;transform:none}
.chk input:checked~span{color:var(--mut);text-decoration:line-through}
.prog{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:4px 0 6px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.prog i:after{content:"";position:absolute;inset:0;background:var(--acc);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .5s var(--ease)}
.kick{font:600 11px/1.2 var(--fb),sans-serif;letter-spacing:.3em;text-transform:uppercase}
.z{cursor:zoom-in}
/* ess (essentiels) commun */
.ess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.es{border-radius:20px;padding:16px;position:relative;overflow:hidden}
.es .ico{width:24px;height:24px;margin-bottom:18px}
.es .l{font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.es .v{font-family:var(--fh),serif;font-size:22px;line-height:1.2;margin-top:7px;word-break:break-word}
.es .s{font-size:12.5px;opacity:.7;margin-top:3px}
.es .ex{margin:8px 0 0}
.ess .es:nth-child(3),.ess .es:nth-child(4){grid-column:1/-1}
.ess .es:nth-child(3) .v,.ess .es:nth-child(4) .v{font-size:24px}
/* footer */
footer{background:#0b0b0e;color:#cfd0d8;text-align:center;padding:80px 26px calc(150px + var(--sb))}
footer .ecl{width:44px;height:44px;margin:0 auto 26px;animation:none;box-shadow:0 0 30px 4px rgba(205,210,230,.18)}
footer .ecl:after{background:#0b0b0e;animation:none;transform:translate(8px,-5px)}
footer .thx{font-family:var(--fh),serif;font-size:27px;line-height:1.3;color:#fff;max-width:520px;margin:0 auto 16px}
footer small{font-size:12.5px;letter-spacing:.06em;color:#8d8f9e}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,6,8,.96);display:none;touch-action:pan-y}
#lb.on{display:block}
#lb .tr{display:flex;height:100%;transition:transform .45s var(--ease)}
#lb figure{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:60px 10px}
#lb figure img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
#lb .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;cursor:pointer;z-index:2}
#lb .n{position:absolute;bottom:calc(22px + var(--sb));left:0;right:0;text-align:center;color:#aaa;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em}

/* =========================== MAS : immersif =========================== */
.L-mas .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#1a1a1a}
.L-mas .hero .bg{position:absolute;inset:-6% 0 0 0;will-change:transform}
.L-mas .hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}@keyframes kb2{from{transform:scale(1.04)}to{transform:scale(1)}}.L-mas .hero .bg img.lo{animation-name:kb2}
.L-mas .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.72) 100%)}
.L-mas .hero .tx{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 24px calc(92px + var(--sb));max-width:820px;margin:0 auto}
.L-mas .hero .kick{display:flex;align-items:center;gap:12px;opacity:0;animation:fi 1s 2.6s forwards}
.L-mas .hero .kick:before{content:"";width:28px;height:1px;background:#fff}
.L-mas .hero h1{font-size:clamp(50px,14vw,104px);line-height:.95;margin:16px 0 18px}
.sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.sp>span{display:inline-block;transform:translateY(105%);animation:up 1.2s var(--ease) forwards}
@keyframes up{to{transform:none}}
.L-mas .hero .meta{font-size:15px;letter-spacing:.04em;opacity:0;animation:fi 1s 3.1s forwards}
.cue{position:absolute;left:50%;bottom:calc(22px + var(--sb));z-index:2;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cue i{width:1px;height:40px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.cue i:after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{to{top:100%}}
.L-mas .wel{padding:96px 26px 70px;max-width:760px;margin:0 auto}
.L-mas .wel .kick{color:var(--acc);margin-bottom:26px;display:flex;gap:12px;align-items:center}
.L-mas .wel .kick:before{content:"";width:28px;height:1px;background:var(--acc)}
.L-mas .big{font-family:var(--fh),serif;font-size:clamp(28px,7.4vw,44px);line-height:1.22;letter-spacing:-.01em}
.L-mas .big .w{opacity:.14;transition:opacity .4s}
.L-mas .big .w.on{opacity:1}
.L-mas .essw{background:var(--ink);color:var(--bg);padding:56px 18px 60px}
.L-mas .essw .in{max-width:760px;margin:0 auto}
.L-mas .essw .kick{opacity:.6;margin:0 6px 20px}
.L-mas .es{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.L-mas .es .ex{color:var(--bg)}
.L-mas .chap{position:relative}
.L-mas .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:#222;z-index:0}
.L-mas .pin img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;will-change:transform}.L-mas .pin img.lo{inset:-3% 0;height:106%}
.L-mas .pin:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35) 100%)}
.L-mas .plab{position:absolute;left:24px;right:24px;top:calc(84px + env(safe-area-inset-top));z-index:2;color:#fff}
.L-mas .plab .no{font-family:var(--fh),serif;font-size:92px;line-height:.8;display:block;opacity:.95;-webkit-text-stroke:1px rgba(255,255,255,.9);color:transparent}
.L-mas .plab h2{font-size:clamp(40px,11vw,74px);line-height:1;margin-top:6px}
.L-mas .body{position:relative;z-index:2;margin-top:-30svh;background:var(--bg);border-radius:30px 30px 0 0;padding:34px 24px 54px;box-shadow:0 -24px 60px rgba(0,0,0,.22)}
.L-mas .body .in{max-width:720px;margin:0 auto}
.L-mas .body:before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-16px auto 18px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -24px 6px;padding:0 24px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 76%;height:min(62vw,420px);object-fit:cover;border-radius:18px;scroll-snap-align:center}
.L-mas .galw{padding:80px 12px 40px;max-width:980px;margin:0 auto}
.L-mas .galw h2{font-size:clamp(40px,11vw,70px);line-height:1;margin:0 12px 30px}
.L-mas .galw h2 em{color:var(--acc)}
.mz{columns:2;column-gap:10px}
.mz .pr{break-inside:avoid;margin-bottom:10px;--pr-r:14px}
.mz img{width:100%;border-radius:14px}

/* =========================== CARNET : app =========================== */
.L-carnet{background:var(--bg)}
.L-carnet .top{padding:calc(76px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(180deg,var(--soft) 0%,var(--soft) 62%,var(--bg) 100%);overflow:hidden}
.stack{position:relative;height:min(118vw,560px);max-width:520px;margin:0 auto}
.stack .c{position:absolute;left:50%;top:6%;width:66%;aspect-ratio:3/4;margin-left:-33%;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px rgba(30,20,40,.28);transition:transform 1.4s var(--ease);background:#ccc}
.stack .c img{width:100%;height:100%;object-fit:cover}
.stack .c1{transform:rotate(0) translate(0,30px) scale(.9);z-index:1}
.stack .c2{transform:rotate(0) translate(0,30px) scale(.9);z-index:2}
.stack .c3{transform:rotate(0) translate(0,20px);z-index:3}
.stack.vis .c1{transform:rotate(-9deg) translate(-27%,6%) scale(.86)}
.stack.vis .c2{transform:rotate(8deg) translate(27%,8%) scale(.86)}
.stack.vis .c3{transform:rotate(-1.5deg) translate(0,0)}
.L-carnet .ttl{padding:6px 24px 0;max-width:640px;margin:0 auto;text-align:center}
.L-carnet .ttl .kick{color:var(--acc)}
.L-carnet .ttl h1{font-size:clamp(46px,13vw,84px);line-height:.98;margin:14px 0 10px}
.L-carnet .ttl .meta{color:var(--mut);font-size:15px}
.L-carnet .lead{font-size:18.5px;line-height:1.6;color:var(--ink2);padding:26px 24px 8px;max-width:640px;margin:0 auto}
.pass{margin:22px 18px 0;max-width:600px;background:var(--card);border-radius:24px;box-shadow:0 20px 50px rgba(30,20,40,.12);position:relative}
@media(min-width:640px){.pass{margin:22px auto 0}}
.pass .tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 20px 18px}
.pass .tp div:last-child{text-align:right}
.pass .tp .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .tp .v{font-family:var(--fh),serif;font-size:clamp(21px,6.2vw,28px);line-height:1.1;margin-top:6px}
.pass .tp .mid{color:var(--acc);width:54px;height:24px}
.pass .tp .mid svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4}
.pass .perf{height:0;border-top:2px dashed var(--line);margin:0 18px;position:relative}
.pass .perf:before,.pass .perf:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.pass .perf:before{left:-30px}.pass .perf:after{right:-30px}
.pass .bt{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pass .bt>div{padding:16px 20px 20px;display:flex;gap:12px;align-items:center}
.pass .bt>div+div{border-left:1px solid var(--line)}
.pass .bt .ico{color:var(--acc)}
.pass .bt .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .bt .v{font-weight:600;font-size:14.5px;margin-top:5px;word-break:break-word;line-height:1.3}
.pass .ex{margin:6px 0 0}
.L-carnet .open{display:flex;margin:28px auto 6px;align-items:center;gap:10px;border:0;background:var(--ink);color:var(--bg);padding:16px 24px;border-radius:99px;font:700 14px/1 var(--fb),sans-serif;letter-spacing:.04em;cursor:pointer}
.L-carnet .open .ico{width:18px;height:18px}
.panes{padding:10px 0 0;min-height:100svh}
.pane{display:none;padding:0 16px 40px;max-width:720px;margin:0 auto}
.pane.on{display:block;animation:pin .55s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pane.on.back{animation-name:pinb}
@keyframes pinb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.pban{position:relative;border-radius:26px;overflow:hidden;height:min(108vw,460px);margin:6px 0 18px;color:#fff;--pr-r:26px}
.pban img{width:100%;height:100%;object-fit:cover}
.pban:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)}
.pban .t{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}
.pban .t span{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.85}
.pban .t h2{font-size:clamp(36px,10vw,56px);line-height:1;margin-top:8px}

.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:50;background:rgba(18,16,22,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:flex;padding:7px;gap:2px;max-width:560px;margin:0 auto;transform:translateY(140%);transition:transform .6s var(--ease);box-shadow:0 18px 40px rgba(0,0,0,.3)}

.L-riviera .rwel{max-width:720px;margin:0 auto;padding:80px 24px 30px}
.L-riviera .rwel .kick{color:var(--acc);margin-bottom:22px}

.L-riviera .drop:first-letter{font-family:var(--fh),serif;float:left;font-size:86px;line-height:.82;margin:6px 12px 0 0;color:var(--acc)}
.etab{margin-top:40px;border-top:1px solid var(--ink)}
.etab .r{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.etab .r .l{font:600 10.5px/1.4 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.etab .r .v{font-family:var(--fh),serif;font-size:24px;line-height:1.2;word-break:break-word}
.etab .r .v small{display:block;font-family:var(--fb),sans-serif;font-size:13px;color:var(--mut);margin-top:3px}
.hs{position:relative;background:var(--bg)}
.hsin{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hsh{display:flex;justify-content:space-between;align-items:baseline;padding:0 24px 22px;max-width:1100px;width:100%;margin:0 auto}
.hsh h2{font-size:clamp(34px,9vw,60px);line-height:1}
.hsh h2 em{color:var(--acc)}
.hsh .cnt{font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em;color:var(--mut);font-variant-numeric:tabular-nums}
.track{display:flex;gap:14px;padding:0 24px;will-change:transform}
.track figure{flex:0 0 78vw;max-width:560px}
.track figure div{height:min(64svh,520px);border-radius:20px;overflow:hidden}
.track img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.track figcaption{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.22em;color:var(--mut);margin-top:12px}
.toc{max-width:760px;margin:0 auto;padding:40px 20px 70px}
.toc>.kick{color:var(--acc);padding:0 4px 18px}
.row{border-top:1px solid var(--ink)}
.row:last-child{border-bottom:1px solid var(--ink)}
.row>button{width:100%;display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;padding:24px 4px;background:transparent;border:0;text-align:left;cursor:pointer}

.row.on .pl{transform:rotate(45deg);background:var(--ink);color:var(--bg)}
.row .rc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--ease)}

.row .rci{overflow:hidden;padding:0 4px}
.row .rci>.wrap{padding:0 0 26px}
.row .rimg{height:min(60vw,360px);border-radius:18px;overflow:hidden;margin:0 0 8px}

.night{background:var(--ink);color:var(--bg);padding:84px 22px 80px;position:relative;overflow:hidden}
.night .in{max-width:720px;margin:0 auto;position:relative}

.night h2{font-size:clamp(40px,11vw,72px);line-height:1;margin:14px 0 34px}

/* =========================== couche Umbra : offre =========================== */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(130%);transition:transform .6s var(--ease);padding:0 10px calc(10px + var(--sb))}

.btns{display:flex;gap:8px}
.b1{flex:1;border:0;background:#ececf1;color:#0b0b0e;font:700 14px/1 var(--fb),sans-serif;padding:15px;border-radius:13px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.b2{border:1px solid #3a3a44;background:transparent;color:#ececf1;font:600 14px/1 var(--fb),sans-serif;padding:15px 16px;border-radius:13px;cursor:pointer}
#pill{position:fixed;right:14px;bottom:calc(14px + var(--sb));z-index:55;border:0;background:#0b0b0e;color:#fff;font:700 13.5px/1 var(--fb),sans-serif;padding:15px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;display:flex;gap:9px;align-items:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:all .5s var(--ease)}
#pill i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
#pill.on{opacity:1;transform:none;pointer-events:auto}
#offer{position:fixed;inset:0;z-index:80;background:rgba(5,5,8,.55);display:none}

#offer .pn{position:absolute;left:0;right:0;bottom:0;top:7svh;background:#0b0b0e;color:#ececf1;border-radius:24px 24px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 20px 40px;animation:sup .55s var(--ease)}
@keyframes sup{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#offer .x{position:sticky;top:0;float:right;background:#1c1c22;color:#fff;border:0;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
#offer .pn>div{max-width:620px;margin:0 auto}
#offer small.k{letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#8d8f9e}

.val{margin:22px 0 6px}
.val div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #22222a;font-size:15px;color:#d6d7de}
.val div b{color:#fff}
.val span{flex:none;width:26px;height:26px;border-radius:50%;background:#1c1c22;display:flex;align-items:center;justify-content:center;font-size:13px}
.plans{display:grid;gap:12px;margin:22px 0}
.plan{border:1px solid #2a2a33;border-radius:18px;padding:18px;position:relative;background:#111116}
.plan.best{border-color:#d9dbe4;background:#15151b}
.plan .tag{position:absolute;top:-10px;left:16px;background:#ececf1;color:#0b0b0e;font:700 10.5px/1 var(--fb),sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:6px}
.plan h4{font-family:var(--fh),serif;font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan h4 b{font-family:var(--fb),sans-serif;font-size:26px;font-weight:700;color:#fff}
.plan ul{list-style:none;margin:10px 0 14px}
.plan li{font-size:14px;color:#c9cad3;padding:5px 0 5px 22px;position:relative}
.plan li:before{content:"✓";position:absolute;left:0;color:#d9dbe4}
.steps{counter-reset:s;margin:10px 0 18px}
.steps div{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:15px;color:#d6d7de}
.steps div:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #3a3a44;display:flex;align-items:center;justify-content:center;font-size:13px}
.guar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 22px}
.guar div{background:#15151b;border-radius:12px;padding:12px;font-size:12.5px;color:#c9cad3;text-align:center;line-height:1.35}
.guar b{display:block;color:#fff;font-size:14px;margin-bottom:4px}
details{border-bottom:1px solid #22222a;padding:14px 0}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
summary::-webkit-details-marker{display:none}
details p{color:#b9bac6;font-size:14.5px;margin-top:8px}
.legal{font-size:12px;color:#7c7e8c;margin-top:26px;text-align:center}
.legal a{color:#a9abb8;text-decoration:underline}
h3.pt{font-family:var(--fh),serif;font-weight:400;font-size:22px;margin:26px 0 6px}

/* =========================== blocs v3 : services, taxe, terroir, agenda =========================== */
sup{font-size:.62em;line-height:0;vertical-align:.45em}
.svc{display:grid}
.sv{display:grid;grid-template-columns:40px 1fr auto 20px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sv:last-child{border-bottom:0}

.txu{font-size:15px;color:var(--ink2);line-height:1.35;max-width:13em;padding-bottom:4px}
.txt .r b{font-weight:500;color:var(--ink2)}

.txm{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 2px;border-top:1px solid var(--line)}

.txm dt{font-size:11.5px;color:var(--mut);line-height:1.3}
.txm dd{font-size:14.5px;font-weight:600;line-height:1.35;margin-top:3px}
.tax .txx,.tax .txw{font-size:14px;margin-top:12px;line-height:1.55}
.tax .txx b{color:var(--ink);font-weight:600}
.txof{font-size:13.5px;color:var(--mut);margin-top:12px;font-variant-numeric:tabular-nums}
.txof span{font-weight:600;color:var(--ink2);margin-right:8px}
.ter .tr{padding:15px 0;border-bottom:1px solid var(--line)}

.ter .th{display:flex;justify-content:space-between;align-items:baseline;gap:14px}

.ter .th span{font-size:13px;color:var(--acc);font-style:italic;text-align:right;flex:none;max-width:45%}
.ter .tr p{font-size:15px;margin-top:4px;line-height:1.5}
.ag{list-style:none;position:relative;margin-top:10px;padding-left:24px}

.ag .w{display:block;font-size:13px;font-weight:600;color:var(--acc)}
.ag b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.25;margin-top:2px}
.ag p{font-size:15px;margin-top:3px;color:var(--ink2);line-height:1.5}
.night .ter .tr{border-color:rgba(255,255,255,.12)}

.sos b{white-space:nowrap;font-variant-numeric:lining-nums}.sos b.lg{font-size:20px;line-height:1.5}
@media(min-width:760px){.txm{grid-template-columns:1.3fr 1fr 1fr}.txm div:first-child{grid-column:auto}.txm div+div{padding-left:14px;border-left:1px solid var(--line)}}

fast", "bf": "Served from 8 to 10 am, made with local ingredients. Tell us about any allergies the day before.", "table_t": "Dinner", "table": "On request, the day before.", "spa_t": "Spa", "spa": "Treatments on request: ask us for a time.", "safe_t": "Safety", "safe": "Smoke and carbon monoxide alarms are installed throughout the house. The fire extinguisher and first-aid kit are in the kitchen. In an emergency, get everyone out first, then call 911.", "trash_t": "Trash & recycling", "trash": "Trash and recycling go in the bins we'll show you. Rinse containers, and keep plastic bags out of the recycling.", "c3": "Around {c}", "near_t": "Worth seeing nearby", "market_t": "Farmers markets", "market_n": "Days and seasons are indicative: check before you go.", "maps": "Directions", "c4": "Local tips", "seas_t": "Weather", "seas": "Check the forecast before outdoor plans: conditions can change fast, especially in the mountains and on the coast.", "sea_t": "The ocean", "sea": "Swim at beaches with lifeguards and follow the posted flags. Caught in a rip current? Don't fight it: swim parallel to the shore, then head back in.", "sos_t": "Emergencies", "sos": [["911", "Police, fire, ambulance"], ["1-800-222-1222", "Poison Control"], ["988", "Suicide & Crisis Lifeline"]], "tax_t": "Lodging tax", "tax": "State and local taxes on lodging are added to the room rate. Booked through Airbnb or Vrbo? The platform usually collects them for you.", "c5": "Check-out", "out_t": "Before you leave", "out": ["Keys back in the lockbox or the agreed place", "Windows closed, doors locked", "Thermostat turned down, lights off", "Dishes washed or dishwasher running", "Trash and recycling in the outside bins", "Nothing left behind: chargers, the fridge, the bathroom"], "thanks": "Thank you for staying with us! A review on Google or wherever you booked helps us more than you know.", "gallery": "In pictures", "ex": "to fill in", "made": "Prepared by Umbra Agency for {n}"}, "es": {"kicker": "Guía de bienvenida", "welcome_t": "Bienvenidos", "welcome": "¡Bienvenidos a {n}! Está {z}. Esta guía reúne todo lo necesario para su estancia: la llegada, la casa, nuestros lugares favoritos en los alrededores de {c} y consejos prácticos. Guárdela en su teléfono.", "checkin": "Llegada", "checkout": "Salida", "wifi": "Wifi", "host": "Su anfitrión", "from": "desde las 3 p. m.", "before": "antes de las 11 a. m.", "net": "Red", "pwd": "Contraseña", "call": "Llamar", "msg": "Escribir", "nav": ["Llegada", "La casa", "Alrededores", "Consejos", "Salida"], "c1": "Cómo llegar", "car": "En auto", "car_t": "Le enviaremos la dirección exacta y las indicaciones antes de su llegada. En el campo, el GPS puede fallar en las últimas millas: siga nuestras indicaciones y descargue mapas sin conexión por si se pierde la señal del celular.", "train": "En tren", "plane": "En avión", "approx": "distancias aproximadas por carretera", "parking": "Estacionamiento", "park_yes": "Estacionamiento gratuito en la propiedad.", "park_no": "Dónde estacionar: se lo indicaremos antes de su llegada.", "late": "¿Llega tarde? Avísenos y le preparamos la llegada autónoma (caja de llaves o cerradura con código).", "c2": "La casa", "rules_t": "Normas de la casa", "rules": ["Prohibido fumar o vapear dentro de la casa.", "Horas de silencio de 10 p. m. a 8 a. m.: aquí el sonido llega lejos.", "No se permiten fiestas ni eventos, ni más huéspedes de los indicados en la reserva.", "Al salir, cierre las puertas con llave y también las ventanas."], "pets": "Mascotas: bajo petición, consúltenos antes de reservar.", "clim": "Aire acondicionado: mantenga las ventanas cerradas mientras funciona, unos 74 °F son suficientes, y apáguelo al salir.", "pool_t": "La piscina", "pool": ["Abierta de 8 a. m. a 9 p. m.", "No hay salvavidas: los niños deben estar siempre bajo la supervisión de un adulto.", "Dúchese antes de nadar y no lleve vasos de vidrio a la zona de la piscina."], "tub_t": "El jacuzzi", "tub": ["Limite cada baño a unos 15 minutos y beba bastante agua.", "No se recomienda a niños pequeños ni durante el embarazo; los niños, siempre con un adulto.", "Nada de vidrio, y vuelva a colocar la cubierta después de usarlo."], "bf_t": "Desayuno", "bf": "Se sirve de 8 a 10 a. m., con productos locales. Avísenos de cualquier alergia el día anterior.", "table_t": "Cena", "table": "Bajo petición, el día anterior.", "spa_t": "Spa", "spa": "Tratamientos bajo petición: pídanos un horario.", "safe_t": "Seguridad", "safe": "La casa cuenta con detectores de humo y de monóxido de carbono. El extintor y el botiquín están en la cocina. En caso de emergencia, primero salgan todos de la casa y luego llame al 911.", "trash_t": "Basura y reciclaje", "trash": "La basura y el reciclaje van en los contenedores que le indicaremos. Enjuague los envases y no ponga bolsas de plástico en el reciclaje.", "c3": "Alrededor de {c}", "near_t": "Qué ver cerca", "market_t": "Mercados de agricultores", "market_n": "Días y temporadas orientativos: confírmelos antes de ir.", "maps": "Cómo llegar", "c4": "Consejos prácticos", "seas_t": "El tiempo", "seas": "Consulte el pronóstico antes de cualquier plan al aire libre: el tiempo puede cambiar rápido, sobre todo en la montaña y en la costa.", "sea_t": "El mar", "sea": "Nade en playas con salvavidas y respete las banderas. ¿Le atrapa una corriente de resaca? No luche contra ella: nade en paralelo a la orilla y luego regrese.", "sos_t": "Emergencias", "sos": [["911", "Policía, bomberos, ambulancia"], ["1-800-222-1222", "Centro de Toxicología (Poison Control)"], ["988", "Línea de Prevención del Suicidio y Crisis (oprima 2 para español)"]], "tax_t": "Impuesto de alojamiento", "tax": "Los impuestos estatales y locales sobre el alojamiento se suman a la tarifa de la habitación. ¿Reservó por Airbnb o Vrbo? Normalmente la plataforma los cobra por usted.", "c5": "Salida", "out_t": "Antes de irse", "out": ["Llaves en la caja de llaves o en el lugar acordado", "Ventanas cerradas, puertas con llave", "Termostato bajado, luces apagadas", "Platos lavados o lavavajillas en marcha", "Basura y reciclaje en los contenedores de afuera", "Nada olvidado: cargadores, el refrigerador, el baño"], "thanks": "¡Gracias por alojarse con nosotros! Una reseña en Google o en la plataforma donde reservó nos ayuda muchísimo.", "gallery": "En imágenes", "ex": "por completar", "made": "Preparada por Umbra Agency para {n}"}, "fr": {"kicker": "Livret d'accueil", "welcome_t": "Bienvenue", "welcome": "Bienvenue à {n} ! Vous êtes {z}. Ce livret rassemble tout ce qu'il faut pour votre séjour : l'arrivée, la maison, nos adresses autour de {c} et les infos pratiques. Gardez-le sur votre téléphone.", "checkin": "Arrivée", "checkout": "Départ", "wifi": "Wi-Fi", "host": "Votre hôte", "from": "à partir de 15 h", "before": "avant 11 h", "net": "Réseau", "pwd": "Mot de passe", "call": "Appeler", "msg": "Écrire", "nav": ["Arriver", "La maison", "Autour", "Infos pratiques", "Départ"], "c1": "Arriver", "car": "En voiture", "car_t": "Nous vous envoyons l'adresse exacte et l'itinéraire avant votre arrivée. À la campagne, le GPS peut se tromper sur les derniers miles : suivez nos indications, et téléchargez des cartes hors ligne au cas où le réseau mobile disparaîtrait.", "train": "En train", "plane": "En avion", "approx": "distances approximatives par la route", "parking": "Stationnement", "park_yes": "Parking gratuit sur place.", "park_no": "Où se garer : on vous l'indique avant l'arrivée.", "late": "Arrivée tardive ? Prévenez-nous, on prévoit une arrivée autonome (boîte à clés ou serrure à code).", "c2": "La maison", "rules_t": "Les règles de la maison", "rules": ["Maison non-fumeur, cigarette électronique comprise.", "Calme de 22 h à 8 h : ici, le son porte loin.", "Pas de fêtes ni d'événements, et pas plus de personnes que prévu dans la réservation.", "Fermez les portes à clé et les fenêtres quand vous sortez."], "pets": "Animaux : sur demande, avant la réservation.", "clim": "Climatisation : fenêtres fermées quand elle tourne, 74 °F (23 °C) suffisent, et on l'éteint en sortant.", "pool_t": "La piscine", "pool": ["Ouverte de 8 h à 21 h.", "Piscine non surveillée : les enfants restent toujours sous la surveillance d'un adulte.", "Une douche avant la baignade, et pas de verre autour du bassin."], "tub_t": "Le jacuzzi", "tub": ["Limitez chaque bain à 15 minutes environ, et buvez beaucoup d'eau.", "Déconseillé aux jeunes enfants et pendant la grossesse ; enfants uniquement avec un adulte.", "Pas de verre, et remettez la couverture après usage."], "bf_t": "Petit-déjeuner", "bf": "Servi de 8 h à 10 h, avec des produits locaux. Signalez-nous vos allergies la veille.", "table_t": "Dîner", "table": "Sur réservation, la veille.", "spa_t": "Spa", "spa": "Soins sur réservation : demandez-nous un créneau.", "safe_t": "Sécurité", "safe": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone. L'extincteur et la trousse de secours sont dans la cuisine. En cas d'urgence, faites d'abord sortir tout le monde, puis appelez le 911.", "trash_t": "Poubelles et recyclage", "trash": "Ordures et recyclage vont dans les bacs que nous vous montrerons. Rincez les emballages, et pas de sacs plastiques dans le recyclage.", "c3": "Autour de {c}", "near_t": "À voir près d'ici", "market_t": "Marchés fermiers", "market_n": "Jours et saisons indicatifs : vérifiez avant d'y aller.", "maps": "Itinéraire", "c4": "Infos pratiques", "seas_t": "La météo", "seas": "Consultez la météo avant toute sortie : le temps peut changer vite, surtout en montagne et sur la côte.", "sea_t": "L'océan", "sea": "Baignez-vous sur les plages surveillées et respectez les drapeaux. Pris dans un courant d'arrachement ? Ne luttez pas : nagez parallèlement au rivage, puis revenez.", "sos_t": "Urgences", "sos": [["911", "Police, pompiers, ambulance"], ["1-800-222-1222", "Centre antipoison"], ["988", "Ligne d'écoute suicide et crise"]], "tax_t": "Taxe d'hébergement", "tax": "Les taxes de l'État et locales sur l'hébergement s'ajoutent au prix de la chambre. Réservé sur Airbnb ou Vrbo ? La plateforme les perçoit en général pour vous.", "c5": "Départ", "out_t": "Avant de partir", "out": ["Clés dans la boîte à clés ou à l'endroit convenu", "Fenêtres fermées, portes verrouillées", "Thermostat baissé, lumières éteintes", "Vaisselle faite ou lave-vaisselle lancé", "Poubelles et recyclage dans les bacs extérieurs", "Rien d'oublié : chargeurs, frigo, salle de bains"], "thanks": "Merci d'avoir séjourné chez nous ! Un avis sur Google ou sur le site où vous avez réservé nous aide énormément.", "gallery": "En images", "ex": "à compléter", "made": "Préparé par Umbra Agency pour {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen bei {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Tipps. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 15 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Wegbeschreibung schicken wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi auf den letzten Meilen manchmal: Folgen Sie unserer Beschreibung und laden Sie Offline-Karten herunter, falls der Mobilfunkempfang abbricht.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, dann richten wir den Self-Check-in ein (Schlüsselbox oder Zahlenschloss).", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht, auch keine E-Zigaretten.", "Nachtruhe von 22 bis 8 Uhr: Geräusche tragen hier weit.", "Keine Partys oder Veranstaltungen und nicht mehr Gäste als in der Buchung angegeben.", "Beim Hinausgehen bitte Türen abschließen und Fenster schließen."], "pets": "Haustiere: auf Anfrage, bitte vor der Buchung fragen.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, etwa 74 °F (23 °C) genügen, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 8 bis 21 Uhr.", "Kein Bademeister: Kinder nur unter ständiger Aufsicht eines Erwachsenen.", "Vor dem Schwimmen duschen, kein Glas im Poolbereich."], "tub_t": "Der Whirlpool", "tub": ["Nicht länger als etwa 15 Minuten am Stück baden und viel Wasser trinken.", "Nicht empfohlen für kleine Kinder und in der Schwangerschaft; Kinder nur mit einem Erwachsenen.", "Kein Glas, und bitte die Abdeckung nach dem Baden wieder auflegen."], "bf_t": "Frühstück", "bf": "Von 8 bis 10 Uhr, mit Zutaten aus der Region. Allergien bitte am Vortag mitteilen.", "table_t": "Abendessen", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Anwendungen auf Anfrage: Fragen Sie uns nach einem Termin.", "safe_t": "Sicherheit", "safe": "Im ganzen Haus sind Rauch- und Kohlenmonoxidmelder installiert. Feuerlöscher und Erste-Hilfe-Kasten finden Sie in der Küche. Im Notfall zuerst alle nach draußen bringen, dann 911 anrufen.", "trash_t": "Müll und Recycling", "trash": "Müll und Wertstoffe kommen in die Tonnen, die wir Ihnen zeigen. Behälter ausspülen und keine Plastiktüten in den Recyclingmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Bauernmärkte", "market_n": "Tage und Saison ohne Gewähr: bitte vorher prüfen.", "maps": "Route", "c4": "Praktische Tipps", "seas_t": "Das Wetter", "seas": "Vor Ausflügen den Wetterbericht prüfen: Das Wetter kann schnell umschlagen, vor allem in den Bergen und an der Küste.", "sea_t": "Der Ozean", "sea": "Nur an bewachten Stränden baden und die Flaggen beachten. In einer Rippströmung? Nicht dagegen anschwimmen: parallel zum Ufer schwimmen, dann zurück an Land.", "sos_t": "Notfälle", "sos": [["911", "Polizei, Feuerwehr, Rettungsdienst"], ["1-800-222-1222", "Giftnotruf (Poison Control)"], ["988", "Krisen- und Suizid-Hotline"]], "tax_t": "Beherbergungssteuer", "tax": "Staatliche und lokale Steuern auf Übernachtungen kommen zum Zimmerpreis hinzu. Über Airbnb oder Vrbo gebucht? Dann zieht sie meist die Plattform für Sie ein.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel in der Schlüsselbox oder am vereinbarten Ort", "Fenster zu, Türen abgeschlossen", "Thermostat heruntergedreht, Licht aus", "Geschirr gespült oder Spülmaschine an", "Müll und Recycling in die Tonnen draußen", "Nichts vergessen: Ladegeräte, Kühlschrank, Bad"], "thanks": "Danke für Ihren Aufenthalt! Eine Bewertung bei Google oder dort, wo Sie gebucht haben, hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Erstellt von Umbra Agency für {n}"}};
var R={"NAV4": {"en": "New England tips", "es": "Nueva Inglaterra práctica", "fr": "Nouvelle-Angleterre pratique", "de": "Neuengland-Tipps"}, "RULES": {"en": ["Vermont rentals post the host’s phone number and the Health Department and Fire Safety contacts, and keep the state safety, health and tax form on site.", "Towns add their own rules: Burlington and Stowe require registration, a quick-response local contact and the permit number on every listing.", "In Maine, Portland and Bar Harbor require annual registration and safety inspections; Bar Harbor also caps rentals not lived in by their owner.", "Rooms tax is part of your bill: Vermont 9% (plus 3% for short-term rentals and 1% in some towns), New Hampshire 8.5%, Maine 9%.", "Occupancy is limited to the number of guests on the booking; quiet after 10pm, no fireworks, and no extra cars on the lawn or the road."], "es": ["En Vermont, el alojamiento exhibe el teléfono del anfitrión y los contactos de Salud y Bomberos, y guarda in situ el formulario estatal de seguridad y fiscalidad.", "Los municipios añaden sus normas: Burlington y Stowe exigen registro, un contacto local que responda rápido y el número de permiso en cada anuncio.", "En Maine, Portland y Bar Harbor exigen registro anual e inspecciones de seguridad; Bar Harbor limita además los alquileres sin propietario residente.", "El impuesto de alojamiento va en su factura: Vermont 9 % (más 3 % en alquileres de corta estancia y 1 % en algunos pueblos), New Hampshire 8,5 %, Maine 9 %.", "La ocupación se limita al número de huéspedes de la reserva; silencio a partir de las 22 h, nada de fuegos artificiales ni coches de más en el césped o la calle."], "fr": ["Au Vermont, le logement affiche le numéro de l’hôte et les contacts de la Santé et des pompiers, et garde sur place le formulaire de l’État (sécurité, santé, taxes).", "Les villes ajoutent leurs règles : Burlington et Stowe imposent un enregistrement, un contact local réactif et le numéro sur chaque annonce.", "Dans le Maine, Portland et Bar Harbor imposent enregistrement annuel et inspections de sécurité ; Bar Harbor plafonne aussi les locations non habitées par leur propriétaire.", "La taxe de séjour figure sur votre facture : Vermont 9 % (plus 3 % pour les locations de courte durée et 1 % dans certaines villes), New Hampshire 8,5 %, Maine 9 %.", "Le nombre d’occupants est limité à celui de la réservation ; calme après 22 h, pas de feux d’artifice, et pas de voitures en plus sur la pelouse ou la route."], "de": ["In Vermont hängen Unterkünfte die Nummer des Gastgebers sowie Kontakte von Gesundheitsamt und Brandschutz aus und halten das staatliche Pflichtenformular bereit.", "Gemeinden haben eigene Regeln: Burlington und Stowe verlangen Registrierung, eine schnell erreichbare Kontaktperson und die Nummer in jeder Anzeige.", "In Maine verlangen Portland und Bar Harbor jährliche Registrierung und Sicherheitsprüfungen; Bar Harbor begrenzt zudem nicht selbst bewohnte Ferienhäuser.", "Die Beherbergungssteuer steht auf Ihrer Rechnung: Vermont 9 % (plus 3 % für Kurzzeitvermietungen und 1 % in manchen Orten), New Hampshire 8,5 %, Maine 9 %.", "Die Belegung ist auf die gebuchte Gästezahl begrenzt; Ruhe ab 22 Uhr, kein Feuerwerk und keine zusätzlichen Autos auf dem Rasen oder der Straße."]}, "HOUSE": {"en": [{"ic": "home", "h": "Heat & wood stove", "p": "Nights can drop well below freezing from October to April. In winter, never switch the heat off when you go out: keep the thermostat at 60–65°F so the pipes don’t freeze. If there is a <b>wood stove or fireplace<\/b>: dry firewood only, no lighter fluid, keep the door or screen closed, and put ashes in the metal bucket with a lid, outside and away from the house – they stay hot for days."}, {"ic": "leaf", "h": "Well water & septic", "p": "Many country homes run on a private well and a <b>septic system<\/b>: only toilet paper in the toilet – no wipes (even ‘flushable’ ones), no paper towels, no grease. The well pump needs electricity, so during a power cut there is no running water: keep a jug filled when a storm is forecast."}, {"ic": "bin", "h": "Trash, recycling & bears", "ul": ["Many towns have no curbside pickup: trash goes to the town transfer station, which keeps limited hours; we’ll tell you what applies here.", "Recycling: rinsed cans, bottles, plastics and flattened cardboard, sorted as shown at the house.", "Vermont bans food scraps from the trash: use the compost or the scraps bin.", "Vermont and Maine refund a deposit on many bottles and cans at redemption centers.", "Black bears are common: keep trash indoors or in the locked bin, never leave food on the porch, and don’t hang bird feeders from April to November."]}, {"ic": "sos", "h": "Smoke & CO alarms", "p": "The house has smoke and <b>carbon-monoxide<\/b> alarms: never cover or unplug them. If the CO alarm sounds, get everyone outside and call <b>911<\/b>. Never run a grill, generator or heater indoors or in the garage. We’ll show you the fire extinguisher and the exits when you arrive."}, {"ic": "list", "h": "Quiet & neighbours", "p": "Sound carries far across lakes and valleys: please keep it quiet after 10pm, which is also when most town noise ordinances apply. Fireworks are restricted or banned in many towns, and campfires may need a permit or be banned in dry spells: ask us first."}, {"ic": "car", "h": "Parking, snow & mud", "p": "Park only where we show you, so the plow can clear the driveway. Many towns ban overnight street parking in winter or during snow storms: follow the posted signs. Steps and decks get icy: use the salt or sand provided. In April, ‘mud season’ can make dirt roads soft and rutted – drive slowly."}], "es": [{"ic": "home", "h": "Calefacción y estufa de leña", "p": "De octubre a abril las noches pueden bajar mucho de 0 °C. En invierno, no apague nunca la calefacción al salir: deje el termostato en 60–65 °F (16–18 °C) para que no se congelen las tuberías. Si hay <b>estufa de leña o chimenea<\/b>: solo leña seca, nada de líquidos inflamables, puerta o pantalla cerrada, y las cenizas en el cubo metálico con tapa, fuera y lejos de la casa: siguen calientes durante días."}, {"ic": "leaf", "h": "Agua de pozo y fosa séptica", "p": "Muchas casas de campo tienen pozo propio y <b>fosa séptica<\/b>: en el inodoro, solo papel higiénico; nada de toallitas (ni las «desechables»), papel de cocina ni grasa. La bomba del pozo funciona con electricidad: si se va la luz, no hay agua corriente. Llene una garrafa cuando se anuncie tormenta."}, {"ic": "bin", "h": "Basura, reciclaje y osos", "ul": ["Muchos pueblos no recogen la basura a domicilio: se lleva al punto de transferencia municipal, con horario limitado; le diremos cómo funciona aquí.", "Reciclaje: latas, botellas, plásticos enjuagados y cartón plegado, separados como se indica en la casa.", "En Vermont está prohibido tirar restos de comida a la basura: use el compost o el cubo de orgánicos.", "En Vermont y Maine se devuelve un depósito por muchas botellas y latas en los centros de reciclaje.", "Los osos negros son frecuentes: guarde la basura dentro o en el contenedor cerrado, no deje comida en el porche ni cuelgue comederos de pájaros de abril a noviembre."]}, {"ic": "sos", "h": "Detectores de humo y CO", "p": "La casa tiene detectores de humo y de <b>monóxido de carbono<\/b>: no los tape ni los desconecte. Si suena la alarma de CO, salgan todos y llamen al <b>911<\/b>. Nunca use parrilla, generador o estufa dentro de casa ni en el garaje. A su llegada le mostraremos el extintor y las salidas."}, {"ic": "list", "h": "Silencio y vecinos", "p": "El sonido llega lejos sobre lagos y valles: le pedimos silencio a partir de las 22 h, hora en la que se aplican la mayoría de las ordenanzas municipales. Los fuegos artificiales están restringidos o prohibidos en muchos pueblos, y las fogatas pueden requerir permiso o prohibirse en época seca: consúltenos antes."}, {"ic": "car", "h": "Aparcamiento, nieve y barro", "p": "Aparque solo donde le indiquemos para que la quitanieves pueda limpiar la entrada. Muchos pueblos prohíben aparcar de noche en la calle en invierno o durante las nevadas: respete las señales. Escalones y terrazas se hielan: use la sal o la arena disponibles. En abril, la «temporada de barro» deja los caminos de tierra blandos: conduzca despacio."}], "fr": [{"ic": "home", "h": "Chauffage & poêle à bois", "p": "D’octobre à avril, les nuits descendent souvent bien sous 0 °C. L’hiver, ne coupez jamais le chauffage en sortant : laissez le thermostat sur 60–65 °F (16–18 °C) pour que les canalisations ne gèlent pas. S’il y a un <b>poêle à bois ou une cheminée<\/b> : bois sec uniquement, jamais d’allume-feu liquide, porte ou pare-feu fermés, et cendres dans le seau métallique à couvercle, dehors et loin de la maison – elles restent chaudes des jours."}, {"ic": "leaf", "h": "Puits & fosse septique", "p": "Beaucoup de maisons de campagne ont un puits privé et une <b>fosse septique<\/b> : dans les WC, uniquement du papier toilette – ni lingettes (même « jetables »), ni essuie-tout, ni graisse. La pompe du puits fonctionne à l’électricité : en cas de coupure, plus d’eau au robinet. Remplissez un bidon quand une tempête est annoncée."}, {"ic": "bin", "h": "Déchets, tri & ours", "ul": ["Beaucoup de villes n’ont pas de collecte à domicile : les déchets vont à la déchetterie municipale (transfer station), aux horaires limités ; on vous explique ce qui vaut ici.", "Recyclage : canettes, bouteilles et plastiques rincés, cartons aplatis, triés comme indiqué à la maison.", "Au Vermont, les restes alimentaires sont interdits dans les ordures : compost ou bac à biodéchets.", "Au Vermont et dans le Maine, une consigne est remboursée sur beaucoup de bouteilles et canettes dans les centres de collecte.", "Les ours noirs sont fréquents : déchets à l’intérieur ou dans le bac verrouillé, jamais de nourriture sur le porche, et pas de mangeoires à oiseaux d’avril à novembre."]}, {"ic": "sos", "h": "Détecteurs fumée & CO", "p": "La maison est équipée de détecteurs de fumée et de <b>monoxyde de carbone<\/b> : ne les couvrez pas et ne les débranchez pas. Si l’alarme CO sonne, sortez tous et appelez le <b>911<\/b>. Jamais de barbecue, de groupe électrogène ou de chauffage d’appoint à l’intérieur ou au garage. On vous montre l’extincteur et les sorties à l’arrivée."}, {"ic": "list", "h": "Calme & voisinage", "p": "Le son porte loin sur les lacs et dans les vallées : merci de rester calmes après 22 h, l’heure à laquelle s’appliquent la plupart des arrêtés municipaux sur le bruit. Les feux d’artifice sont limités ou interdits dans beaucoup de villes, et un feu de camp peut exiger un permis ou être interdit par temps sec : demandez-nous d’abord."}, {"ic": "car", "h": "Stationnement, neige & boue", "p": "Garez-vous uniquement là où on vous l’indique, pour que le chasse-neige puisse dégager l’allée. Beaucoup de villes interdisent de stationner la nuit dans la rue en hiver ou pendant les tempêtes : suivez les panneaux. Marches et terrasses gèlent : utilisez le sel ou le sable fournis. En avril, la « saison de la boue » rend les chemins de terre mous et creusés : roulez doucement."}], "de": [{"ic": "home", "h": "Heizung & Holzofen", "p": "Von Oktober bis April fallen die Nächte oft weit unter 0 °C. Im Winter die Heizung beim Weggehen nie ausschalten: Thermostat auf 60–65 °F (16–18 °C) lassen, damit die Leitungen nicht einfrieren. Falls es einen <b>Holzofen oder Kamin<\/b> gibt: nur trockenes Holz, kein flüssiger Anzünder, Ofentür oder Funkenschutz geschlossen, Asche in den Metalleimer mit Deckel, draußen und weg vom Haus – sie bleibt tagelang heiß."}, {"ic": "leaf", "h": "Brunnen & Klärgrube", "p": "Viele Landhäuser haben einen eigenen Brunnen und eine <b>Klärgrube<\/b>: nur Toilettenpapier in die Toilette – keine Feuchttücher (auch keine „spülbaren“), keine Küchentücher, kein Fett. Die Brunnenpumpe braucht Strom: Bei Stromausfall kommt kein Wasser. Füllen Sie einen Kanister, wenn ein Sturm angekündigt ist."}, {"ic": "bin", "h": "Müll, Recycling & Bären", "ul": ["Viele Orte haben keine Müllabfuhr: Der Müll kommt zur Sammelstelle der Gemeinde (Transfer Station) mit begrenzten Öffnungszeiten; wir sagen Ihnen, wie es hier läuft.", "Recycling: ausgespülte Dosen, Flaschen und Kunststoffe sowie flach gefaltete Kartons, sortiert wie im Haus beschrieben.", "In Vermont dürfen Essensreste nicht in den Restmüll: bitte Kompost oder Biotonne nutzen.", "In Vermont und Maine gibt es für viele Flaschen und Dosen Pfand an den Rücknahmestellen.", "Schwarzbären sind häufig: Müll im Haus oder in der verschlossenen Tonne lassen, kein Essen auf der Veranda und von April bis November keine Vogelfutterhäuschen."]}, {"ic": "sos", "h": "Rauch- & CO-Melder", "p": "Das Haus hat Rauch- und <b>Kohlenmonoxid<\/b>-Melder: bitte nie abdecken oder abklemmen. Schlägt der CO-Melder an, alle sofort ins Freie und <b>911<\/b> anrufen. Grill, Generator oder Heizgeräte nie im Haus oder in der Garage betreiben. Feuerlöscher und Ausgänge zeigen wir Ihnen bei der Ankunft."}, {"ic": "list", "h": "Ruhe & Nachbarn", "p": "Über Seen und Täler trägt der Schall weit: Bitte ab 22 Uhr Ruhe – ab dann gelten auch die meisten Lärmverordnungen der Gemeinden. Feuerwerk ist in vielen Orten eingeschränkt oder verboten, und Lagerfeuer brauchen teils eine Genehmigung oder sind bei Trockenheit verboten: Fragen Sie uns vorher."}, {"ic": "car", "h": "Parken, Schnee & Matsch", "p": "Parken Sie nur dort, wo wir es Ihnen zeigen, damit der Schneepflug die Einfahrt räumen kann. Viele Orte verbieten im Winter oder bei Schneesturm das nächtliche Parken auf der Straße: Schilder beachten. Stufen und Terrassen vereisen: Salz oder Sand liegen bereit. Im April macht die „Mud Season“ Schotterwege weich und tief zerfurcht – langsam fahren."}]}, "PRAT": {"en": [{"ic": "sun", "h": "Through the seasons", "p": "Warm summer days with cool nights; peak foliage from late September to mid-October; snowy winters from December to March. April brings ‘mud season’, and May–June brings black flies in the woods. Mountain weather changes fast: on Mount Washington it can snow in any month, so carry layers and turn back if it closes in."}, {"ic": "bug", "h": "Ticks & Lyme disease", "al": 1, "p": "Northern New England has some of the highest Lyme disease rates in the country. Use repellent, tuck trousers into socks in tall grass, and check everyone – children and dogs too – every evening. Remove a tick with fine tweezers, close to the skin, and see a doctor if a rash or fever follows."}, {"ic": "car", "h": "Moose, deer & winter roads", "al": 1, "p": "Moose cross roads at dusk and at night, especially in the north woods and the White Mountains: slow down where you see ‘Brake for Moose’ signs. In winter, allow extra time, keep the tank half full and the windows clear; Smugglers’ Notch (Route 108) closes for the season. Road conditions: <b>511<\/b>."}, {"ic": "leaf", "h": "Hunting season", "p": "Hunting runs mainly from September to December, with the busiest deer rifle season in November. Wear something bright orange on trails and back roads, keep dogs close, and respect ‘Posted’ signs on private land."}, {"ic": "list", "h": "Parks & reservations", "p": "Acadia requires an entrance pass, and in season the Cadillac Summit Road needs a timed vehicle reservation on Recreation.gov. Baxter State Park day-use parking for Katahdin must be reserved; many White Mountain trailheads require a recreation pass. In fall foliage season, book tables and lodging well ahead."}, {"ic": "sea", "h": "Sea, tides & lakes", "p": "The Gulf of Maine stays cold – often in the 50s or low 60s °F even in August – so keep swims short and watch for rip currents. Downeast tides rise and fall more than ten feet: check the tide table before walking out to Bar Island or exploring the rocks. On lakes, life jackets for children are the law."}, {"ic": "phone", "h": "Cell coverage", "p": "There is no signal along much of the Kancamagus Highway, in the North Woods, parts of the Northeast Kingdom and many valleys. Download offline maps before you go, tell someone your route, and note where the nearest landline or village store is."}, {"ic": "coins", "h": "Tipping, taxes & hours", "p": "Tip 18–20% in restaurants and bars, and leave a little for housekeeping. New Hampshire has no general sales tax but charges 8.5% on meals; Vermont and Maine add tax on meals too. Many restaurants close one or two days a week and keep shorter hours from November to April: call ahead."}], "es": [{"ic": "sun", "h": "Las estaciones", "p": "Veranos cálidos con noches frescas; follaje otoñal en su apogeo de finales de septiembre a mediados de octubre; inviernos nevados de diciembre a marzo. Abril trae la «temporada de barro», y mayo–junio, las moscas negras en el bosque. En la montaña el tiempo cambia rápido: en el monte Washington puede nevar cualquier mes, así que lleve capas de ropa y dé la vuelta si se cierra la niebla."}, {"ic": "bug", "h": "Garrapatas y enfermedad de Lyme", "al": 1, "p": "El norte de Nueva Inglaterra tiene algunas de las tasas de enfermedad de Lyme más altas del país. Use repelente, meta el pantalón en los calcetines en la hierba alta y revise a todos, niños y perros incluidos, cada noche. Retire la garrapata con pinzas finas, a ras de piel, y consulte a un médico si aparece una mancha o fiebre."}, {"ic": "car", "h": "Alces, ciervos y carreteras en invierno", "al": 1, "p": "Los alces cruzan las carreteras al anochecer y de noche, sobre todo en los bosques del norte y las White Mountains: reduzca la velocidad donde vea señales «Brake for Moose». En invierno, calcule más tiempo, mantenga el depósito a la mitad y los cristales limpios; Smugglers’ Notch (Ruta 108) cierra en temporada. Estado de las carreteras: <b>511<\/b>."}, {"ic": "leaf", "h": "Temporada de caza", "p": "La caza se concentra de septiembre a diciembre, con la temporada de ciervo con rifle en noviembre como la más concurrida. Lleve algo naranja vivo en senderos y caminos rurales, mantenga al perro cerca y respete los carteles «Posted» en terrenos privados."}, {"ic": "list", "h": "Parques y reservas", "p": "Acadia exige un pase de entrada y, en temporada, la carretera a la cima del Cadillac requiere reserva de vehículo con horario en Recreation.gov. El aparcamiento de día para el Katahdin, en Baxter State Park, se reserva; muchos accesos de las White Mountains exigen un pase recreativo. En época de follaje, reserve mesa y alojamiento con antelación."}, {"ic": "sea", "h": "Mar, mareas y lagos", "p": "El golfo de Maine es frío –a menudo entre 10 y 17 °C (50–60 °F) incluso en agosto–: baños cortos y atención a las corrientes de resaca. En el Downeast la marea sube y baja más de 3 m: consulte la tabla antes de cruzar a Bar Island o explorar las rocas. En los lagos, el chaleco salvavidas es obligatorio para los niños."}, {"ic": "phone", "h": "Cobertura móvil", "p": "No hay señal en buena parte de la Kancamagus Highway, en los bosques del norte de Maine, en zonas del Northeast Kingdom y en muchos valles. Descargue mapas sin conexión, avise a alguien de su ruta y fíjese dónde está el teléfono fijo o la tienda más cercana."}, {"ic": "coins", "h": "Propinas, impuestos y horarios", "p": "En restaurantes y bares se deja un 18–20 % de propina, y algo para la limpieza. New Hampshire no tiene impuesto general sobre las ventas, pero cobra un 8,5 % en las comidas; Vermont y Maine también gravan las comidas. Muchos restaurantes cierran uno o dos días por semana y reducen horario de noviembre a abril: llame antes."}], "fr": [{"ic": "sun", "h": "Au fil des saisons", "p": "Étés chauds aux nuits fraîches ; couleurs d’automne au sommet de fin septembre à mi-octobre ; hivers enneigés de décembre à mars. Avril amène la « saison de la boue », mai–juin les mouches noires en forêt. En montagne, la météo tourne vite : sur le mont Washington, il peut neiger tous les mois de l’année. Prévoyez des couches et faites demi-tour si le temps se gâte."}, {"ic": "bug", "h": "Tiques & maladie de Lyme", "al": 1, "p": "Le nord de la Nouvelle-Angleterre a l’un des taux de maladie de Lyme les plus élevés du pays. Répulsif, pantalon dans les chaussettes dans les hautes herbes, et inspection de tout le monde – enfants et chiens compris – chaque soir. Retirez une tique avec une pince fine, au ras de la peau, et consultez en cas de rougeur ou de fièvre."}, {"ic": "car", "h": "Orignaux, cerfs & routes d’hiver", "al": 1, "p": "Les orignaux traversent au crépuscule et la nuit, surtout dans les forêts du nord et les White Mountains : ralentissez aux panneaux « Brake for Moose ». L’hiver, prévoyez de la marge, gardez le réservoir à moitié plein et les vitres dégagées ; Smugglers’ Notch (Route 108) est fermé pour la saison. État des routes : <b>511<\/b>."}, {"ic": "leaf", "h": "Saison de chasse", "p": "La chasse a lieu surtout de septembre à décembre, la saison du cerf à la carabine, en novembre, étant la plus fréquentée. Portez du orange vif sur les sentiers et les petites routes, gardez le chien près de vous et respectez les panneaux « Posted » des terrains privés."}, {"ic": "list", "h": "Parcs & réservations", "p": "Acadia exige un pass d’entrée et, en saison, la route du sommet du Cadillac se réserve par créneau horaire sur Recreation.gov. Le parking de jour du Katahdin, à Baxter State Park, se réserve ; beaucoup de départs de sentiers des White Mountains demandent un pass. En saison des couleurs, réservez tables et hébergements longtemps à l’avance."}, {"ic": "sea", "h": "Mer, marées & lacs", "p": "Le golfe du Maine reste froid – souvent 10 à 17 °C (50–60 °F) même en août : baignades courtes et attention aux courants d’arrachement. Dans le Downeast, le marnage dépasse 3 m : consultez l’horaire des marées avant de rejoindre Bar Island ou d’explorer les rochers. Sur les lacs, le gilet de sauvetage est obligatoire pour les enfants."}, {"ic": "phone", "h": "Réseau mobile", "p": "Pas de réseau sur une bonne partie de la Kancamagus Highway, dans les forêts du nord du Maine, dans une partie du Northeast Kingdom et dans bien des vallées. Téléchargez des cartes hors ligne, prévenez quelqu’un de votre itinéraire et repérez le téléphone fixe ou l’épicerie la plus proche."}, {"ic": "coins", "h": "Pourboires, taxes & horaires", "p": "Comptez 18 à 20 % de pourboire au restaurant et au bar, et un petit mot pour le ménage. Le New Hampshire n’a pas de taxe générale sur les ventes mais taxe les repas à 8,5 % ; le Vermont et le Maine taxent aussi les repas. Beaucoup de restaurants ferment un ou deux jours par semaine et réduisent leurs horaires de novembre à avril : appelez avant."}], "de": [{"ic": "sun", "h": "Im Lauf der Jahreszeiten", "p": "Warme Sommertage mit kühlen Nächten; Höhepunkt der Laubfärbung von Ende September bis Mitte Oktober; schneereiche Winter von Dezember bis März. Im April kommt die „Mud Season“, im Mai–Juni die Kriebelmücken im Wald. Das Bergwetter schlägt schnell um: Auf dem Mount Washington kann es in jedem Monat schneien – Kleidung zum Schichten mitnehmen und bei Wetterumschwung umkehren."}, {"ic": "bug", "h": "Zecken & Lyme-Borreliose", "al": 1, "p": "Das nördliche Neuengland hat einige der höchsten Borreliose-Raten der USA. Mückenschutz auftragen, im hohen Gras die Hose in die Socken stecken und abends alle absuchen – auch Kinder und Hunde. Zecken mit einer feinen Pinzette hautnah entfernen; bei Rötung oder Fieber zum Arzt."}, {"ic": "car", "h": "Elche, Hirsche & Winterstraßen", "al": 1, "p": "Elche queren in der Dämmerung und nachts die Straßen, vor allem in den Wäldern des Nordens und in den White Mountains: Bei „Brake for Moose“-Schildern langsamer fahren. Im Winter mehr Zeit einplanen, den Tank halb voll und die Scheiben frei halten; die Smugglers’ Notch (Route 108) ist dann gesperrt. Straßenzustand: <b>511<\/b>."}, {"ic": "leaf", "h": "Jagdsaison", "p": "Gejagt wird vor allem von September bis Dezember, am meisten während der Hirschjagd mit dem Gewehr im November. Tragen Sie auf Wanderwegen und Nebenstraßen etwas Leuchtorange, halten Sie Hunde nah bei sich und beachten Sie „Posted“-Schilder auf Privatgrund."}, {"ic": "list", "h": "Parks & Reservierungen", "p": "Für Acadia braucht man einen Eintrittspass, und in der Saison erfordert die Gipfelstraße des Cadillac eine zeitgebundene Fahrzeugreservierung auf Recreation.gov. Tagesparkplätze für den Katahdin im Baxter State Park müssen reserviert werden; viele Trailheads in den White Mountains verlangen einen Recreation Pass. In der Laubsaison Tisch und Unterkunft früh buchen."}, {"ic": "sea", "h": "Meer, Gezeiten & Seen", "p": "Der Golf von Maine bleibt kalt – oft nur 10 bis 17 °C (50–60 °F), selbst im August: kurz baden und auf Brandungsrückströme achten. Im Downeast beträgt der Tidenhub über 3 m: Vor dem Weg nach Bar Island oder über die Felsen den Gezeitenkalender prüfen. Auf Seen sind Schwimmwesten für Kinder Pflicht."}, {"ic": "phone", "h": "Handyempfang", "p": "Kein Netz gibt es auf großen Teilen des Kancamagus Highway, in den North Woods, in Teilen des Northeast Kingdom und in vielen Tälern. Laden Sie Offline-Karten herunter, sagen Sie jemandem Ihre Route und merken Sie sich das nächste Festnetztelefon oder den nächsten Dorfladen."}, {"ic": "coins", "h": "Trinkgeld, Steuern & Zeiten", "p": "In Restaurants und Bars sind 18–20 % Trinkgeld üblich, und eine Kleinigkeit fürs Zimmerpersonal. New Hampshire hat keine allgemeine Umsatzsteuer, besteuert aber Mahlzeiten mit 8,5 %; auch Vermont und Maine besteuern Mahlzeiten. Viele Restaurants haben ein bis zwei Ruhetage und von November bis April kürzere Öffnungszeiten: vorher anrufen."}]}, "TERROIR": {"en": [["Vermont maple syrup", "Vermont makes roughly half of all US maple syrup; grades run from Golden to Very Dark – taste them at a sugarhouse", "sugaring Mar – Apr; all year"], ["Vermont cheddar & farmstead cheese", "Aged cheddars and small-farm cheeses along the Vermont Cheese Trail, from Shelburne Farms to Grafton", "all
