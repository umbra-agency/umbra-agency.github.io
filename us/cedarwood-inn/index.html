<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0e">
<title>CedarWood Inn · Welcome Book</title>
<meta property="og:title" content="CedarWood Inn · your guest welcome book is ready">
<meta property="og:description" content="Welcome book in 4 languages, prepared by Umbra Agency.">
<meta property="og:image" content="https://wsrv.nl/?url=https%3A%2F%2Fcdn.prod.website-files.com%2F64df6dfbbbe558f6c57b9f12%2F64df6f4c9e955b0a7ccaa939_CedarWood%2520Inn2.png&amp;w=1600&amp;output=webp&amp;q=80">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Marcellus:wght@400&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{--bg:#f1f2ea;--ink:#1f261d;--ink2:#3f4a3c;--acc:#55713d;--soft:#e2e9d6;--card:#fffdfa;--line:rgba(0,0,0,.09);--mut:#7d7a72;--r:16px;--fh:'Marcellus';--fb:'Jost';--emst:normal;--ease:cubic-bezier(.2,.7,.1,1);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb),system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,.ser{font-family:var(--fh),Georgia,serif;font-weight:400;letter-spacing:-.005em}
em{font-style:var(--emst,italic)}
.ico{display:inline-flex;width:22px;height:22px;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translate3d(0,34px,0);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.vis{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
.pr{overflow:hidden;clip-path:inset(10% 6% 10% 6% round 22px);transition:clip-path 1.3s var(--ease)}
.pr img{transform:scale(1.12);transition:transform 1.6s var(--ease)}
.pr.vis{clip-path:inset(0 0 0 0 round var(--pr-r,0px))}
.pr.vis img{transform:scale(1)}
.ex{display:inline-block;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);border:1px solid currentColor;padding:4px 6px 3px;border-radius:99px;vertical-align:middle;margin-left:8px;opacity:.85;white-space:nowrap}
/* barre haute */
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:70}
.demo{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:45;font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.16em;text-transform:uppercase;background:rgba(11,11,14,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#ececf1;padding:10px 12px;border-radius:99px;display:flex;gap:7px;align-items:center}
.demo i{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:45;display:flex;gap:2px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.lang button{border:0;background:transparent;font:700 11.5px/1 var(--fb),sans-serif;letter-spacing:.06em;padding:8px 9px;border-radius:99px;color:#2a2a2e;cursor:pointer;transition:background .3s,color .3s}
.lang button.on{background:#111114;color:#fff}
.tip{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 46px);right:14px;z-index:45;background:#111114;color:#f1f1f4;font:600 12px/1.3 var(--fb),sans-serif;padding:9px 12px;border-radius:12px;max-width:210px;opacity:0;transform:translateY(-6px);transition:all .5s var(--ease);pointer-events:none}
.tip:before{content:"";position:absolute;top:-5px;right:22px;width:10px;height:10px;background:#111114;transform:rotate(45deg)}
.tip.on{opacity:1;transform:none}
/* intro Umbra */
#intro{position:fixed;inset:0;z-index:100;background:#060608;color:#e9e9ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .8s ease,visibility .8s}
#intro.off{opacity:0;visibility:hidden}
.ecl{width:78px;height:78px;border-radius:50%;position:relative;background:#d9dbe4;box-shadow:0 0 50px 8px rgba(205,210,230,.22);animation:eg 2.2s var(--ease) both}
.ecl:after{content:"";position:absolute;inset:0;border-radius:50%;background:#060608;transform:translate(14px,-8px);animation:em 2.2s var(--ease) both}
@keyframes eg{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes em{from{transform:translate(70px,-30px)}to{transform:translate(14px,-8px)}}
#intro small{letter-spacing:.38em;text-transform:uppercase;font-size:10.5px;color:#8e90a0}
#intro b{font-family:var(--fh),serif;font-weight:400;font-size:25px;line-height:1.25;text-align:center;padding:0 30px;max-width:520px;opacity:0;animation:fi 1s .5s var(--ease) forwards}
@keyframes fi{to{opacity:1}}
/* blocs de contenu (communs) */
.blk{padding:26px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bh .ico{width:40px;height:40px;padding:9px;border-radius:50%;background:var(--soft);color:var(--acc)}
.bh h3{font-size:23px;line-height:1.2}
.blk p{color:var(--ink2)}
.blk.al{background:var(--soft);border:0;border-radius:20px;padding:22px 20px;margin:10px 0}
.blk.al .bh .ico{background:var(--card)}
.ul{list-style:none}
.ul li{position:relative;padding:9px 0 9px 22px;color:var(--ink2);border-bottom:1px dashed var(--line)}
.ul li:last-child{border-bottom:0}
.ul li:before{content:"";position:absolute;left:2px;top:19px;width:9px;height:1.5px;background:var(--acc)}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r b{font-weight:600}
.rows .r span{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.pois{display:grid;gap:2px}
.poi{display:grid;grid-template-columns:74px 1fr 26px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.poi:last-child{border-bottom:0}
.poi .km{font-family:var(--fh),serif;font-size:38px;line-height:.9;color:var(--acc);text-align:right;font-variant-numeric:lining-nums}
.poi .km small{display:block;font:600 10px/1.6 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.poi b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.2}
.poi small.d{display:block;font-size:14px;color:var(--ink2);line-height:1.45;margin-top:4px}
.poi .go{width:26px;height:26px;color:var(--acc);transition:transform .3s}
.poi:active .go{transform:translateX(4px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.3}
.chip b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:18px}
.chip span{color:var(--mut)}
.sos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sos a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;transition:transform .2s}
.sos a:active{transform:scale(.97)}
.sos b{font-family:var(--fh),serif;font-size:28px;font-weight:400;color:var(--acc);line-height:1.1}
.sos small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35}
.chk label{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk label:last-of-type{border-bottom:0}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .bx{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--acc);flex:none;display:flex;align-items:center;justify-content:center;transition:background .3s}
.chk .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none;opacity:0;transform:scale(.5);transition:all .3s var(--ease)}
.chk input:checked+.bx{background:var(--acc)}
.chk input:checked+.bx svg{opacity:1;transform:none}
.chk input:checked~span{color:var(--mut);text-decoration:line-through}
.prog{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:4px 0 6px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.prog i:after{content:"";position:absolute;inset:0;background:var(--acc);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .5s var(--ease)}
.kick{font:600 11px/1.2 var(--fb),sans-serif;letter-spacing:.3em;text-transform:uppercase}
.z{cursor:zoom-in}
/* ess (essentiels) commun */
.ess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.es{border-radius:20px;padding:16px;position:relative;overflow:hidden}
.es .ico{width:24px;height:24px;margin-bottom:18px}
.es .l{font:600 10.5px/1 var(--fb),sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.es .v{font-family:var(--fh),serif;font-size:22px;line-height:1.2;margin-top:7px;word-break:break-word}
.es .s{font-size:12.5px;opacity:.7;margin-top:3px}
.es .ex{margin:8px 0 0}
.ess .es:nth-child(3),.ess .es:nth-child(4){grid-column:1/-1}
.ess .es:nth-child(3) .v,.ess .es:nth-child(4) .v{font-size:24px}
/* footer */
footer{background:#0b0b0e;color:#cfd0d8;text-align:center;padding:80px 26px calc(150px + var(--sb))}
footer .ecl{width:44px;height:44px;margin:0 auto 26px;animation:none;box-shadow:0 0 30px 4px rgba(205,210,230,.18)}
footer .ecl:after{background:#0b0b0e;animation:none;transform:translate(8px,-5px)}
footer .thx{font-family:var(--fh),serif;font-size:27px;line-height:1.3;color:#fff;max-width:520px;margin:0 auto 16px}
footer small{font-size:12.5px;letter-spacing:.06em;color:#8d8f9e}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,6,8,.96);display:none;touch-action:pan-y}
#lb.on{display:block}
#lb .tr{display:flex;height:100%;transition:transform .45s var(--ease)}
#lb figure{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:60px 10px}
#lb figure img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
#lb .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;cursor:pointer;z-index:2}
#lb .n{position:absolute;bottom:calc(22px + var(--sb));left:0;right:0;text-align:center;color:#aaa;font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em}

/* =========================== MAS : immersif =========================== */
.L-mas .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#1a1a1a}
.L-mas .hero .bg{position:absolute;inset:-6% 0 0 0;will-change:transform}
.L-mas .hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}@keyframes kb2{from{transform:scale(1.04)}to{transform:scale(1)}}.L-mas .hero .bg img.lo{animation-name:kb2}
.L-mas .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.72) 100%)}
.L-mas .hero .tx{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 24px calc(92px + var(--sb));max-width:820px;margin:0 auto}
.L-mas .hero .kick{display:flex;align-items:center;gap:12px;opacity:0;animation:fi 1s 2.6s forwards}
.L-mas .hero .kick:before{content:"";width:28px;height:1px;background:#fff}
.L-mas .hero h1{font-size:clamp(50px,14vw,104px);line-height:.95;margin:16px 0 18px}
.sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.sp>span{display:inline-block;transform:translateY(105%);animation:up 1.2s var(--ease) forwards}
@keyframes up{to{transform:none}}
.L-mas .hero .meta{font-size:15px;letter-spacing:.04em;opacity:0;animation:fi 1s 3.1s forwards}
.cue{position:absolute;left:50%;bottom:calc(22px + var(--sb));z-index:2;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font:600 9.5px/1 var(--fb),sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cue i{width:1px;height:40px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.cue i:after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{to{top:100%}}
.L-mas .wel{padding:96px 26px 70px;max-width:760px;margin:0 auto}
.L-mas .wel .kick{color:var(--acc);margin-bottom:26px;display:flex;gap:12px;align-items:center}
.L-mas .wel .kick:before{content:"";width:28px;height:1px;background:var(--acc)}
.L-mas .big{font-family:var(--fh),serif;font-size:clamp(28px,7.4vw,44px);line-height:1.22;letter-spacing:-.01em}
.L-mas .big .w{opacity:.14;transition:opacity .4s}
.L-mas .big .w.on{opacity:1}
.L-mas .essw{background:var(--ink);color:var(--bg);padding:56px 18px 60px}
.L-mas .essw .in{max-width:760px;margin:0 auto}
.L-mas .essw .kick{opacity:.6;margin:0 6px 20px}
.L-mas .es{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.L-mas .es .ex{color:var(--bg)}
.L-mas .chap{position:relative}
.L-mas .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:#222;z-index:0}
.L-mas .pin img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;will-change:transform}.L-mas .pin img.lo{inset:-3% 0;height:106%}
.L-mas .pin:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35) 100%)}
.L-mas .plab{position:absolute;left:24px;right:24px;top:calc(84px + env(safe-area-inset-top));z-index:2;color:#fff}
.L-mas .plab .no{font-family:var(--fh),serif;font-size:92px;line-height:.8;display:block;opacity:.95;-webkit-text-stroke:1px rgba(255,255,255,.9);color:transparent}
.L-mas .plab h2{font-size:clamp(40px,11vw,74px);line-height:1;margin-top:6px}
.L-mas .body{position:relative;z-index:2;margin-top:-30svh;background:var(--bg);border-radius:30px 30px 0 0;padding:34px 24px 54px;box-shadow:0 -24px 60px rgba(0,0,0,.22)}
.L-mas .body .in{max-width:720px;margin:0 auto}
.L-mas .body:before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-16px auto 18px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -24px 6px;padding:0 24px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 76%;height:min(62vw,420px);object-fit:cover;border-radius:18px;scroll-snap-align:center}
.L-mas .galw{padding:80px 12px 40px;max-width:980px;margin:0 auto}
.L-mas .galw h2{font-size:clamp(40px,11vw,70px);line-height:1;margin:0 12px 30px}
.L-mas .galw h2 em{color:var(--acc)}
.mz{columns:2;column-gap:10px}
.mz .pr{break-inside:avoid;margin-bottom:10px;--pr-r:14px}
.mz img{width:100%;border-radius:14px}

/* =========================== CARNET : app =========================== */
.L-carnet{background:var(--bg)}
.L-carnet .top{padding:calc(76px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(180deg,var(--soft) 0%,var(--soft) 62%,var(--bg) 100%);overflow:hidden}
.stack{position:relative;height:min(118vw,560px);max-width:520px;margin:0 auto}
.stack .c{position:absolute;left:50%;top:6%;width:66%;aspect-ratio:3/4;margin-left:-33%;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px rgba(30,20,40,.28);transition:transform 1.4s var(--ease);background:#ccc}
.stack .c img{width:100%;height:100%;object-fit:cover}
.stack .c1{transform:rotate(0) translate(0,30px) scale(.9);z-index:1}
.stack .c2{transform:rotate(0) translate(0,30px) scale(.9);z-index:2}
.stack .c3{transform:rotate(0) translate(0,20px);z-index:3}
.stack.vis .c1{transform:rotate(-9deg) translate(-27%,6%) scale(.86)}
.stack.vis .c2{transform:rotate(8deg) translate(27%,8%) scale(.86)}
.stack.vis .c3{transform:rotate(-1.5deg) translate(0,0)}
.L-carnet .ttl{padding:6px 24px 0;max-width:640px;margin:0 auto;text-align:center}
.L-carnet .ttl .kick{color:var(--acc)}
.L-carnet .ttl h1{font-size:clamp(46px,13vw,84px);line-height:.98;margin:14px 0 10px}
.L-carnet .ttl .meta{color:var(--mut);font-size:15px}
.L-carnet .lead{font-size:18.5px;line-height:1.6;color:var(--ink2);padding:26px 24px 8px;max-width:640px;margin:0 auto}
.pass{margin:22px 18px 0;max-width:600px;background:var(--card);border-radius:24px;box-shadow:0 20px 50px rgba(30,20,40,.12);position:relative}
@media(min-width:640px){.pass{margin:22px auto 0}}
.pass .tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 20px 18px}
.pass .tp div:last-child{text-align:right}
.pass .tp .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .tp .v{font-family:var(--fh),serif;font-size:clamp(21px,6.2vw,28px);line-height:1.1;margin-top:6px}
.pass .tp .mid{color:var(--acc);width:54px;height:24px}
.pass .tp .mid svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4}
.pass .perf{height:0;border-top:2px dashed var(--line);margin:0 18px;position:relative}
.pass .perf:before,.pass .perf:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.pass .perf:before{left:-30px}.pass .perf:after{right:-30px}
.pass .bt{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pass .bt>div{padding:16px 20px 20px;display:flex;gap:12px;align-items:center}
.pass .bt>div+div{border-left:1px solid var(--line)}
.pass .bt .ico{color:var(--acc)}
.pass .bt .l{font:600 10px/1 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.pass .bt .v{font-weight:600;font-size:14.5px;margin-top:5px;word-break:break-word;line-height:1.3}
.pass .ex{margin:6px 0 0}
.L-carnet .open{display:flex;margin:28px auto 6px;align-items:center;gap:10px;border:0;background:var(--ink);color:var(--bg);padding:16px 24px;border-radius:99px;font:700 14px/1 var(--fb),sans-serif;letter-spacing:.04em;cursor:pointer}
.L-carnet .open .ico{width:18px;height:18px}
.panes{padding:10px 0 0;min-height:100svh}
.pane{display:none;padding:0 16px 40px;max-width:720px;margin:0 auto}
.pane.on{display:block;animation:pin .55s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pane.on.back{animation-name:pinb}
@keyframes pinb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.pban{position:relative;border-radius:26px;overflow:hidden;height:min(108vw,460px);margin:6px 0 18px;color:#fff;--pr-r:26px}
.pban img{width:100%;height:100%;object-fit:cover}
.pban:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)}
.pban .t{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}
.pban .t span{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.85}
.pban .t h2{font-size:clamp(36px,10vw,56px);line-height:1;margin-top:8px}

.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:50;background:rgba(18,16,22,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:flex;padding:7px;gap:2px;max-width:560px;margin:0 auto;transform:translateY(140%);transition:transform .6s var(--ease);box-shadow:0 18px 40px rgba(0,0,0,.3)}

.L-riviera .rwel{max-width:720px;margin:0 auto;padding:80px 24px 30px}
.L-riviera .rwel .kick{color:var(--acc);margin-bottom:22px}

.L-riviera .drop:first-letter{font-family:var(--fh),serif;float:left;font-size:86px;line-height:.82;margin:6px 12px 0 0;color:var(--acc)}
.etab{margin-top:40px;border-top:1px solid var(--ink)}
.etab .r{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.etab .r .l{font:600 10.5px/1.4 var(--fb),sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.etab .r .v{font-family:var(--fh),serif;font-size:24px;line-height:1.2;word-break:break-word}
.etab .r .v small{display:block;font-family:var(--fb),sans-serif;font-size:13px;color:var(--mut);margin-top:3px}
.hs{position:relative;background:var(--bg)}
.hsin{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hsh{display:flex;justify-content:space-between;align-items:baseline;padding:0 24px 22px;max-width:1100px;width:100%;margin:0 auto}
.hsh h2{font-size:clamp(34px,9vw,60px);line-height:1}
.hsh h2 em{color:var(--acc)}
.hsh .cnt{font:600 12px/1 var(--fb),sans-serif;letter-spacing:.2em;color:var(--mut);font-variant-numeric:tabular-nums}
.track{display:flex;gap:14px;padding:0 24px;will-change:transform}
.track figure{flex:0 0 78vw;max-width:560px}
.track figure div{height:min(64svh,520px);border-radius:20px;overflow:hidden}
.track img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.track figcaption{font:600 11px/1 var(--fb),sans-serif;letter-spacing:.22em;color:var(--mut);margin-top:12px}
.toc{max-width:760px;margin:0 auto;padding:40px 20px 70px}
.toc>.kick{color:var(--acc);padding:0 4px 18px}
.row{border-top:1px solid var(--ink)}
.row:last-child{border-bottom:1px solid var(--ink)}
.row>button{width:100%;display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;padding:24px 4px;background:transparent;border:0;text-align:left;cursor:pointer}

.row.on .pl{transform:rotate(45deg);background:var(--ink);color:var(--bg)}
.row .rc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--ease)}

.row .rci{overflow:hidden;padding:0 4px}
.row .rci>.wrap{padding:0 0 26px}
.row .rimg{height:min(60vw,360px);border-radius:18px;overflow:hidden;margin:0 0 8px}

.night{background:var(--ink);color:var(--bg);padding:84px 22px 80px;position:relative;overflow:hidden}
.night .in{max-width:720px;margin:0 auto;position:relative}

.night h2{font-size:clamp(40px,11vw,72px);line-height:1;margin:14px 0 34px}

/* =========================== couche Umbra : offre =========================== */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(130%);transition:transform .6s var(--ease);padding:0 10px calc(10px + var(--sb))}

.btns{display:flex;gap:8px}
.b1{flex:1;border:0;background:#ececf1;color:#0b0b0e;font:700 14px/1 var(--fb),sans-serif;padding:15px;border-radius:13px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.b2{border:1px solid #3a3a44;background:transparent;color:#ececf1;font:600 14px/1 var(--fb),sans-serif;padding:15px 16px;border-radius:13px;cursor:pointer}
#pill{position:fixed;right:14px;bottom:calc(14px + var(--sb));z-index:55;border:0;background:#0b0b0e;color:#fff;font:700 13.5px/1 var(--fb),sans-serif;padding:15px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;display:flex;gap:9px;align-items:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:all .5s var(--ease)}
#pill i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 65% 40%,#0b0b0e 45%,transparent 47%),#d9dbe4}
#pill.on{opacity:1;transform:none;pointer-events:auto}
#offer{position:fixed;inset:0;z-index:80;background:rgba(5,5,8,.55);display:none}

#offer .pn{position:absolute;left:0;right:0;bottom:0;top:7svh;background:#0b0b0e;color:#ececf1;border-radius:24px 24px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 20px 40px;animation:sup .55s var(--ease)}
@keyframes sup{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#offer .x{position:sticky;top:0;float:right;background:#1c1c22;color:#fff;border:0;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
#offer .pn>div{max-width:620px;margin:0 auto}
#offer small.k{letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#8d8f9e}

.val{margin:22px 0 6px}
.val div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #22222a;font-size:15px;color:#d6d7de}
.val div b{color:#fff}
.val span{flex:none;width:26px;height:26px;border-radius:50%;background:#1c1c22;display:flex;align-items:center;justify-content:center;font-size:13px}
.plans{display:grid;gap:12px;margin:22px 0}
.plan{border:1px solid #2a2a33;border-radius:18px;padding:18px;position:relative;background:#111116}
.plan.best{border-color:#d9dbe4;background:#15151b}
.plan .tag{position:absolute;top:-10px;left:16px;background:#ececf1;color:#0b0b0e;font:700 10.5px/1 var(--fb),sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:6px}
.plan h4{font-family:var(--fh),serif;font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan h4 b{font-family:var(--fb),sans-serif;font-size:26px;font-weight:700;color:#fff}
.plan ul{list-style:none;margin:10px 0 14px}
.plan li{font-size:14px;color:#c9cad3;padding:5px 0 5px 22px;position:relative}
.plan li:before{content:"✓";position:absolute;left:0;color:#d9dbe4}
.steps{counter-reset:s;margin:10px 0 18px}
.steps div{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:15px;color:#d6d7de}
.steps div:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #3a3a44;display:flex;align-items:center;justify-content:center;font-size:13px}
.guar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 22px}
.guar div{background:#15151b;border-radius:12px;padding:12px;font-size:12.5px;color:#c9cad3;text-align:center;line-height:1.35}
.guar b{display:block;color:#fff;font-size:14px;margin-bottom:4px}
details{border-bottom:1px solid #22222a;padding:14px 0}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
summary::-webkit-details-marker{display:none}
details p{color:#b9bac6;font-size:14.5px;margin-top:8px}
.legal{font-size:12px;color:#7c7e8c;margin-top:26px;text-align:center}
.legal a{color:#a9abb8;text-decoration:underline}
h3.pt{font-family:var(--fh),serif;font-weight:400;font-size:22px;margin:26px 0 6px}

/* =========================== blocs v3 : services, taxe, terroir, agenda =========================== */
sup{font-size:.62em;line-height:0;vertical-align:.45em}
.svc{display:grid}
.sv{display:grid;grid-template-columns:40px 1fr auto 20px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sv:last-child{border-bottom:0}

.txu{font-size:15px;color:var(--ink2);line-height:1.35;max-width:13em;padding-bottom:4px}
.txt .r b{font-weight:500;color:var(--ink2)}

.txm{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 2px;border-top:1px solid var(--line)}

.txm dt{font-size:11.5px;color:var(--mut);line-height:1.3}
.txm dd{font-size:14.5px;font-weight:600;line-height:1.35;margin-top:3px}
.tax .txx,.tax .txw{font-size:14px;margin-top:12px;line-height:1.55}
.tax .txx b{color:var(--ink);font-weight:600}
.txof{font-size:13.5px;color:var(--mut);margin-top:12px;font-variant-numeric:tabular-nums}
.txof span{font-weight:600;color:var(--ink2);margin-right:8px}
.ter .tr{padding:15px 0;border-bottom:1px solid var(--line)}

.ter .th{display:flex;justify-content:space-between;align-items:baseline;gap:14px}

.ter .th span{font-size:13px;color:var(--acc);font-style:italic;text-align:right;flex:none;max-width:45%}
.ter .tr p{font-size:15px;margin-top:4px;line-height:1.5}
.ag{list-style:none;position:relative;margin-top:10px;padding-left:24px}

.ag .w{display:block;font-size:13px;font-weight:600;color:var(--acc)}
.ag b{display:block;font-family:var(--fh),serif;font-weight:400;font-size:21px;line-height:1.25;margin-top:2px}
.ag p{font-size:15px;margin-top:3px;color:var(--ink2);line-height:1.5}
.night .ter .tr{border-color:rgba(255,255,255,.12)}

.sos b{white-space:nowrap;font-variant-numeric:lining-nums}.sos b.lg{font-size:20px;line-height:1.5}
@media(min-width:760px){.txm{grid-template-columns:1.3fr 1fr 1fr}.txm div:first-child{grid-column:auto}.txm div+div{padding-left:14px;border-left:1px solid var(--line)}}

ocales sur l'hébergement s'ajoutent au prix de la chambre. Réservé sur Airbnb ou Vrbo ? La plateforme les perçoit en général pour vous.", "c5": "Départ", "out_t": "Avant de partir", "out": ["Clés dans la boîte à clés ou à l'endroit convenu", "Fenêtres fermées, portes verrouillées", "Thermostat baissé, lumières éteintes", "Vaisselle faite ou lave-vaisselle lancé", "Poubelles et recyclage dans les bacs extérieurs", "Rien d'oublié : chargeurs, frigo, salle de bains"], "thanks": "Merci d'avoir séjourné chez nous ! Un avis sur Google ou sur le site où vous avez réservé nous aide énormément.", "gallery": "En images", "ex": "à compléter", "made": "Préparé par Umbra Agency pour {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen bei {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Tipps. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 15 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Wegbeschreibung schicken wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi auf den letzten Meilen manchmal: Folgen Sie unserer Beschreibung und laden Sie Offline-Karten herunter, falls der Mobilfunkempfang abbricht.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, dann richten wir den Self-Check-in ein (Schlüsselbox oder Zahlenschloss).", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht, auch keine E-Zigaretten.", "Nachtruhe von 22 bis 8 Uhr: Geräusche tragen hier weit.", "Keine Partys oder Veranstaltungen und nicht mehr Gäste als in der Buchung angegeben.", "Beim Hinausgehen bitte Türen abschließen und Fenster schließen."], "pets": "Haustiere: auf Anfrage, bitte vor der Buchung fragen.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, etwa 74 °F (23 °C) genügen, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 8 bis 21 Uhr.", "Kein Bademeister: Kinder nur unter ständiger Aufsicht eines Erwachsenen.", "Vor dem Schwimmen duschen, kein Glas im Poolbereich."], "tub_t": "Der Whirlpool", "tub": ["Nicht länger als etwa 15 Minuten am Stück baden und viel Wasser trinken.", "Nicht empfohlen für kleine Kinder und in der Schwangerschaft; Kinder nur mit einem Erwachsenen.", "Kein Glas, und bitte die Abdeckung nach dem Baden wieder auflegen."], "bf_t": "Frühstück", "bf": "Von 8 bis 10 Uhr, mit Zutaten aus der Region. Allergien bitte am Vortag mitteilen.", "table_t": "Abendessen", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Anwendungen auf Anfrage: Fragen Sie uns nach einem Termin.", "safe_t": "Sicherheit", "safe": "Im ganzen Haus sind Rauch- und Kohlenmonoxidmelder installiert. Feuerlöscher und Erste-Hilfe-Kasten finden Sie in der Küche. Im Notfall zuerst alle nach draußen bringen, dann 911 anrufen.", "trash_t": "Müll und Recycling", "trash": "Müll und Wertstoffe kommen in die Tonnen, die wir Ihnen zeigen. Behälter ausspülen und keine Plastiktüten in den Recyclingmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Bauernmärkte", "market_n": "Tage und Saison ohne Gewähr: bitte vorher prüfen.", "maps": "Route", "c4": "Praktische Tipps", "seas_t": "Das Wetter", "seas": "Vor Ausflügen den Wetterbericht prüfen: Das Wetter kann schnell umschlagen, vor allem in den Bergen und an der Küste.", "sea_t": "Der Ozean", "sea": "Nur an bewachten Stränden baden und die Flaggen beachten. In einer Rippströmung? Nicht dagegen anschwimmen: parallel zum Ufer schwimmen, dann zurück an Land.", "sos_t": "Notfälle", "sos": [["911", "Polizei, Feuerwehr, Rettungsdienst"], ["1-800-222-1222", "Giftnotruf (Poison Control)"], ["988", "Krisen- und Suizid-Hotline"]], "tax_t": "Beherbergungssteuer", "tax": "Staatliche und lokale Steuern auf Übernachtungen kommen zum Zimmerpreis hinzu. Über Airbnb oder Vrbo gebucht? Dann zieht sie meist die Plattform für Sie ein.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel in der Schlüsselbox oder am vereinbarten Ort", "Fenster zu, Türen abgeschlossen", "Thermostat heruntergedreht, Licht aus", "Geschirr gespült oder Spülmaschine an", "Müll und Recycling in die Tonnen draußen", "Nichts vergessen: Ladegeräte, Kühlschrank, Bad"], "thanks": "Danke für Ihren Aufenthalt! Eine Bewertung bei Google oder dort, wo Sie gebucht haben, hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Erstellt von Umbra Agency für {n}"}};
var R={"NAV4": {"en": "Blue Ridge & Smokies tips", "es": "Consejos Blue Ridge y Smokies", "fr": "Blue Ridge & Smokies pratique", "de": "Blue-Ridge- & Smokies-Tipps"}, "RULES": {"en": ["Overnight guests are limited to the number on your booking – local permits and our septic system depend on it. No parties or events.", "Quiet hours 10 pm – 7 am: sound carries a long way in mountain coves, and local noise ordinances apply.", "This is bear country: trash goes in the bear-resistant bin (or stays indoors until pickup), and never leave food, coolers or a greasy grill outside.", "Fires only in the fire pit or grill provided – never during a burn ban, never unattended – and no fireworks or sky lanterns.", "Park only in the spaces on the property, never on the road shoulder, a neighbor’s drive or a gravel turnout.", "Smoke and CO alarms, extinguishers and exits are part of our safety inspection: please never cover, unplug or block them."], "es": ["El número de huéspedes que pernoctan se limita al de su reserva: de ello dependen los permisos locales y nuestra fosa séptica. No se permiten fiestas ni eventos.", "Silencio de 22:00 a 7:00: en los valles de montaña el sonido llega muy lejos y rigen las ordenanzas locales sobre ruido.", "Estamos en tierra de osos: la basura va al contenedor a prueba de osos (o se queda dentro hasta el día de recogida); nunca deje comida, neveras portátiles ni una parrilla grasienta fuera.", "Fuego solo en el fogón o la parrilla previstos, nunca durante una prohibición de quemas ni sin vigilancia, y nada de fuegos artificiales ni farolillos voladores.", "Aparque solo en las plazas de la propiedad, nunca en el arcén, en la entrada de un vecino ni en un apartadero de grava.", "Los detectores de humo y de CO, los extintores y las salidas forman parte de nuestra inspección de seguridad: no los tape, desconecte ni bloquee nunca."], "fr": ["Le nombre de voyageurs qui dorment sur place est limité à celui de votre réservation : nos permis et notre fosse septique en dépendent. Ni fêtes ni événements.", "Calme de 22 h à 7 h : dans les vallons de montagne, le son porte très loin, et les arrêtés locaux sur le bruit s’appliquent.", "Nous sommes au pays des ours : les déchets vont dans le bac anti-ours (ou restent à l’intérieur jusqu’au ramassage), et ne laissez jamais dehors nourriture, glacière ou barbecue gras.", "Feu uniquement dans le foyer extérieur ou le barbecue prévus, jamais en période d’interdiction, jamais sans surveillance, et ni feux d’artifice ni lanternes célestes.", "Garez-vous uniquement sur les places de la propriété, jamais sur l’accotement, devant l’allée d’un voisin ou sur un dégagement de gravier.", "Détecteurs de fumée et de CO, extincteurs et sorties font partie de notre inspection de sécurité : ne les couvrez, ne les débranchez et ne les bloquez jamais."], "de": ["Übernachten dürfen nur so viele Gäste wie gebucht – davon hängen die örtlichen Genehmigungen und unsere Klärgrube ab. Keine Partys oder Veranstaltungen.", "Nachtruhe von 22 bis 7 Uhr: In Bergtälern trägt der Schall sehr weit, und es gelten die örtlichen Lärmschutzverordnungen.", "Hier leben Bären: Müll gehört in die bärensichere Tonne (oder bleibt bis zum Abholtag im Haus), und lassen Sie nie Essen, Kühlboxen oder einen fettigen Grill draußen.", "Feuer nur in der vorgesehenen Feuerstelle oder im Grill – nie bei Feuerverbot, nie unbeaufsichtigt – und kein Feuerwerk, keine Himmelslaternen.", "Parken Sie nur auf den Stellplätzen des Grundstücks, nie am Straßenrand, in der Einfahrt der Nachbarn oder in einer Schotterausweiche.", "Rauch- und CO-Melder, Feuerlöscher und Notausgänge gehören zu unserer Sicherheitsinspektion: bitte nie abdecken, ausstecken oder zustellen."]}, "HOUSE": {"en": [{"ic": "fire", "h": "Heating, cooling & the fireplace", "p": "Mountain nights are cool even in summer and cold from October to April. Keep the thermostat between 65 and 72 °F and close windows while the heat or AC is running. Wood stove or fireplace: we’ll show you how it works. Open the damper before lighting, burn only the dry firewood provided (no trash or wrapping paper), keep the screen closed, and put ashes in the metal bucket outside, away from the deck – never in the trash. Gas logs: if you smell gas, switch them off, leave the house and call <b>911<\/b>."}, {"ic": "leaf", "h": "Well water & septic", "p": "Many mountain homes run on a private <b>well<\/b> and a <b>septic system<\/b>: only toilet paper down the toilet – no wipes (even ‘flushable’ ones), sanitary products, grease or cooking oil. Short showers spare both the well and the septic. The well pump needs electricity, so during a power cut the taps may stop too. If the house uses well water, we’ll tell you whether to drink it from the tap or use the filtered or bottled water provided."}, {"ic": "bin", "h": "Trash, recycling & bears", "ul": ["Black bears live here and have a superb sense of smell: never leave trash, food or coolers outside, on the porch or in the car.", "Use the bear-resistant bin and close every latch, every time.", "Put trash out only on the morning of pickup – or take it to the county convenience center (transfer station) if there is no curbside service; we’ll tell you which.", "Recycling: rinsed cans, plastic bottles and jugs, flattened cardboard and paper; glass is accepted in some counties only.", "Clean the grill after use and close the lid: grease draws bears.", "Please don’t put out bird feeders or any food for wildlife – a fed bear is a doomed bear."]}, {"ic": "sos", "h": "Smoke & CO alarms, exits", "p": "There are smoke alarms in and outside the bedrooms and on every level, plus carbon-monoxide (CO) alarms near the sleeping areas: never unplug or cover them. If an alarm sounds, get everyone out first, then call <b>911<\/b>. We’ll show you the fire extinguisher and first-aid kit at check-in; the exit routes are posted on each level. Never use a generator, grill or propane heater indoors, on a covered porch or in the garage."}, {"ic": "home", "h": "Quiet hours & neighbors", "p": "Sound carries in mountain coves: please keep voices and music down outdoors after 10 pm, and close the hot-tub cover when you’re not using it (it keeps the water hot, too). Many neighbors are full-time residents. Respect private roads and land, leave gates as you found them, and don’t use drones over neighboring homes."}, {"ic": "car", "h": "Parking & winter driveways", "p": "Park only in the marked spaces. Mountain driveways can be steep, narrow and gravelled: drive slowly and use a low gear going down. In snow or ice, don’t attempt a steep drive without four-wheel drive and good tires; we’ll tell you how and when the road is plowed. Never stop on a blind curve to admire the view – use the overlooks."}], "es": [{"ic": "fire", "h": "Calefacción, aire acondicionado y chimenea", "p": "Las noches de montaña son frescas incluso en verano y frías de octubre a abril. Mantenga el termostato entre 65 y 72 °F (18–22 °C) y cierre las ventanas con la calefacción o el aire en marcha. Estufa de leña o chimenea: le explicamos su uso. Abra el tiro antes de encenderla, queme solo la leña seca que le dejamos (ni basura ni papel de regalo), mantenga la rejilla cerrada y eche la ceniza en el cubo metálico exterior, lejos de la terraza, nunca en la basura. Leños de gas: si huele a gas, apáguelos, salga de la casa y llame al <b>911<\/b>."}, {"ic": "leaf", "h": "Agua de pozo y fosa séptica", "p": "Muchas casas de montaña tienen <b>pozo<\/b> propio y <b>fosa séptica<\/b>: al inodoro solo papel higiénico, ni toallitas (aunque digan «desechables»), ni compresas, ni grasa ni aceite. Las duchas cortas cuidan el pozo y la fosa. La bomba del pozo funciona con electricidad: si se va la luz, también puede cortarse el agua. Si la casa usa agua de pozo, le diremos si puede beberla del grifo o si debe usar el agua filtrada o embotellada que le dejamos."}, {"ic": "bin", "h": "Basura, reciclaje y osos", "ul": ["Aquí viven osos negros con un olfato excelente: no deje nunca basura, comida ni neveras portátiles fuera, en el porche ni en el coche.", "Use el contenedor a prueba de osos y cierre todos los pestillos, siempre.", "Saque la basura solo la mañana de la recogida, o llévela al punto limpio del condado (convenience center) si no hay recogida a domicilio; le diremos cuál es el caso.", "Reciclaje: latas enjuagadas, botellas y garrafas de plástico, cartón plegado y papel; el vidrio solo se acepta en algunos condados.", "Limpie la parrilla después de usarla y cierre la tapa: la grasa atrae a los osos.", "No ponga comederos para pájaros ni comida para la fauna: un oso alimentado es un oso condenado."]}, {"ic": "sos", "h": "Detectores de humo y CO, salidas", "p": "Hay detectores de humo dentro y fuera de los dormitorios y en cada planta, y detectores de monóxido de carbono (CO) cerca de las zonas de descanso: no los desconecte ni los tape nunca. Si suena una alarma, saque primero a todo el mundo y después llame al <b>911<\/b>. A la llegada le enseñamos el extintor y el botiquín; las vías de evacuación están indicadas en cada planta. No use nunca un generador, una parrilla ni un calefactor de propano dentro de casa, en un porche cubierto ni en el garaje."}, {"ic": "home", "h": "Descanso y vecinos", "p": "En los valles de montaña el sonido viaja: baje la voz y la música en el exterior a partir de las 22:00, y cierre la tapa del jacuzzi cuando no lo use (así además conserva el calor). Muchos vecinos viven aquí todo el año. Respete los caminos y terrenos privados, deje las cancelas como las encontró y no vuele drones sobre las casas vecinas."}, {"ic": "car", "h": "Aparcamiento y accesos en invierno", "p": "Aparque solo en las plazas señaladas. Los caminos de acceso en la montaña pueden ser empinados, estrechos y de grava: conduzca despacio y baje con una marcha corta. Con nieve o hielo, no intente subir una pendiente fuerte sin tracción a las cuatro ruedas y buenos neumáticos; le diremos cómo y cuándo se quita la nieve del camino. No se detenga nunca en una curva sin visibilidad para mirar el paisaje: use los miradores."}], "fr": [{"ic": "fire", "h": "Chauffage, climatisation & cheminée", "p": "En montagne, les nuits sont fraîches même l’été et froides d’octobre à avril. Réglez le thermostat entre 65 et 72 °F (18–22 °C) et fermez les fenêtres quand le chauffage ou la clim fonctionne. Poêle à bois ou cheminée : nous vous montrons comment faire. Ouvrez le conduit avant d’allumer, ne brûlez que le bois sec fourni (ni déchets ni papier cadeau), gardez le pare-feu fermé, et videz les cendres dans le seau métallique dehors, loin de la terrasse – jamais à la poubelle. Bûches à gaz : si vous sentez le gaz, coupez-les, sortez et appelez le <b>911<\/b>."}, {"ic": "leaf", "h": "Eau de puits & fosse septique", "p": "Beaucoup de maisons de montagne ont leur propre <b>puits<\/b> et une <b>fosse septique<\/b> : uniquement du papier toilette dans les WC – ni lingettes (même « jetables »), ni protections, ni graisse ni huile. Des douches courtes ménagent le puits comme la fosse. La pompe du puits fonctionne à l’électricité : en cas de coupure, l’eau peut aussi s’arrêter. Si la maison est alimentée par un puits, nous vous dirons si l’eau du robinet se boit ou s’il faut utiliser l’eau filtrée ou en bouteille fournie."}, {"ic": "bin", "h": "Déchets, recyclage & ours", "ul": ["Des ours noirs vivent ici et ont un odorat exceptionnel : ne laissez jamais déchets, nourriture ou glacière dehors, sur le porche ou dans la voiture.", "Utilisez le bac anti-ours et fermez tous les loquets, à chaque fois.", "Sortez les déchets seulement le matin du ramassage, ou portez-les à la déchetterie du comté (convenience center) s’il n’y a pas de collecte ; nous vous dirons ce qu’il en est.", "Recyclage : canettes rincées, bouteilles et bidons en plastique, cartons aplatis et papier ; le verre n’est accepté que dans certains comtés.", "Nettoyez le barbecue après usage et refermez le couvercle : la graisse attire les ours.", "Pas de mangeoires à oiseaux ni de nourriture pour les animaux : un ours nourri est un ours condamné."]}, {"ic": "sos", "h": "Détecteurs de fumée & de CO, sorties", "p": "Des détecteurs de fumée équipent l’intérieur et les abords des chambres ainsi que chaque niveau, et des détecteurs de monoxyde de carbone (CO) se trouvent près des chambres : ne les débranchez ni ne les couvrez jamais. Si une alarme sonne, faites d’abord sortir tout le monde, puis appelez le <b>911<\/b>. Extincteur et trousse de secours vous sont montrés à l’arrivée ; les itinéraires d’évacuation sont affichés à chaque niveau. N’utilisez jamais de groupe électrogène, de barbecue ou de chauffage au propane à l’intérieur, sous un porche couvert ou dans le garage."}, {"ic": "home", "h": "Calme & voisinage", "p": "Le son porte dans les vallons : baissez la voix et la musique dehors après 22 h, et refermez le couvercle du spa quand vous ne l’utilisez pas (l’eau reste chaude, en prime). Beaucoup de voisins vivent ici à l’année. Respectez chemins et terrains privés, laissez les barrières comme vous les avez trouvées et ne faites pas voler de drone au-dessus des maisons voisines."}, {"ic": "car", "h": "Stationnement & allées en hiver", "p": "Garez-vous uniquement sur les emplacements prévus. Les allées de montagne peuvent être raides, étroites et gravillonnées : roulez doucement et descendez en rapport court. Par neige ou verglas, ne vous engagez pas dans une pente raide sans quatre roues motrices et de bons pneus ; nous vous dirons comment et quand la route est déneigée. Ne vous arrêtez jamais dans un virage sans visibilité pour admirer la vue : utilisez les belvédères."}], "de": [{"ic": "fire", "h": "Heizung, Klimaanlage & Kamin", "p": "Bergnächte sind selbst im Sommer kühl und von Oktober bis April kalt. Stellen Sie den Thermostat auf 65 bis 72 °F (18–22 °C) und schließen Sie die Fenster, wenn Heizung oder Klimaanlage laufen. Holzofen oder Kamin: Wir erklären Ihnen alles. Vor dem Anzünden die Klappe öffnen, nur das bereitgestellte trockene Holz verbrennen (keinen Müll, kein Geschenkpapier), das Schutzgitter geschlossen halten und die Asche in den Metalleimer draußen geben, weit weg von der Terrasse – nie in den Müll. Gaskamin: Bei Gasgeruch abschalten, das Haus verlassen und <b>911<\/b> anrufen."}, {"ic": "leaf", "h": "Brunnenwasser & Klärgrube", "p": "Viele Berghäuser haben einen eigenen <b>Brunnen<\/b> und eine <b>Klärgrube<\/b>: nur Toilettenpapier in die Toilette – keine Feuchttücher (auch keine „spülbaren“), Hygieneartikel, Fett oder Speiseöl. Kurzes Duschen schont Brunnen und Klärgrube. Die Brunnenpumpe braucht Strom: Bei einem Stromausfall kann auch das Wasser ausfallen. Hat das Haus Brunnenwasser, sagen wir Ihnen, ob Sie es aus dem Hahn trinken können oder das bereitgestellte gefilterte bzw. abgefüllte Wasser nehmen sollten."}, {"ic": "bin", "h": "Müll, Recycling & Bären", "ul": ["Hier leben Schwarzbären mit einem hervorragenden Geruchssinn: Lassen Sie nie Müll, Essen oder Kühlboxen draußen, auf der Veranda oder im Auto.", "Nutzen Sie die bärensichere Tonne und schließen Sie jedes Mal alle Verriegelungen.", "Müll erst am Morgen des Abholtags hinausstellen – oder zum Wertstoffhof des Countys (Convenience Center) bringen, falls es keine Abholung gibt; wir sagen Ihnen, was gilt.", "Recycling: ausgespülte Dosen, Plastikflaschen und -kanister, flach gefaltete Kartons und Papier; Glas nehmen nur manche Countys an.", "Den Grill nach dem Benutzen reinigen und den Deckel schließen: Fett lockt Bären an.", "Bitte keine Vogelhäuschen aufhängen und keine Tiere füttern – ein gefütterter Bär ist ein verlorener Bär."]}, {"ic": "sos", "h": "Rauch- & CO-Melder, Fluchtwege", "p": "In und vor den Schlafzimmern sowie auf jeder Etage hängen Rauchmelder, dazu Kohlenmonoxid-Melder (CO) nahe den Schlafräumen: nie ausstecken oder abdecken. Wenn ein Alarm ertönt, bringen Sie zuerst alle nach draußen und rufen dann <b>911<\/b> an. Feuerlöscher und Erste-Hilfe-Set zeigen wir Ihnen bei der Ankunft; die Fluchtwege hängen auf jeder Etage aus. Nie einen Generator, Grill oder Propan-Heizstrahler im Haus, auf einer überdachten Veranda oder in der Garage betreiben."}, {"ic": "home", "h": "Nachtruhe & Nachbarn", "p": "In Bergtälern trägt der Schall weit: Bitte nach 22 Uhr draußen leise sprechen und die Musik leiser stellen, und den Whirlpool abdecken, wenn er nicht genutzt wird (so bleibt das Wasser auch warm). Viele Nachbarn wohnen ganzjährig hier. Respektieren Sie Privatwege und -grundstücke, lassen Sie Tore so, wie Sie sie vorgefunden haben, und fliegen Sie keine Drohnen über Nachbarhäuser."}, {"ic": "car", "h": "Parken & Zufahrten im Winter", "p": "Parken Sie nur auf den markierten Plätzen. Zufahrten in den Bergen können steil, schmal und geschottert sein: langsam fahren und bergab einen kleinen Gang nutzen. Bei Schnee oder Eis keine steile Zufahrt ohne Allradantrieb und gute Reifen versuchen; wir sagen Ihnen, wie und wann geräumt wird. Halten Sie nie in einer unübersichtlichen Kurve, um die Aussicht zu genießen – nutzen Sie die Aussichtspunkte (Overlooks)."}]}, "PRAT": {"en": [{"ic": "sun", "h": "Mountain weather", "p": "Four real seasons: spring wildflowers in April and May, summer highs in the 80s °F with afternoon thunderstorms, fall color from early October on the peaks to early November in the valleys, and winters with snow and ice at elevation. It gets roughly 3–5 °F cooler for every 1,000 ft you climb, so pack layers and a rain jacket even in July. In October, leaf-peeping traffic is heavy at weekends: set off early."}, {"ic": "sos", "h": "After Helene: check before you go", "al": 1, "p": "Hurricane Helene (September 2024) caused historic flooding across western North Carolina and east Tennessee. Most roads, the Blue Ridge Parkway and the parks have reopened, but some trails, campgrounds and facilities are still closed and repair work brings lane closures. Before each outing, check the NPS road-status pages for the Parkway and the Smokies, and dial <b>511<\/b> (DriveNC.gov, TN SmartWay, 511 Virginia). Never go past a gate or barricade. In heavy rain, never drive or walk into a flooded road: turn around."}, {"ic": "bug", "h": "Bears, elk & other wildlife", "al": 1, "p": "Black bears are common. In the national parks it is illegal to approach within 50 yards (150 ft) of a bear or an elk, or to disturb one at any distance. If a bear comes toward you, stand tall, make noise and back away slowly – never run – and never feed wildlife. Elk graze around Cataloochee and Oconaluftee: give them a wide berth, above all during the fall rut. Check for ticks after a walk, and watch for copperheads and rattlesnakes on warm rocks. Hunting seasons run through fall and early winter in the national forests (not in the national parks): wear something bright orange on forest trails."}, {"ic": "park", "h": "Park fees & passes", "p": "Great Smoky Mountains National Park has no entrance fee, but any vehicle parked for more than 15 minutes needs a <b>Park It Forward<\/b> parking tag: $5 a day, $15 a week or $40 a year, sold on Recreation.gov and at visitor centers. America the Beautiful passes don’t replace it. The Blue Ridge Parkway is free. Shenandoah National Park charges $30 per vehicle for 7 days; non-US residents pay $250 for the annual America the Beautiful pass. Some hikes, such as Old Rag, also need a timed ticket."}, {"ic": "car", "h": "Mountain roads & winter", "p": "On the Parkway the limit is 45 mph or less and there are no gas stations: fill up first. Sections are gated in snow, ice or fog; Newfound Gap Road (US-441) can close in winter storms, the Kuwohi road is closed from December 1 to March 31, and Roaring Fork closes for the winter. GPS apps sometimes send cars up steep gravel roads: stay on paved routes. Use a low gear on long descents to save your brakes, and watch for deer and bears at dawn and dusk. Cell signal drops in many valleys and across much of the parks: download offline maps before you leave."}, {"ic": "sea", "h": "Waterfalls & rivers", "al": 1, "p": "Waterfalls are beautiful and dangerous: every year people die after climbing on the rocks at the top or along the edges. Stay on the trail and behind the railings, and never climb on or above a waterfall – wet rock and moss are as slick as ice. Rivers can rise within minutes after a storm upstream: get out if the water turns muddy or starts to rise. Swim only where locals do, and never jump in without knowing the depth."}, {"ic": "fire", "h": "Fire & burn bans", "p": "Wildfire danger peaks in fall and early spring. The NC Forest Service and the Tennessee Division of Forestry declare burn bans: while one is in force, no outdoor fires at all, fire pits included. Never leave a fire unattended, drown it until it is cold to the touch, and never throw a cigarette from a car. Fireworks are banned in the national parks and in many towns: leave them at home."}, {"ic": "coins", "h": "Tipping, hours & paying", "p": "Tipping is expected: 18–20 % at sit-down restaurants, $1–2 per drink at the bar, and a similar share for tour and rafting guides. Sales tax is added at the register, so shelf prices don’t include it. In small towns many restaurants close early, and some close on Mondays or Tuesdays in winter: book ahead at weekends and in October. Cards are taken almost everywhere, but carry some cash for farmers markets and roadside stands."}], "es": [{"ic": "sun", "h": "El tiempo en la montaña", "p": "Cuatro estaciones de verdad: flores silvestres en abril y mayo; veranos con máximas de 80–89 °F (27–32 °C) y tormentas por la tarde; colores de otoño desde principios de octubre en las cumbres hasta principios de noviembre en los valles; e inviernos con nieve y hielo en altura. La temperatura baja unos 2–3 °C cada 300 m de subida: traiga capas y chubasquero incluso en julio. En octubre, los fines de semana hay mucho tráfico para ver las hojas: salga temprano."}, {"ic": "sos", "h": "Tras Helene: infórmese antes de salir", "al": 1, "p": "El huracán Helene (septiembre de 2024) provocó inundaciones históricas en el oeste de Carolina del Norte y el este de Tennessee. La mayoría de las carreteras, la Blue Ridge Parkway y los parques han reabierto, pero algunos senderos, campings e instalaciones siguen cerrados y las obras obligan a cortar carriles. Antes de cada salida, consulte las páginas de estado de carreteras del NPS para la Parkway y las Smokies, y marque el <b>511<\/b> (DriveNC.gov, TN SmartWay, 511 Virginia). No pase nunca una barrera o un cierre. Con lluvias fuertes, no entre jamás en una carretera inundada, ni en coche ni a pie: dé la vuelta."}, {"ic": "bug", "h": "Osos, alces y otra fauna", "al": 1, "p": "Los osos negros son frecuentes. En los parques nacionales es ilegal acercarse a menos de 50 yardas (46 m) de un oso o un alce (wapití), o molestarlo a cualquier distancia. Si un oso se acerca, póngase erguido, haga ruido y retroceda despacio – nunca corra – y no alimente jamás a los animales. Los alces pastan en Cataloochee y Oconaluftee: guarde mucha distancia, sobre todo durante la berrea de otoño. Revísese por si tiene garrapatas tras cada paseo y cuidado con las serpientes cabeza de cobre y de cascabel sobre las rocas calientes. En otoño y principios de invierno hay temporada de caza en los bosques nacionales (no en los parques nacionales): lleve algo de color naranja vivo en los senderos forestales."}, {"ic": "park", "h": "Tasas y pases de los parques", "p": "El parque nacional Great Smoky Mountains no cobra entrada, pero todo vehículo aparcado más de 15 minutos necesita la etiqueta de aparcamiento <b>Park It Forward<\/b>: 5 $ al día, 15 $ a la semana o 40 $ al año, a la venta en Recreation.gov y en los centros de visitantes. El pase America the Beautiful no la sustituye. La Blue Ridge Parkway es gratuita. El parque nacional de Shenandoah cobra 30 $ por vehículo para 7 días; los no residentes en EE. UU. pagan 250 $ por el pase anual America the Beautiful. Algunas rutas, como Old Rag, exigen además un billete con horario."}, {"ic": "car", "h": "Carreteras de montaña e invierno", "p": "En la Parkway el límite es de 45 mph (72 km/h) o menos y no hay gasolineras: llene el depósito antes. Algunos tramos se cierran con nieve, hielo o niebla; la Newfound Gap Road (US-441) puede cerrarse con temporales, la carretera de Kuwohi está cerrada del 1 de diciembre al 31 de marzo y Roaring Fork cierra en invierno. A veces el GPS manda los coches por pistas de grava empinadas: siga las carreteras asfaltadas. Use una marcha corta en las bajadas largas para no castigar los frenos, y atención a ciervos y osos al amanecer y al anochecer. En muchos valles y en gran parte de los parques no hay cobertura: descargue mapas sin conexión antes de salir."}, {"ic": "sea", "h": "Cascadas y ríos", "al": 1, "p": "Las cascadas son preciosas y peligrosas: cada año muere gente por trepar a las rocas de lo alto o de los bordes. Siga el sendero, quédese detrás de las barandillas y no suba nunca sobre una cascada ni por encima de ella: la roca mojada y el musgo resbalan como el hielo. Los ríos pueden crecer en minutos tras una tormenta aguas arriba: salga del agua si se enturbia o empieza a subir. Báñese solo donde se bañan los locales y no salte nunca sin conocer la profundidad."}, {"ic": "fire", "h": "Fuego y prohibiciones de quema", "p": "El riesgo de incendio forestal es máximo en otoño y a principios de primavera. El NC Forest Service y la Tennessee Division of Forestry decretan prohibiciones de quema: mientras estén vigentes, nada de fuego al aire libre, tampoco en los fogones. No deje nunca un fuego sin vigilancia, apáguelo con agua hasta que esté frío al tacto y no tire jamás una colilla desde el coche. Los fuegos artificiales están prohibidos en los parques nacionales y en muchos municipios: déjelos en casa."}, {"ic": "coins", "h": "Propinas, horarios y pagos", "p": "La propina es obligada en la práctica: 18–20 % en restaurantes con servicio de mesa, 1–2 $ por bebida en la barra y algo similar para guías de excursiones y de rafting. El impuesto sobre las ventas se añade en caja: los precios expuestos no lo incluyen. En los pueblos, muchos restaurantes cierran pronto y algunos cierran lunes o martes en invierno: reserve los fines de semana y en octubre. Se aceptan tarjetas casi en todas partes, pero lleve algo de efectivo para los mercados y puestos de carretera."}], "fr": [{"ic": "sun", "h": "La météo en montagne", "p": "Quatre vraies saisons : fleurs sauvages en avril et mai ; étés à 80–89 °F (27–32 °C) avec des orages l’après-midi ; couleurs d’automne dès début octobre sur les sommets et jusqu’à début novembre dans les vallées ; hivers avec neige et verglas en altitude. On perd environ 2 à 3 °C tous les 300 m : prévoyez plusieurs couches et un imperméable, même en juillet. En octobre, la circulation des amateurs de feuillages est dense le week-end : partez tôt."}, {"ic": "sos", "h": "Après Helene : renseignez-vous avant de partir", "al": 1, "p": "L’ouragan Helene (septembre 2024) a provoqué des inondations historiques dans l’ouest de la Caroline du Nord et l’est du Tennessee. La plupart des routes, la Blue Ridge Parkway et les parcs ont rouvert, mais certains sentiers, campings et équipements restent fermés et des travaux imposent des fermetures de voies. Avant chaque sortie, consultez les pages d’état des routes du NPS pour la Parkway et les Smokies, et composez le <b>511<\/b> (DriveNC.gov, TN SmartWay, 511 Virginia). Ne franchissez jamais une barrière ou un barrage. Par fortes pluies, ne vous engagez jamais sur une route inondée, ni en voiture ni à pied : faites demi-tour."}, {"ic": "bug", "h": "Ours, wapitis & autres animaux", "al": 1, "p": "Les ours noirs sont nombreux. Dans les parcs nationaux, il est interdit de s’approcher à moins de 50 yards (46 m) d’un ours ou d’un wapiti, ou de le déranger à quelque distance que ce soit. Si un ours s’avance vers vous, redressez-vous, faites du bruit et reculez lentement – ne courez jamais – et ne nourrissez jamais les animaux. Les wapitis paissent autour de Cataloochee et d’Oconaluftee : gardez vos distances, surtout pendant le brame d’automne. Vérifiez l’absence de tiques après chaque balade et gare aux serpents (mocassins à tête cuivrée, crotales) sur les rochers chauds. La chasse est ouverte en automne et au début de l’hiver dans les forêts nationales (pas dans les parcs nationaux) : portez une touche d’orange vif sur les sentiers forestiers."}, {"ic": "park", "h": "Droits d’accès & pass", "p": "Le parc national des Great Smoky Mountains n’a pas de droit d’entrée, mais tout véhicule garé plus de 15 minutes doit afficher la vignette de stationnement <b>Park It Forward<\/b> : 5 $ la journée, 15 $ la semaine ou 40 $ l’année, en vente sur Recreation.gov et dans les centres d’accueil. Le pass America the Beautiful ne la remplace pas. La Blue Ridge Parkway est gratuite. Le parc national de Shenandoah coûte 30 $ par véhicule pour 7 jours ; les non-résidents des États-Unis paient 250 $ le pass annuel America the Beautiful. Certaines randonnées, comme Old Rag, exigent aussi un billet horaire."}, {"ic": "car", "h": "Routes de montagne & hiver", "p": "Sur la Parkway, la vitesse est limitée à 45 mph (72 km/h) ou moins et il n’y a aucune station-service : faites le plein avant. Des tronçons sont fermés par neige, verglas ou brouillard ; la Newfound Gap Road (US-441) peut fermer lors des tempêtes d’hiver, la route de Kuwohi est fermée du 1er décembre au 31 mars et Roaring Fork ferme l’hiver. Les GPS envoient parfois les voitures sur des pistes de gravier très raides : restez sur les routes goudronnées. Utilisez un rapport court dans les longues descentes pour ménager les freins, et attention aux cerfs et aux ours à l’aube et au crépuscule. Le réseau mobile disparaît dans beaucoup de vallées et dans une grande partie des parcs : téléchargez des cartes hors ligne avant de partir."}, {"ic": "sea", "h": "Cascades & rivières", "al": 1, "p": "Les cascades sont superbes et dangereuses : chaque année, des personnes y meurent après avoir escaladé les rochers du sommet ou des bords. Restez sur le sentier et derrière les rambardes, et ne grimpez jamais sur une cascade ni au-dessus – roche mouillée et mousse glissent comme de la glace. Les rivières peuvent monter en quelques minutes après un orage en amont : sortez de l’eau si elle se trouble ou commence à monter. Baignez-vous seulement là où se baignent les habitants, et ne sautez jamais sans connaître la profondeur."}, {"ic": "fire", "h": "Feux & interdictions", "p": "Le risque d’incendie de forêt culmine à l’automne et au début du printemps. Le NC Forest Service et la Tennessee Division of Forestry décrètent des interdictions de brûlage : tant qu’elles sont en vigueur, aucun feu dehors, foyers extérieurs compris. Ne laissez jamais un feu sans surveillance, noyez-le jusqu’à ce qu’il soit froid au toucher et ne jetez jamais une cigarette par la fenêtre. Les feux d’artifice sont interdits dans les parcs nationaux et dans de nombreuses communes : laissez-les à la maison."}, {"ic": "coins", "h": "Pourboires, horaires & paiement", "p": "Le pourboire est de rigueur : 18–20 % au restaurant avec service à table, 1–2 $ par verre au bar, et un montant similaire pour les guides de randonnée ou de rafting. La taxe de vente s’ajoute en caisse : les prix affichés ne la comprennent pas. Dans les petites villes, beaucoup de restaurants ferment tôt, et certains ferment le lundi ou le mardi en hiver : réservez le week-end et en octobre. La carte est acceptée presque partout, mais gardez un peu d’espèces pour les marchés et les étals au bord des routes."}], "de": [{"ic": "sun", "h": "Bergwetter", "p": "Vier echte Jahreszeiten: Wildblumen im April und Mai, Sommer mit 80–89 °F (27–32 °C) und Nachmittagsgewittern, Herbstfarben ab Anfang Oktober auf den Gipfeln bis Anfang November in den Tälern, und Winter mit Schnee und Eis in der Höhe. Pro 300 Höhenmeter wird es etwa 2–3 °C kühler: Packen Sie auch im Juli mehrere Schichten und eine Regenjacke ein. Im Oktober ist an Wochenenden viel Laubgucker-Verkehr: früh losfahren."}, {"ic": "sos", "h": "Nach Helene: vorher informieren", "al": 1, "p": "Hurrikan Helene (September 2024) verursachte im Westen North Carolinas und im Osten Tennessees historische Überschwemmungen. Die meisten Straßen, der Blue Ridge Parkway und die Parks sind wieder offen, doch manche Wege, Campingplätze und Einrichtungen sind noch geschlossen, und Bauarbeiten führen zu Fahrbahnsperrungen. Prüfen Sie vor jedem Ausflug die Straßenzustandsseiten des NPS für Parkway und Smokies und wählen Sie <b>511<\/b> (DriveNC.gov, TN SmartWay, 511 Virginia). Fahren Sie nie an einer Schranke oder Absperrung vorbei. Bei Starkregen nie in eine überflutete Straße fahren oder gehen: umkehren."}, {"ic": "bug", "h": "Bären, Wapitis & andere Tiere", "al": 1, "p": "Schwarzbären sind häufig. In den Nationalparks ist es verboten, sich einem Bären oder Wapiti auf weniger als 50 Yards (46 m) zu nähern oder ihn in irgendeiner Entfernung zu stören. Kommt ein Bär auf Sie zu: aufrichten, Lärm machen, langsam zurückweichen – nie rennen – und Wildtiere niemals füttern. Wapitis grasen bei Cataloochee und Oconaluftee: großen Abstand halten, vor allem während der Brunft im Herbst. Nach Wanderungen auf Zecken prüfen und auf warmen Felsen auf Kupferkopf- und Klapperschlangen achten. Im Herbst und Frühwinter ist in den National Forests (nicht in den Nationalparks) Jagdsaison: Tragen Sie auf Waldwegen etwas Leuchtorangefarbenes."}, {"ic": "park", "h": "Parkgebühren & Pässe", "p": "Der Great Smoky Mountains National Park verlangt keinen Eintritt, doch jedes Fahrzeug, das länger als 15 Minuten parkt, braucht eine <b>Park It Forward<\/b>-Parkplakette: 5 $ pro Tag, 15 $ pro Woche oder 40 $ pro Jahr, erhältlich auf Recreation.gov und in den Besucherzentren. Der America-the-Beautiful-Pass ersetzt sie nicht. Der Blue Ridge Parkway ist kostenlos. Der Shenandoah National Park kostet 30 $ pro Fahrzeug für 7 Tage; Nicht-US-Bürger zahlen 250 $ für den Jahrespass America the Beautiful. Manche Wanderungen wie Old Rag erfordern zusätzlich ein Zeitfenster-Ticket."}, {"ic": "car", "h": "Bergstraßen & Winter", "p": "Auf dem Parkway gilt höchstens 45 mph (72 km/h), und es gibt keine Tankstellen: vorher volltanken. Abschnitte werden bei Schnee, Eis oder Nebel gesperrt; die Newfound Gap Road (US-441) kann bei Wintersturm schließen, die Straße zum Kuwohi ist vom 1. Dezember bis 31. März gesperrt, und Roaring Fork ist im Winter zu. Navi-Apps schicken Autos manchmal über steile Schotterstraßen: auf asphaltierten Strecken bleiben. Auf langen Gefällen einen kleinen Gang nutzen, um die Bremsen zu schonen, und in der Dämmerung auf Hirsche und Bären achten. In vielen Tälern und großen Teilen der Parks gibt es kein Netz: Laden Sie vorher Offline-Karten herunter."}, {"ic": "sea", "h": "Wasserfälle & Flüsse", "al": 1, "p": "Wasserfälle sind schön und gefährlich: Jedes Jahr sterben Menschen, die auf die Felsen oben oder am Rand klettern. Bleiben Sie auf dem Weg und hinter den Geländern und klettern Sie nie auf oder über einen Wasserfall – nasser Fels und Moos sind glatt wie Eis. Flüsse können nach einem Gewitter flussaufwärts binnen Minuten steigen: Verlassen Sie das Wasser, wenn es trüb wird oder steigt. Baden Sie nur, wo auch Einheimische baden, und springen Sie nie, ohne die Tiefe zu kennen."}, {"ic": "fire", "h": "Feuer & Brennverbote", "p": "Die Waldbrandgefahr ist im Herbst und im zeitigen Frühjahr am höchsten. Der NC Forest Service und die Tennessee Division of Forestry verhängen Brennverbote: Solange sie gelten, kein Feuer im Freien, auch nicht in Feuerstellen. Lassen Sie ein Feuer nie unbeaufsichtigt, löschen Sie es mit Wasser, bis es kalt ist, und werfen Sie nie eine Zigarette aus dem Auto. Feuerwerk ist in den Nationalparks und in vielen Orten verboten: lassen Sie es zu Hause."}, {"ic": "coins", "h": "Trinkgeld, Öffnungszeiten & Bezahlen", "p": "Trinkgeld wird erwartet: 18–20 % im Restaurant mit Tischbedienung, 1–2 $ pro Getränk an der Bar und ähnlich viel für Wander- und Raftingguides. Die Umsatzsteuer kommt an der Kasse dazu – die ausgezeichneten Preise enthalten sie nicht. In kleinen Orten schließen viele Restaurants früh, manche im Winter montags oder dienstags: am Wochenende und im Oktober reservieren. Karten werden fast überall akzeptiert, aber für Bauernmärkte und Straßenstände etwas Bargeld mitnehmen."}]}, "TERROIR": {"en": [["Mountain apples", "Henderson County grows most of North Carolina’s apples: stop at an orchard stand for Honeycrisp, fresh cider and fried apple pies", "Aug – Nov"], ["Rainbow trout", "Cold mountain streams make western North Carolina a leading trout-farming region; smoked-trout dip is a local favorite", "all year"], ["Craft beer", "Asheville counts dozens of breweries, and Brevard, Sylva, Waynesville and Boone all have their own taprooms", "all year"], ["Moonshine", "The old mountain spirit is now distilled legally: tasting rooms line the Parkway in Gatlinburg and Pigeon Forge (21+, bring ID)", "all year"], ["Sourwood honey", "A pale, buttery honey from the blossoms of the sourwood tree, prized all over Appalachia", "harvest Jul – Sep"], ["Ramps", "Wild mountain leeks with a fierce garlic-and-onion bite, celebrated at spring ramp suppers", "Apr – May"], ["Country ham & biscuits", "Salt-cured, long-aged ham – Benton’s of Madisonville, Tennessee is legendary – served on a buttermilk biscuit", "all year"], ["Apple butter & stack cake", "Slow-cooked apple butter and the Appalachian stack cake, thin layers filled with dried-apple preserves", "fall"], ["Fraser fir Christmas trees", "The High Country is one of America’s great Christmas-tree regions; many farms let you choose and cut your own", "late Nov – Dec"], ["Shenandoah Valley wines & cider", "Valley vineyards and cideries pouring crisp whites, reds and hard cider from local orchards", "all year"]], "es": [["Manzanas de montaña", "El condado de Henderson produce la mayoría de las manzanas de Carolina del Norte: pare en un puesto de huerto para comprar Honeycrisp, sidra fresca sin alcohol y empanadillas fritas de manzana", "ago. – nov."], ["Trucha arcoíris", "Los arroyos fríos de montaña hacen del oeste de Carolina del Norte una gran región truchera; el paté de trucha ahumada es un clásico local", "todo el año"], ["Cerveza artesana", "Asheville cuenta con decenas de cervecerías, y Brevard, Sylva, Waynesville y Boone tienen sus propias taprooms", "todo el año"], ["Moonshine", "El viejo aguardiente de la montaña hoy se destila legalmente: hay salas de cata a lo largo de la Parkway de Gatlinburg y Pigeon Forge (mayores de 21, con documento)", "todo el año"], ["Miel de sourwood", "Una miel clara y mantecosa de la flor del árbol sourwood, muy apreciada en todos los Apalaches", "cosecha jul. – sep."], ["Ramps", "Puerros silvestres de montaña con un fuerte sabor a ajo y cebolla, protagonistas de las cenas de primavera", "abr. – may."], ["Jamón curado y biscuits", "Jamón curado en sal y largamente madurado – el de Benton’s, en Madisonville (Tennessee), es legendario – servido en un biscuit de suero de leche", "todo el año"], ["Apple butter y stack cake", "Crema de manzana cocida a fuego lento y el stack cake apalache, finas capas rellenas de compota de manzana seca", "otoño"], ["Abetos de Navidad Fraser", "El High Country es una de las grandes regiones de árboles de Navidad de EE. UU.; muchas granjas le dejan elegir y cortar el suyo", "fin. nov. – dic."], ["Vinos y sidras del valle de Shenandoah", "Viñedos y sidrerías del valle con blancos frescos, tintos y sidra de los huertos de la zona", "todo el año"]], "fr": [["Pommes de montagne", "Le comté de Henderson produit l’essentiel des pommes de Caroline du Nord : arrêtez-vous à un étal de verger pour des Honeycrisp, du jus de pomme frais (cider) et des chaussons frits", "août – nov."], ["Truite arc-en-ciel", "Grâce à ses torrents froids, l’ouest de la Caroline du Nor
