var T={"en": {"kicker": "Welcome guide", "welcome_t": "Welcome", "welcome": "Welcome to {n}! You're {z}. This guide has everything for your stay: getting here, the house, our favorite places around {c} and local tips. Keep it on your phone.", "checkin": "Check-in", "checkout": "Check-out", "wifi": "Wi-Fi", "host": "Your host", "from": "after 3 pm", "before": "by 11 am", "net": "Network", "pwd": "Password", "call": "Call", "msg": "Message", "nav": ["Arrival", "The house", "Nearby", "Local tips", "Check-out"], "c1": "Getting here", "car": "By car", "car_t": "We'll send you the exact address and directions before you arrive. Out in the country, GPS can go wrong on the last few miles: follow our directions, and download offline maps in case cell service drops.", "train": "By train", "plane": "By air", "approx": "approximate driving distances", "parking": "Parking", "park_yes": "Free parking on site.", "park_no": "Where to park: we'll tell you before you arrive.", "late": "Arriving late? Let us know and we'll set up self check-in (lockbox or keypad).", "c2": "The house", "rules_t": "House rules", "rules": ["No smoking or vaping inside the house.", "Quiet hours from 10 pm to 8 am: sound carries far out here.", "No parties or events, and no more guests than stated in your booking.", "Please lock the doors and close the windows when you go out."], "pets": "Pets: on request, please ask before you book.", "clim": "Air conditioning: keep the windows closed while it runs, around 74 °F is plenty, and switch it off when you go out.", "pool_t": "The pool", "pool": ["Open from 8 am to 9 pm.", "No lifeguard on duty: children must be supervised by an adult at all times.", "Shower before swimming, and no glass in the pool area."], "tub_t": "The hot tub", "tub": ["Keep each soak to about 15 minutes, and drink plenty of water.", "Not recommended for young children or during pregnancy; children only with an adult.", "No glass, and please put the cover back on after use."], "bf_t": "Breakfast", "bf": "Served from 8 to 10 am, made with local ingredients. Tell us about any allergies the day before.", "table_t": "Dinner", "table": "On request, the day before.", "spa_t": "Spa", "spa": "Treatments on request: ask us for a time.", "safe_t": "Safety", "safe": "Smoke and carbon monoxide alarms are installed throughout the house. The fire extinguisher and first-aid kit are in the kitchen. In an emergency, get everyone out first, then call 911.", "trash_t": "Trash & recycling", "trash": "Trash and recycling go in the bins we'll show you. Rinse containers, and keep plastic bags out of the recycling.", "c3": "Around {c}", "near_t": "Worth seeing nearby", "market_t": "Farmers markets", "market_n": "Days and seasons are indicative: check before you go.", "maps": "Directions", "c4": "Local tips", "seas_t": "Weather", "seas": "Check the forecast before outdoor plans: conditions can change fast, especially in the mountains and on the coast.", "sea_t": "The ocean", "sea": "Swim at beaches with lifeguards and follow the posted flags. Caught in a rip current? Don't fight it: swim parallel to the shore, then head back in.", "sos_t": "Emergencies", "sos": [["911", "Police, fire, ambulance"], ["1-800-222-1222", "Poison Control"], ["988", "Suicide & Crisis Lifeline"]], "tax_t": "Lodging tax", "tax": "State and local taxes on lodging are added to the room rate. Booked through Airbnb or Vrbo? The platform usually collects them for you.", "c5": "Check-out", "out_t": "Before you leave", "out": ["Keys back in the lockbox or the agreed place", "Windows closed, doors locked", "Thermostat turned down, lights off", "Dishes washed or dishwasher running", "Trash and recycling in the outside bins", "Nothing left behind: chargers, the fridge, the bathroom"], "thanks": "Thank you for staying with us! A review on Google or wherever you booked helps us more than you know.", "gallery": "In pictures", "ex": "to fill in", "made": "Prepared by Umbra Agency for {n}"}, "es": {"kicker": "Guía de bienvenida", "welcome_t": "Bienvenidos", "welcome": "¡Bienvenidos a {n}! Está {z}. Esta guía reúne todo lo necesario para su estancia: la llegada, la casa, nuestros lugares favoritos en los alrededores de {c} y consejos prácticos. Guárdela en su teléfono.", "checkin": "Llegada", "checkout": "Salida", "wifi": "Wifi", "host": "Su anfitrión", "from": "desde las 3 p. m.", "before": "antes de las 11 a. m.", "net": "Red", "pwd": "Contraseña", "call": "Llamar", "msg": "Escribir", "nav": ["Llegada", "La casa", "Alrededores", "Consejos", "Salida"], "c1": "Cómo llegar", "car": "En auto", "car_t": "Le enviaremos la dirección exacta y las indicaciones antes de su llegada. En el campo, el GPS puede fallar en las últimas millas: siga nuestras indicaciones y descargue mapas sin conexión por si se pierde la señal del celular.", "train": "En tren", "plane": "En avión", "approx": "distancias aproximadas por carretera", "parking": "Estacionamiento", "park_yes": "Estacionamiento gratuito en la propiedad.", "park_no": "Dónde estacionar: se lo indicaremos antes de su llegada.", "late": "¿Llega tarde? Avísenos y le preparamos la llegada autónoma (caja de llaves o cerradura con código).", "c2": "La casa", "rules_t": "Normas de la casa", "rules": ["Prohibido fumar o vapear dentro de la casa.", "Horas de silencio de 10 p. m. a 8 a. m.: aquí el sonido llega lejos.", "No se permiten fiestas ni eventos, ni más huéspedes de los indicados en la reserva.", "Al salir, cierre las puertas con llave y también las ventanas."], "pets": "Mascotas: bajo petición, consúltenos antes de reservar.", "clim": "Aire acondicionado: mantenga las ventanas cerradas mientras funciona, unos 74 °F son suficientes, y apáguelo al salir.", "pool_t": "La piscina", "pool": ["Abierta de 8 a. m. a 9 p. m.", "No hay salvavidas: los niños deben estar siempre bajo la supervisión de un adulto.", "Dúchese antes de nadar y no lleve vasos de vidrio a la zona de la piscina."], "tub_t": "El jacuzzi", "tub": ["Limite cada baño a unos 15 minutos y beba bastante agua.", "No se recomienda a niños pequeños ni durante el embarazo; los niños, siempre con un adulto.", "Nada de vidrio, y vuelva a colocar la cubierta después de usarlo."], "bf_t": "Desayuno", "bf": "Se sirve de 8 a 10 a. m., con productos locales. Avísenos de cualquier alergia el día anterior.", "table_t": "Cena", "table": "Bajo petición, el día anterior.", "spa_t": "Spa", "spa": "Tratamientos bajo petición: pídanos un horario.", "safe_t": "Seguridad", "safe": "La casa cuenta con detectores de humo y de monóxido de carbono. El extintor y el botiquín están en la cocina. En caso de emergencia, primero salgan todos de la casa y luego llame al 911.", "trash_t": "Basura y reciclaje", "trash": "La basura y el reciclaje van en los contenedores que le indicaremos. Enjuague los envases y no ponga bolsas de plástico en el reciclaje.", "c3": "Alrededor de {c}", "near_t": "Qué ver cerca", "market_t": "Mercados de agricultores", "market_n": "Días y temporadas orientativos: confírmelos antes de ir.", "maps": "Cómo llegar", "c4": "Consejos prácticos", "seas_t": "El tiempo", "seas": "Consulte el pronóstico antes de cualquier plan al aire libre: el tiempo puede cambiar rápido, sobre todo en la montaña y en la costa.", "sea_t": "El mar", "sea": "Nade en playas con salvavidas y respete las banderas. ¿Le atrapa una corriente de resaca? No luche contra ella: nade en paralelo a la orilla y luego regrese.", "sos_t": "Emergencias", "sos": [["911", "Policía, bomberos, ambulancia"], ["1-800-222-1222", "Centro de Toxicología (Poison Control)"], ["988", "Línea de Prevención del Suicidio y Crisis (oprima 2 para español)"]], "tax_t": "Impuesto de alojamiento", "tax": "Los impuestos estatales y locales sobre el alojamiento se suman a la tarifa de la habitación. ¿Reservó por Airbnb o Vrbo? Normalmente la plataforma los cobra por usted.", "c5": "Salida", "out_t": "Antes de irse", "out": ["Llaves en la caja de llaves o en el lugar acordado", "Ventanas cerradas, puertas con llave", "Termostato bajado, luces apagadas", "Platos lavados o lavavajillas en marcha", "Basura y reciclaje en los contenedores de afuera", "Nada olvidado: cargadores, el refrigerador, el baño"], "thanks": "¡Gracias por alojarse con nosotros! Una reseña en Google o en la plataforma donde reservó nos ayuda muchísimo.", "gallery": "En imágenes", "ex": "por completar", "made": "Preparada por Umbra Agency para {n}"}, "fr": {"kicker": "Livret d'accueil", "welcome_t": "Bienvenue", "welcome": "Bienvenue à {n} ! Vous êtes {z}. Ce livret rassemble tout ce qu'il faut pour votre séjour : l'arrivée, la maison, nos adresses autour de {c} et les infos pratiques. Gardez-le sur votre téléphone.", "checkin": "Arrivée", "checkout": "Départ", "wifi": "Wi-Fi", "host": "Votre hôte", "from": "à partir de 15 h", "before": "avant 11 h", "net": "Réseau", "pwd": "Mot de passe", "call": "Appeler", "msg": "Écrire", "nav": ["Arriver", "La maison", "Autour", "Infos pratiques", "Départ"], "c1": "Arriver", "car": "En voiture", "car_t": "Nous vous envoyons l'adresse exacte et l'itinéraire avant votre arrivée. À la campagne, le GPS peut se tromper sur les derniers miles : suivez nos indications, et téléchargez des cartes hors ligne au cas où le réseau mobile disparaîtrait.", "train": "En train", "plane": "En avion", "approx": "distances approximatives par la route", "parking": "Stationnement", "park_yes": "Parking gratuit sur place.", "park_no": "Où se garer : on vous l'indique avant l'arrivée.", "late": "Arrivée tardive ? Prévenez-nous, on prévoit une arrivée autonome (boîte à clés ou serrure à code).", "c2": "La maison", "rules_t": "Les règles de la maison", "rules": ["Maison non-fumeur, cigarette électronique comprise.", "Calme de 22 h à 8 h : ici, le son porte loin.", "Pas de fêtes ni d'événements, et pas plus de personnes que prévu dans la réservation.", "Fermez les portes à clé et les fenêtres quand vous sortez."], "pets": "Animaux : sur demande, avant la réservation.", "clim": "Climatisation : fenêtres fermées quand elle tourne, 74 °F (23 °C) suffisent, et on l'éteint en sortant.", "pool_t": "La piscine", "pool": ["Ouverte de 8 h à 21 h.", "Piscine non surveillée : les enfants restent toujours sous la surveillance d'un adulte.", "Une douche avant la baignade, et pas de verre autour du bassin."], "tub_t": "Le jacuzzi", "tub": ["Limitez chaque bain à 15 minutes environ, et buvez beaucoup d'eau.", "Déconseillé aux jeunes enfants et pendant la grossesse ; enfants uniquement avec un adulte.", "Pas de verre, et remettez la couverture après usage."], "bf_t": "Petit-déjeuner", "bf": "Servi de 8 h à 10 h, avec des produits locaux. Signalez-nous vos allergies la veille.", "table_t": "Dîner", "table": "Sur réservation, la veille.", "spa_t": "Spa", "spa": "Soins sur réservation : demandez-nous un créneau.", "safe_t": "Sécurité", "safe": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone. L'extincteur et la trousse de secours sont dans la cuisine. En cas d'urgence, faites d'abord sortir tout le monde, puis appelez le 911.", "trash_t": "Poubelles et recyclage", "trash": "Ordures et recyclage vont dans les bacs que nous vous montrerons. Rincez les emballages, et pas de sacs plastiques dans le recyclage.", "c3": "Autour de {c}", "near_t": "À voir près d'ici", "market_t": "Marchés fermiers", "market_n": "Jours et saisons indicatifs : vérifiez avant d'y aller.", "maps": "Itinéraire", "c4": "Infos pratiques", "seas_t": "La météo", "seas": "Consultez la météo avant toute sortie : le temps peut changer vite, surtout en montagne et sur la côte.", "sea_t": "L'océan", "sea": "Baignez-vous sur les plages surveillées et respectez les drapeaux. Pris dans un courant d'arrachement ? Ne luttez pas : nagez parallèlement au rivage, puis revenez.", "sos_t": "Urgences", "sos": [["911", "Police, pompiers, ambulance"], ["1-800-222-1222", "Centre antipoison"], ["988", "Ligne d'écoute suicide et crise"]], "tax_t": "Taxe d'hébergement", "tax": "Les taxes de l'État et locales sur l'hébergement s'ajoutent au prix de la chambre. Réservé sur Airbnb ou Vrbo ? La plateforme les perçoit en général pour vous.", "c5": "Départ", "out_t": "Avant de partir", "out": ["Clés dans la boîte à clés ou à l'endroit convenu", "Fenêtres fermées, portes verrouillées", "Thermostat baissé, lumières éteintes", "Vaisselle faite ou lave-vaisselle lancé", "Poubelles et recyclage dans les bacs extérieurs", "Rien d'oublié : chargeurs, frigo, salle de bains"], "thanks": "Merci d'avoir séjourné chez nous ! Un avis sur Google ou sur le site où vous avez réservé nous aide énormément.", "gallery": "En images", "ex": "à compléter", "made": "Préparé par Umbra Agency pour {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen bei {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Tipps. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 15 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Wegbeschreibung schicken wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi auf den letzten Meilen manchmal: Folgen Sie unserer Beschreibung und laden Sie Offline-Karten herunter, falls der Mobilfunkempfang abbricht.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, dann richten wir den Self-Check-in ein (Schlüsselbox oder Zahlenschloss).", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht, auch keine E-Zigaretten.", "Nachtruhe von 22 bis 8 Uhr: Geräusche tragen hier weit.", "Keine Partys oder Veranstaltungen und nicht mehr Gäste als in der Buchung angegeben.", "Beim Hinausgehen bitte Türen abschließen und Fenster schließen."], "pets": "Haustiere: auf Anfrage, bitte vor der Buchung fragen.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, etwa 74 °F (23 °C) genügen, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 8 bis 21 Uhr.", "Kein Bademeister: Kinder nur unter ständiger Aufsicht eines Erwachsenen.", "Vor dem Schwimmen duschen, kein Glas im Poolbereich."], "tub_t": "Der Whirlpool", "tub": ["Nicht länger als etwa 15 Minuten am Stück baden und viel Wasser trinken.", "Nicht empfohlen für kleine Kinder und in der Schwangerschaft; Kinder nur mit einem Erwachsenen.", "Kein Glas, und bitte die Abdeckung nach dem Baden wieder auflegen."], "bf_t": "Frühstück", "bf": "Von 8 bis 10 Uhr, mit Zutaten aus der Region. Allergien bitte am Vortag mitteilen.", "table_t": "Abendessen", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Anwendungen auf Anfrage: Fragen Sie uns nach einem Termin.", "safe_t": "Sicherheit", "safe": "Im ganzen Haus sind Rauch- und Kohlenmonoxidmelder installiert. Feuerlöscher und Erste-Hilfe-Kasten finden Sie in der Küche. Im Notfall zuerst alle nach draußen bringen, dann 911 anrufen.", "trash_t": "Müll und Recycling", "trash": "Müll und Wertstoffe kommen in die Tonnen, die wir Ihnen zeigen. Behälter ausspülen und keine Plastiktüten in den Recyclingmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Bauernmärkte", "market_n": "Tage und Saison ohne Gewähr: bitte vorher prüfen.", "maps": "Route", "c4": "Praktische Tipps", "seas_t": "Das Wetter", "seas": "Vor Ausflügen den Wetterbericht prüfen: Das Wetter kann schnell umschlagen, vor allem in den Bergen und an der Küste.", "sea_t": "Der Ozean", "sea": "Nur an bewachten Stränden baden und die Flaggen beachten. In einer Rippströmung? Nicht dagegen anschwimmen: parallel zum Ufer schwimmen, dann zurück an Land.", "sos_t": "Notfälle", "sos": [["911", "Polizei, Feuerwehr, Rettungsdienst"], ["1-800-222-1222", "Giftnotruf (Poison Control)"], ["988", "Krisen- und Suizid-Hotline"]], "tax_t": "Beherbergungssteuer", "tax": "Staatliche und lokale Steuern auf Übernachtungen kommen zum Zimmerpreis hinzu. Über Airbnb oder Vrbo gebucht? Dann zieht sie meist die Plattform für Sie ein.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel in der Schlüsselbox oder am vereinbarten Ort", "Fenster zu, Türen abgeschlossen", "Thermostat heruntergedreht, Licht aus", "Geschirr gespült oder Spülmaschine an", "Müll und Recycling in die Tonnen draußen", "Nichts vergessen: Ladegeräte, Kühlschrank, Bad"], "thanks": "Danke für Ihren Aufenthalt! Eine Bewertung bei Google oder dort, wo Sie gebucht haben, hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Erstellt von Umbra Agency für {n}"}};
var R={"NAV4": {"en": "Cape & coast tips", "es": "Consejos: Cape Cod y la costa", "fr": "Cape Cod & côte pratique", "de": "Cape Cod & Küste: Tipps"}, "RULES": {"en": ["Massachusetts: register every rental with the Department of Revenue on MassTaxConnect, post the certificate of registration in the unit and give its number to each booking platform.", "Massachusetts: carry at least $1 million of liability insurance per rental unless the platform’s coverage is equal or greater, and collect the room occupancy excise on direct bookings (5.7% state + up to 6% local + 2.75% Cape Cod & Islands Water Protection Fund on the Cape).", "Cape & Islands towns: most also require an annual local registration (Barnstable through its Health Division). Nantucket’s Board of Health certificate ($250 a year) must appear in every listing, occupancy is capped at two guests per bedroom plus two, and a local contact must be able to reach the house within two hours.", "Rhode Island: register each unit with the Department of Business Regulation. In Newport, also obtain the city’s Transient Guest Facility certificate (valid June 1 – May 31); in residential zones, stays under 30 days are allowed only in the owner’s primary residence (up to 2 rooms, 4 guests).", "Connecticut: register with the Department of Revenue Services and collect the room occupancy tax (15% for homes, inns and lodging houses, 11% for B&Bs); some towns have their own zoning or permit rules, so check with town hall.", "Everywhere: working smoke and carbon-monoxide alarms, posted emergency exits and street address for 911, and occupancy limits and quiet hours written into the house rules."], "es": ["Massachusetts: registre cada alquiler en el Department of Revenue a través de MassTaxConnect, coloque el certificado de registro en el alojamiento y facilite su número a cada plataforma de reservas.", "Massachusetts: mantenga un seguro de responsabilidad civil de al menos 1 millón de dólares por alquiler, salvo que la plataforma ofrezca una cobertura igual o superior, y cobre el impuesto de ocupación en las reservas directas (5,7 % estatal + hasta 6 % local + 2,75 % del Cape Cod & Islands Water Protection Fund en el cabo).", "Municipios del cabo y las islas: la mayoría exige además un registro local anual (Barnstable, a través de su Health Division). En Nantucket, el certificado del Board of Health (250 $ al año) debe figurar en cada anuncio, la ocupación se limita a dos huéspedes por dormitorio más dos y un contacto local debe poder llegar a la casa en menos de dos horas.", "Rhode Island: registre cada unidad en el Department of Business Regulation. En Newport, obtenga también el certificado municipal de Transient Guest Facility (válido del 1 de junio al 31 de mayo); en zonas residenciales, las estancias de menos de 30 días solo se permiten en la residencia principal del propietario (hasta 2 habitaciones y 4 huéspedes).", "Connecticut: regístrese en el Department of Revenue Services y cobre el impuesto de ocupación (15 % para casas, posadas y hospedajes; 11 % para B&B); algunos municipios tienen sus propias normas urbanísticas o permisos, consulte en el ayuntamiento.", "En todas partes: detectores de humo y de monóxido de carbono en funcionamiento, salidas de emergencia y dirección postal para el 911 a la vista, y límites de ocupación y horas de silencio en las normas de la casa."], "fr": ["Massachusetts : enregistrez chaque location auprès du Department of Revenue via MassTaxConnect, affichez le certificat d’enregistrement dans le logement et communiquez son numéro à chaque plateforme de réservation.", "Massachusetts : souscrivez au moins 1 million de dollars d’assurance responsabilité civile par location, sauf si la plateforme offre une couverture équivalente ou supérieure, et collectez la taxe d’occupation sur les réservations directes (5,7 % de l’État + jusqu’à 6 % local + 2,75 % pour le Cape Cod & Islands Water Protection Fund sur le cap).", "Communes du cap et des îles : la plupart exigent aussi un enregistrement local annuel (à Barnstable, auprès de la Health Division). À Nantucket, le certificat du Board of Health (250 $ par an) doit figurer dans chaque annonce, la capacité est limitée à deux personnes par chambre plus deux, et un contact local doit pouvoir rejoindre la maison en moins de deux heures.", "Rhode Island : enregistrez chaque logement auprès du Department of Business Regulation. À Newport, obtenez aussi le certificat municipal de Transient Guest Facility (valable du 1er juin au 31 mai) ; en zone résidentielle, les séjours de moins de 30 jours ne sont autorisés que dans la résidence principale du propriétaire (2 chambres et 4 personnes au maximum).", "Connecticut : inscrivez-vous auprès du Department of Revenue Services et collectez la taxe d’occupation (15 % pour les maisons, auberges et pensions, 11 % pour les B&B) ; certaines communes ont leurs propres règles d’urbanisme ou de permis, renseignez-vous en mairie.", "Partout : détecteurs de fumée et de monoxyde de carbone en état de marche, sorties de secours et adresse pour le 911 affichées, capacité maximale et heures de calme inscrites dans le règlement intérieur."], "de": ["Massachusetts: Jede Vermietung beim Department of Revenue über MassTaxConnect registrieren, die Registrierungsbescheinigung in der Unterkunft aushängen und ihre Nummer jeder Buchungsplattform mitteilen.", "Massachusetts: Pro Vermietung mindestens 1 Million Dollar Haftpflichtversicherung, sofern die Plattform keine gleichwertige oder höhere Deckung bietet, und bei Direktbuchungen die Beherbergungssteuer erheben (5,7 % Staat + bis zu 6 % Gemeinde + 2,75 % Cape Cod & Islands Water Protection Fund auf dem Kap).", "Gemeinden auf dem Kap und den Inseln: Die meisten verlangen zusätzlich eine jährliche lokale Registrierung (in Barnstable bei der Health Division). Auf Nantucket muss das Zertifikat des Board of Health (250 $ pro Jahr) in jeder Anzeige stehen, die Belegung ist auf zwei Gäste pro Schlafzimmer plus zwei begrenzt, und eine Kontaktperson vor Ort muss das Haus binnen zwei Stunden erreichen können.", "Rhode Island: Jede Einheit beim Department of Business Regulation registrieren. In Newport zusätzlich das städtische Transient-Guest-Facility-Zertifikat einholen (gültig 1. Juni – 31. Mai); in Wohngebieten sind Aufenthalte unter 30 Tagen nur im Hauptwohnsitz des Eigentümers erlaubt (höchstens 2 Zimmer, 4 Gäste).", "Connecticut: Beim Department of Revenue Services anmelden und die Beherbergungssteuer erheben (15 % für Häuser, Gasthöfe und Pensionen, 11 % für B&Bs); manche Gemeinden haben eigene Bau- oder Genehmigungsregeln – beim Rathaus nachfragen.", "Überall: funktionierende Rauch- und Kohlenmonoxidmelder, ausgehängte Notausgänge und Adresse für den Notruf 911 sowie Belegungsgrenzen und Ruhezeiten in der Hausordnung."]}, "HOUSE": {"en": [{"ic": "home", "h": "Heating, cooling & fireplaces", "p": "Many Cape and island cottages have no central air: sea breezes and ceiling fans do the work, so open windows on both sides of the house in the evening. If there is air conditioning, keep doors and windows shut while it runs and switch it off when you go out. Fireplace or wood stove: open the damper before lighting, burn only the dry wood we provide, keep the screen closed, never leave the fire unattended, and put cold ashes in the metal bucket outside, never in the trash."}, {"ic": "leaf", "h": "Septic & water", "p": "Most homes here run on a <b>septic system<\/b> (in Massachusetts, under the state’s Title 5 rules): only toilet paper down the toilet, no wipes, even “flushable” ones, no sanitary products and no grease. Nitrogen from septic systems is the main threat to the Cape’s bays and ponds, so go easy on water and detergent. Tap water comes from the town supply or a private well and is safe to drink unless we tell you otherwise. In the outdoor shower, please use biodegradable soap."}, {"ic": "bin", "h": "Trash & recycling", "ul": ["Many Cape and island towns have no curbside pickup: trash goes to the town transfer station, which needs a sticker. We’ll explain how we handle it.", "Recycling: rinse cans, bottles and plastic containers and flatten cardboard; sorting rules vary by town, so follow the labels on the bins.", "Massachusetts and Connecticut have a bottle deposit: return empty cans and bottles to the machines at the supermarket.", "Keep lids tightly closed: gulls, raccoons, skunks and coyotes raid open bins.", "Never leave bags on the porch or outside overnight.", "Many beaches have no bins: what you carry in, you carry out."]}, {"ic": "sos", "h": "Smoke & CO alarms", "p": "The house has smoke and carbon-monoxide alarms: never disconnect them, and if one chirps, let us know and we’ll change the battery. We’ll show you the fire extinguisher, the first-aid kit and the exits when you arrive. If a CO alarm sounds, get everyone outside and call <b>911<\/b>. Grills and fire pits stay well away from the house, the deck and the dune grass."}, {"ic": "list", "h": "Quiet hours & neighbors", "p": "Sound carries over water and between closely spaced cottages: keep voices and music down after <b>10 pm<\/b>, as most town noise bylaws expect. Parties and events need our approval in advance. Consumer fireworks are illegal in Massachusetts and strictly limited in Rhode Island and Connecticut: leave them to the town displays."}, {"ic": "car", "h": "Parking & storms", "p": "Park only in the driveway or the spaces we show you: narrow lanes, sandy shoulders and neighbors’ lawns are off-limits, and many villages tow. When a nor’easter or tropical storm is forecast, bring in deck furniture, umbrellas and kayaks, keep phones charged and follow town alerts. In winter, a snow emergency means no parking on the street, so the plows can get through."}], "es": [{"ic": "home", "h": "Calefacción, frescor y chimeneas", "p": "Muchas casitas del cabo y las islas no tienen aire acondicionado central: la brisa marina y los ventiladores de techo hacen el trabajo, así que por la tarde abra ventanas en ambos lados de la casa. Si hay aire acondicionado, mantenga puertas y ventanas cerradas mientras funcione y apáguelo al salir. Chimenea o estufa de leña: abra el tiro antes de encenderla, queme solo la leña seca que le dejamos, mantenga la pantalla cerrada, no deje nunca el fuego sin vigilancia y ponga las cenizas frías en el cubo metálico de fuera, nunca en la basura."}, {"ic": "leaf", "h": "Fosa séptica y agua", "p": "La mayoría de las casas funcionan con una <b>fosa séptica<\/b> (en Massachusetts, regulada por las normas estatales Title 5): en el inodoro, solo papel higiénico; ni toallitas, aunque digan «desechables», ni compresas, ni grasa. El nitrógeno de las fosas sépticas es la principal amenaza para las bahías y lagunas del cabo: use el agua y los detergentes con moderación. El agua del grifo procede de la red municipal o de un pozo privado y es potable salvo que le indiquemos lo contrario. En la ducha exterior, use jabón biodegradable."}, {"ic": "bin", "h": "Basura y reciclaje", "ul": ["Muchos municipios del cabo y las islas no recogen la basura a domicilio: se lleva al punto limpio municipal (transfer station), que exige una pegatina. Le explicaremos cómo lo hacemos.", "Reciclaje: enjuague latas, botellas y envases de plástico y aplaste el cartón; las normas varían según el municipio, siga las etiquetas de los contenedores.", "Massachusetts y Connecticut tienen depósito por envase: devuelva latas y botellas vacías en las máquinas del supermercado.", "Cierre bien las tapas: gaviotas, mapaches, mofetas y coyotes saquean los cubos abiertos.", "No deje nunca bolsas en el porche ni fuera por la noche.", "Muchas playas no tienen papeleras: lo que lleve, se lo vuelve a llevar."]}, {"ic": "sos", "h": "Detectores de humo y CO", "p": "La casa tiene detectores de humo y de monóxido de carbono: no los desconecte nunca; si uno pita, avísenos y cambiaremos la pila. A su llegada le mostraremos el extintor, el botiquín y las salidas. Si suena una alarma de CO, salgan todos de la casa y llame al <b>911<\/b>. Barbacoas y braseros, siempre bien lejos de la casa, del porche y de la hierba de las dunas."}, {"ic": "list", "h": "Silencio y vecinos", "p": "El sonido viaja sobre el agua y entre casitas muy próximas: baje la voz y la música a partir de las <b>22:00<\/b>, como piden la mayoría de las ordenanzas municipales sobre ruido. Las fiestas y celebraciones requieren nuestra autorización previa. Los fuegos artificiales de particulares están prohibidos en Massachusetts y muy restringidos en Rhode Island y Connecticut: disfrute de los espectáculos municipales."}, {"ic": "car", "h": "Aparcamiento y tormentas", "p": "Aparque solo en la entrada de la casa o en las plazas que le indiquemos: los caminos estrechos, los arcenes de arena y el césped de los vecinos están prohibidos, y en muchos pueblos la grúa actúa. Si se anuncia un nor’easter o una tormenta tropical, guarde los muebles del porche, las sombrillas y los kayaks, tenga los móviles cargados y siga los avisos municipales. En invierno, una emergencia por nieve significa que no se puede aparcar en la calle, para que pasen las quitanieves."}], "fr": [{"ic": "home", "h": "Chauffage, fraîcheur & cheminées", "p": "Beaucoup de cottages du cap et des îles n’ont pas de climatisation centrale : la brise marine et les ventilateurs de plafond suffisent, alors ouvrez le soir les fenêtres des deux côtés de la maison. S’il y a la climatisation, gardez portes et fenêtres fermées quand elle tourne et éteignez-la en sortant. Cheminée ou poêle à bois : ouvrez le conduit avant d’allumer, ne brûlez que le bois sec fourni, gardez le pare-feu fermé, ne laissez jamais le feu sans surveillance et videz les cendres froides dans le seau métallique dehors, jamais à la poubelle."}, {"ic": "leaf", "h": "Fosse septique & eau", "p": "La plupart des maisons ont une <b>fosse septique<\/b> (au Massachusetts, soumise aux règles Title 5 de l’État) : uniquement du papier toilette dans les WC, ni lingettes, même « jetables », ni protections, ni graisse. L’azote des fosses septiques est la principale menace pour les baies et les étangs du cap : économisez l’eau et les détergents. L’eau du robinet vient du réseau communal ou d’un puits privé et elle est potable, sauf indication contraire de notre part. Sous la douche extérieure, utilisez un savon biodégradable."}, {"ic": "bin", "h": "Déchets & recyclage", "ul": ["Beaucoup de communes du cap et des îles n’ont pas de collecte à domicile : les déchets vont à la déchetterie communale (transfer station), accessible avec une vignette. Nous vous expliquons comment nous faisons.", "Recyclage : rincez canettes, bouteilles et emballages plastique et aplatissez les cartons ; les consignes varient selon la commune, suivez les étiquettes des bacs.", "Le Massachusetts et le Connecticut pratiquent la consigne : rapportez canettes et bouteilles vides aux machines du supermarché.", "Fermez bien les couvercles : goélands, ratons laveurs, mouffettes et coyotes pillent les poubelles ouvertes.", "Ne laissez jamais de sacs sur le porche ni dehors la nuit.", "Beaucoup de plages n’ont pas de poubelles : ce que vous apportez, vous le remportez."]}, {"ic": "sos", "h": "Détecteurs de fumée & de CO", "p": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone : ne les débranchez jamais ; si l’un d’eux bipe, prévenez-nous et nous changerons la pile. À votre arrivée, nous vous montrons l’extincteur, la trousse de secours et les sorties. Si une alarme CO se déclenche, faites sortir tout le monde et appelez le <b>911<\/b>. Barbecues et braseros restent bien à l’écart de la maison, de la terrasse et des herbes des dunes."}, {"ic": "list", "h": "Calme & voisinage", "p": "Le son porte loin sur l’eau et entre des cottages très proches : baissez la voix et la musique après <b>22 h<\/b>, comme le prévoient la plupart des règlements communaux sur le bruit. Fêtes et réceptions nécessitent notre accord préalable. Les feux d’artifice des particuliers sont interdits au Massachusetts et très encadrés au Rhode Island et au Connecticut : profitez des spectacles municipaux."}, {"ic": "car", "h": "Stationnement & tempêtes", "p": "Garez-vous uniquement dans l’allée ou aux places indiquées : chemins étroits, bas-côtés sableux et pelouses des voisins sont interdits, et de nombreux villages font enlever les voitures. Si un nor’easter ou une tempête tropicale est annoncé, rentrez meubles de terrasse, parasols et kayaks, gardez vos téléphones chargés et suivez les alertes de la commune. L’hiver, une alerte neige (snow emergency) interdit de stationner dans la rue pour laisser passer les chasse-neige."}], "de": [{"ic": "home", "h": "Heizen, Kühlen & Kamin", "p": "Viele Cottages auf dem Kap und den Inseln haben keine zentrale Klimaanlage: Seebrise und Deckenventilatoren erledigen das, also abends Fenster auf beiden Hausseiten öffnen. Gibt es eine Klimaanlage, Türen und Fenster geschlossen halten, solange sie läuft, und beim Weggehen ausschalten. Kamin oder Holzofen: vor dem Anzünden die Klappe öffnen, nur das bereitgestellte trockene Holz verbrennen, das Schutzgitter geschlossen halten, das Feuer nie unbeaufsichtigt lassen und kalte Asche in den Metalleimer draußen geben, nie in den Müll."}, {"ic": "leaf", "h": "Klärgrube & Wasser", "p": "Die meisten Häuser haben eine <b>Klärgrube<\/b> (in Massachusetts nach den staatlichen Title-5-Vorschriften): nur Toilettenpapier in die Toilette, keine Feuchttücher, auch keine „spülbaren“, keine Hygieneartikel und kein Fett. Stickstoff aus Klärgruben ist die größte Bedrohung für Buchten und Teiche des Kaps: Bitte sparsam mit Wasser und Spülmittel umgehen. Das Leitungswasser kommt aus dem Gemeindenetz oder einem privaten Brunnen und ist trinkbar, sofern wir nichts anderes sagen. Unter der Außendusche bitte biologisch abbaubare Seife verwenden."}, {"ic": "bin", "h": "Müll & Recycling", "ul": ["Viele Gemeinden auf dem Kap und den Inseln haben keine Müllabfuhr am Haus: Der Müll kommt zum Wertstoffhof der Gemeinde (Transfer Station), für den man eine Plakette braucht. Wir erklären Ihnen, wie wir das regeln.", "Recycling: Dosen, Flaschen und Plastikbehälter ausspülen, Karton flach falten; die Regeln sind je nach Gemeinde verschieden, bitte den Aufklebern an den Tonnen folgen.", "Massachusetts und Connecticut haben Flaschenpfand: Leere Dosen und Flaschen an den Automaten im Supermarkt zurückgeben.", "Deckel fest schließen: Möwen, Waschbären, Stinktiere und Kojoten plündern offene Tonnen.", "Nie Müllbeutel auf der Veranda oder über Nacht draußen stehen lassen.", "Viele Strände haben keine Mülleimer: Was Sie mitbringen, nehmen Sie wieder mit."]}, {"ic": "sos", "h": "Rauch- & CO-Melder", "p": "Das Haus hat Rauch- und Kohlenmonoxidmelder: Bitte nie abklemmen; piept einer, sagen Sie uns Bescheid, und wir wechseln die Batterie. Feuerlöscher, Erste-Hilfe-Set und Ausgänge zeigen wir Ihnen bei der Ankunft. Schlägt ein CO-Melder an, bringen Sie alle nach draußen und rufen <b>911<\/b>. Grill und Feuerschale gehören weit weg von Haus, Terrasse und Dünengras."}, {"ic": "list", "h": "Ruhezeiten & Nachbarn", "p": "Schall trägt weit über das Wasser und zwischen den dicht stehenden Cottages: Ab <b>22 Uhr<\/b> Stimmen und Musik leise halten, wie es die meisten Lärmschutzsatzungen der Gemeinden verlangen. Partys und Feiern nur nach vorheriger Absprache mit uns. Privates Feuerwerk ist in Massachusetts verboten und in Rhode Island und Connecticut stark eingeschränkt: Genießen Sie lieber die Feuerwerke der Gemeinden."}, {"ic": "car", "h": "Parken & Stürme", "p": "Bitte nur in der Einfahrt oder auf den gezeigten Plätzen parken: Schmale Wege, sandige Bankette und die Rasenflächen der Nachbarn sind tabu, und in vielen Dörfern wird abgeschleppt. Wenn ein Nor’easter oder Tropensturm angesagt ist, Terrassenmöbel, Sonnenschirme und Kajaks hereinholen, Handys geladen halten und die Warnungen der Gemeinde verfolgen. Im Winter gilt bei einem Schneenotstand (Snow Emergency) Parkverbot auf der Straße, damit die Räumfahrzeuge durchkommen."}]}, "PRAT": {"en": [{"ic": "sun", "h": "Through the seasons", "p": "Summers are warm rather than hot, with highs mostly in the upper 70s °F and cool nights. Nantucket Sound and Buzzards Bay reach about 70 °F by August, while the Atlantic side stays brisker. September and October are the local secret: warm water and quiet beaches. From Columbus Day to Memorial Day many shops, restaurants and ferries keep shorter hours, so check before you go. Fog can roll in at any time, especially on the islands."}, {"ic": "sea", "h": "Beaches, stickers & dunes", "p": "Town beaches usually require a parking sticker or a daily fee in season; many towns sell weekly visitor stickers, so ask us or the town hall. The Cape Cod National Seashore charges a daily or season pass in summer (the America the Beautiful pass is accepted). Swim at lifeguarded beaches, watch for rip currents and keep off the dunes: they are fragile, and roped-off areas protect nesting piping plovers and terns."}, {"ic": "sos", "h": "Sharks & seals", "al": 1, "p": "White sharks hunt gray seals off the Outer Cape and the islands, mostly from July to October. Stay close to shore in water no deeper than your waist, swim in groups, keep away from seals and don’t swim at dawn or dusk. Purple shark flags are a reminder; if a beach is closed to swimming, stay out of the water. The Sharktivity app posts recent sightings."}, {"ic": "bug", "h": "Ticks & poison ivy", "p": "Deer ticks carry Lyme disease and other infections: on trails and in tall grass, wear long pants tucked into socks, use repellent, and check yourself, the children and pets every evening. Remove a tick promptly with fine tweezers, and see a doctor if a rash or fever follows. Poison ivy grows everywhere along paths and dunes: “leaves of three, let it be.”"}, {"ic": "wind", "h": "Hurricanes & nor’easters", "al": 1, "p": "Hurricane season runs from June to November, peaking from August to October; nor’easters bring wind and coastal flooding in fall and winter. Follow National Weather Service and town alerts, find out whether you are in a hurricane evacuation zone, and leave if officials order it. Never drive through a flooded road: a foot of moving water can float a car. Ferries are cancelled in high winds, so build in some slack before a flight home."}, {"ic": "list", "h": "Ferries & reservations", "p": "For Martha’s Vineyard and Nantucket, book car space on the Steamship Authority (Woods Hole, Hyannis) months ahead for summer; foot passengers can walk on, but buy tickets early in peak season. Hy-Line (Hyannis), the Island Queen (Falmouth), Seastreak (New Bedford) and the Vineyard Fast Ferry (Quonset Point, RI) carry passengers only. In season, fast ferries run to Provincetown from Boston and Plymouth; the Block Island Ferry leaves from Point Judith."}, {"ic": "car", "h": "Bridges & traffic", "p": "Every car reaches the Cape over the Sagamore or Bourne Bridge: in summer, avoid heading on-Cape on Friday afternoons and Saturday mornings and off-Cape on Sunday afternoons, and allow for roadwork. Route 6A is slow but beautiful; Route 28 gets busy in summer. The CapeFLYER train runs from Boston to Hyannis on summer weekends, and buses and bikes are the easy way around Provincetown and the islands."}, {"ic": "coins", "h": "Tips, permits & habits", "p": "Tip 18–20% in restaurants and about $1–2 a drink at the bar. Farm stands often run on an honor box, so carry some cash. Saltwater fishing needs a state permit (Massachusetts, Rhode Island and Connecticut each have their own), and digging clams or quahogs needs a town shellfish permit; rules and closed areas change, so ask at town hall. In the fall, wear blaze orange on woodland trails during hunting season."}], "es": [{"ic": "sun", "h": "A lo largo del año", "p": "Los veranos son templados más que calurosos, con máximas de unos 75–80 °F (24–27 °C) y noches frescas. Nantucket Sound y Buzzards Bay alcanzan unos 70 °F (21 °C) en agosto; la costa atlántica es más fresca. Septiembre y octubre son el secreto local: agua templada y playas tranquilas. Entre Columbus Day (octubre) y Memorial Day (finales de mayo) muchas tiendas, restaurantes y ferris reducen horarios: compruébelos antes de salir. La niebla puede llegar en cualquier momento, sobre todo en las islas."}, {"ic": "sea", "h": "Playas, pegatinas y dunas", "p": "Las playas municipales suelen exigir en temporada una pegatina de aparcamiento o una tarifa diaria; muchos municipios venden pegatinas semanales para visitantes: pregúntenos o consulte en el ayuntamiento. La Cape Cod National Seashore cobra en verano un pase diario o de temporada (se acepta el pase America the Beautiful). Báñese en playas vigiladas, cuidado con las corrientes de resaca y no pise las dunas: son frágiles, y las zonas acordonadas protegen los nidos de chorlitos y charranes."}, {"ic": "sos", "h": "Tiburones y focas", "al": 1, "p": "Los tiburones blancos cazan focas grises frente al Outer Cape y las islas, sobre todo de julio a octubre. Quédese cerca de la orilla, donde el agua no le pase de la cintura, nade en grupo, aléjese de las focas y no se bañe al amanecer ni al anochecer. Las banderas moradas con un tiburón son un recordatorio; si una playa está cerrada al baño, no entre en el agua. La app Sharktivity publica los avistamientos recientes."}, {"ic": "bug", "h": "Garrapatas y hiedra venenosa", "p": "Las garrapatas de ciervo transmiten la enfermedad de Lyme y otras infecciones: en senderos y hierba alta, lleve pantalón largo metido en los calcetines, use repelente y revísese cada noche, igual que a los niños y las mascotas. Retire cualquier garrapata enseguida con unas pinzas finas y consulte a un médico si aparecen erupción o fiebre. La hiedra venenosa crece por todas partes en caminos y dunas: si tiene tres hojas, no la toque."}, {"ic": "wind", "h": "Huracanes y nor’easters", "al": 1, "p": "La temporada de huracanes va de junio a noviembre, con el pico de agosto a octubre; los nor’easters traen viento e inundaciones costeras en otoño e invierno. Siga los avisos del National Weather Service y del municipio, averigüe si está en una zona de evacuación por huracán y salga si las autoridades lo ordenan. No cruce nunca una carretera inundada: 30 cm de agua en movimiento pueden arrastrar un coche. Los ferris se cancelan con viento fuerte: deje margen antes de un vuelo de regreso."}, {"ic": "list", "h": "Ferris y reservas", "p": "Para Martha’s Vineyard y Nantucket, reserve con meses de antelación el coche en la Steamship Authority (Woods Hole, Hyannis) para el verano; a pie no hace falta reserva, pero compre los billetes pronto en temporada alta. Hy-Line (Hyannis), Island Queen (Falmouth), Seastreak (New Bedford) y Vineyard Fast Ferry (Quonset Point, RI) solo llevan pasajeros. En temporada, ferris rápidos unen Provincetown con Boston y Plymouth; el Block Island Ferry sale de Point Judith."}, {"ic": "car", "h": "Puentes y tráfico", "p": "Todos los coches entran al cabo por el puente de Sagamore o el de Bourne: en verano, evite entrar el viernes por la tarde y el sábado por la mañana y salir el domingo por la tarde, y cuente con obras. La Route 6A es lenta pero preciosa; la Route 28 se satura en verano. El tren CapeFLYER va de Boston a Hyannis los fines de semana de verano, y el autobús y la bici son la forma más fácil de moverse por Provincetown y las islas."}, {"ic": "coins", "h": "Propinas, permisos y costumbres", "p": "Deje un 18–20 % de propina en los restaurantes y 1–2 $ por bebida en la barra. Los puestos de granja suelen funcionar con una caja de confianza: lleve algo de efectivo. La pesca en el mar exige una licencia estatal (Massachusetts, Rhode Island y Connecticut tienen la suya) y recoger almejas requiere un permiso municipal de marisqueo; las normas y zonas cerradas cambian, consulte en el ayuntamiento. En otoño, vista de naranja fluorescente en los senderos del bosque durante la temporada de caza."}], "fr": [{"ic": "sun", "h": "Au fil des saisons", "p": "Les étés sont doux plutôt que chauds, avec des maximales autour de 75–80 °F (24–27 °C) et des nuits fraîches. Le Nantucket Sound et Buzzards Bay atteignent environ 70 °F (21 °C) en août ; côté Atlantique, l’eau reste plus vive. Septembre et octobre sont le secret des habitants : eau tiède et plages tranquilles. De Columbus Day (octobre) à Memorial Day (fin mai), beaucoup de boutiques, restaurants et ferries réduisent leurs horaires : vérifiez avant de partir. Le brouillard peut tomber à tout moment, surtout sur les îles."}, {"ic": "sea", "h": "Plages, vignettes & dunes", "p": "Les plages communales exigent en général, en saison, une vignette de stationnement ou un forfait à la journée ; beaucoup de communes vendent des vignettes hebdomadaires pour les visiteurs : demandez-nous ou à la mairie. La Cape Cod National Seashore fait payer l’été un pass à la journée ou à la saison (le pass America the Beautiful est accepté). Baignez-vous sur les plages surveillées, méfiez-vous des courants d’arrachement et ne marchez pas sur les dunes : elles sont fragiles, et les zones balisées protègent les nids des pluviers siffleurs et des sternes."}, {"ic": "sos", "h": "Requins & phoques", "al": 1, "p": "Des requins blancs chassent les phoques gris au large de l’Outer Cape et des îles, surtout de juillet à octobre. Restez près du bord, avec de l’eau jusqu’à la taille au plus, nagez en groupe, éloignez-vous des phoques et évitez l’aube et le crépuscule. Les drapeaux violets à requin sont un rappel ; si une plage est fermée à la baignade, n’entrez pas dans l’eau. L’application Sharktivity signale les observations récentes."}, {"ic": "bug", "h": "Tiques & sumac vénéneux", "p": "Les tiques du cerf transmettent la maladie de Lyme et d’autres infections : sur les sentiers et dans les hautes herbes, portez un pantalon rentré dans les chaussettes, un répulsif, et inspectez-vous chaque soir, ainsi que les enfants et les animaux. Retirez vite toute tique avec une pince fine et consultez un médecin en cas de rougeur ou de fièvre. Le sumac vénéneux (poison ivy) pousse partout le long des chemins et des dunes : trois folioles, on n’y touche pas."}, {"ic": "wind", "h": "Ouragans & nor’easters", "al": 1, "p": "La saison des ouragans va de juin à novembre, avec un pic d’août à octobre ; les nor’easters apportent vent et submersions côtières en automne et en hiver. Suivez les alertes du National Weather Service et de la commune, vérifiez si vous êtes en zone d’évacuation et partez si les autorités l’ordonnent. Ne traversez jamais une route inondée : 30 cm d’eau courante suffisent à emporter une voiture. Les ferries sont annulés par grand vent : prévoyez de la marge avant un vol retour."}, {"ic": "list", "h": "Ferries & réservations", "p": "Pour Martha’s Vineyard et Nantucket, réservez la voiture sur la Steamship Authority (Woods Hole, Hyannis) des mois à l’avance pour l’été ; les piétons embarquent sans réservation, mais achetez vos billets tôt en haute saison. Hy-Line (Hyannis), l’Island Queen (Falmouth), Seastreak (New Bedford) et le Vineyard Fast Ferry (Quonset Point, RI) ne prennent que des passagers. En saison, des ferries rapides relient Provincetown à Boston et à Plymouth ; le Block Island Ferry part de Point Judith."}, {"ic": "car", "h": "Ponts & circulation", "p": "Toutes les voitures entrent sur le cap par le pont de Sagamore ou celui de Bourne : l’été, évitez d’arriver le vendredi après-midi ou le samedi matin et de repartir le dimanche après-midi, et prévoyez des travaux. La Route 6A est lente mais superbe ; la Route 28 est chargée l’été. Le train CapeFLYER relie Boston à Hyannis les week-ends d’été, et bus et vélo sont les moyens les plus simples pour circuler à Provincetown et sur les îles."}, {"ic": "coins", "h": "Pourboires, permis & usages", "p": "Laissez 18 à 20 % de pourboire au restaurant et 1 à 2 $ par verre au bar. Les stands de ferme fonctionnent souvent avec une caisse de confiance : prévoyez un peu de liquide. La pêche en mer exige un permis de l’État (Massachusetts, Rhode Island et Connecticut ont chacun le leur) et la pêche aux palourdes un permis communal ; règles et zones fermées changent, renseignez-vous en mairie. En automne, portez de l’orange fluo sur les sentiers forestiers pendant la saison de chasse."}], "de": [{"ic": "sun", "h": "Im Lauf der Jahreszeiten", "p": "Die Sommer sind eher warm als heiß, mit Höchstwerten um 75–80 °F (24–27 °C) und kühlen Nächten. Nantucket Sound und Buzzards Bay erreichen im August etwa 70 °F (21 °C), die Atlantikseite bleibt frischer. September und Oktober sind der Geheimtipp: warmes Wasser, leere Strände. Zwischen Columbus Day (Oktober) und Memorial Day (Ende Mai) haben viele Läden, Restaurants und Fähren kürzere Zeiten, also vorher nachsehen. Nebel kann jederzeit aufziehen, vor allem auf den Inseln."}, {"ic": "sea", "h": "Strände, Plaketten & Dünen", "p": "Gemeindestrände verlangen in der Saison meist eine Parkplakette oder eine Tagesgebühr; viele Gemeinden verkaufen Wochenplaketten für Gäste, fragen Sie uns oder im Rathaus. Die Cape Cod National Seashore erhebt im Sommer eine Tages- oder Saisongebühr (der America-the-Beautiful-Pass gilt). Baden Sie an bewachten Stränden, achten Sie auf Rippströmungen und betreten Sie keine Dünen: Sie sind empfindlich, und abgesperrte Bereiche schützen brütende Regenpfeifer und Seeschwalben."}, {"ic": "sos", "h": "Haie & Robben", "al": 1, "p": "Weiße Haie jagen Kegelrobben vor dem Outer Cape und den Inseln, vor allem von Juli bis Oktober. Bleiben Sie in Ufernähe, wo das Wasser höchstens hüfttief ist, schwimmen Sie in Gruppen, halten Sie Abstand zu Robben und baden Sie nicht in der Morgen- und Abenddämmerung. Lila Hai-Flaggen erinnern daran; ist ein Strand für Badegäste gesperrt, bleiben Sie aus dem Wasser. Die App Sharktivity meldet aktuelle Sichtungen."}, {"ic": "bug", "h": "Zecken & Giftefeu", "p": "Hirschzecken übertragen Borreliose (Lyme) und andere Infektionen: Auf Wegen und im hohen Gras lange Hosen in die Socken stecken, Schutzmittel auftragen und sich, die Kinder und Haustiere jeden Abend absuchen. Zecken sofort mit einer feinen Pinzette entfernen und bei Ausschlag oder Fieber zum Arzt gehen. Giftefeu (Poison Ivy) wächst überall an Wegen und Dünen: Drei Blätter? Finger weg."}, {"ic": "wind", "h": "Hurrikane & Nor’easter", "al": 1, "p": "Die Hurrikansaison dauert von Juni bis November, mit Höhepunkt von August bis Oktober; Nor’easter bringen im Herbst und Winter Sturm und Küstenhochwasser. Verfolgen Sie die Warnungen des National Weather Service und der Gemeinde, prüfen Sie, ob Sie in einer Hurrikan-Evakuierungszone sind, und verlassen Sie sie, wenn die Behörden es anordnen. Nie durch überflutete Straßen fahren: 30 cm fließendes Wasser reichen, um ein Auto mitzureißen. Bei Sturm fallen Fähren aus, also vor dem Rückflug Puffer einplanen."}, {"ic": "list", "h": "Fähren & Reservierungen", "p": "Für Martha’s Vineyard und Nantucket den Autoplatz bei der Steamship Authority (Woods Hole, Hyannis) für den Sommer Monate im Voraus buchen; Fußgänger brauchen keine Reservierung, sollten in der Hochsaison aber früh Tickets kaufen. Hy-Line (Hyannis), Island Queen (Falmouth), Seastreak (New Bedford) und Vineyard Fast Ferry (Quonset Point, RI) befördern nur Passagiere. In der Saison fahren Schnellfähren von Boston und Plymouth nach Provincetown; die Block Island Ferry legt in Point Judith ab."}, {"ic": "car", "h": "Brücken & Verkehr", "p": "Jedes Auto kommt über die Sagamore- oder die Bourne-Brücke aufs Kap: Im Sommer Freitagnachmittag und Samstagvormittag für die Anreise sowie Sonntagnachmittag für die Abreise meiden und mit Baustellen rechnen. Die Route 6A ist langsam, aber wunderschön; die Route 28 ist im Sommer voll. Der CapeFLYER-Zug fährt an Sommerwochenenden von Boston nach Hyannis, und in Provincetown und auf den Inseln kommt man am einfachsten mit Bus und Fahrrad voran."}, {"ic": "coins", "h": "Trinkgeld, Genehmigungen & Gepflogenheiten", "p": "Im Restaurant 18–20 % Trinkgeld geben, an der Bar etwa 1–2 $ pro Getränk. Hofstände arbeiten oft mit einer Vertrauenskasse, also etwas Bargeld dabeihaben. Angeln im Meer erfordert eine staatliche Lizenz (Massachusetts, Rhode Island und Connecticut haben jeweils eigene), Muschelsammeln eine Genehmigung der Gemeinde; Regeln und Sperrgebiete ändern sich, im Rathaus nachfragen. Im Herbst während der Jagdsaison auf Waldwegen leuchtendes Orange tragen."}]}, "TERROIR": {"en": [["Wellfleet oysters", "Cold, briny oysters from Wellfleet Harbor; also look for Cotuit, Duxbury and Katama Bay oysters on raw-bar menus", "all year, best Sep – Apr"], ["Cranberries", "Massachusetts’ official state berry, grown in sandy bogs in Plymouth County and on the Cape; at harvest, flooded bogs turn crimson", "harvest mid-Sep – early Nov"], ["Lobster rolls", "Served cold with a little mayonnaise in Massachusetts, or warm with melted butter, “Connecticut style”", "summer"], ["Clam shacks & chowder", "Creamy New England clam chowder, fried whole-belly clams and steamers; Rhode Island serves its chowder in a clear broth, with clam cakes", "summer; many shacks close in winter"], ["Bay scallops", "Small, sweet bay scallops from Nantucket and Cape waters; the commercial season opens in November", "Nov – Mar"], ["Striped bass & bluefish", "The great sport fish of the coast, caught from the surf and from boats and grilled fresh in harbor restaurants", "late May – Oct"], ["Stuffies & johnnycakes", "Rhode Island classics: baked stuffed quahogs, and thin cornmeal griddle cakes", "all year"], ["Coastal New England wine", "The Southeastern New England appellation spans the coast from Cape Cod to Connecticut: try Truro Vineyards, Newport Vineyards, Sakonnet or Stonington Vineyards", "all year; some tasting rooms seasonal"], ["Del’s Lemonade & coffee milk", "Rhode Island’s frozen lemonade, sold from summer trucks, and coffee milk, the official state drink", "Del’s in summer"], ["Cape Cod chips & local beer", "Kettle-cooked chips made in Hyannis since 1980, and craft breweries from Cape Cod Beer to Nantucket’s Cisco Brewers", "all year"]], "es": [["Ostras de Wellfleet", "Ostras salinas de aguas frías del puerto de Wellfleet; busque también en las barras de marisco las de Cotuit, Duxbury y Katama Bay", "todo el año, mejores de sept. a abr."], ["Arándanos rojos", "La baya oficial de Massachusetts, cultivada en turberas arenosas del condado de Plymouth y del cabo; en la cosecha, los campos inundados se tiñen de carmesí", "cosecha de mediados de sept. a principios de nov."], ["Lobster roll", "Bocadillo de langosta: frío con un poco de mayonesa en Massachusetts, o caliente con mantequilla fundida, «al estilo Connecticut»", "verano"], ["Clam shacks y chowder", "Crema de almejas New England, almejas enteras fritas y almejas al vapor; en Rhode Island la sopa es de caldo claro y se acompaña de buñuelos de almeja", "verano; muchos puestos cierran en invierno"], ["Vieiras de bahía", "Pequeñas vieiras dulces de Nantucket y del cabo; la temporada comercial se abre en noviembre", "nov. – mar."], ["Lubina rayada y anjova", "Los grandes peces de pesca deportiva de la costa, capturados desde la orilla o en barco y servidos a la parrilla en los restaurantes del puerto", "finales de mayo – oct."], ["Stuffies y johnnycakes", "Clásicos de Rhode Island: almejas quahog rellenas al horno y finas tortitas de maíz a la plancha", "todo el año"], ["Vinos de la costa de Nueva Inglaterra", "La denominación Southeastern New England abarca la costa de Cape Cod a Connecticut: pruebe Truro Vineyards, Newport Vineyards, Sakonnet o Stonington Vineyards", "todo el año; algunas salas de cata solo en temporada"], ["Del’s Lemonade y coffee milk", "La limonada granizada de Rhode Island, vendida en camionetas en verano, y la leche con café, bebida oficial del estado", "Del’s en verano"], ["Patatas Cape Cod y cerveza local", "Patatas fritas en caldera elaboradas en Hyannis desde 1980 y cervecerías artesanas, de Cape Cod Beer a Cisco Brewers en Nantucket", "todo el año"]], "fr": [["Huîtres de Wellfleet", "Huîtres iodées d’eau froide du port de Wellfleet ; cherchez aussi celles de Cotuit, Duxbury et Katama Bay dans les bars à huîtres", "toute l’année, idéales de sept. à avr."], ["Canneberges", "La baie officielle du Massachusetts, cultivée dans des tourbières sableuses du comté de Plymouth et du cap ; à la récolte, les champs inondés virent au cramoisi", "récolte mi-sept. – début nov."], ["Lobster roll", "Le sandwich au homard : froid avec un peu de mayonnaise au Massachusetts, ou chaud au beurre fondu, « à la Connecticut »", "été"], ["Clam shacks & chowder", "Velouté de palourdes à la New England, palourdes entières frites et palourdes vapeur ; au Rhode Island, la chowder se sert en bouillon clair, avec des beignets de palourdes", "été ; beaucoup de cabanes ferment l’hiver"], ["Pétoncles de baie", "Petits pétoncles sucrés de Nantucket et du cap ; la saison commerciale ouvre en novembre", "nov. – mars"], ["Bar rayé & tassergal", "Les grands poissons de pêche sportive de la côte, pris depuis la plage ou en bateau et grillés tout frais dans les restaurants du port", "fin mai – oct."], ["Stuffies & johnnycakes", "Classiques du Rhode Island : palourdes quahog farcies au four et fines galettes de maïs cuites à la plancha", "toute l’année"], ["Vins de la côte de Nouvelle-Angleterre", "L’appellation Southeastern New England couvre la côte du cap Cod au Connecticut : goûtez Truro Vineyards, Newport Vineyards, Sakonnet ou Stonington Vineyards", "toute l’année ; certaines salles de dégustation saisonnières"], ["Del’s Lemonade & coffee milk", "La citronnade glacée du Rhode Island, vendue l’été dans des camionnettes, et le lait au café, boisson officielle de l’État", "Del’s l’été"], ["Chips Cape Cod & bière locale", "Chips cuites en chaudron à Hyannis depuis 1980, et brasseries artisanales, de Cape Cod Beer à Cisco Brewers à Nantucket", "toute l’année"]], "de": [["Wellfleet-Austern", "Salzige Kaltwasseraustern aus dem Hafen von Wellfleet; auf den Karten der Austernbars auch nach Cotuit, Duxbury und Katama Bay Ausschau halten", "ganzjährig, am besten Sept. – Apr."], ["Cranberrys", "Die offizielle Staatsbeere von Massachusetts, angebaut in sandigen Mooren im Plymouth County und auf dem Kap; zur Ernte färben sich die gefluteten Felder purpurrot", "Ernte Mitte Sept. – Anfang Nov."], ["Lobster Roll", "Hummerbrötchen: kalt mit etwas Mayonnaise in Massachusetts oder warm mit geschmolzener Butter nach „Connecticut-Art“", "Sommer"], ["Clam Shacks & Chowder", "Cremige New-England-Muschelsuppe, frittierte ganze Muscheln und gedämpfte Steamers; in Rhode Island wird die Chowder als klare Brühe mit Muschelkrapfen serviert", "Sommer; viele Buden im Winter geschlossen"], ["Bay Scallops", "Kleine, süße Buchtmuscheln aus Nantucket und den Gewässern des Kaps; die kommerzielle Saison beginnt im November", "Nov. – März"], ["Streifenbarsch & Blaubarsch", "Die großen Sportfische der Küste, vom Strand oder Boot aus gefangen und in den Hafenrestaurants frisch gegrillt", "Ende Mai – Okt."], ["Stuffies & Johnnycakes", "Klassiker aus Rhode Island: gefüllte, überbackene Quahog-Muscheln und dünne Maismehlpfannkuchen", "ganzjährig"], ["Wein von der Neuengland-Küste", "Die Herkunftsbezeichnung Southeastern New England reicht von Cape Cod bis Connecticut: probieren Sie Truro Vineyards, Newport Vineyards, Sakonnet oder Stonington Vineyards", "ganzjährig; manche Probierstuben saisonal"], ["Del’s Lemonade & Coffee Milk", "Rhode Islands gefrorene Limonade, im Sommer aus Verkaufswagen, und Milch mit Kaffeesirup, das offizielle Staatsgetränk", "Del’s im Sommer"], ["Cape-Cod-Chips & lokales Bier", "Im Kessel frittierte Chips aus Hyannis seit 1980 und Craft-Brauereien von Cape Cod Beer bis Cisco Brewers auf Nantucket", "ganzjährig"]]}, "AGENDA": {"en": [["late April", "Daffodil Festival, Nantucket", "Antique cars decked in daffodils parade to ’Sconset for tailgate picnics
