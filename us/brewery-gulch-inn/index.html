n : fenêtres fermées quand elle tourne, 74 °F (23 °C) suffisent, et on l'éteint en sortant.", "pool_t": "La piscine", "pool": ["Ouverte de 8 h à 21 h.", "Piscine non surveillée : les enfants restent toujours sous la surveillance d'un adulte.", "Une douche avant la baignade, et pas de verre autour du bassin."], "tub_t": "Le jacuzzi", "tub": ["Limitez chaque bain à 15 minutes environ, et buvez beaucoup d'eau.", "Déconseillé aux jeunes enfants et pendant la grossesse ; enfants uniquement avec un adulte.", "Pas de verre, et remettez la couverture après usage."], "bf_t": "Petit-déjeuner", "bf": "Servi de 8 h à 10 h, avec des produits locaux. Signalez-nous vos allergies la veille.", "table_t": "Dîner", "table": "Sur réservation, la veille.", "spa_t": "Spa", "spa": "Soins sur réservation : demandez-nous un créneau.", "safe_t": "Sécurité", "safe": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone. L'extincteur et la trousse de secours sont dans la cuisine. En cas d'urgence, faites d'abord sortir tout le monde, puis appelez le 911.", "trash_t": "Poubelles et recyclage", "trash": "Ordures et recyclage vont dans les bacs que nous vous montrerons. Rincez les emballages, et pas de sacs plastiques dans le recyclage.", "c3": "Autour de {c}", "near_t": "À voir près d'ici", "market_t": "Marchés fermiers", "market_n": "Jours et saisons indicatifs : vérifiez avant d'y aller.", "maps": "Itinéraire", "c4": "Infos pratiques", "seas_t": "La météo", "seas": "Consultez la météo avant toute sortie : le temps peut changer vite, surtout en montagne et sur la côte.", "sea_t": "L'océan", "sea": "Baignez-vous sur les plages surveillées et respectez les drapeaux. Pris dans un courant d'arrachement ? Ne luttez pas : nagez parallèlement au rivage, puis revenez.", "sos_t": "Urgences", "sos": [["911", "Police, pompiers, ambulance"], ["1-800-222-1222", "Centre antipoison"], ["988", "Ligne d'écoute suicide et crise"]], "tax_t": "Taxe d'hébergement", "tax": "Les taxes de l'État et locales sur l'hébergement s'ajoutent au prix de la chambre. Réservé sur Airbnb ou Vrbo ? La plateforme les perçoit en général pour vous.", "c5": "Départ", "out_t": "Avant de partir", "out": ["Clés dans la boîte à clés ou à l'endroit convenu", "Fenêtres fermées, portes verrouillées", "Thermostat baissé, lumières éteintes", "Vaisselle faite ou lave-vaisselle lancé", "Poubelles et recyclage dans les bacs extérieurs", "Rien d'oublié : chargeurs, frigo, salle de bains"], "thanks": "Merci d'avoir séjourné chez nous ! Un avis sur Google ou sur le site où vous avez réservé nous aide énormément.", "gallery": "En images", "ex": "à compléter", "made": "Préparé par Umbra Agency pour {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen bei {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Tipps. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 15 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Wegbeschreibung schicken wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi auf den letzten Meilen manchmal: Folgen Sie unserer Beschreibung und laden Sie Offline-Karten herunter, falls der Mobilfunkempfang abbricht.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, dann richten wir den Self-Check-in ein (Schlüsselbox oder Zahlenschloss).", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht, auch keine E-Zigaretten.", "Nachtruhe von 22 bis 8 Uhr: Geräusche tragen hier weit.", "Keine Partys oder Veranstaltungen und nicht mehr Gäste als in der Buchung angegeben.", "Beim Hinausgehen bitte Türen abschließen und Fenster schließen."], "pets": "Haustiere: auf Anfrage, bitte vor der Buchung fragen.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, etwa 74 °F (23 °C) genügen, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 8 bis 21 Uhr.", "Kein Bademeister: Kinder nur unter ständiger Aufsicht eines Erwachsenen.", "Vor dem Schwimmen duschen, kein Glas im Poolbereich."], "tub_t": "Der Whirlpool", "tub": ["Nicht länger als etwa 15 Minuten am Stück baden und viel Wasser trinken.", "Nicht empfohlen für kleine Kinder und in der Schwangerschaft; Kinder nur mit einem Erwachsenen.", "Kein Glas, und bitte die Abdeckung nach dem Baden wieder auflegen."], "bf_t": "Frühstück", "bf": "Von 8 bis 10 Uhr, mit Zutaten aus der Region. Allergien bitte am Vortag mitteilen.", "table_t": "Abendessen", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Anwendungen auf Anfrage: Fragen Sie uns nach einem Termin.", "safe_t": "Sicherheit", "safe": "Im ganzen Haus sind Rauch- und Kohlenmonoxidmelder installiert. Feuerlöscher und Erste-Hilfe-Kasten finden Sie in der Küche. Im Notfall zuerst alle nach draußen bringen, dann 911 anrufen.", "trash_t": "Müll und Recycling", "trash": "Müll und Wertstoffe kommen in die Tonnen, die wir Ihnen zeigen. Behälter ausspülen und keine Plastiktüten in den Recyclingmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Bauernmärkte", "market_n": "Tage und Saison ohne Gewähr: bitte vorher prüfen.", "maps": "Route", "c4": "Praktische Tipps", "seas_t": "Das Wetter", "seas": "Vor Ausflügen den Wetterbericht prüfen: Das Wetter kann schnell umschlagen, vor allem in den Bergen und an der Küste.", "sea_t": "Der Ozean", "sea": "Nur an bewachten Stränden baden und die Flaggen beachten. In einer Rippströmung? Nicht dagegen anschwimmen: parallel zum Ufer schwimmen, dann zurück an Land.", "sos_t": "Notfälle", "sos": [["911", "Polizei, Feuerwehr, Rettungsdienst"], ["1-800-222-1222", "Giftnotruf (Poison Control)"], ["988", "Krisen- und Suizid-Hotline"]], "tax_t": "Beherbergungssteuer", "tax": "Staatliche und lokale Steuern auf Übernachtungen kommen zum Zimmerpreis hinzu. Über Airbnb oder Vrbo gebucht? Dann zieht sie meist die Plattform für Sie ein.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel in der Schlüsselbox oder am vereinbarten Ort", "Fenster zu, Türen abgeschlossen", "Thermostat heruntergedreht, Licht aus", "Geschirr gespült oder Spülmaschine an", "Müll und Recycling in die Tonnen draußen", "Nichts vergessen: Ladegeräte, Kühlschrank, Bad"], "thanks": "Danke für Ihren Aufenthalt! Eine Bewertung bei Google oder dort, wo Sie gebucht haben, hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Erstellt von Umbra Agency für {n}"}};
var R={"NAV4": {"en": "California tips", "es": "Consejos de California", "fr": "Californie pratique", "de": "Kalifornien-Tipps"}, "RULES": {"en": ["Permit: this home is rented under its local vacation-rental permit or license, and the number appears in its listings. Stays under 30 nights are banned in unincorporated Napa County, in Carmel’s single-family zone and in most residential zones of unincorporated Santa Barbara County.", "Occupancy: no more overnight guests than the permit allows (in the City of Napa, two per bedroom plus two, ten at most), and no parties, weddings or commercial events.", "Local contact: a host or manager can be reached 24/7 and will respond quickly; the number is posted inside with the emergency information.", "Quiet hours, generally 10pm–7am: no amplified music outdoors, and keep voices low on decks and in hot tubs.", "Parking: use only the spaces provided. Never block narrow rural roads, driveways or hydrants: fire engines must always get through.", "Fire: fireworks are banned in most of the region; no open flames outdoors and no charcoal on Red Flag days. Smoke only where allowed, never near dry grass.", "Lodging tax: the local transient occupancy tax and tourism assessments apply to stays of 30 nights or fewer, and are added to your bill or collected by the booking platform."], "es": ["Permiso: esta casa se alquila con su permiso o licencia local de alquiler vacacional, cuyo número figura en sus anuncios. Las estancias de menos de 30 noches están prohibidas en el condado no incorporado de Napa, en la zona unifamiliar de Carmel y en la mayoría de zonas residenciales no incorporadas del condado de Santa Bárbara.", "Ocupación: no más huéspedes por noche de los que permite el permiso (en la ciudad de Napa, dos por dormitorio más dos, con un máximo de diez); no se admiten fiestas, bodas ni eventos comerciales.", "Contacto local: un anfitrión o gestor está localizable las 24 horas y responderá rápido; el número está a la vista dentro de la casa, junto a la información de emergencia.", "Horario de silencio, en general de 22:00 a 7:00: nada de música amplificada fuera, y hable bajo en terrazas y jacuzzis.", "Aparcamiento: use solo las plazas previstas. Nunca bloquee caminos rurales estrechos, accesos ni hidrantes: los bomberos siempre deben poder pasar.", "Fuego: los fuegos artificiales están prohibidos en casi toda la región; nada de llamas al aire libre ni carbón los días de alerta roja (Red Flag). Fume solo donde esté permitido y nunca cerca de hierba seca.", "Impuesto de alojamiento: el impuesto local de ocupación transitoria (TOT) y las tasas turísticas se aplican a estancias de 30 noches o menos y se añaden a su factura o los cobra la plataforma de reserva."], "fr": ["Autorisation : ce logement est loué sous son permis ou sa licence locale de location saisonnière, dont le numéro figure dans ses annonces. Les séjours de moins de 30 nuits sont interdits dans la partie non incorporée du comté de Napa, dans la zone pavillonnaire de Carmel et dans la plupart des zones résidentielles non incorporées du comté de Santa Barbara.", "Capacité : pas plus d’occupants la nuit que ne l’autorise le permis (dans la ville de Napa, deux par chambre plus deux, dix au maximum) ; ni fêtes, ni mariages, ni événements commerciaux.", "Contact local : un hôte ou gestionnaire est joignable 24 h/24 et intervient rapidement ; son numéro est affiché dans le logement avec les consignes d’urgence.", "Calme, en général de 22 h à 7 h : pas de musique amplifiée dehors, et l’on parle bas sur la terrasse et dans le spa.", "Stationnement : uniquement sur les places prévues. Ne bloquez jamais les routes de campagne étroites, les accès ni les bouches d’incendie : les pompiers doivent toujours pouvoir passer.", "Feu : les feux d’artifice sont interdits presque partout dans la région ; aucune flamme nue dehors et pas de charbon les jours d’alerte rouge (Red Flag). On ne fume qu’aux endroits autorisés, jamais près de l’herbe sèche.", "Taxe de séjour : la taxe locale d’occupation (TOT) et les contributions touristiques s’appliquent aux séjours de 30 nuits ou moins ; elles figurent sur votre facture ou sont perçues par la plateforme de réservation."], "de": ["Genehmigung: Dieses Haus wird mit seiner örtlichen Ferienvermietungsgenehmigung bzw. -lizenz vermietet; die Nummer steht in den Inseraten. Aufenthalte unter 30 Nächten sind im gemeindefreien Napa County, in Carmels Einfamilienhauszone und in den meisten Wohngebieten des gemeindefreien Santa Barbara County verboten.", "Belegung: nicht mehr Übernachtungsgäste, als die Genehmigung erlaubt (in der Stadt Napa zwei pro Schlafzimmer plus zwei, höchstens zehn); keine Partys, Hochzeiten oder gewerblichen Veranstaltungen.", "Ansprechpartner vor Ort: Gastgeber oder Verwalter sind rund um die Uhr erreichbar und reagieren schnell; die Nummer hängt im Haus bei den Notfallinformationen.", "Ruhezeiten in der Regel 22–7 Uhr: keine verstärkte Musik im Freien, und auf Terrasse und im Whirlpool bitte leise sprechen.", "Parken: nur auf den vorgesehenen Plätzen. Nie enge Landstraßen, Einfahrten oder Hydranten blockieren: Die Feuerwehr muss immer durchkommen.", "Feuer: Feuerwerk ist fast in der ganzen Region verboten; keine offenen Flammen im Freien und keine Holzkohle an Red-Flag-Tagen. Rauchen nur, wo erlaubt, nie in der Nähe von trockenem Gras.", "Beherbergungssteuer: Die örtliche Transient Occupancy Tax (TOT) und Tourismusabgaben gelten für Aufenthalte bis 30 Nächte; sie stehen auf Ihrer Rechnung oder werden von der Buchungsplattform erhoben."]}, "HOUSE": {"en": [{"ic": "sun", "h": "Heating, cooling & fireplace", "p": "The inland valleys (Napa, Sonoma, Paso Robles, Santa Ynez) often reach 90–100 °F in summer, while the coast stays cool and foggy. Close blinds and windows in the afternoon heat and open up as it cools at night; if there’s air conditioning, keep doors shut while it runs and switch it off when you go out. Fireplace or wood stove: use only the wood provided, keep the screen closed, never leave a fire unattended and put ashes in the metal bucket outside, never in a bin. In Napa and southern Sonoma, wood burning is banned on winter <b>Spare the Air<\/b> alert days."}, {"ic": "leaf", "h": "Water, well & septic", "p": "California is prone to drought: take short showers and run the dishwasher and washing machine only when full. Many country homes have a <b>well and septic system<\/b>: only toilet paper in the toilet, no wipes (even ‘flushable’ ones), grease or harsh chemicals. If the house is on a well, we’ll tell you on arrival whether the tap water is for drinking."}, {"ic": "bin", "h": "Recycling & trash", "ul": ["Blue cart: clean recycling (paper, cardboard, cans, glass and plastic bottles and tubs).", "Green cart: food scraps and yard waste, as California’s organics law requires.", "Black or grey cart: everything else, in tied bags.", "Collection is curbside on a set day each week; we’ll tell you when to wheel the carts out and back in.", "Keep lids closed and latched: raccoons, skunks and, in the hills, even black bears raid bins.", "Batteries, propane cylinders and electronics never go in the carts: leave them in the box provided."]}, {"ic": "sos", "h": "Safety & earthquakes", "p": "The home has smoke and carbon-monoxide alarms, as California law requires; we’ll show you the fire extinguisher, the first-aid kit and the exits when you arrive. In an earthquake: <b>Drop, Cover and Hold On<\/b> under a sturdy table, away from windows, until the shaking stops. If there’s a pool or hot tub, never leave children unsupervised, and no glass around it."}, {"ic": "home", "h": "Neighbors & quiet hours", "p": "Most counties and towns set quiet hours from about 10pm to 7am, and sound carries far across the vineyards and canyons. Keep music indoors and voices low on the deck late at night. Use only the parking provided: neighbors, delivery trucks and fire engines rely on narrow rural lanes."}, {"ic": "fire", "h": "Wildfire season & Red Flag days", "al": 1, "p": "From roughly June to November, hot, dry, windy days bring <b>Red Flag Warnings<\/b>: no outdoor flames, no charcoal grills and no power tools on dry grass, and never park on dry vegetation (hot exhaust can start a fire). The garden is kept as <b>defensible space<\/b>, as California fire rules require in high-risk areas: please don’t pile firewood, cushions or trash against the house. If an evacuation order comes, leave at once and follow the routes given by the county."}], "es": [{"ic": "sun", "h": "Calefacción, aire acondicionado y chimenea", "p": "Los valles del interior (Napa, Sonoma, Paso Robles, Santa Ynez) suelen alcanzar 90–100 °F (32–38 °C) en verano, mientras la costa sigue fresca y con niebla. Cierre persianas y ventanas con el calor de la tarde y abra cuando refresque por la noche; si hay aire acondicionado, mantenga las puertas cerradas mientras funciona y apáguelo al salir. Chimenea o estufa de leña: use solo la leña que dejamos, mantenga la pantalla cerrada, no deje nunca el fuego sin vigilancia y vacíe las cenizas en el cubo metálico de fuera, nunca en un contenedor. En Napa y el sur de Sonoma está prohibido quemar leña los días de alerta invernal <b>Spare the Air<\/b>."}, {"ic": "leaf", "h": "Agua, pozo y fosa séptica", "p": "California sufre sequías con frecuencia: duchas cortas, y lavavajillas y lavadora solo con carga completa. Muchas casas de campo tienen <b>pozo y fosa séptica<\/b>: al inodoro solo papel higiénico, nada de toallitas (ni siquiera las «desechables»), grasa ni productos agresivos. Si la casa se abastece de un pozo, le diremos a su llegada si el agua del grifo es potable."}, {"ic": "bin", "h": "Reciclaje y basura", "ul": ["Contenedor azul: reciclaje limpio (papel, cartón, latas, vidrio, botellas y envases de plástico).", "Contenedor verde: restos de comida y de jardín, como exige la ley californiana de residuos orgánicos.", "Contenedor negro o gris: todo lo demás, en bolsas cerradas.", "La recogida es en la acera un día fijo por semana; le indicaremos cuándo sacar los contenedores y cuándo volver a meterlos.", "Mantenga las tapas cerradas y trabadas: mapaches, mofetas y, en las colinas, hasta osos negros abren los cubos.", "Pilas, bombonas de propano y aparatos electrónicos nunca van a los contenedores: déjelos en la caja prevista."]}, {"ic": "sos", "h": "Seguridad y terremotos", "p": "La casa tiene detectores de humo y de monóxido de carbono, como exige la ley de California; a su llegada le mostraremos el extintor, el botiquín y las salidas. En caso de terremoto: <b>agáchese, cúbrase y sujétese<\/b> bajo una mesa sólida, lejos de las ventanas, hasta que pare el temblor. Si hay piscina o jacuzzi, no deje nunca a los niños sin vigilancia, y nada de vidrio a su alrededor."}, {"ic": "home", "h": "Vecinos y horario de silencio", "p": "La mayoría de condados y municipios fijan horas de silencio de 22:00 a 7:00 aproximadamente, y el sonido llega lejos entre viñedos y cañones. Mantenga la música dentro y hable bajo en la terraza por la noche. Aparque solo en los sitios previstos: vecinos, repartidores y bomberos dependen de estos caminos rurales estrechos."}, {"ic": "fire", "h": "Temporada de incendios y días de alerta roja", "al": 1, "p": "Aproximadamente de junio a noviembre, los días calurosos, secos y ventosos traen <b>alertas Red Flag<\/b>: ni llamas al aire libre, ni barbacoas de carbón, ni herramientas eléctricas sobre hierba seca; nunca aparque sobre vegetación seca (el escape caliente puede prender fuego). El jardín se mantiene como <b>espacio defendible<\/b>, como exigen las normas contra incendios de California en zonas de riesgo: no apile leña, cojines ni basura contra la casa. Si se ordena una evacuación, salga de inmediato y siga las rutas indicadas por el condado."}], "fr": [{"ic": "sun", "h": "Chauffage, clim & cheminée", "p": "Les vallées intérieures (Napa, Sonoma, Paso Robles, Santa Ynez) atteignent souvent 90–100 °F (32–38 °C) l’été, alors que la côte reste fraîche et brumeuse. Fermez stores et fenêtres aux heures chaudes et ouvrez grand quand la nuit rafraîchit ; s’il y a la climatisation, gardez les portes fermées quand elle tourne et éteignez-la en sortant. Cheminée ou poêle : uniquement le bois fourni, pare-feu fermé, jamais de feu sans surveillance, et les cendres dans le seau métallique dehors, jamais dans une poubelle. À Napa et dans le sud du comté de Sonoma, il est interdit de brûler du bois les jours d’alerte hivernale <b>Spare the Air<\/b>."}, {"ic": "leaf", "h": "Eau, puits & fosse septique", "p": "La Californie connaît souvent la sécheresse : douches courtes, lave-vaisselle et lave-linge seulement quand ils sont pleins. Beaucoup de maisons de campagne ont un <b>puits et une fosse septique<\/b> : uniquement du papier toilette dans les WC, ni lingettes (même « jetables »), ni graisse, ni produits agressifs. Si la maison est sur puits, nous vous dirons à l’arrivée si l’eau du robinet est potable."}, {"ic": "bin", "h": "Tri & poubelles", "ul": ["Bac bleu : recyclables propres (papier, carton, canettes, verre, bouteilles et pots en plastique).", "Bac vert : restes alimentaires et déchets verts, comme l’impose la loi californienne sur les biodéchets.", "Bac noir ou gris : tout le reste, en sacs fermés.", "Collecte en bord de rue un jour fixe par semaine : nous vous dirons quand sortir les bacs et quand les rentrer.", "Gardez les couvercles fermés et verrouillés : ratons laveurs, mouffettes et, dans les collines, même les ours noirs fouillent les poubelles.", "Piles, bouteilles de propane et appareils électroniques ne vont jamais dans les bacs : déposez-les dans la boîte prévue."]}, {"ic": "sos", "h": "Sécurité & séismes", "p": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone, comme l’exige la loi californienne ; nous vous montrons l’extincteur, la trousse de secours et les sorties à l’arrivée. En cas de séisme : <b>à terre, à l’abri, on s’agrippe<\/b> (Drop, Cover, Hold On) sous une table solide, loin des fenêtres, jusqu’à la fin des secousses. Piscine ou spa : ne laissez jamais un enfant sans surveillance, et pas de verre autour."}, {"ic": "home", "h": "Voisins & heures calmes", "p": "La plupart des comtés et des villes imposent le calme d’environ 22 h à 7 h, et le son porte loin dans les vignes et les canyons. La musique reste à l’intérieur, et l’on parle bas sur la terrasse le soir. Garez-vous uniquement aux places prévues : voisins, livreurs et pompiers comptent sur ces petites routes étroites."}, {"ic": "fire", "h": "Saison des incendies & alertes rouges", "al": 1, "p": "Environ de juin à novembre, les journées chaudes, sèches et venteuses déclenchent des <b>alertes Red Flag<\/b> : aucune flamme dehors, pas de barbecue au charbon, pas d’outil électrique sur l’herbe sèche, et ne vous garez jamais sur de la végétation sèche (un pot d’échappement chaud peut l’enflammer). Le jardin est entretenu en <b>zone défendable<\/b>, comme l’exigent les règles californiennes dans les zones à risque : n’empilez ni bois, ni coussins, ni sacs contre la maison. En cas d’ordre d’évacuation, partez immédiatement par les itinéraires indiqués par le comté."}], "de": [{"ic": "sun", "h": "Heizung, Klimaanlage & Kamin", "p": "Die Täler im Landesinneren (Napa, Sonoma, Paso Robles, Santa Ynez) erreichen im Sommer oft 90–100 °F (32–38 °C), während die Küste kühl und neblig bleibt. Schließen Sie in der Nachmittagshitze Jalousien und Fenster und lüften Sie, wenn es nachts abkühlt; läuft eine Klimaanlage, Türen geschlossen halten und beim Weggehen ausschalten. Kamin oder Holzofen: nur das bereitgestellte Holz verwenden, Schutzgitter geschlossen halten, Feuer nie unbeaufsichtigt lassen und die Asche in den Metalleimer draußen geben, nie in eine Mülltonne. In Napa und im südlichen Sonoma County ist Holzfeuer an winterlichen <b>Spare-the-Air<\/b>-Alarmtagen verboten."}, {"ic": "leaf", "h": "Wasser, Brunnen & Klärgrube", "p": "Kalifornien leidet oft unter Dürre: kurz duschen und Spül- und Waschmaschine nur voll beladen laufen lassen. Viele Landhäuser haben <b>Brunnen und Klärgrube<\/b>: nur Toilettenpapier in die Toilette – keine Feuchttücher (auch keine „spülbaren“), kein Fett und keine scharfen Reiniger. Hängt das Haus an einem Brunnen, sagen wir Ihnen bei der Ankunft, ob das Leitungswasser trinkbar ist."}, {"ic": "bin", "h": "Mülltrennung", "ul": ["Blaue Tonne: saubere Wertstoffe (Papier, Karton, Dosen, Glas, Plastikflaschen und -becher).", "Grüne Tonne: Essensreste und Gartenabfälle, wie es Kaliforniens Biomüll-Gesetz vorschreibt.", "Schwarze oder graue Tonne: alles Übrige, in zugebundenen Beuteln.", "Abholung an der Straße an einem festen Wochentag; wir sagen Ihnen, wann die Tonnen hinaus- und wieder hereingestellt werden.", "Deckel geschlossen und verriegelt halten: Waschbären, Stinktiere und in den Hügeln sogar Schwarzbären plündern Tonnen.", "Batterien, Propankartuschen und Elektrogeräte gehören nie in die Tonnen: bitte in die bereitgestellte Kiste legen."]}, {"ic": "sos", "h": "Sicherheit & Erdbeben", "p": "Das Haus hat Rauch- und Kohlenmonoxidmelder, wie es das kalifornische Recht verlangt; Feuerlöscher, Erste-Hilfe-Set und Ausgänge zeigen wir Ihnen bei der Ankunft. Bei einem Erdbeben: <b>Drop, Cover, Hold On<\/b> – unter einen stabilen Tisch, weg von Fenstern, festhalten, bis das Beben aufhört. Bei Pool oder Whirlpool Kinder nie unbeaufsichtigt lassen, und kein Glas am Beckenrand."}, {"ic": "home", "h": "Nachbarn & Ruhezeiten", "p": "Die meisten Countys und Gemeinden schreiben Nachtruhe etwa von 22 bis 7 Uhr vor, und Schall trägt weit über Weinberge und Canyons. Musik bitte drinnen lassen und spätabends auf der Terrasse leise sprechen. Nur auf den vorgesehenen Plätzen parken: Nachbarn, Lieferwagen und Feuerwehr sind auf die schmalen Landstraßen angewiesen."}, {"ic": "fire", "h": "Waldbrandsaison & Red-Flag-Tage", "al": 1, "p": "Etwa von Juni bis November bringen heiße, trockene, windige Tage <b>Red-Flag-Warnungen<\/b>: keine offenen Flammen im Freien, kein Holzkohlegrill, keine Motorgeräte auf trockenem Gras, und nie auf trockener Vegetation parken (heiße Auspuffanlagen können sie entzünden). Der Garten wird als <b>Brandschutzzone<\/b> (Defensible Space) gepflegt, wie es Kaliforniens Brandschutzregeln in Risikogebieten verlangen: bitte kein Holz, keine Kissen und keinen Müll ans Haus stellen. Kommt eine Evakuierungsanordnung, sofort aufbrechen und den Routen des Countys folgen."}]}, "PRAT": {"en": [{"ic": "sun", "h": "Seasons & microclimates", "p": "Summer is hot and dry inland (often 90 °F and up) but foggy and cool on the coast: Big Sur or Mendocino can sit at 60 °F in July while Napa bakes. Bring layers wherever you go. Harvest (August–October) is the busiest and most beautiful season; the rains come mainly from November to March, when the hills turn green and the valleys are quiet."}, {"ic": "fire", "h": "Wildfire smoke & power shutoffs", "al": 1, "p": "During fire season, smoke can drift in from distant fires: check air quality on <b>AirNow.gov<\/b> and stay indoors with windows closed if it’s poor. On high-wind days the utility (PG&E across most of the region) may switch off power for a day or more as a <b>Public Safety Power Shutoff<\/b>: keep phones charged and a flashlight handy. Sign up for your county’s emergency alerts, and if you’re told to evacuate, go immediately. Report any fire or smoke to <b>911<\/b>."}, {"ic": "sos", "h": "Earthquakes & tsunamis", "al": 1, "p": "Earthquakes can strike without warning: <b>Drop, Cover and Hold On<\/b> until the shaking stops, then check for gas smells and damage. On the coast, if you feel a strong or long quake, don’t wait for an alert: walk inland or uphill at once, following the blue tsunami evacuation-route signs."}, {"ic": "sea", "h": "The Pacific", "al": 1, "p": "The ocean here is cold (around 50–58 °F), with rip currents and <b>sneaker waves<\/b> that surge far up the beach without warning: never turn your back on the water, and keep children and dogs well back on steep beaches and rocks. Few beaches have lifeguards. Check the tide tables before exploring tide pools, and keep at least 50 feet from seals, sea lions and elephant seals."}, {"ic": "car", "h": "Highway 1 & wine-country roads", "p": "Highway 1 through Big Sur is regularly closed by landslides: check <b>Caltrans QuickMap<\/b> or call 1-800-427-7623 before you set out. Fill up in Carmel or Cambria, use the turnouts to let faster cars pass, and expect no cell signal for long stretches. The drink-drive limit is 0.08% BAC: pick a designated driver or book a car service for tasting days. On weekends, the Silverado Trail is usually calmer than Highway 29."}, {"ic": "grape", "h": "Wine tasting", "p": "Most wineries take visitors by reservation, and many Napa estates are appointment-only under their county permits: book a few days ahead, especially at harvest and on weekends. Tasting fees vary widely, from about $25 to well over $100 in Napa, and are often waived if you buy wine. Ask before bringing children or dogs, and remember that many states limit what wineries can ship to you."}, {"ic": "bug", "h": "Nature & wildlife", "p": "Learn to spot <b>poison oak<\/b> (‘leaves of three, let it be’): it grows along most trails and causes an itchy rash. Check yourself for ticks after hikes in grass and woods. In warm months, watch for rattlesnakes on sunny trails; mountain lions and black bears are rarely seen, but never feed wildlife. Most state parks charge a day-use parking fee."}, {"ic": "coins", "h": "Tipping, hours & phone signal", "p": "Tipping is customary: 18–22% in restaurants, a dollar or two per drink at a bar, and something for drivers and guides. Sales tax is added at the register. In small towns, kitchens often close by 8 or 9pm and some restaurants close early in the week. Download offline maps: cell coverage is patchy in Big Sur, on the Mendocino coast and in the Anderson Valley."}], "es": [{"ic": "sun", "h": "Estaciones y microclimas", "p": "El verano es caluroso y seco en el interior (a menudo más de 90 °F / 32 °C), pero fresco y con niebla en la costa: en julio, Big Sur o Mendocino pueden estar a 60 °F (16 °C) mientras Napa se asa. Lleve siempre ropa por capas. La vendimia (de agosto a octubre) es la temporada más animada y más bonita; las lluvias llegan sobre todo de noviembre a marzo, cuando las colinas reverdecen y los valles están tranquilos."}, {"ic": "fire", "h": "Humo de incendios y cortes de luz", "al": 1, "p": "En temporada de incendios, el humo de fuegos lejanos puede llegar hasta aquí: consulte la calidad del aire en <b>AirNow.gov<\/b> y, si es mala, quédese dentro con las ventanas cerradas. Los días de viento fuerte, la compañía eléctrica (PG&E en casi toda la región) puede cortar la luz uno o varios días como medida preventiva (<b>Public Safety Power Shutoff<\/b>): tenga el móvil cargado y una linterna a mano. Suscríbase a las alertas de emergencia del condado y, si le piden evacuar, salga enseguida. Avise de cualquier fuego o humo al <b>911<\/b>."}, {"ic": "sos", "h": "Terremotos y tsunamis", "al": 1, "p": "Los terremotos llegan sin avisar: <b>agáchese, cúbrase y sujétese<\/b> hasta que pare el temblor, y luego compruebe si huele a gas o hay daños. En la costa, si siente un sismo fuerte o largo, no espere ninguna alerta: aléjese a pie hacia el interior o hacia zonas altas siguiendo las señales azules de ruta de evacuación por tsunami."}, {"ic": "sea", "h": "El Pacífico", "al": 1, "p": "El océano aquí es frío (unos 50–58 °F / 10–14 °C), con corrientes de resaca y <b>olas traicioneras<\/b> (sneaker waves) que suben mucho por la playa sin avisar: no dé nunca la espalda al mar y mantenga a niños y perros lejos de las playas empinadas y las rocas. Pocas playas tienen socorristas. Consulte las tablas de mareas antes de explorar las pozas, y manténgase a más de 15 m de focas, leones marinos y elefantes marinos."}, {"ic": "car", "h": "Highway 1 y carreteras del vino", "p": "La Highway 1 en Big Sur se corta con frecuencia por desprendimientos: consulte <b>Caltrans QuickMap<\/b> o llame al 1-800-427-7623 antes de salir. Llene el depósito en Carmel o Cambria, use los apartaderos para dejar pasar a los coches más rápidos y cuente con largos tramos sin cobertura. El límite de alcohol al volante es 0,08 %: designe un conductor o reserve un chófer para los días de catas. Los fines de semana, la Silverado Trail suele estar más tranquila que la Highway 29."}, {"ic": "grape", "h": "Catas de vino", "p": "La mayoría de bodegas recibe con reserva, y muchas fincas de Napa solo con cita previa por las condiciones de su permiso: reserve con unos días de antelación, sobre todo en vendimia y en fin de semana. Las catas cuestan muy distinto, desde unos 25 $ hasta bastante más de 100 $ en Napa, y a menudo se descuentan si compra vino. Pregunte antes de ir con niños o perros, y recuerde que muchos países y estados limitan el envío de vino."}, {"ic": "bug", "h": "Naturaleza y fauna", "p": "Aprenda a reconocer el <b>poison oak<\/b> (roble venenoso, de hojas en grupos de tres): crece junto a casi todos los senderos y provoca una erupción con picor. Revise si tiene garrapatas después de caminar por hierba o bosque. En los meses cálidos, cuidado con las serpientes de cascabel en senderos soleados; pumas y osos negros se ven muy poco, pero nunca alimente a los animales. Casi todos los parques estatales cobran el aparcamiento por día."}, {"ic": "coins", "h": "Propinas, horarios y cobertura", "p": "La propina es costumbre: 18–22 % en restaurantes, uno o dos dólares por bebida en un bar, y algo para conductores y guías. El impuesto sobre las ventas se añade en caja. En los pueblos, las cocinas cierran a menudo hacia las 20:00 o 21:00, y algunos restaurantes cierran a principios de semana. Descargue mapas sin conexión: la cobertura es irregular en Big Sur, en la costa de Mendocino y en el valle de Anderson."}], "fr": [{"ic": "sun", "h": "Saisons & microclimats", "p": "L’été est chaud et sec dans les terres (souvent plus de 90 °F, soit 32 °C), mais frais et brumeux sur la côte : en juillet, Big Sur ou Mendocino peuvent stagner à 60 °F (16 °C) quand Napa étouffe. Prévoyez toujours plusieurs couches. Les vendanges (août à octobre) sont la saison la plus animée et la plus belle ; les pluies tombent surtout de novembre à mars, quand les collines reverdissent et que les vallées sont paisibles."}, {"ic": "fire", "h": "Fumées d’incendie & coupures de courant", "al": 1, "p": "En saison des incendies, la fumée de feux lointains peut arriver jusqu’ici : consultez la qualité de l’air sur <b>AirNow.gov<\/b> et, si elle est mauvaise, restez à l’intérieur fenêtres fermées. Les jours de vent fort, le fournisseur d’électricité (PG&E sur presque toute la région) peut couper le courant un jour ou plus par précaution (<b>Public Safety Power Shutoff<\/b>) : gardez vos téléphones chargés et une lampe à portée de main. Inscrivez-vous aux alertes d’urgence du comté et, si l’on vous demande d’évacuer, partez immédiatement. Tout feu ou fumée se signale au <b>911<\/b>."}, {"ic": "sos", "h": "Séismes & tsunamis", "al": 1, "p": "Les séismes surviennent sans prévenir : <b>à terre, à l’abri, on s’agrippe<\/b> jusqu’à la fin des secousses, puis on vérifie l’absence d’odeur de gaz et de dégâts. Sur la côte, si vous ressentez un séisme fort ou long, n’attendez aucune alerte : partez à pied vers l’intérieur ou les hauteurs en suivant les panneaux bleus d’évacuation tsunami."}, {"ic": "sea", "h": "Le Pacifique", "al": 1, "p": "L’océan est froid ici (environ 50–58 °F, soit 10–14 °C), avec des courants d’arrachement et des <b>vagues scélérates<\/b> (sneaker waves) qui montent très haut sur la plage sans prévenir : ne tournez jamais le dos à la mer, et tenez enfants et chiens loin des plages pentues et des rochers. Rares sont les plages surveillées. Consultez les horaires des marées avant d’explorer les mares, et restez à plus de 15 m des phoques, otaries et éléphants de mer."}, {"ic": "car", "h": "Highway 1 & routes du vin", "p": "La Highway 1 à Big Sur est régulièrement coupée par des glissements de terrain : consultez <b>Caltrans QuickMap<\/b> ou appelez le 1-800-427-7623 avant de partir. Faites le plein à Carmel ou Cambria, utilisez les aires de dégagement pour laisser passer les plus rapides, et attendez-vous à de longues zones sans réseau. Le taux d’alcool maximal est de 0,8 g/l (0,08 %) : désignez un conducteur ou réservez un chauffeur les jours de dégustation. Le week-end, la Silverado Trail est en général plus calme que la Highway 29."}, {"ic": "grape", "h": "Dégustations", "p": "La plupart des domaines reçoivent sur réservation, et beaucoup de domaines de Napa uniquement sur rendez-vous, condition de leur permis : réservez quelques jours avant, surtout aux vendanges et le week-end. Les dégustations coûtent de 25 $ environ à bien plus de 100 $ à Napa, souvent offertes en cas d’achat. Demandez avant de venir avec des enfants ou un chien, et sachez que l’expédition de vin est limitée vers de nombreux pays et États."}, {"ic": "bug", "h": "Nature & faune", "p": "Apprenez à reconnaître le <b>poison oak<\/b> (sumac de l’Ouest, feuilles par trois) : il pousse au bord de presque tous les sentiers et provoque des démangeaisons. Inspectez-vous pour les tiques après une balade dans l’herbe ou les bois. Aux beaux jours, attention aux serpents à sonnette sur les sentiers ensoleillés ; pumas et ours noirs se montrent rarement, mais ne nourrissez jamais les animaux. La plupart des parcs d’État font payer le stationnement à la journée."}, {"ic": "coins", "h": "Pourboires, horaires & réseau", "p": "Le pourboire est d’usage : 18–22 % au restaurant, un ou deux dollars par verre au bar, et un geste pour les chauffeurs et les guides. La taxe sur les ventes s’ajoute en caisse. Dans les petites villes, les cuisines ferment souvent vers 20 h ou 21 h et certains restaurants ferment en début de semaine. Téléchargez des cartes hors ligne : le réseau est très inégal à Big Sur, sur la côte de Mendocino et dans l’Anderson Valley."}], "de": [{"ic": "sun", "h": "Jahreszeiten & Mikroklima", "p": "Im Landesinneren ist der Sommer heiß und trocken (oft über 90 °F bzw. 32 °C), an der Küste dagegen kühl und neblig: Im Juli können Big Sur oder Mendocino bei 60 °F (16 °C) liegen, während Napa glüht. Nehmen Sie immer mehrere Schichten mit. Die Lese (August–Oktober) ist die lebhafteste und schönste Zeit; Regen fällt vor allem von November bis März, wenn die Hügel grün werden und die Täler ruhig sind."}, {"ic": "fire", "h": "Waldbrandrauch & Stromabschaltungen", "al": 1, "p": "In der Brandsaison kann Rauch von weit entfernten Feuern herüberziehen: Prüfen Sie die Luftqualität auf <b>AirNow.gov<\/b> und bleiben Sie bei schlechten Werten mit geschlossenen Fenstern drinnen. An sehr windigen Tagen kann der Energieversorger (in fast der ganzen Region PG&E) vorsorglich für einen Tag oder länger den Strom abschalten (<b>Public Safety Power Shutoff<\/b>): Handys geladen halten und eine Taschenlampe bereitlegen. Melden Sie sich für die Notfallwarnungen des Countys an und brechen Sie bei einer Evakuierungsanordnung sofort auf. Feuer oder Rauch unter <b>911<\/b> melden."}, {"ic": "sos", "h": "Erdbeben & Tsunamis", "al": 1, "p": "Erdbeben kommen ohne Vorwarnung: <b>Drop, Cover, Hold On<\/b> – in Deckung gehen und festhalten, bis das Beben vorbei ist, danach auf Gasgeruch und Schäden achten. An der Küste nach einem starken oder langen Beben nicht auf eine Warnung warten: sofort zu Fuß landeinwärts oder bergauf gehen und den blauen Tsunami-Evakuierungsschildern folgen."}, {"ic": "sea", "h": "Der Pazifik", "al": 1, "p": "Das Meer ist hier kalt (etwa 50–58 °F bzw. 10–14 °C), mit Brandungsrückströmen und <b>Sneaker Waves<\/b>, die ohne Vorwarnung weit den Strand hinaufschießen: dem Wasser nie den Rücken zukehren und Kinder und Hunde von steilen Stränden und Felsen fernhalten. Nur wenige Strände sind bewacht. Vor dem Erkunden der Gezeitenbecken die Tidenzeiten prüfen und mindestens 15 m Abstand zu Robben, Seelöwen und See-Elefanten halten."}, {"ic": "car", "h": "Highway 1 & Weinlandstraßen", "p": "Der Highway 1 durch Big Sur wird immer wieder von Erdrutschen gesperrt: vor der Fahrt <b>Caltrans QuickMap<\/b> prüfen oder 1-800-427-7623 anrufen. In Carmel oder Cambria volltanken, schnellere Autos in den Haltebuchten vorbeilassen und mit langen Funklöchern rechnen. Die Promillegrenze liegt bei 0,8 ‰ (0,08 %): Bestimmen Sie für Weinproben einen Fahrer oder buchen Sie einen Fahrdienst. Am Wochenende ist der Silverado Trail meist ruhiger als der Highway 29."}, {"ic": "grape", "h": "Weinproben", "p": "Die meisten Weingüter empfangen nur mit Reservierung, viele in Napa laut ihrer Genehmigung ausschließlich mit Termin: einige Tage vorher buchen, vor allem zur Lese und am Wochenende. Die Preise reichen von etwa 25 $ bis weit über 100 $ in Napa und werden beim Weinkauf oft erlassen. Fragen Sie vorher, ob Kinder oder Hunde willkommen sind, und beachten Sie, dass der Weinversand in viele Länder und Bundesstaaten eingeschränkt ist."}, {"ic": "bug", "h": "Natur & Tiere", "p": "Lernen Sie <b>Poison Oak<\/b> zu erkennen (Gift-Eiche, Blätter zu dritt): Sie wächst an fast allen Wegen und verursacht juckenden Ausschlag. Nach Wanderungen in Gras und Wald auf Zecken absuchen. In der warmen Jahreszeit auf sonnigen Wegen auf Klapperschlangen achten; Pumas und Schwarzbären sieht man selten – Wildtiere aber nie füttern. Die meisten State Parks verlangen eine Tagesgebühr fürs Parken."}, {"ic": "coins", "h": "Trinkgeld, Öffnungszeiten & Netz", "p": "Trinkgeld ist üblich: 18–22 % im Restaurant, ein bis zwei Dollar pro Getränk an der Bar und etwas für Fahrer und Guides. Die Umsatzsteuer kommt an der Kasse hinzu. In kleinen Orten schließen die Küchen oft gegen 20 oder 21 Uhr, manche Restaurants haben Anfang der Woche Ruhetag. Laden Sie Offline-Karten herunter: In Big Sur, an der Mendocino-Küste und im Anderson Valley ist das Netz lückenhaft."}]}, "TERROIR": {"en": [["Napa Valley Cabernet Sauvignon", "The valley’s signature red, from Oakville, Rutherford and Stags Leap to the mountain appellations", "all year"], ["Sonoma Pinot Noir & Chardonnay", "Grown in the fog-cooled Russian River Valley, Sonoma Coast and Carneros", "all year"], ["Zinfandel", "California’s heritage grape: old-vine bottlings from Dry Creek Valley and Paso Robles", "all year"], ["Paso Robles Rhône blends", "Syrah, Grenache and Mourvèdre from the limestone hills west of town", "all year"], ["Sta. Rita Hills & Anderson Valley", "Two cool-climate havens for Pinot Noir; Anderson Valley also makes fine sparkling wine and cider", "all year"], ["Dungeness crab", "Sweet local crab landed from Fort Bragg and Bodega Bay to Monterey; opening dates vary each year", "winter – spring"], ["Gravenstein apples & cider", "Sebastopol’s heirloom early apple, with local cideries pouring all year", "Jul – Aug"], ["Castroville artichokes", "From the Salinas Valley, the ‘Salad Bowl of the World’ next door to Monterey", "peak Mar – May"], ["Santa Maria-style barbecue", "Tri-tip grilled over red oak, served with pinquito beans and salsa: the Central Coast cookout", "all year"], ["Olive oil & Sonoma cheeses", "California extra-virgin olive oils, Dry Jack and fresh goat cheeses from Sonoma creameries", "all year"]], "es": [["Cabernet Sauvignon del valle de Napa", "El tinto emblema del valle, de Oakville, Rutherford y Stags Leap a las denominaciones de montaña", "todo el año"], ["Pinot Noir y Chardonnay de Sonoma", "Del Russian River Valley, la Sonoma Coast y Carneros, refrescados por la niebla", "todo el año"], ["Zinfandel", "La uva patrimonial de California: viñas viejas del Dry Creek Valley y de Paso Robles", "todo el año"], ["Mezclas del Ródano de Paso Robles", "Syrah, Garnacha y Monastrell de las colinas calcáreas al oeste del pueblo", "todo el año"], ["Sta. Rita Hills y Anderson Valley", "Dos refugios de clima fresco para el Pinot Noir; en Anderso
