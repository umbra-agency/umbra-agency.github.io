var T={"en": {"kicker": "Welcome guide", "welcome_t": "Welcome", "welcome": "Welcome to {n}! You're {z}. This guide has everything for your stay: getting here, the house, our favorite places around {c} and local tips. Keep it on your phone.", "checkin": "Check-in", "checkout": "Check-out", "wifi": "Wi-Fi", "host": "Your host", "from": "after 3 pm", "before": "by 11 am", "net": "Network", "pwd": "Password", "call": "Call", "msg": "Message", "nav": ["Arrival", "The house", "Nearby", "Local tips", "Check-out"], "c1": "Getting here", "car": "By car", "car_t": "We'll send you the exact address and directions before you arrive. Out in the country, GPS can go wrong on the last few miles: follow our directions, and download offline maps in case cell service drops.", "train": "By train", "plane": "By air", "approx": "approximate driving distances", "parking": "Parking", "park_yes": "Free parking on site.", "park_no": "Where to park: we'll tell you before you arrive.", "late": "Arriving late? Let us know and we'll set up self check-in (lockbox or keypad).", "c2": "The house", "rules_t": "House rules", "rules": ["No smoking or vaping inside the house.", "Quiet hours from 10 pm to 8 am: sound carries far out here.", "No parties or events, and no more guests than stated in your booking.", "Please lock the doors and close the windows when you go out."], "pets": "Pets: on request, please ask before you book.", "clim": "Air conditioning: keep the windows closed while it runs, around 74 °F is plenty, and switch it off when you go out.", "pool_t": "The pool", "pool": ["Open from 8 am to 9 pm.", "No lifeguard on duty: children must be supervised by an adult at all times.", "Shower before swimming, and no glass in the pool area."], "tub_t": "The hot tub", "tub": ["Keep each soak to about 15 minutes, and drink plenty of water.", "Not recommended for young children or during pregnancy; children only with an adult.", "No glass, and please put the cover back on after use."], "bf_t": "Breakfast", "bf": "Served from 8 to 10 am, made with local ingredients. Tell us about any allergies the day before.", "table_t": "Dinner", "table": "On request, the day before.", "spa_t": "Spa", "spa": "Treatments on request: ask us for a time.", "safe_t": "Safety", "safe": "Smoke and carbon monoxide alarms are installed throughout the house. The fire extinguisher and first-aid kit are in the kitchen. In an emergency, get everyone out first, then call 911.", "trash_t": "Trash & recycling", "trash": "Trash and recycling go in the bins we'll show you. Rinse containers, and keep plastic bags out of the recycling.", "c3": "Around {c}", "near_t": "Worth seeing nearby", "market_t": "Farmers markets", "market_n": "Days and seasons are indicative: check before you go.", "maps": "Directions", "c4": "Local tips", "seas_t": "Weather", "seas": "Check the forecast before outdoor plans: conditions can change fast, especially in the mountains and on the coast.", "sea_t": "The ocean", "sea": "Swim at beaches with lifeguards and follow the posted flags. Caught in a rip current? Don't fight it: swim parallel to the shore, then head back in.", "sos_t": "Emergencies", "sos": [["911", "Police, fire, ambulance"], ["1-800-222-1222", "Poison Control"], ["988", "Suicide & Crisis Lifeline"]], "tax_t": "Lodging tax", "tax": "State and local taxes on lodging are added to the room rate. Booked through Airbnb or Vrbo? The platform usually collects them for you.", "c5": "Check-out", "out_t": "Before you leave", "out": ["Keys back in the lockbox or the agreed place", "Windows closed, doors locked", "Thermostat turned down, lights off", "Dishes washed or dishwasher running", "Trash and recycling in the outside bins", "Nothing left behind: chargers, the fridge, the bathroom"], "thanks": "Thank you for staying with us! A review on Google or wherever you booked helps us more than you know.", "gallery": "In pictures", "ex": "to fill in", "made": "Prepared by Umbra Agency for {n}"}, "es": {"kicker": "Guía de bienvenida", "welcome_t": "Bienvenidos", "welcome": "¡Bienvenidos a {n}! Está {z}. Esta guía reúne todo lo necesario para su estancia: la llegada, la casa, nuestros lugares favoritos en los alrededores de {c} y consejos prácticos. Guárdela en su teléfono.", "checkin": "Llegada", "checkout": "Salida", "wifi": "Wifi", "host": "Su anfitrión", "from": "desde las 3 p. m.", "before": "antes de las 11 a. m.", "net": "Red", "pwd": "Contraseña", "call": "Llamar", "msg": "Escribir", "nav": ["Llegada", "La casa", "Alrededores", "Consejos", "Salida"], "c1": "Cómo llegar", "car": "En auto", "car_t": "Le enviaremos la dirección exacta y las indicaciones antes de su llegada. En el campo, el GPS puede fallar en las últimas millas: siga nuestras indicaciones y descargue mapas sin conexión por si se pierde la señal del celular.", "train": "En tren", "plane": "En avión", "approx": "distancias aproximadas por carretera", "parking": "Estacionamiento", "park_yes": "Estacionamiento gratuito en la propiedad.", "park_no": "Dónde estacionar: se lo indicaremos antes de su llegada.", "late": "¿Llega tarde? Avísenos y le preparamos la llegada autónoma (caja de llaves o cerradura con código).", "c2": "La casa", "rules_t": "Normas de la casa", "rules": ["Prohibido fumar o vapear dentro de la casa.", "Horas de silencio de 10 p. m. a 8 a. m.: aquí el sonido llega lejos.", "No se permiten fiestas ni eventos, ni más huéspedes de los indicados en la reserva.", "Al salir, cierre las puertas con llave y también las ventanas."], "pets": "Mascotas: bajo petición, consúltenos antes de reservar.", "clim": "Aire acondicionado: mantenga las ventanas cerradas mientras funciona, unos 74 °F son suficientes, y apáguelo al salir.", "pool_t": "La piscina", "pool": ["Abierta de 8 a. m. a 9 p. m.", "No hay salvavidas: los niños deben estar siempre bajo la supervisión de un adulto.", "Dúchese antes de nadar y no lleve vasos de vidrio a la zona de la piscina."], "tub_t": "El jacuzzi", "tub": ["Limite cada baño a unos 15 minutos y beba bastante agua.", "No se recomienda a niños pequeños ni durante el embarazo; los niños, siempre con un adulto.", "Nada de vidrio, y vuelva a colocar la cubierta después de usarlo."], "bf_t": "Desayuno", "bf": "Se sirve de 8 a 10 a. m., con productos locales. Avísenos de cualquier alergia el día anterior.", "table_t": "Cena", "table": "Bajo petición, el día anterior.", "spa_t": "Spa", "spa": "Tratamientos bajo petición: pídanos un horario.", "safe_t": "Seguridad", "safe": "La casa cuenta con detectores de humo y de monóxido de carbono. El extintor y el botiquín están en la cocina. En caso de emergencia, primero salgan todos de la casa y luego llame al 911.", "trash_t": "Basura y reciclaje", "trash": "La basura y el reciclaje van en los contenedores que le indicaremos. Enjuague los envases y no ponga bolsas de plástico en el reciclaje.", "c3": "Alrededor de {c}", "near_t": "Qué ver cerca", "market_t": "Mercados de agricultores", "market_n": "Días y temporadas orientativos: confírmelos antes de ir.", "maps": "Cómo llegar", "c4": "Consejos prácticos", "seas_t": "El tiempo", "seas": "Consulte el pronóstico antes de cualquier plan al aire libre: el tiempo puede cambiar rápido, sobre todo en la montaña y en la costa.", "sea_t": "El mar", "sea": "Nade en playas con salvavidas y respete las banderas. ¿Le atrapa una corriente de resaca? No luche contra ella: nade en paralelo a la orilla y luego regrese.", "sos_t": "Emergencias", "sos": [["911", "Policía, bomberos, ambulancia"], ["1-800-222-1222", "Centro de Toxicología (Poison Control)"], ["988", "Línea de Prevención del Suicidio y Crisis (oprima 2 para español)"]], "tax_t": "Impuesto de alojamiento", "tax": "Los impuestos estatales y locales sobre el alojamiento se suman a la tarifa de la habitación. ¿Reservó por Airbnb o Vrbo? Normalmente la plataforma los cobra por usted.", "c5": "Salida", "out_t": "Antes de irse", "out": ["Llaves en la caja de llaves o en el lugar acordado", "Ventanas cerradas, puertas con llave", "Termostato bajado, luces apagadas", "Platos lavados o lavavajillas en marcha", "Basura y reciclaje en los contenedores de afuera", "Nada olvidado: cargadores, el refrigerador, el baño"], "thanks": "¡Gracias por alojarse con nosotros! Una reseña en Google o en la plataforma donde reservó nos ayuda muchísimo.", "gallery": "En imágenes", "ex": "por completar", "made": "Preparada por Umbra Agency para {n}"}, "fr": {"kicker": "Livret d'accueil", "welcome_t": "Bienvenue", "welcome": "Bienvenue à {n} ! Vous êtes {z}. Ce livret rassemble tout ce qu'il faut pour votre séjour : l'arrivée, la maison, nos adresses autour de {c} et les infos pratiques. Gardez-le sur votre téléphone.", "checkin": "Arrivée", "checkout": "Départ", "wifi": "Wi-Fi", "host": "Votre hôte", "from": "à partir de 15 h", "before": "avant 11 h", "net": "Réseau", "pwd": "Mot de passe", "call": "Appeler", "msg": "Écrire", "nav": ["Arriver", "La maison", "Autour", "Infos pratiques", "Départ"], "c1": "Arriver", "car": "En voiture", "car_t": "Nous vous envoyons l'adresse exacte et l'itinéraire avant votre arrivée. À la campagne, le GPS peut se tromper sur les derniers miles : suivez nos indications, et téléchargez des cartes hors ligne au cas où le réseau mobile disparaîtrait.", "train": "En train", "plane": "En avion", "approx": "distances approximatives par la route", "parking": "Stationnement", "park_yes": "Parking gratuit sur place.", "park_no": "Où se garer : on vous l'indique avant l'arrivée.", "late": "Arrivée tardive ? Prévenez-nous, on prévoit une arrivée autonome (boîte à clés ou serrure à code).", "c2": "La maison", "rules_t": "Les règles de la maison", "rules": ["Maison non-fumeur, cigarette électronique comprise.", "Calme de 22 h à 8 h : ici, le son porte loin.", "Pas de fêtes ni d'événements, et pas plus de personnes que prévu dans la réservation.", "Fermez les portes à clé et les fenêtres quand vous sortez."], "pets": "Animaux : sur demande, avant la réservation.", "clim": "Climatisation : fenêtres fermées quand elle tourne, 74 °F (23 °C) suffisent, et on l'éteint en sortant.", "pool_t": "La piscine", "pool": ["Ouverte de 8 h à 21 h.", "Piscine non surveillée : les enfants restent toujours sous la surveillance d'un adulte.", "Une douche avant la baignade, et pas de verre autour du bassin."], "tub_t": "Le jacuzzi", "tub": ["Limitez chaque bain à 15 minutes environ, et buvez beaucoup d'eau.", "Déconseillé aux jeunes enfants et pendant la grossesse ; enfants uniquement avec un adulte.", "Pas de verre, et remettez la couverture après usage."], "bf_t": "Petit-déjeuner", "bf": "Servi de 8 h à 10 h, avec des produits locaux. Signalez-nous vos allergies la veille.", "table_t": "Dîner", "table": "Sur réservation, la veille.", "spa_t": "Spa", "spa": "Soins sur réservation : demandez-nous un créneau.", "safe_t": "Sécurité", "safe": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone. L'extincteur et la trousse de secours sont dans la cuisine. En cas d'urgence, faites d'abord sortir tout le monde, puis appelez le 911.", "trash_t": "Poubelles et recyclage", "trash": "Ordures et recyclage vont dans les bacs que nous vous montrerons. Rincez les emballages, et pas de sacs plastiques dans le recyclage.", "c3": "Autour de {c}", "near_t": "À voir près d'ici", "market_t": "Marchés fermiers", "market_n": "Jours et saisons indicatifs : vérifiez avant d'y aller.", "maps": "Itinéraire", "c4": "Infos pratiques", "seas_t": "La météo", "seas": "Consultez la météo avant toute sortie : le temps peut changer vite, surtout en montagne et sur la côte.", "sea_t": "L'océan", "sea": "Baignez-vous sur les plages surveillées et respectez les drapeaux. Pris dans un courant d'arrachement ? Ne luttez pas : nagez parallèlement au rivage, puis revenez.", "sos_t": "Urgences", "sos": [["911", "Police, pompiers, ambulance"], ["1-800-222-1222", "Centre antipoison"], ["988", "Ligne d'écoute suicide et crise"]], "tax_t": "Taxe d'hébergement", "tax": "Les taxes de l'État et locales sur l'hébergement s'ajoutent au prix de la chambre. Réservé sur Airbnb ou Vrbo ? La plateforme les perçoit en général pour vous.", "c5": "Départ", "out_t": "Avant de partir", "out": ["Clés dans la boîte à clés ou à l'endroit convenu", "Fenêtres fermées, portes verrouillées", "Thermostat baissé, lumières éteintes", "Vaisselle faite ou lave-vaisselle lancé", "Poubelles et recyclage dans les bacs extérieurs", "Rien d'oublié : chargeurs, frigo, salle de bains"], "thanks": "Merci d'avoir séjourné chez nous ! Un avis sur Google ou sur le site où vous avez réservé nous aide énormément.", "gallery": "En images", "ex": "à compléter", "made": "Préparé par Umbra Agency pour {n}"}, "de": {"kicker": "Gästemappe", "welcome_t": "Willkommen", "welcome": "Willkommen bei {n}! Sie sind {z}. Diese Mappe enthält alles für Ihren Aufenthalt: Anreise, das Haus, unsere Lieblingsorte rund um {c} und praktische Tipps. Speichern Sie sie auf Ihrem Handy.", "checkin": "Anreise", "checkout": "Abreise", "wifi": "WLAN", "host": "Ihr Gastgeber", "from": "ab 15 Uhr", "before": "bis 11 Uhr", "net": "Netzwerk", "pwd": "Passwort", "call": "Anrufen", "msg": "Schreiben", "nav": ["Anreise", "Das Haus", "Umgebung", "Tipps", "Abreise"], "c1": "Anreise", "car": "Mit dem Auto", "car_t": "Die genaue Adresse und Wegbeschreibung schicken wir Ihnen vor der Ankunft. Auf dem Land irrt sich das Navi auf den letzten Meilen manchmal: Folgen Sie unserer Beschreibung und laden Sie Offline-Karten herunter, falls der Mobilfunkempfang abbricht.", "train": "Mit dem Zug", "plane": "Mit dem Flugzeug", "approx": "ungefähre Entfernungen auf der Straße", "parking": "Parken", "park_yes": "Kostenloser Parkplatz vor Ort.", "park_no": "Wo Sie parken: Das sagen wir Ihnen vor der Ankunft.", "late": "Späte Ankunft? Sagen Sie uns Bescheid, dann richten wir den Self-Check-in ein (Schlüsselbox oder Zahlenschloss).", "c2": "Das Haus", "rules_t": "Hausregeln", "rules": ["Im Haus wird nicht geraucht, auch keine E-Zigaretten.", "Nachtruhe von 22 bis 8 Uhr: Geräusche tragen hier weit.", "Keine Partys oder Veranstaltungen und nicht mehr Gäste als in der Buchung angegeben.", "Beim Hinausgehen bitte Türen abschließen und Fenster schließen."], "pets": "Haustiere: auf Anfrage, bitte vor der Buchung fragen.", "clim": "Klimaanlage: Fenster geschlossen halten, solange sie läuft, etwa 74 °F (23 °C) genügen, und beim Hinausgehen ausschalten.", "pool_t": "Der Pool", "pool": ["Geöffnet von 8 bis 21 Uhr.", "Kein Bademeister: Kinder nur unter ständiger Aufsicht eines Erwachsenen.", "Vor dem Schwimmen duschen, kein Glas im Poolbereich."], "tub_t": "Der Whirlpool", "tub": ["Nicht länger als etwa 15 Minuten am Stück baden und viel Wasser trinken.", "Nicht empfohlen für kleine Kinder und in der Schwangerschaft; Kinder nur mit einem Erwachsenen.", "Kein Glas, und bitte die Abdeckung nach dem Baden wieder auflegen."], "bf_t": "Frühstück", "bf": "Von 8 bis 10 Uhr, mit Zutaten aus der Region. Allergien bitte am Vortag mitteilen.", "table_t": "Abendessen", "table": "Auf Anfrage, am Vortag.", "spa_t": "Spa", "spa": "Anwendungen auf Anfrage: Fragen Sie uns nach einem Termin.", "safe_t": "Sicherheit", "safe": "Im ganzen Haus sind Rauch- und Kohlenmonoxidmelder installiert. Feuerlöscher und Erste-Hilfe-Kasten finden Sie in der Küche. Im Notfall zuerst alle nach draußen bringen, dann 911 anrufen.", "trash_t": "Müll und Recycling", "trash": "Müll und Wertstoffe kommen in die Tonnen, die wir Ihnen zeigen. Behälter ausspülen und keine Plastiktüten in den Recyclingmüll.", "c3": "Rund um {c}", "near_t": "Sehenswert in der Nähe", "market_t": "Bauernmärkte", "market_n": "Tage und Saison ohne Gewähr: bitte vorher prüfen.", "maps": "Route", "c4": "Praktische Tipps", "seas_t": "Das Wetter", "seas": "Vor Ausflügen den Wetterbericht prüfen: Das Wetter kann schnell umschlagen, vor allem in den Bergen und an der Küste.", "sea_t": "Der Ozean", "sea": "Nur an bewachten Stränden baden und die Flaggen beachten. In einer Rippströmung? Nicht dagegen anschwimmen: parallel zum Ufer schwimmen, dann zurück an Land.", "sos_t": "Notfälle", "sos": [["911", "Polizei, Feuerwehr, Rettungsdienst"], ["1-800-222-1222", "Giftnotruf (Poison Control)"], ["988", "Krisen- und Suizid-Hotline"]], "tax_t": "Beherbergungssteuer", "tax": "Staatliche und lokale Steuern auf Übernachtungen kommen zum Zimmerpreis hinzu. Über Airbnb oder Vrbo gebucht? Dann zieht sie meist die Plattform für Sie ein.", "c5": "Abreise", "out_t": "Vor der Abreise", "out": ["Schlüssel in der Schlüsselbox oder am vereinbarten Ort", "Fenster zu, Türen abgeschlossen", "Thermostat heruntergedreht, Licht aus", "Geschirr gespült oder Spülmaschine an", "Müll und Recycling in die Tonnen draußen", "Nichts vergessen: Ladegeräte, Kühlschrank, Bad"], "thanks": "Danke für Ihren Aufenthalt! Eine Bewertung bei Google oder dort, wo Sie gebucht haben, hilft uns sehr.", "gallery": "In Bildern", "ex": "auszufüllen", "made": "Erstellt von Umbra Agency für {n}"}};
var R={"NAV4": {"en": "Hudson Valley tips", "es": "Consejos del valle del Hudson", "fr": "Vallée de l’Hudson pratique", "de": "Hudson-Valley-Tipps"}, "RULES": {"en": ["County occupancy tax: register the rental with your county (Ulster, Dutchess, Columbia, Orange, Sullivan or Delaware) and obtain a Certificate of Authority. Airbnb and Vrbo collect the tax on their bookings, but you still file returns and must collect it on direct bookings.", "New York sales tax has applied to short-term rentals since March 1, 2025. Platforms collect it on the bookings they handle; for direct bookings, register with the NYS Tax Department through New York Business Express. Some counties, such as Greene, also run a free STR registry under the new state law.", "Check your town before you list: many require a short-term rental permit or registration, e.g. Woodstock (capped number of registrations, one per owner), Rhinebeck (owner’s primary residence, two-year permit), Saugerties (permit), Kingston (only in certain zoning districts, plus city registration) and Hudson (owner-occupied homes only, with a yearly day cap).", "Massachusetts: register each unit with the Department of Revenue through MassTaxConnect, post the Certificate of Registration in the unit, and charge the 5.7% state room occupancy excise plus any local excise (up to 6%) and community impact fee (up to 3%). Carry at least $1 million in liability insurance unless your platform provides it.", "Berkshire towns add their own rules: Great Barrington requires town registration (one STR per owner), Pittsfield requires registration and caps rental days, and Lenox limits rental days through zoning.", "Safety basics that permits check: working smoke and carbon monoxide alarms, a fire extinguisher, clear exits, posted emergency information with the full street address, a maximum occupancy and enough off-street parking.", "Name a local contact who can respond quickly, show your permit or registration number on listings where your town requires it, and keep records of nights rented and taxes collected."], "es": ["Impuesto de ocupación del condado: registre el alojamiento en su condado (Ulster, Dutchess, Columbia, Orange, Sullivan o Delaware) y obtenga un Certificate of Authority. Airbnb y Vrbo cobran el impuesto en sus reservas, pero usted sigue presentando declaraciones y debe cobrarlo en las reservas directas.", "El impuesto sobre las ventas de Nueva York se aplica a los alquileres de corta estancia desde el 1 de marzo de 2025. Las plataformas lo cobran en sus reservas; para las reservas directas, regístrese en el Departamento de Impuestos del estado a través de New York Business Express. Algunos condados, como Greene, tienen además un registro gratuito de alquileres turísticos según la nueva ley estatal.", "Consulte a su municipio antes de anunciarse: muchos exigen permiso o registro, p. ej. Woodstock (número limitado de registros, uno por propietario), Rhinebeck (vivienda principal del propietario, permiso de dos años), Saugerties (permiso), Kingston (solo en ciertas zonas urbanísticas, más registro municipal) y Hudson (solo viviendas ocupadas por el propietario, con un tope anual de días).", "Massachusetts: registre cada unidad en el Department of Revenue a través de MassTaxConnect, exponga el Certificate of Registration en la vivienda y cobre el impuesto estatal de ocupación del 5,7 % más el impuesto local (hasta el 6 %) y la tasa de impacto comunitario (hasta el 3 %) si existen. Tenga un seguro de responsabilidad civil de al menos 1 millón de dólares, salvo que lo aporte la plataforma.", "Los municipios de los Berkshires añaden sus propias normas: Great Barrington exige registro municipal (un alquiler por propietario), Pittsfield exige registro y limita los días de alquiler, y Lenox limita los días mediante la normativa urbanística.", "Seguridad básica que revisan los permisos: detectores de humo y de monóxido de carbono que funcionen, extintor, salidas despejadas, información de emergencia visible con la dirección completa, ocupación máxima y aparcamiento suficiente fuera de la calle.", "Designe un contacto local que responda rápido, muestre su número de permiso o registro en los anuncios si su municipio lo exige y guarde registros de las noches alquiladas y los impuestos cobrados."], "fr": ["Taxe d’occupation du comté : déclarez la location auprès de votre comté (Ulster, Dutchess, Columbia, Orange, Sullivan ou Delaware) et obtenez un Certificate of Authority. Airbnb et Vrbo perçoivent la taxe sur leurs réservations, mais vous devez toujours déposer vos déclarations et la collecter sur les réservations directes.", "La taxe de vente de New York s’applique aux locations de courte durée depuis le 1er mars 2025. Les plateformes la perçoivent sur leurs réservations ; pour les réservations directes, inscrivez-vous auprès du service des impôts de l’État via New York Business Express. Certains comtés, comme Greene, tiennent aussi un registre gratuit des meublés de tourisme au titre de la nouvelle loi.", "Renseignez-vous auprès de votre commune avant de publier une annonce : beaucoup exigent un permis ou un enregistrement, par ex. Woodstock (nombre d’enregistrements plafonné, un par propriétaire), Rhinebeck (résidence principale du propriétaire, permis de deux ans), Saugerties (permis), Kingston (seulement dans certaines zones d’urbanisme, plus un enregistrement municipal) et Hudson (logements occupés par le propriétaire uniquement, avec un plafond annuel de jours).", "Massachusetts : enregistrez chaque logement auprès du Department of Revenue via MassTaxConnect, affichez le Certificate of Registration dans le logement, et facturez la taxe d’État de 5,7 % sur l’occupation des chambres, plus la taxe locale (jusqu’à 6 %) et la redevance d’impact communautaire (jusqu’à 3 %) le cas échéant. Souscrivez une assurance responsabilité civile d’au moins 1 million de dollars, sauf si la plateforme la fournit.", "Les communes des Berkshires ont leurs propres règles : Great Barrington impose un enregistrement municipal (une location par propriétaire), Pittsfield un enregistrement et un plafond de jours, et Lenox limite les jours de location par son règlement d’urbanisme.", "Les bases de sécurité que vérifient les permis : détecteurs de fumée et de monoxyde de carbone en état de marche, extincteur, issues dégagées, consignes d’urgence affichées avec l’adresse complète, capacité maximale et stationnement suffisant hors de la rue.", "Désignez un contact local joignable rapidement, indiquez votre numéro de permis ou d’enregistrement dans les annonces si votre commune l’exige, et conservez la trace des nuitées louées et des taxes perçues."], "de": ["Beherbergungssteuer des County: Melden Sie die Unterkunft bei Ihrem County an (Ulster, Dutchess, Columbia, Orange, Sullivan oder Delaware) und beantragen Sie ein Certificate of Authority. Airbnb und Vrbo führen die Steuer für ihre Buchungen ab, Sie müssen aber weiterhin Erklärungen abgeben und bei Direktbuchungen selbst kassieren.", "Seit dem 1. März 2025 gilt die New Yorker Umsatzsteuer auch für Kurzzeitvermietungen. Plattformen ziehen sie bei ihren Buchungen ein; für Direktbuchungen registrieren Sie sich über New York Business Express beim Steueramt des Bundesstaats. Einige Countys wie Greene führen nach dem neuen Landesgesetz zudem ein kostenloses Register für Ferienunterkünfte.", "Fragen Sie vor dem Inserieren bei Ihrer Gemeinde nach: Viele verlangen eine Genehmigung oder Registrierung, z. B. Woodstock (begrenzte Zahl an Registrierungen, eine pro Eigentümer), Rhinebeck (Hauptwohnsitz des Eigentümers, Genehmigung für zwei Jahre), Saugerties (Genehmigung), Kingston (nur in bestimmten Bauzonen, plus städtische Registrierung) und Hudson (nur eigengenutzte Häuser, mit jährlicher Obergrenze an Tagen).", "Massachusetts: Registrieren Sie jede Einheit über MassTaxConnect beim Department of Revenue, hängen Sie das Certificate of Registration in der Unterkunft aus und berechnen Sie die staatliche Zimmerbelegungssteuer von 5,7 % sowie gegebenenfalls die lokale Steuer (bis 6 %) und die Community Impact Fee (bis 3 %). Schließen Sie eine Haftpflichtversicherung über mindestens 1 Million Dollar ab, sofern die Plattform keine stellt.", "Die Gemeinden der Berkshires haben eigene Regeln: Great Barrington verlangt eine Registrierung bei der Gemeinde (eine Ferienunterkunft pro Eigentümer), Pittsfield eine Registrierung mit Obergrenze an Vermietungstagen, und Lenox begrenzt die Tage über das Baurecht.", "Sicherheitsgrundlagen, die bei Genehmigungen geprüft werden: funktionierende Rauch- und Kohlenmonoxidmelder, Feuerlöscher, freie Fluchtwege, ausgehängte Notfallinfos mit vollständiger Adresse, eine maximale Belegung und genügend Stellplätze abseits der Straße.", "Benennen Sie einen schnell erreichbaren Ansprechpartner vor Ort, nennen Sie Ihre Genehmigungs- oder Registrierungsnummer in Inseraten, wo die Gemeinde es verlangt, und dokumentieren Sie vermietete Nächte und eingezogene Steuern."]}, "HOUSE": {"en": [{"ic": "fire", "h": "Heating, fireplace & wood stove", "p": "Keep the thermostat between 65 and 70 °F and turn it down when you go out, but never switch the heat off in winter: pipes can freeze. Wood stove or fireplace: open the damper before lighting, burn only the dry firewood provided (no trash, no lighter fluid), keep the door or screen closed and never leave a fire unattended. Ashes stay hot for days: put them in the metal bucket, outside and well away from the house."}, {"ic": "leaf", "h": "Well water & septic", "p": "Like many country homes, this house may run on a private <b>well<\/b> and a <b>septic system<\/b>: only toilet paper down the toilet – no wipes (even ‘flushable’ ones), sanitary products, paper towels or grease. The well pump needs electricity, so a power cut also means no running water until the power comes back: in stormy weather, keep a jug of water handy. Tap water is safe to drink unless we tell you otherwise."}, {"ic": "bin", "h": "Trash & recycling", "ul": ["Many rural towns have no curbside pickup: we’ll explain whether trash is collected or taken to the town transfer station.", "Recycling: rinse cans, bottles and plastic containers and flatten cardboard; rules vary by town, so follow the labels on the bins.", "Bears and raccoons raid trash: keep bins closed inside the garage or shed, and put them out only on the morning of pickup.", "Never leave bags on the porch, on the deck or in the car.", "Cans and bottles marked with a 5¢ deposit can be returned at most supermarkets.", "Food scraps: in the compost if there is one, otherwise sealed in the trash."]}, {"ic": "sos", "h": "Safety", "p": "The house has smoke and carbon monoxide alarms: if one sounds, get everyone outside and call <b>911<\/b>. We’ll show you the fire extinguisher, the first-aid kit and the exits when you arrive. Never run a grill, generator or camp stove indoors or in a garage. When you call 911, give the full street address: it’s at the top of this guide."}, {"ic": "home", "h": "Quiet hours & neighbors", "p": "Sound carries far in the countryside and across water. Please keep voices and music down after 10 pm, when most local noise rules apply, and switch off outdoor lights you don’t need: dark skies are part of the charm. No fireworks, please: they are restricted in New York and banned in Massachusetts."}, {"ic": "car", "h": "Parking & winter", "p": "Please park only where we’ve shown you, never on the lawn or in front of a neighbor’s driveway. In winter the driveway is plowed after snowfalls: leave room for the plow and move your car if asked. Many villages ban overnight street parking in winter and during snow emergencies. Watch for ice on steps and paths, and use the salt or sand provided."}], "es": [{"ic": "fire", "h": "Calefacción, chimenea y estufa de leña", "p": "Mantenga el termostato entre 65 y 70 °F y bájelo cuando salga, pero nunca apague la calefacción en invierno: las tuberías pueden congelarse. Estufa de leña o chimenea: abra el tiro antes de encender, queme solo la leña seca que le dejamos (ni basura ni líquido encendedor), mantenga la puerta o la pantalla cerrada y no deje nunca el fuego sin vigilancia. Las cenizas siguen calientes durante días: échelas en el cubo metálico, fuera y lejos de la casa."}, {"ic": "leaf", "h": "Agua de pozo y fosa séptica", "p": "Como muchas casas de campo, puede que esta funcione con un <b>pozo<\/b> propio y una <b>fosa séptica<\/b>: al inodoro solo papel higiénico, nada de toallitas (aunque digan «desechables»), compresas, papel de cocina ni grasa. La bomba del pozo funciona con electricidad, así que un apagón también deja la casa sin agua corriente hasta que vuelva la luz: con mal tiempo, tenga a mano una garrafa de agua. El agua del grifo es potable salvo que le digamos lo contrario."}, {"ic": "bin", "h": "Basura y reciclaje", "ul": ["Muchos municipios rurales no tienen recogida puerta a puerta: le explicaremos si se recoge la basura o hay que llevarla al punto de transferencia municipal.", "Reciclaje: enjuague latas, botellas y envases de plástico y aplane el cartón; las normas cambian según el municipio, así que siga las etiquetas de los cubos.", "Osos y mapaches asaltan la basura: guarde los cubos cerrados en el garaje o el cobertizo y sáquelos solo la mañana de la recogida.", "No deje nunca bolsas en el porche, en la terraza ni en el coche.", "Las latas y botellas con depósito de 5 centavos se pueden devolver en la mayoría de los supermercados.", "Restos de comida: al compost si lo hay; si no, bien cerrados en la basura."]}, {"ic": "sos", "h": "Seguridad", "p": "La casa tiene detectores de humo y de monóxido de carbono: si suena uno, salgan todos y llame al <b>911<\/b>. A su llegada le enseñaremos el extintor, el botiquín y las salidas. No use nunca una parrilla, un generador ni un hornillo de camping dentro de casa o en el garaje. Al llamar al 911, dé la dirección completa: figura al principio de esta guía."}, {"ic": "home", "h": "Horas de silencio y vecinos", "p": "En el campo y sobre el agua el sonido llega muy lejos. Baje la voz y la música a partir de las 22:00, cuando rigen la mayoría de las normas locales sobre ruido, y apague las luces exteriores que no necesite: el cielo oscuro es parte del encanto. Nada de fuegos artificiales, por favor: están restringidos en Nueva York y prohibidos en Massachusetts."}, {"ic": "car", "h": "Aparcamiento e invierno", "p": "Aparque solo donde le indiquemos, nunca en el césped ni delante de la entrada de un vecino. En invierno se quita la nieve del camino de acceso tras cada nevada: deje sitio a la quitanieves y mueva el coche si se lo pedimos. Muchos pueblos prohíben aparcar en la calle por la noche en invierno y durante las emergencias por nieve. Cuidado con el hielo en escalones y caminos: use la sal o la arena que le dejamos."}], "fr": [{"ic": "fire", "h": "Chauffage, cheminée & poêle à bois", "p": "Réglez le thermostat entre 65 et 70 °F (18 à 21 °C) et baissez-le quand vous sortez, mais ne coupez jamais le chauffage en hiver : les canalisations peuvent geler. Poêle ou cheminée : ouvrez le registre avant d’allumer, ne brûlez que le bois sec fourni (ni déchets ni allume-feu liquide), gardez la porte ou le pare-feu fermé et ne laissez jamais un feu sans surveillance. Les cendres restent chaudes pendant des jours : videz-les dans le seau en métal, dehors et loin de la maison."}, {"ic": "leaf", "h": "Puits & fosse septique", "p": "Comme beaucoup de maisons de campagne, celle-ci peut fonctionner avec un <b>puits<\/b> privé et une <b>fosse septique<\/b> : uniquement du papier toilette dans les WC – ni lingettes (même « biodégradables »), ni protections, ni essuie-tout, ni graisse. La pompe du puits fonctionne à l’électricité : une coupure de courant prive aussi la maison d’eau courante jusqu’au retour du courant. Par temps d’orage, gardez un bidon d’eau à portée de main. L’eau du robinet est potable, sauf indication contraire de notre part."}, {"ic": "bin", "h": "Déchets & recyclage", "ul": ["Beaucoup de communes rurales n’ont pas de ramassage à domicile : nous vous dirons si les déchets sont collectés ou s’il faut les porter à la déchetterie municipale (transfer station).", "Recyclage : rincez canettes, bouteilles et emballages plastique et aplatissez les cartons ; les règles varient d’une commune à l’autre, suivez les étiquettes des bacs.", "Ours et ratons laveurs fouillent les poubelles : gardez les bacs fermés dans le garage ou l’abri, et sortez-les seulement le matin du ramassage.", "Ne laissez jamais de sacs sur le porche, la terrasse ou dans la voiture.", "Les canettes et bouteilles consignées 5 cents peuvent être rapportées dans la plupart des supermarchés.", "Restes alimentaires : au compost s’il y en a un, sinon bien fermés dans la poubelle."]}, {"ic": "sos", "h": "Sécurité", "p": "La maison est équipée de détecteurs de fumée et de monoxyde de carbone : si l’un sonne, faites sortir tout le monde et appelez le <b>911<\/b>. Nous vous montrerons l’extincteur, la trousse de secours et les sorties à votre arrivée. N’utilisez jamais de barbecue, de groupe électrogène ou de réchaud de camping à l’intérieur ou dans un garage. En appelant le 911, donnez l’adresse complète : elle figure en tête de ce livret."}, {"ic": "home", "h": "Calme & voisinage", "p": "À la campagne et au-dessus de l’eau, le son porte très loin. Merci de baisser la voix et la musique après 22 h, heure à laquelle s’appliquent la plupart des règles locales sur le bruit, et d’éteindre les éclairages extérieurs inutiles : le ciel étoilé fait partie du charme. Pas de feux d’artifice, s’il vous plaît : ils sont réglementés dans l’État de New York et interdits au Massachusetts."}, {"ic": "car", "h": "Stationnement & hiver", "p": "Garez-vous uniquement aux emplacements indiqués, jamais sur la pelouse ni devant l’entrée d’un voisin. En hiver, l’allée est déneigée après chaque chute : laissez de la place au chasse-neige et déplacez la voiture si on vous le demande. Beaucoup de villages interdisent le stationnement de nuit dans la rue en hiver et lors des alertes neige. Attention au verglas sur les marches et les allées : utilisez le sel ou le sable mis à disposition."}], "de": [{"ic": "fire", "h": "Heizung, Kamin & Holzofen", "p": "Stellen Sie den Thermostat auf 65 bis 70 °F (18 bis 21 °C) und drehen Sie ihn herunter, wenn Sie weggehen – schalten Sie die Heizung im Winter aber nie ganz aus, sonst können Leitungen einfrieren. Holzofen oder Kamin: vor dem Anzünden die Drosselklappe öffnen, nur das bereitgestellte trockene Holz verbrennen (keinen Müll, keinen flüssigen Grillanzünder), Tür oder Funkenschutz geschlossen halten und das Feuer nie unbeaufsichtigt lassen. Asche bleibt tagelang heiß: in den Metalleimer geben und draußen, weit weg vom Haus, abstellen."}, {"ic": "leaf", "h": "Brunnenwasser & Klärgrube", "p": "Wie viele Landhäuser hat dieses Haus womöglich einen eigenen <b>Brunnen<\/b> und eine <b>Klärgrube<\/b>: nur Toilettenpapier in die Toilette – keine Feuchttücher (auch keine „spülbaren“), Hygieneartikel, Küchentücher oder Fett. Die Brunnenpumpe läuft mit Strom: Bei einem Stromausfall gibt es auch kein fließendes Wasser, bis der Strom zurück ist. Halten Sie bei Unwetter einen Kanister Wasser bereit. Das Leitungswasser ist trinkbar, sofern wir Ihnen nichts anderes sagen."}, {"ic": "bin", "h": "Müll & Recycling", "ul": ["Viele ländliche Gemeinden haben keine Müllabfuhr vor der Tür: Wir erklären Ihnen, ob abgeholt wird oder der Müll zur kommunalen Sammelstelle (Transfer Station) muss.", "Recycling: Dosen, Flaschen und Plastikbehälter ausspülen, Karton flach falten; die Regeln sind je nach Gemeinde verschieden, folgen Sie den Aufklebern auf den Tonnen.", "Bären und Waschbären plündern Mülltonnen: Tonnen geschlossen in Garage oder Schuppen aufbewahren und erst am Morgen des Abholtags hinausstellen.", "Nie Müllbeutel auf der Veranda, der Terrasse oder im Auto lassen.", "Dosen und Flaschen mit 5 Cent Pfand nehmen die meisten Supermärkte zurück.", "Essensreste: auf den Kompost, falls vorhanden, sonst gut verschlossen in den Restmüll."]}, {"ic": "sos", "h": "Sicherheit", "p": "Das Haus hat Rauch- und Kohlenmonoxidmelder: Schlägt einer Alarm, bringen Sie alle nach draußen und rufen Sie die <b>911<\/b>. Feuerlöscher, Erste-Hilfe-Set und Ausgänge zeigen wir Ihnen bei der Ankunft. Grill, Generator oder Campingkocher nie im Haus oder in der Garage betreiben. Nennen Sie beim Notruf die vollständige Adresse: Sie steht oben in diesem Gästebuch."}, {"ic": "home", "h": "Ruhezeiten & Nachbarn", "p": "Auf dem Land und über dem Wasser trägt der Schall weit. Bitte ab 22 Uhr leiser sprechen und die Musik dämpfen – dann gelten die meisten örtlichen Lärmregeln – und unnötige Außenbeleuchtung ausschalten: Der dunkle Sternenhimmel gehört zum Reiz. Bitte kein Feuerwerk: Es ist in New York eingeschränkt und in Massachusetts verboten."}, {"ic": "car", "h": "Parken & Winter", "p": "Parken Sie bitte nur an den gezeigten Stellen, nie auf dem Rasen oder vor der Einfahrt der Nachbarn. Im Winter wird die Zufahrt nach Schneefall geräumt: Lassen Sie Platz für den Räumdienst und fahren Sie das Auto auf Bitte weg. Viele Orte verbieten im Winter und bei Schneenotstand das nächtliche Parken auf der Straße. Vorsicht vor Glatteis auf Stufen und Wegen: Nutzen Sie das bereitgestellte Salz oder den Sand."}]}, "PRAT": {"en": [{"ic": "sun", "h": "Through the seasons", "p": "Summers are warm and often humid (highs in the 80s °F), with thunderstorms on hot afternoons. Fall foliage usually peaks from late September in the high Catskills and Berkshires to mid-October along the river. Winters are cold and snowy, with nights often in the teens °F in the mountains; spring brings ‘mud season’ on dirt roads and trails."}, {"ic": "bug", "h": "Ticks & Lyme disease", "al": 1, "p": "The Hudson Valley has some of the highest Lyme disease rates in the country, and ticks are active from spring to late fall, even on mild winter days. Use a repellent (DEET or picaridin) and permethrin-treated clothing, walk in the middle of trails, and check yourself, children and dogs every evening. Remove ticks with fine tweezers, and see a doctor if you develop a spreading rash, fever or aches."}, {"ic": "leaf", "h": "Bears & wildlife", "p": "Black bears live throughout the Catskills, the Highlands and the Berkshires. Never feed them, keep food and trash indoors or in a locked bin, and don’t leave coolers on the porch. If you meet one, give it space, talk loudly and back away slowly. Deer cross the roads at dawn and dusk all year, especially in October and November: slow down."}, {"ic": "park", "h": "Hiking safely", "p": "Cell service drops out in many valleys and on trails: download maps before you go and tell someone your route. At Kaaterskill Falls and other cliffs, stay on marked paths – falls there have been fatal. Popular trailheads (Breakneck Ridge, Kaaterskill, Minnewaska, Sam’s Point) fill early on fall weekends, and some require parking reservations. In a backcountry emergency, call <b>911<\/b> or the DEC Forest Rangers."}, {"ic": "sos", "h": "Hunting season", "p": "From October through December hunters share the woods, especially during deer season around Thanksgiving. On trails, wear blaze orange or another bright color, and put an orange vest on your dog. In Massachusetts, hunting is not allowed on Sundays."}, {"ic": "car", "h": "On the road", "p": "Snow and ice are common from December to March: drive slowly, leave extra distance and keep a brush and scraper in the car. Many back roads are steep, narrow or unpaved. On fall weekends, expect slow traffic on Routes 9, 23, 28 and 7 and in the villages. Right on red is allowed in New York and Massachusetts unless a sign says otherwise; always stop for a school bus with flashing red lights."}, {"ic": "train", "h": "Getting around without a car", "p": "Metro-North’s Hudson Line runs from Grand Central to Beacon, Cold Spring and Poughkeepsie; Amtrak serves Croton-Harmon, Poughkeepsie, Rhinecliff (for Rhinebeck and Kingston) and Hudson from Penn Station. Taxis and ride-hailing are scarce in rural areas, especially late at night: book a local car service ahead of time."}, {"ic": "coins", "h": "Tipping, tax & opening hours", "p": "Tip 18–20% at sit-down restaurants and $1–2 per drink at a bar. Prices are shown before sales tax, which is added at the register. In small towns many restaurants close one or two days midweek and kitchens close early; on fall and holiday weekends, book tables ahead. Some farm stands are cash only, so carry a few small bills."}], "es": [{"ic": "sun", "h": "A lo largo del año", "p": "Los veranos son cálidos y a menudo húmedos (máximas de 27 a 32 °C), con tormentas las tardes de calor. El follaje de otoño suele alcanzar su apogeo desde finales de septiembre en las cumbres de los Catskills y los Berkshires hasta mediados de octubre junto al río. Los inviernos son fríos y con nieve, con noches que en la montaña bajan a menudo de -7 °C; la primavera trae la «temporada del barro» en caminos de tierra y senderos."}, {"ic": "bug", "h": "Garrapatas y enfermedad de Lyme", "al": 1, "p": "El valle del Hudson tiene una de las tasas de enfermedad de Lyme más altas del país, y las garrapatas están activas de la primavera a finales de otoño, incluso en días suaves de invierno. Use repelente (DEET o icaridina) y ropa tratada con permetrina, camine por el centro de los senderos y revísese, y revise a niños y perros, cada noche. Retire las garrapatas con pinzas finas y acuda al médico si aparece una mancha roja que se extiende, fiebre o dolores."}, {"ic": "leaf", "h": "Osos y fauna", "p": "Hay osos negros en todos los Catskills, las Highlands y los Berkshires. No les dé nunca de comer, guarde comida y basura dentro o en un cubo con cierre, y no deje neveras portátiles en el porche. Si se encuentra con uno, déjele espacio, hable alto y retroceda despacio. Los ciervos cruzan las carreteras al amanecer y al anochecer todo el año, sobre todo en octubre y noviembre: reduzca la velocidad."}, {"ic": "park", "h": "Senderismo seguro", "p": "En muchos valles y senderos no hay cobertura: descargue los mapas antes de salir y avise a alguien de su ruta. En Kaaterskill Falls y otros acantilados, no salga de los senderos señalizados: ha habido caídas mortales. Los aparcamientos de las rutas más populares (Breakneck Ridge, Kaaterskill, Minnewaska, Sam’s Point) se llenan pronto los fines de semana de otoño, y algunos exigen reserva. En una emergencia en la montaña, llame al <b>911<\/b> o a los guardas forestales del DEC."}, {"ic": "sos", "h": "Temporada de caza", "p": "De octubre a diciembre los cazadores comparten el bosque, sobre todo en la temporada del ciervo, en torno a Acción de Gracias. En los senderos, vista de naranja fosforito u otro color llamativo, y ponga un chaleco naranja a su perro. En Massachusetts no se caza los domingos."}, {"ic": "car", "h": "En la carretera", "p": "De diciembre a marzo son frecuentes la nieve y el hielo: conduzca despacio, deje más distancia y lleve en el coche un cepillo y un rascador. Muchas carreteras secundarias son empinadas, estrechas o de tierra. Los fines de semana de otoño hay tráfico lento en las carreteras 9, 23, 28 y 7 y en los pueblos. En Nueva York y Massachusetts se puede girar a la derecha en rojo salvo señal que lo prohíba; deténgase siempre ante un autobús escolar con las luces rojas encendidas."}, {"ic": "train", "h": "Moverse sin coche", "p": "La línea Hudson de Metro-North va de Grand Central a Beacon, Cold Spring y Poughkeepsie; Amtrak para en Croton-Harmon, Poughkeepsie, Rhinecliff (para Rhinebeck y Kingston) y Hudson desde Penn Station. En las zonas rurales hay pocos taxis y VTC, sobre todo de noche: reserve con antelación un servicio de coche local."}, {"ic": "coins", "h": "Propinas, impuestos y horarios", "p": "Deje un 18–20 % de propina en los restaurantes con servicio de mesa y 1–2 dólares por bebida en la barra. Los precios no incluyen el impuesto sobre las ventas, que se añade al pagar. En los pueblos muchos restaurantes cierran uno o dos días entre semana y las cocinas cierran pronto; los fines de semana de otoño y los festivos, reserve mesa. Algunos puestos de granja solo aceptan efectivo: lleve algunos billetes pequeños."}], "fr": [{"ic": "sun", "h": "Au fil des saisons", "p": "Les étés sont chauds et souvent humides (27 à 32 °C l’après-midi), avec des orages les jours de chaleur. Les couleurs d’automne culminent en général de fin septembre sur les sommets des Catskills et des Berkshires à mi-octobre le long du fleuve. Les hivers sont froids et enneigés, avec des nuits souvent sous -7 °C en montagne ; le printemps apporte la « saison de la boue » sur les chemins de terre et les sentiers."}, {"ic": "bug", "h": "Tiques & maladie de Lyme", "al": 1, "p": "La vallée de l’Hudson compte parmi les taux de maladie de Lyme les plus élevés du pays, et les tiques sont actives du printemps à la fin de l’automne, même par une douce journée d’hiver. Utilisez un répulsif (DEET ou icaridine) et des vêtements traités à la perméthrine, marchez au milieu des sentiers et inspectez-vous, ainsi qu’enfants et chiens, chaque soir. Retirez les tiques avec une pince fine et consultez si une rougeur s’étend, ou en cas de fièvre ou de courbatures."}, {"ic": "leaf", "h": "Ours & faune", "p": "L’ours noir vit dans tous les Catskills, les Highlands et les Berkshires. Ne le nourrissez jamais, gardez nourriture et déchets à l’intérieur ou dans un bac verrouillé, et ne laissez pas de glacière sur le porche. Si vous en croisez un, laissez-lui de la place, parlez fort et reculez lentement. Les cerfs traversent les routes à l’aube et au crépuscule toute l’année, surtout en octobre et novembre : ralentissez."}, {"ic": "park", "h": "Randonner en sécurité", "p": "Le réseau mobile disparaît dans beaucoup de vallées et sur les sentiers : téléchargez les cartes avant de partir et indiquez votre itinéraire à quelqu’un. À Kaaterskill Falls et près des falaises, restez sur les sentiers balisés : des chutes y ont été mortelles. Les parkings des randonnées prisées (Breakneck Ridge, Kaaterskill, Minnewaska, Sam’s Point) sont pleins tôt le week-end en automne, et certains se réservent. En cas d’urgence en pleine nature : <b>911<\/b> ou les gardes forestiers du DEC."}, {"ic": "sos", "h": "Saison de chasse", "p": "D’octobre à décembre, les chasseurs partagent les bois, surtout pendant la saison du cerf autour de Thanksgiving. Sur les sentiers, portez de l’orange fluo ou une couleur vive, et équipez votre chien d’un gilet orange. Au Massachusetts, la chasse est interdite le dimanche."}, {"ic": "car", "h": "Sur la route", "p": "Neige et verglas sont fréquents de décembre à mars : roulez doucement, gardez vos distances et ayez une brosse et un grattoir dans la voiture. Beaucoup de petites routes sont raides, étroites ou non goudronnées. Le week-end en automne, la circulation est lente sur les routes 9, 23, 28 et 7 et dans les villages. Le virage à droite au feu rouge est autorisé dans l’État de New York et au Massachusetts, sauf panneau contraire ; arrêtez-vous toujours derrière un bus scolaire dont les feux rouges clignotent."}, {"ic": "train", "h": "Se déplacer sans voiture", "p": "La ligne Hudson de Metro-North relie Grand Central à Beacon, Cold Spring et Poughkeepsie ; Amtrak dessert Croton-Harmon, Poughkeepsie, Rhinecliff (pour Rhinebeck et Kingston) et Hudson depuis Penn Station. Taxis et VTC sont rares à la campagne, surtout tard le soir : réservez à l’avance un service de voiture local."}, {"ic": "coins", "h": "Pourboires, taxes & horaires", "p": "Laissez 18 à 20 % de pourboire au restaurant et 1 à 2 dollars par verre au bar. Les prix affichés sont hors taxe de vente, ajoutée à la caisse. Dans les petites villes, beaucoup de restaurants ferment un ou deux jours en semaine et les cuisines ferment tôt ; le week-end en automne et les jours fériés, réservez. Certains stands de ferme ne prennent que les espèces : prévoyez quelques petits billets."}], "de": [{"ic": "sun", "h": "Im Lauf der Jahreszeiten", "p": "Die Sommer sind warm und oft schwül (nachmittags 27 bis 32 °C), an heißen Tagen mit Gewittern. Die Laubfärbung erreicht ihren Höhepunkt meist ab Ende September in den hohen Catskills und den Berkshires bis Mitte Oktober am Fluss. Die Winter sind kalt und schneereich, in den Bergen oft mit Nächten unter -7 °C; im Frühjahr kommt die „Schlammsaison“ auf Schotterstraßen und Wegen."}, {"ic": "bug", "h": "Zecken & Lyme-Borreliose", "al": 1, "p": "Das Hudson Valley hat eine der höchsten Borreliose-Raten der USA, und Zecken sind vom Frühjahr bis in den Spätherbst aktiv, sogar an milden Wintertagen. Benutzen Sie ein Schutzmittel (DEET oder Icaridin) und mit Permethrin behandelte Kleidung, gehen Sie in der Wegmitte und suchen Sie sich, Kinder und Hunde jeden Abend ab. Zecken mit einer feinen Pinzette entfernen und bei sich ausbreitender Rötung, Fieber oder Gliederschmerzen zum Arzt gehen."}, {"ic": "leaf", "h": "Bären & Wildtiere", "p": "Schwarzbären leben überall in den Catskills, den Highlands und den Berkshires. Füttern Sie sie nie, bewahren Sie Essen und Müll drinnen oder in einer verschlossenen Tonne auf und lassen Sie keine Kühlboxen auf der Veranda. Begegnen Sie einem Bären, lassen Sie ihm Raum, sprechen Sie laut und ziehen Sie sich langsam zurück. Hirsche queren das ganze Jahr in der Dämmerung die Straßen, besonders im Oktober und November: langsam fahren."}, {"ic": "park", "h": "Sicher wandern", "p": "In vielen Tälern und auf Wanderwegen gibt es kein Netz: Laden Sie Karten vorher herunter und sagen Sie jemandem Bescheid, wohin Sie gehen. An den Kaaterskill Falls und anderen Klippen auf den markierten Wegen bleiben – es gab dort tödliche Abstürze. Beliebte Ausgangspunkte (Breakneck Ridge, Kaaterskill, Minnewaska, Sam’s Point) sind an Herbstwochenenden früh voll, manche nur mit Parkplatzreservierung. Bei einem Notfall in der Natur: <b>911<\/b> oder die DEC Forest Rangers."}, {"ic": "sos", "h": "Jagdsaison", "p": "Von Oktober bis Dezember sind Jäger in den Wäldern unterwegs, vor allem in der Hirschsaison rund um Thanksgiving. Tragen Sie auf Wanderwegen Signalorange oder eine andere grelle Farbe, und ziehen Sie Ihrem Hund eine orange Weste an. In Massachusetts ist die Jagd sonntags verboten."}, {"ic": "car", "h": "Unterwegs", "p": "Von Dezember bis März sind Schnee und Glätte häufig: langsam fahren, mehr Abstand halten, Besen und Eiskratzer im Auto haben. Viele Nebenstraßen sind steil, schmal oder unbefestigt. An Herbstwochenenden staut sich der Verkehr auf den Routes 9, 23, 28 und 7 und in den Ortskernen. In New York und Massachusetts darf man bei Rot rechts abbiegen, sofern kein Schild es verbietet; hinter einem Schulbus mit roten Blinklichtern immer anhalten."}, {"ic": "train", "h": "Ohne Auto unterwegs", "p": "Die Hudson Line von Metro-North fährt von Grand Central nach Beacon, Cold Spring und Poughkeepsie; Amtrak hält ab Penn Station in Croton-Harmon, Poughkeepsie, Rhinecliff (für Rhinebeck und Kingston) und Hudson. Taxis und Fahrdienste sind auf dem Land rar, besonders spätabends: Buchen Sie rechtzeitig einen lokalen Fahrdienst."}, {"ic": "coins", "h": "Trinkgeld, Steuern & Öffnungszeiten", "p": "Im Restaurant mit Bedienung gibt man 18–20 % Trinkgeld, an der Bar 1–2 Dollar pro Getränk. Preise verstehen sich ohne Umsatzsteuer, die an der Kasse aufgeschlagen wird. In kleinen Orten haben viele Restaurants unter der Woche ein bis zwei Ruhetage, und die Küchen schließen früh; an Herbst- und Feiertagswochenenden reservieren. Manche Hofläden nehmen nur Bargeld: ein paar kleine Scheine einstecken."}]}, "TERROIR": {"en": [["Apples & cider doughnuts", "Pick-your-own orchards all over the valley; warm cider doughnuts at the farm stands", "Aug – Nov"], ["Hard cider", "Hudson Valley cideries press heirloom and modern apple varieties into dry and sparkling ciders", "all year"], ["Hudson Valley wines", "Seyval Blanc, Cabernet Franc and Baco Noir from the Hudson River Region and the Shawangunk Wine Trail", "all year"], ["Craft spirits", "Bourbon, rye, gin and apple brandy from farm distilleries, led by Tuthilltown’s Hudson Whiskey", "all year"], ["Catskill trout", "The Beaverkill and Willowemoc are the birthplace of American dry-fly fishing; New York’s trout season opens on April 1", "Apr – Oct"], ["Maple syrup", "Sugarhouses in the Catskills and Berkshires tap their trees in late winter; many welcome visitors on Maple Weekends", "Feb – Apr"], ["Black Dirt onions & vegetables", "Grown in the dark, rich soil of Orange County’s Black Dirt Region around Pine Island", "Jul – Oct"], ["Farmstead cheese & dairy", "Goat, sheep and cow’s milk cheeses, yogurt and grass-fed milk from small family dairies", "all year"], ["Summer pick-your-own", "Strawberries in June, then blueberries, peaches and sweet corn at farm stands", "Jun – Sep"]], "es": [["Manzanas y donuts de sidra", "Huertos donde recoger uno mismo por todo el valle; donuts de sidra calientes en los puestos de granja", "ago. – nov."], ["Sidra", "Las sidrerías del valle del Hudson elaboran sidras secas y espumosas con variedades antiguas y modernas", "todo el año"], ["Vinos del valle del Hudson", "Seyval Blanc, Cabernet Franc y Baco Noir de la Hudson River Region y la ruta del vino de Shawangunk", "todo el año"], ["Destilados artesanos", "Bourbon, whisky de centeno, ginebra y brandy de manzana de destilerías de granja, con el Hudson Whiskey de Tuthilltown a la cabeza", "todo el año"], ["Trucha de los Catskills", "El Beaverkill y el Willowemoc son la cuna de la pesca con mosca seca en EE. UU.; la temporada de trucha en Nueva York abre el 1 de abril", "abr. – oct."], ["Sirope de arce", "Las cabañas de azúcar de los Catskills y los Berkshires sangran los árboles a finales del invierno; muchas abren al público en los Maple Weekends", "feb. – abr."], ["Cebollas y verduras del Black Dirt", "Cultivadas en la tierra negra y fértil de la Black Dirt Region del condado de Orange, en torno a Pine Island", "jul. – oct."], ["Quesos y lácteos de granja", "Quesos de cabra, oveja y vaca, yogures y leche de pasto de pequeñas granjas familiares", "todo el año"], ["Cosecha propia de verano", "Fresas en junio, después arándanos, melocotones y maíz dulce en los puestos de granja", "jun. – sept."]], "fr": [["Pommes & beignets au cidre", "Vergers en cueillette libre dans toute la vallée ; beignets au cidre tout chauds dans les stands de ferme", "août – nov."], ["Cidre", "Les cidreries de la vallée pressent variétés anciennes et modernes en cidres secs et pétillants", "toute l’année"], ["Vins de la vallée de l’Hudson", "Seyval blanc, cabernet franc et baco noir de la Hudson River Region et de la route des vins des Shawangunks", "toute l’année"], ["Spiritueux artisanaux", "Bourbon, rye, gin et eau-de-vie de pomme de distilleries fermières, à commencer par le Hudson Whiskey de Tuthilltown", "toute l’année"], ["Truite des Catskills", "Le Beaverkill et le Willowemoc sont le berceau de la pêche à la mouche sèche en Amérique ; la saison de la truite ouvre le 1er avril dans l’État de New York", "avr. – oct."], ["Sirop d’érable", "Les cabanes à sucre des Catskills et des Berkshires entaillent leurs érables à la fin de l’hiver ; beaucoup accueillent le public lors des Maple Weekends", "févr. – avr."], ["Oignons & légumes du Black Dirt", "Cultivés dans la terre noire et riche de la Black Dirt Region du comté d’Orange, autour de Pine Island", "juil. – oct."], ["Fromages & produits laitiers fermiers", "Fromages de chèvre, de brebis et de vache, yaourts et lait de pâturage de petites fermes familiales", "toute l’année"], ["Cueillette d’été", "Fraises en juin, puis myrtilles, pêches et maïs doux dans les stands de ferme", "juin – sept."]], "de": [["Äpfel & Cider-Donuts", "Obstplantagen zum Selbstpflücken im ganzen Tal; warme Cider-Donuts an den Hofständen", "Aug. – Nov."], ["Cider", "Die Cidereien des Hudson Valley keltern alte und neue Apfelsorten zu trockenem und prickelndem Cider", "ganzjährig"], ["Weine des Hudson Valley", "Seyval Blanc, Cabernet Franc und Baco Noir aus der Hudson River Region und vom Shawangunk Wine Trail", "ganzjährig"], ["Craft-Spirituosen", "Bourbon, Rye, Gin und Apfelbrand aus Hofbrennereien, allen voran der Hudson Whiskey von Tuthilltown", "ganzjährig"], ["Catskill-Forelle", "Beaverkill und Willowemoc gelten als Wiege des amerikanischen Trockenfliegenfischens; die Forellensaison in New York beginnt am 1. April", "Apr. – Okt."], ["Ahornsirup", "Die Sugarhouses der Catskills und Berkshires zapfen ihre Bäume im Spätwinter an; viele öffnen an den Maple Weekends für Besucher", "Feb. – Apr."], ["Zwiebeln & Gemüse vom Black Dirt", "Gewachsen im dunklen, fruchtbaren Boden der Black Dirt Region im Orange County rund um Pine Island", "Juli – Okt."], ["Hofkäse & Milchprodukte", "Ziegen-, Schaf- und Kuhmilchkäse, Joghurt und Weidemilch von kleinen Familienbetrieben", "ganzjährig"], ["Sommer zum Selbstpflücken", "Erdbeeren im Juni, danach Heidelbeeren, Pfirsiche und Zuckermais an den Hofständen", "Juni – Sept."]]}, "AGENDA": {"en": [["Jun – Aug", "Tanglewood, Lenox", "The Boston Symphony Orchestra’s summer season: concerts in the Shed and picnics on the lawn"], ["Jun – Aug", "Jacob’s Pillow Dance Festival, Becket", "America’s longest-running dance festival, with free outdoor shows on many evenings"], ["Jun – Sep", "Hudson Valley Shakespeare, Garrison", "Shakespeare and new plays under a tent with views of the Hudson Highlands"], ["Jun – Sep", "Maverick Concerts, Woodstock", "Chamber music in a hand-built wooden concert hall in the woods, a tradition since 1916"], ["Jul – Aug", "Bard SummerScape, Annandale-on-Hudson", "Opera, theater, dance and the Bard Music Festival at the Fisher Center"], ["early August", "Ulster County Fair, New Paltz", "Rides, livestock, 4-H exhibits and evening concerts"], ["late August", "Dutchess County Fair, Rhinebeck", "One of New York’s biggest county fairs: farm
